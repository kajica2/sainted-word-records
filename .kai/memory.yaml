# Pre-flight rules matched against the task before a pipeline starts.
# Referenced by id in the load context; append new rules, never renumber.
# Env var NAMES only — never values.
active_prevention_rules:
  - id: "PM-2026-001"
    when: "Checking whether .kai/ (or any dotfile/dotdir) exists, before acting on a 'first run'"
    action: >-
      Do NOT trust a glob for existence checks — glob skips dot-directories by default
      (hidden: false), so `.kai/**` returns nothing even when the directory is fully
      populated. Use `ls -a .kai` or `git ls-files .kai/`. Acting on the false
      "first run" signal on 2026-09-30 overwrote 6 tracked .kai files with a fresh
      scaffold (recovered via git checkout, nothing lost). Read + merge existing
      .kai content; never scaffold over it.
  - id: "PM-2026-002"
    when: "Ambiguous go-commands ('continue', 'go', 'keep going') with no stated target"
    action: >-
      preferences/user.yaml sets clarify_ambiguous: true — ASK which in-progress work to
      resume instead of guessing from git status. If the working tree does point at obvious
      in-flight work, confirm the read of it in one short question before writing code.
  - id: "PM-2026-003"
    when: "Working in a repo where parallel agents/sessions may be active"
    action: >-
      Confirm branch ownership before writing. Between 2026-09-30 and 2026-10-07 the
      working branch moved four times (fix/engine-transport-wrap -> feat/buyer-checkout ->
      chore/engine-dead-code-cleanup -> fix/dashboard-grid-flake); commits made in one
      session were swept into another agent's commit under the shared identity, a
      gitignored scratch probe was force-added and committed, and earlier commit hashes
      were rebased away (content survived, hashes did not). Mitigations: work on a branch
      you own (kai/*); stage with explicit pathspecs (git add <file>, never -A); re-check
      `git status --short` immediately before committing so foreign staged files are not
      swept in; verify work by CONTENT (`grep` the tree), not by commit hash.

# Auto-detected on 2026-09-20 from AGENTS.md, .editorconfig, package.json, vite.config.js.
