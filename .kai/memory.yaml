owner:
  global_git_user: kajica2 <kai.djuric@gmail.com>
  note: |
    Repo-local git config is unset by design — assistant commits ship as the global user.
    Vercel blocks deploys whose GitHub committer identity is unknown, so do NOT set a
    repo-local user.name/user.email (or pass -c user.name=… -c user.email=… on the commit).