<?xml version="1.0" encoding="UTF-8"?>
<!-- SWR wordmark — used in press kit, dark mode default. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="Sainted Word Records">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#d4a24c"/>
    </linearGradient>
  </defs>
  <!-- Two-cycle audio waveform (the brand mark) -->
  <g stroke="url(#g)" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 20 60 Q 50 30, 80 60 T 140 60"/>
    <path d="M 20 60 Q 50 90, 80 60 T 140 60" opacity="0.55"/>
  </g>
  <!-- Playhead dot -->
  <circle cx="140" cy="60" r="6" fill="#00e5ff"/>
  <!-- Wordmark -->
  <g font-family="-apple-system, 'SF Pro Display', 'Inter', sans-serif" font-weight="800" letter-spacing="2">
    <text x="170" y="55" font-size="22" fill="#f5a524">SAINTED WORD</text>
    <text x="170" y="90" font-size="38" fill="#e8e6e0">RECORDS</text>
  </g>
</svg>
