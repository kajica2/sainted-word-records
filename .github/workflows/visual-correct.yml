name: Command Center assertions

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: assert Command Center controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Test missing-control detection
        run: node --test tests/visual-correct.test.mjs
      - name: Assert checked-out Command Center
        run: node scripts/visual-correct.mjs
