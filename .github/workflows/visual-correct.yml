name: Command Center assertions

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: assert Command Center controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test missing-control detection
        run: node --test tests/visual-correct.test.mjs tests/visual-correct-lifecycle.test.mjs
      - name: Assert checked-out Command Center
        run: node scripts/visual-correct.mjs
      - name: Upload Command Center evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-center-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/command-center/
          if-no-files-found: warn
          retention-days: 7
