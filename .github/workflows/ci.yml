name: CI

# On every push to a non-main branch and every PR against main:
#   1. install deps with npm ci
#   2. run npm run check:full — check (syntax + manifest + bundle + api
#      smoke) + check:verify (the 5 curated Puppeteer smokes — see
#      docs/CI-VERIFY-STRATEGY.md)
#   3. run npm run verify:transitions (38 Puppeteer checks for the
#      music-video transitions module — added 2026-09-12 after the
#      verifier found two regressions that shipped to main:
#        a) setAutoFire(null) left _beatHandler wired to a closure that
#           threw 'Cannot read properties of null (reading onBeat)' on
#           the next beat
#        b) wireTransitionsPanel() overwrote window.SWRTransitionsUI.
#           onBpmUpdate on the last line, clobbering the hook assigned
#           earlier in the same IIFE
#      Both would have been caught here.)
#   4. (added 2026-09-20) run npm run verify:automix-cross-surface —
#      loads all 7 surfaces (engine + 5 variants + dashboard) and
#      asserts the 11+5 scripts + 18 panel IDs + 5 runtime APIs are
#      present on each. Caught the Phase 1a/2/3 regression risk where
#      every surface has to ship the same automix+curator stack.
#   5. (added 2026-09-20) run npm run build + size budget assertion —
#      the music_video → all-surfaces port added ~100KB of JS but the
#      real cost is the asset library (keyart 49M, portfolio 18M,
#      gallery-vintage 10M, audios 8M). 130MB ceiling = current 114M
#      + ~14% headroom for legitimate growth (SVG optimization, new
#      persona art). Anything bigger is a regression to investigate.
#
# A passing CI run is the contract: 'the engine boot path + the
# transitions module + the curated 5-smoke + the automix stack
# across all surfaces + the build size is still under 130MB'.
# Don't merge without it green.
# 'on' is quoted to dodge YAML 1.1's yes/no/on/off-as-boolean parsing
# (GitHub Actions uses YAML 1.2 and parses 'on:' correctly unquoted).
'on':
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check + verify + build-size
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: check + check:verify (the 5 curated Puppeteer smokes)
        # check:full = check + check:verify (the 5 curated smokes)
        # see docs/CI-VERIFY-STRATEGY.md for the verifier list + rationale
        run: npm run check:full

      - name: verify:transitions
        # Net-new as of 2026-09-12 — the transitions module didn't have a
        # CI gate before, which is why two regressions shipped to main.
        # 38 checks: module shape, every transition fires cleanly, UI
        # popover, auto-fire wiring, BPM hook, console clean.
        run: npm run verify:transitions

      - name: verify:automix-cross-surface
        # Net-new as of 2026-09-20 — the music_video → all-surfaces port
        # added the automix+curator stack to 7 surfaces. This verifier
        # boots each one and asserts the 11 automix-stack scripts +
        # 5 runtime scripts + 18 panel IDs + 5 runtime APIs are present.
        # 33 checks total; catches panel/script drift across surfaces.
        # The per-surface verifies (engine/neon/film/grid/smoke/
        # hallucination/dashboard) are covered by this cross-surface
        # run, so we don't need to invoke them individually.
        run: npm run verify:automix-cross-surface

      - name: vite build
        # Needed so we can measure dist/ size. Adds ~30s to CI but
        # catches build-config regressions (broken copy-static plugin,
        # missing vite plugins, etc.) and feeds the size-budget check
        # below.
        run: npm run build

      - name: build-size budget (<= 130M)
        # 130M ceiling = current 114M (post-Phase 1-4 + keyart growth)
        # + ~14% headroom. If this fails, the asset library grew in a
        # way that needs justification — don't silently let the budget
        # inflate. Uses stat-based byte counting so it works on both
        # GNU and BSD du (GitHub Actions runners are Ubuntu GNU).
        run: |
          SIZE_BYTES=$(find dist/ -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          SIZE_MB=$(awk "BEGIN { printf \"%.1f\", $SIZE_BYTES / 1048576 }")
          BUDGET_MB=130
          BUDGET_BYTES=136314880
          echo "[ci] dist/ size: ${SIZE_MB}M (budget: ${BUDGET_MB}M)"
          if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error::dist/ is ${SIZE_MB}M, exceeds ${BUDGET_MB}M budget"
            du -sh dist/* 2>/dev/null | sort -rh | head -10
            exit 1
          fi