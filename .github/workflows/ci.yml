name: CI

# On every PR against main, and on every push to main:
#   1. install deps with npm ci
#   2. run npm run check:full — check (syntax + manifest + bundle + api
#      smoke) + check:verify (the 5 curated Puppeteer smokes — see
#      docs/CI-VERIFY-STRATEGY.md)
#   3. run npm run verify:transitions (38 Puppeteer checks for the
#      music-video transitions module — added 2026-09-12 after the
#      verifier found two regressions that shipped to main:
#        a) setAutoFire(null) left _beatHandler wired to a closure that
#           threw 'Cannot read properties of null (reading onBeat)' on
#           the next beat
#        b) wireTransitionsPanel() overwrote window.SWRTransitionsUI.
#           onBpmUpdate on the last line, clobbering the hook assigned
#           earlier in the same IIFE
#      Both would have been caught here.)
#   4. (added 2026-09-20) run npm run verify:automix-cross-surface —
#      loads all 7 surfaces (engine + 5 variants + dashboard) and
#      asserts the 11+5 scripts + 18 panel IDs + 5 runtime APIs are
#      present on each. Caught the Phase 1a/2/3 regression risk where
#      every surface has to ship the same automix+curator stack.
#   5. (added 2026-09-20) run npm run build + size budget assertion —
#      the music_video → all-surfaces port added ~100KB of JS but the
#      real cost is the asset library (keyart 49M, portfolio 18M,
#      gallery-vintage 10M, audios 8M). 130MB ceiling = current 114M
#      + ~14% headroom for legitimate growth (SVG optimization, new
#      persona art). Anything bigger is a regression to investigate.
#
# A passing CI run is the contract: 'the engine boot path + the
# transitions module + the curated 5-smoke + the automix stack
# across all surfaces + the build size is still under 130MB'.
# Don't merge without it green.
# 'on' is quoted to dodge YAML 1.1's yes/no/on/off-as-boolean parsing
# (GitHub Actions uses YAML 1.2 and parses 'on:' correctly unquoted).
'on':
  push:
    # `main` ONLY — not "every branch" and not "every branch except main".
    #
    # Both of those publish a SECOND check-run with the IDENTICAL context
    # name ("check + verify + build-size", the job name) for the same SHA:
    # the `push` event fires for the branch, and the `pull_request` event
    # fires for the open PR. GitHub matches a required status check by
    # CONTEXT NAME, so two runs of the same name on one commit are
    # ambiguous — and the branch-protection ruleset on `main` (which
    # requires that exact context) is then decided by whichever twin
    # finished last. On 2026-11-04 the PR-event run passed all 33 steps
    # while its push-event twin stalled 34m22s in apt and was cancelled at
    # the job timeout: the PR showed UNSTABLE on a green commit, and a
    # ruleset would have blocked the merge.
    #
    # Restricting `push` to `main` gives exactly ONE run per commit —
    # the PR run for a branch, the push run once it lands on main — and
    # it still gates `main` itself, which is what the production-readiness
    # plan asks for ("CI runs on main and PRs"). A branch with no open PR
    # gets no run; open the PR (or dispatch the workflow) to get one.
    # `visual-correct.yml` uses this same trigger shape.
    branches: [main]
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: check + verify + build-size
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 90-minute ceiling. The chain itself takes ~22m (the 2026-11-04 PR run
    # was 21m43s for check + check:verify, plus ~5m of setup, the build and
    # the budgets), so this is >3x the real duration. The previous 45m
    # ceiling was not enough headroom: one run lost 34m22s to an apt-get
    # stall in the ffmpeg step and was then killed by this timeout with
    # check:full never started — a red CI that had proved nothing. The
    # budget has to survive one slow step, not just the happy path.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check:apply-reactor-unit runs a parity sweep that `git show`s
          # historical variant pages at commit 1508133. The default depth-1
          # checkout on GitHub Actions does not contain that object.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (the generations gate measures the media)
        # The GitHub runner image ships WITHOUT ffmpeg: `which ffprobe`
        # returns nothing. The generations gate measures every credited
        # media file with ffprobe, so on the runner every measurement came
        # back null and the gate failed with "every credited media file has
        # a length and a bitrate" — for all 33 files, on every PR, against
        # a tree that is perfectly fine (the same gate is green locally).
        # The apt package is the same ffprobe the pack pipeline already
        # expects; it installs in ~20s.
        #
        # The install is BOUNDED and retried. `apt-get update` reaches out
        # to the Ubuntu mirrors, and on 2026-11-04 one run stalled there
        # for 34m22s (against 51s on the twin PR run of the same commit) —
        # long enough to eat a whole CI budget on its own. A hang in a
        # mirror must not be able to kill the job, so each attempt gets
        # its own timeout and the step fails fast enough for the job's
        # ceiling (or the next attempt) to decide the outcome.
        run: |
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update -qq \
              && timeout 300 sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg; then
              ffprobe -version | head -1
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            # A killed `apt-get install` can leave dpkg half-configured and
            # its lock held, which would make every later attempt fail for
            # the wrong reason. Put the package manager back in a sane state
            # before the next try — and bound that too, so the recovery
            # cannot itself hang.
            timeout 120 sudo dpkg --configure -a || true
            timeout 60 sudo rm -f /var/lib/dpkg/lock-frontend \
              /var/lib/dpkg/lock /var/lib/apt/lists/lock \
              /var/cache/apt/archives/lock || true
            sleep 10
          done
          echo "::error::could not install ffmpeg after 3 attempts"
          exit 1

      - name: Scene persistence regression tests
        run: node --test tests/scenes-persistence.test.mjs

      - name: check + check:verify (the 5 curated Puppeteer smokes)
        # check:full runs every gate through scripts/run-steps.mjs and reports
        # each one — it is deliberately NOT an `&&` chain, because a chain
        # short-circuits and silently hid every gate after the first failure
        # (7 gates were dead before 2026-09-27).
        # See docs/CI-VERIFY-STRATEGY.md for the verifier list + rationale.
        #
        # 2026-09-27: continue-on-error removed. It was added 2026-09-23 to
        # tolerate headless flakes, and the two that produced it are now
        # resolved rather than suppressed:
        #   - verify-rotation-enabled was failing on a real bug — autoMap()
        #     built layers without rotationEnabled/rotOffset — now fixed;
        #   - the cover pixel assertion moved to verify-layer-cover.mjs,
        #     because it asserts on live canvas pixels and r.x drift makes the
        #     corner pattern audio-feature dependent.
        # check:full is fully green, so a failure here is real signal and
        # should read as one. This does not block deploys either way — Vercel
        # deploys on push to main independently of this job.
        run: npm run check:full

      - name: preset-pipeline:verify (swr-preset/v1 spec)
        # Gates presets/manifest.json + presets/*.json against the
        # swr-preset/v1 schema (id format, FX keys, audio bands, family,
        # hex colors, manifest/disk sync, unique ids + names). Fails on
        # any drifted or malformed preset, so a bad daily generate cannot
        # land unnoticed. Runs here explicitly in addition to the
        # check:preset-smoke member of the check group inside check:full.
        run: npm run preset-pipeline:verify

      - name: targeting:verify (targeting artifacts + voice lint)
        # Own step, not folded into check:full: it is the NFR-2 size budget,
        # the NFR-9 voice-lint drift gate (the banned-phrase list must still
        # match marketing/scripts/README.md) and the FR-19 CTA contract on
        # every banner note. Regenerating the artifacts from
        # marketing/personas/full/ + marketing/scripts/ must reproduce the
        # committed targeting/*.json byte-for-byte.
        run: npm run targeting:verify

      - name: verify:transitions
        # Net-new as of 2026-09-12 — the transitions module didn't have a
        # CI gate before, which is why two regressions shipped to main.
        # 38 checks: module shape, every transition fires cleanly, UI
        # popover, auto-fire wiring, BPM hook, console clean.
        run: npm run verify:transitions

      - name: verify:automix-cross-surface
        # Net-new as of 2026-09-20 — the music_video → all-surfaces port
        # added the automix+curator stack to 7 surfaces. This verifier
        # boots each one and asserts the 11 automix-stack scripts +
        # 5 runtime scripts + 18 panel IDs + 5 runtime APIs are present.
        # 33 checks total; catches panel/script drift across surfaces.
        # The per-surface verifies (engine/neon/film/grid/smoke/
        # hallucination/dashboard) are covered by this cross-surface
        # run, so we don't need to invoke them individually.
        #
        # 2026-09-27: continue-on-error removed, and the rationale that put it
        # there corrected rather than repeated. It claimed "the 17
        # cross-variant port pages have never been fully wired to the automix
        # stack — pre-existing failures, baseline 50/118 pass". Both halves are
        # now wrong: the cross-variant wiring shipped, and the verifier passes
        # locally with 0 failures. The CI failure that made the suppression
        # look justified was a navigation timeout, not that baseline —
        # checkSurface() waited on `networkidle2`, which does not reliably
        # settle on GitHub runners (the same trap the sibling smokes already
        # documented). It now navigates on domcontentloaded with a bounded wait
        # for `complete`, and takes ~38s for the full sweep.
        run: npm run verify:automix-cross-surface

      - name: vite build
        # Needed so we can measure dist/ size. Adds ~30s to CI but
        # catches build-config regressions (broken copy-static plugin,
        # missing vite plugins, etc.) and feeds the size-budget check
        # below.
        run: npm run build

      - name: build-size budget (<= 181M)
        # 181M ceiling = clean `npm run build` measured 180.4M on 2026-11-02
        # (189,181,305 bytes on main and this branch). The prior 180M cap
        # (188,743,680 bytes) left ~438KB headroom — media already on main
        # consumes it, so PR CI was red while deploy-on-main stayed green
        # (ci.yml ignores pushes to main). Per-dir growth is still gated
        # by check:media-budget below.
        #
        # The rule still holds: if this fails, the asset library grew in a
        # way that needs justification — don't silently let the budget
        # inflate. Uses stat-based byte counting so it works on both
        # GNU and BSD du (GitHub Actions runners are Ubuntu GNU).
        run: |
          SIZE_BYTES=$(find dist/ -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')
          SIZE_MB=$(awk "BEGIN { printf \"%.1f\", $SIZE_BYTES / 1048576 }")
          BUDGET_MB=181
          BUDGET_BYTES=189792256
          echo "[ci] dist/ size: ${SIZE_MB}M (budget: ${BUDGET_MB}M)"
          if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error::dist/ is ${SIZE_MB}M, exceeds ${BUDGET_MB}M budget"
            du -sh dist/* 2>/dev/null | sort -rh | head -10
            exit 1
          fi

      - name: shipped-media budget (per directory)
        # Names which media directory grew before the global 180M gate does.
        # See docs/plans/2026-10-21-shipped-media-budget.md.
        run: npm run check:media-budget