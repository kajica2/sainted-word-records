
yaml
name: Presets Daily

Daily preset generation for the self-evolving engine.
Runs preset-pipeline/generate.py + verify.mjs and auto-commits
the new presets to main. Vercel auto-deploys on push.
#
Schedule: 07:00 UTC = 09:00 CEST (Belgrade) / 08:00 CET (winter).
Adjust the cron if you want a different cadence.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of presets to generate'
        required: false
        default: '2'
      seed:
        description: 'Seed (defaults to today YYYYMMDD)'
        required: false
        default: ''

jobs:
  generate:
    name: Generate + verify + commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate presets
        id: generate
        run: |
          cd preset-pipeline
          SEED="${{ github.event.inputs.seed }}"
          if [ -z "$SEED" ]; then
            SEED="$(date -u +%Y%m%d)"
          fi
          COUNT="${{ github.event.inputs.count || '2' }}"
          echo "seed=$SEED count=$COUNT"
          python3 generate.py --count "$COUNT" --seed "$SEED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify schema
        run: node preset-pipeline/verify.mjs

      - name: Commit and push new presets to main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preset-pipeline/ presets/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new presets to commit (today's run produced nothing new)"
          else
            SEED="${{ steps.generate.outputs.seed }}"
            CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "preset-pipeline: daily generation ($SEED)

            Generated $CHANGED new file(s) on $(date -u +%Y-%m-%d).
            Auto-committed by GitHub Actions. Vercel auto-deploys on push."
            git push
            echo "Pushed $CHANGED new file(s) to main"
          fi
