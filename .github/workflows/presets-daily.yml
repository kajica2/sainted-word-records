name: Presets Daily

# Daily preset generation for the self-evolving engine.
# Runs preset-pipeline/generate.py + verify.mjs and opens a PR with
# the new presets. Once merged, Vercel auto-deploys.
#
# Schedule: 07:00 UTC = 09:00 CEST (Belgrade) / 08:00 CET (winter).
# Adjust the cron if you want a different cadence.

on:
  schedule:
    # 07:00 UTC daily. Override "push" branches if you want a different beat.
    - cron: '0 7 * * *'
  # Manual trigger — useful for testing the pipeline.
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of presets to generate'
        required: false
        default: '2'
      seed:
        description: 'Seed (defaults to today YYYYMMDD)'
        required: false
        default: ''

jobs:
  generate:
    name: Generate + verify + PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the verifier can compare against existing presets.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate presets
        id: generate
        run: |
          cd preset-pipeline
          SEED="${{ github.event.inputs.seed }}"
          if [ -z "$SEED" ]; then
            SEED="$(date -u +%Y%m%d)"
          fi
          COUNT="${{ github.event.inputs.count || '2' }}"
          echo "seed=$SEED count=$COUNT"
          python3 generate.py --count "$COUNT" --seed "$SEED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify schema
        run: node preset-pipeline/verify.mjs

      - name: Open PR with new presets
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          branch-name: presets/${{ steps.generate.outputs.seed }}-${{ github.run_number }}
          commit-message: "preset-pipeline: daily generation (${{ steps.generate.outputs.seed }})"
          title: "Daily preset generation — ${{ steps.generate.outputs.seed }}"
          body: |
            Automated daily preset generation for the Sainted Word Records engine.

            - **Seed:** ${{ steps.generate.outputs.seed }}
            - **Run:** #${{ github.run_number }}
            - **Generator:** `preset-pipeline/generate.py`
            - **Verifier:** `preset-pipeline/verify.mjs` (passed)

            ## What changed
            - New preset JSON files in `presets/`
            - Updated `presets/manifest.json` (append-only)

            ## Review checklist
            - [ ] Open one of the new presets and confirm the `fx_state` + `motion` + `palette` + `audio_reactivity` look like a coherent personality
            - [ ] Check the new `preview` SVG renders (no broken paths)
            - [ ] Confirm the `inspiration` blends sum to ~1.0
            - [ ] Skim the auto-generated name and description

            Merge to ship. Vercel will auto-deploy within ~30s of the merge.
          labels: |
            presets
            automated
