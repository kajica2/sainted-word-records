name: Register Invite Codes

# Run manually after merging a PR that adds invite codes, or automatically
# after a push to main. KV is only reachable from inside Vercel's network,
# so this workflow calls the deployed /api/invite/redeem endpoint on the
# latest production deployment.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list codes without registering'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main

jobs:
  register:
    name: register invite codes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read data/invite-codes.csv
        id: read_codes
        run: |
          if [ ! -f data/invite-codes.csv ]; then
            echo "No data/invite-codes.csv found — nothing to register."
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Base64-encode to avoid GHA output format issues with commas/newlines.
          echo "csv_b64=$(base64 -w0 data/invite-codes.csv)" >> $GITHUB_OUTPUT

      - name: Register codes via invite/register endpoint
        env:
          CSV_B64: ${{ steps.read_codes.outputs.csv_b64 }}
          INVITE_ADMIN_SECRET: ${{ secrets.INVITE_ADMIN_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$CSV_B64" ]; then
            echo "No codes to register."
            exit 0
          fi

          REGISTERED=0
          FAILED=0

          if [ '${{ github.event.inputs.dry_run }}' = 'true' ]; then
            echo "=== DRY RUN ==="
          fi

          # Iterate each CSV row (skip header).
          echo "$CSV_B64" | base64 -d | tail -n +2 | while IFS=',' read -r code label createdAt; do
            if [ -z "$code" ]; then continue; fi

            echo -n "  $code ... "

            if [ '${{ github.event.inputs.dry_run }}' = 'true' ]; then
              echo "OK (dry run)"
              continue
            fi

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://sainted-word-records.vercel.app/api/invite/register" \
              -H 'Content-Type: application/json' \
              -H "x-invite-secret: $INVITE_ADMIN_SECRET" \
              -d "{\"secret\": \"$INVITE_ADMIN_SECRET\", \"code\": \"$code\", \"label\": \"$label\"}")

            BODY=$(echo "$RESPONSE" | head -n -1)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "OK"
              REGISTERED=$((REGISTERED + 1))
            else
              echo "FAIL (HTTP $HTTP_CODE): $BODY"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "Registered: $REGISTERED / $((REGISTERED + FAILED))"

          if [ $FAILED -gt 0 ]; then
            exit 1
          fi
