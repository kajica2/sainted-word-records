<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transition Harness — Sainted Word Records</title>
  <meta name="description" content="Visual QA harness for the 29 music-video transitions. Fire any transition manually or auto-fire on a synthesized beat." />
  <style>
    :root {
      --bg-0: #050308;
      --bg-1: #0d0918;
      --bg-2: #1a1226;
      --panel: #11091a;
      --panel-2: #1a1028;
      --line: #2a1d3a;
      --line-2: #3a2a4a;
      --fg: #f5e9ff;
      --muted: #9a8aaa;
      --accent: #ff3d92;
      --accent-2: #00e5ff;
      --accent-3: #ffd24a;
      --warn: #ff7a3d;
      --ok: #00ffa3;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg-0);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(255, 61, 146, 0.18), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(0, 229, 255, 0.16), transparent 50%);
    }
    #stage {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 61, 146, 0.55), transparent 45%),
        radial-gradient(circle at 70% 70%, rgba(0, 229, 255, 0.45), transparent 45%),
        linear-gradient(135deg, #1a1028 0%, #0d0918 100%);
      z-index: 0;
    }
    #stage::after {
      content: 'STAGE — fire a transition to see the overlay';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      letter-spacing: 0.1em;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      opacity: 0.4;
    }
    #ui {
      position: relative;
      z-index: 1;
      padding: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 small {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .controls button, .controls input, .controls select {
      background: var(--panel-2);
      border: 1px solid var(--line-2);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .controls button:hover { background: var(--bg-2); border-color: var(--accent); }
    .controls button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .controls button.primary:hover { background: #ff5fa3; }
    .controls input[type="number"] { width: 64px; }
    .controls label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .tx-card {
      background: var(--panel);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: var(--font-mono);
    }
    .tx-card .name {
      color: var(--accent-2);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .tx-card .meta {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tx-card .badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .tx-card .badge.kind-css { background: rgba(0, 229, 255, 0.2); color: var(--accent-2); }
    .tx-card .badge.kind-fx  { background: rgba(255, 210, 74, 0.2); color: var(--accent-3); }
    .tx-card button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      align-self: flex-start;
    }
    .tx-card button:hover { background: var(--accent); color: #000; }
    .tx-card button:disabled { opacity: 0.4; cursor: wait; }
    .tx-card.firing { border-color: var(--accent); box-shadow: 0 0 14px rgba(255, 61, 146, 0.4); }
    .family-header {
      grid-column: 1 / -1;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-top: 12px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }
    .family-header:first-child { margin-top: 0; }
    .log {
      margin-top: 20px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log h2 {
      margin: 0 0 8px;
      color: var(--accent-2);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .log-entry {
      color: var(--muted);
      padding: 2px 0;
      border-bottom: 1px dashed var(--line);
    }
    .log-entry .when { color: var(--accent-3); margin-right: 8px; }
    .log-entry .what { color: var(--fg); }
    .log-entry .src   { color: var(--muted); font-size: 10px; margin-left: 8px; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="ui">
    <header>
      <h1>Transition Harness <small id="harness-count">—</small></h1>
      <a href="/engine.html" style="color:var(--muted); font-family:var(--font-mono); font-size:11px;">← back to engine</a>
    </header>

    <div class="controls">
      <button id="btn-fire-all" class="primary">FIRE ALL</button>
      <button id="btn-fire-random">FIRE RANDOM</button>
      <span class="separator"></span>
      <label for="preset-select">preset</label>
      <select id="preset-select" title="Pick a version-presets preset to see recommended transitions">
        <option value="">— none —</option>
      </select>
      <span class="separator"></span>
      <label for="auto-bpm">bpm</label>
      <input type="number" id="auto-bpm" min="30" max="240" step="1" value="120" />
      <label for="auto-every">every</label>
      <input type="number" id="auto-every" min="1" max="32" step="1" value="4" />
      <label for="auto-tx">transition</label>
      <select id="auto-tx"></select>
      <button id="btn-auto-toggle">AUTO-FIRE OFF</button>
      <button id="btn-beat">BEAT (one shot)</button>
    </div>

    <div id="grid" class="grid"></div>

    <div class="log">
      <h2>Fire log <small style="color:var(--muted);">(last 30)</small></h2>
      <div id="log-list"></div>
    </div>
  </div>

  <script type="module" src="/engine-transitions.client.js"></script>
  <script src="/lib/preset-transitions.client.js"></script>
  <script type="module">
    // ---- Harness wiring ----
    // Loads the transitions module, renders a grid card for each transition,
    // wires fire / random / all / auto-fire controls, and logs every fire.
    // Does NOT load the full engine — just the transitions + a synthetic
    // stage backdrop (the radial-gradient <div> behind everything).

    const FAMILY_ORDER = ['cover', 'distortion', 'spatial', 'brightness', 'mask', 'hybrid', 'fade', 'wipe'];
    const FAMILY_LABEL = {
      cover: 'Cover', distortion: 'Distortion', spatial: 'Spatial',
      brightness: 'Brightness', mask: 'Mask', hybrid: 'Hybrid',
      fade: 'Fade', wipe: 'Wipe'
    };

    function waitFor(predicate, label, timeoutMs = 5000) {
      return new Promise((resolve, reject) => {
        let waited = 0;
        const tick = () => {
          const ok = predicate();
          if (ok) return resolve();
          waited += 50;
          if (waited >= timeoutMs) return reject(new Error(`${label} not ready`));
          setTimeout(tick, 50);
        };
        tick();
      });
    }

    function fmtTime(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')}`;
    }

    const logEl = document.getElementById('log-list');
    const logBuf = [];
    function log(what, src = 'manual') {
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="when">${fmtTime(new Date())}</span><span class="what">${what}</span><span class="src">${src}</span>`;
      logEl.insertBefore(entry, logEl.firstChild);
      logBuf.unshift({ what, src, t: Date.now() });
      while (logBuf.length > 30) logBuf.pop();
      while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
    }

    await waitFor(() => window.SWRTransitions && window.SWRTransitions.list, 'SWRTransitions');
    const list = window.SWRTransitions.list();
    document.getElementById('harness-count').textContent = `(${list.length} transitions)`;

    // ---- Preset selector + recommendations (PRD-019) ----
    // Populate the preset dropdown from the manifest + paint a small
    // recommendation section that updates when the user picks a preset.
    const presetSelect = document.getElementById('preset-select');
    if (presetSelect && window.SWRPresetTransitions) {
      const populatePresetSelect = () => {
        const m = window.SWRPresetTransitions.manifest && window.SWRPresetTransitions.manifest();
        if (!m) return;
        presetSelect.innerHTML = '<option value="">— none —</option>';
        Object.keys(m).forEach((key) => {
          if (key.startsWith('_')) return;
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = key + (m[key].label ? ' · ' + m[key].label : '');
          presetSelect.appendChild(opt);
        });
      };
      if (window.SWRPresetTransitions.whenReady) {
        window.SWRPresetTransitions.whenReady(populatePresetSelect);
      }
      // Inline recommendation strip below the controls
      const recsBox = document.createElement('div');
      recsBox.id = 'harness-recs';
      recsBox.style.cssText = 'margin:12px 0; padding:10px 12px; background:var(--panel); border:1px solid var(--line-2); border-radius:6px; font-family:var(--font-mono); font-size:11px;';
      recsBox.innerHTML = '<div style="color:var(--muted); font-size:10px; letter-spacing:0.08em; text-transform:uppercase;">recommendations · <span id="harness-rec-preset" style="color:var(--accent-2);">— none —</span></div>';
      const recsList = document.createElement('div');
      recsList.id = 'harness-rec-list';
      recsList.style.cssText = 'margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;';
      recsBox.appendChild(recsList);
      const controlsEl = document.querySelector('.controls');
      if (controlsEl && controlsEl.parentNode) {
        controlsEl.parentNode.insertBefore(recsBox, controlsEl.nextSibling);
      }
      const recPresetEl = recsBox.querySelector('#harness-rec-preset');
      const renderRecs = () => {
        const key = presetSelect.value;
        recPresetEl.textContent = key || '— none —';
        recsList.innerHTML = '';
        if (!key || !window.SWRPresetTransitions) return;
        const rec = window.SWRPresetTransitions.recommended(key);
        const mkChip = (name, secondary) => {
          const cfg = window.SWRTransitions._TRANSITIONS
            ? window.SWRTransitions._TRANSITIONS[name] : null;
          const chip = document.createElement('button');
          chip.className = 'harness-rec-chip' + (secondary ? ' secondary' : '');
          chip.textContent = name + (cfg ? ' (' + cfg.family + ')' : '');
          chip.style.cssText = 'background:transparent; border:1px solid var(--line-2); color:var(--fg); padding:3px 8px; border-radius:3px; cursor:pointer; font-size:10px; opacity:' + (secondary ? 0.55 : 1) + ';';
          chip.addEventListener('click', () => window.SWRTransitions.fire(name));
          return chip;
        };
        (rec.primary || []).forEach((n) => recsList.appendChild(mkChip(n, false)));
        (rec.secondary || []).forEach((n) => recsList.appendChild(mkChip(n, true)));
      };
      presetSelect.addEventListener('change', renderRecs);
      if (window.SWRPresetTransitions.whenReady) {
        window.SWRPresetTransitions.whenReady(renderRecs);
      }
    }

    // ---- Grid ----
    const grid = document.getElementById('grid');
    const byFamily = new Map();
    list.forEach(t => {
      if (!byFamily.has(t.family)) byFamily.set(t.family, []);
      byFamily.get(t.family).push(t);
    });
    FAMILY_ORDER.forEach(fam => {
      if (!byFamily.has(fam)) return;
      const header = document.createElement('div');
      header.className = 'family-header';
      header.textContent = `${FAMILY_LABEL[fam] || fam} (${byFamily.get(fam).length})`;
      grid.appendChild(header);
      byFamily.get(fam).forEach(t => {
        const card = document.createElement('div');
        card.className = 'tx-card';
        card.dataset.name = t.name;
        card.innerHTML = `
          <div class="name">${t.name}</div>
          <div class="meta">
            <span class="badge kind-${t.kind}">${t.kind}</span>
            ${t.duration}ms
            ${t.peak != null ? `· peak ${t.peak}` : ''}
          </div>
          <button>FIRE</button>
        `;
        const btn = card.querySelector('button');
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          card.classList.add('firing');
          // fire() goes through the wrapped proxy below which logs.
          window.SWRTransitions.fire(t.name);
          setTimeout(() => {
            btn.disabled = false;
            card.classList.remove('firing');
          }, t.duration + 120);
        });
        grid.appendChild(card);
      });
    });

    // ---- Auto-fire transition picker ----
    const autoTxSel = document.getElementById('auto-tx');
    list.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.name;
      opt.textContent = `${t.name} (${t.kind}, ${t.duration}ms)`;
      autoTxSel.appendChild(opt);
    });

    // ---- Auto-fire wiring ----
    let autoLive = false;
    const autoBtn = document.getElementById('btn-auto-toggle');
    const bpmInp = document.getElementById('auto-bpm');
    const everyInp = document.getElementById('auto-every');
    autoBtn.addEventListener('click', () => {
      if (autoLive) {
        window.SWRTransitions.setAutoFire(null);
        autoLive = false;
        autoBtn.classList.remove('primary');
        autoBtn.textContent = 'AUTO-FIRE OFF';
      } else {
        const bpm = parseInt(bpmInp.value, 10) || 120;
        window.SWRTransitions.setBPM(bpm);
        window.SWRTransitions.setAutoFire({
          everyNBeats: parseInt(everyInp.value, 10) || 4,
          transition: autoTxSel.value,
          bpm
        });
        autoLive = true;
        autoBtn.classList.add('primary');
        autoBtn.textContent = `AUTO-FIRE ON · ${autoTxSel.value} / ${everyInp.value}b`;
      }
    });

    // ---- Single BEAT button (mimics an audio frame calling onBeat) ----
    document.getElementById('btn-beat').addEventListener('click', () => {
      const bpm = parseInt(bpmInp.value, 10) || 120;
      window.SWRTransitions.onBeat(bpm, true);
      log('BEAT (one-shot)', 'beat');
    });

    // ---- FIRE ALL ----
    document.getElementById('btn-fire-all').addEventListener('click', async () => {
      const btn = document.getElementById('btn-fire-all');
      btn.disabled = true;
      btn.textContent = 'FIRING…';
      log('FIRE ALL — starting', 'batch');
      for (const t of list) {
        // fire() logs via the wrapper below.
        window.SWRTransitions.fire(t.name);
        await new Promise(r => setTimeout(r, t.duration + 80));
      }
      log('FIRE ALL — done', 'batch');
      btn.disabled = false;
      btn.textContent = 'FIRE ALL';
    });

    // ---- FIRE RANDOM ----
    document.getElementById('btn-fire-random').addEventListener('click', () => {
      const t = list[Math.floor(Math.random() * list.length)];
      window.SWRTransitions.fire(t.name);
    });

    // ---- Hook into all fire paths ----
    // Listen for the swr-tx:fire CustomEvent dispatched by the module on every
    // fire() (manual, batch, auto-fire from onBeat, special transitions). This
    // sees fires that wrapping window.SWRTransitions.fire can't (e.g. when
    // the auto-fire handler closes over the module's internal fire function).
    document.addEventListener('swr-tx:fire', (ev) => {
      const { name, source } = ev.detail || {};
      log(name, source || 'manual');
    });
  </script>
</body>
</html>
