<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="SWR Sainted Word Records wordmark">
  <!-- Wordmark: stylised "SWR" mark on top, "SAINTED WORD" centred below,
       small "RECORDS" under that. Black background, light-gray/white marks.
       Light-on-dark matches the bottom-corner overlay use case; the
       mix-blend-mode CSS uses 'screen' so any backdrop still shows through. -->
  <rect x="0" y="0" width="400" height="200" fill="#000000"/>

  <!-- SWR mark — same geometry as the monogram but with a "W" added
       in the centre. W is rendered as two angular V-strokes. -->
  <g fill="#f2f2f2" transform="translate(100, 28)">
    <!-- Top horizontal bar shared across S, W and R -->
    <rect x="0" y="0" width="200" height="14"/>

    <!-- "S" (left third) -->
    <path d="M 0 0
             L 0 28
             L 56 28
             L 56 42
             L 0 42
             L 0 64
             L 56 64
             L 56 78
             L 12 78
             L 12 64
             L 44 64
             L 44 42
             L 12 42
             L 12 14
             L 56 14
             L 56 0
             Z" />

    <!-- "W" (middle third) — built from two angled strokes -->
    <path d="M 64 0
             L 78 0
             L 86 50
             L 94 0
             L 108 0
             L 116 50
             L 124 0
             L 138 0
             L 124 78
             L 110 78
             L 101 32
             L 92 78
             L 78 78
             Z" />

    <!-- "R" (right third) -->
    <path d="M 144 0
             L 144 78
             L 158 78
             L 158 48
             L 172 48
             L 182 78
             L 198 78
             L 188 46
             C 188 42 188 40 188 38
             C 188 32 184 28 178 26
             C 182 24 184 20 184 14
             C 184 6 178 0 170 0
             Z
             M 158 14
             L 170 14
             C 172 14 174 16 174 20
             C 174 24 172 34 170 34
             L 158 34
             Z" />
  </g>

  <!-- "SAINTED WORD" sub-mark — clean sans-serif, letter-spaced -->
  <text x="200" y="142"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="28"
        letter-spacing="6"
        fill="#f2f2f2">SAINTED WORD</text>

  <!-- "RECORDS" tag line — smaller, more letter-spacing -->
  <text x="200" y="170"
        text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="400"
        font-size="14"
        letter-spacing="10"
        fill="#bdbdbd">RECORDS</text>
</svg>
