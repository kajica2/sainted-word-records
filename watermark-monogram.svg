<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d8a"/>
      <stop offset="0.5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#fff04a"/>
    </linearGradient>
  </defs>
  <!-- Waveform -->
  <g stroke="url(#g)" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <line x1="6" y1="30" x2="6" y2="30"/>
    <line x1="10" y1="22" x2="10" y2="38"/>
    <line x1="14" y1="14" x2="14" y2="46"/>
    <line x1="18" y1="20" x2="18" y2="40"/>
    <line x1="22" y1="8"  x2="22" y2="52"/>
    <line x1="26" y1="18" x2="26" y2="42"/>
    <line x1="30" y1="12" x2="30" y2="48"/>
    <line x1="34" y1="22" x2="34" y2="38"/>
    <line x1="38" y1="6"  x2="38" y2="54"/>
    <line x1="42" y1="16" x2="42" y2="44"/>
    <line x1="46" y1="20" x2="46" y2="40"/>
  </g>
  <!-- Playhead -->
