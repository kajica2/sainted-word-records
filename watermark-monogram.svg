<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="SWR Sainted Word Records monogram">
  <!-- Rounded square plate -->
  <rect x="0" y="0" width="200" height="200" rx="40" ry="40" fill="#ffffff"/>

  <!-- Stylised "SR" mark — black geometric letterforms on the white plate.
       Coordinate system: 0..200 both axes; mark sits roughly centered.
       Built from straight strokes + a single connecting path for the
       top horizontal that spans both letters. -->
  <g fill="#000000">
    <!-- Top horizontal bar shared by S and R -->
    <rect x="38" y="68" width="124" height="14"/>

    <!-- "S" body: top-left vertical descender, middle horizontal,
         bottom-left curl back to the right.
         Drawn as a single filled path so the angles stay crisp. -->
    <path d="M 38 68
             L 38 96
             L 116 96
             L 116 110
             L 38 110
             L 38 132
             L 116 132
             L 116 146
             L 50 146
             L 50 132
             L 102 132
             L 102 110
             L 50 110
             L 50 82
             L 116 82
             L 116 68
             Z" />

    <!-- "R" body: vertical bar on left, top connecting bar already
         provided by the shared horizontal, then a diagonal leg
         descending to bottom-right. -->
    <path d="M 124 68
             L 124 146
             L 138 146
             L 138 116
             L 152 116
             L 162 146
             L 178 146
             L 168 114
             C 168 110 168 108 168 106
             C 168 100 164 96 158 94
             C 162 92 164 88 164 82
             C 164 74 158 68 150 68
             Z
             M 138 82
             L 150 82
             C 152 82 154 84 154 88
             C 154 92 152 102 150 102
             L 138 102
             Z" />
  </g>
</svg>
