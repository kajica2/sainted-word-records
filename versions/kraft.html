    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;

    .tbtn:hover { background: var(--ink); color: var(--kraft); }
    .tbtn.primary { background: var(--ink); color: var(--kraft); }
    .tbtn.primary:hover { background: var(--stamp); border-color: var(--stamp); }
    section.stage { position: relative; background: #5a4028; overflow: hidden;

    /* Cardboard frame around the stage */
    .cardboard { position: absolute; inset: 14px; z-index: 1;
      background: var(--kraft);
      box-shadow: inset 0 0 0 2px var(--kraft-darker),
                  inset 0 0 0 4px var(--kraft),

    .cardboard::before { content: ''; position: absolute; inset: 12px;

    .cardboard::after { content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.08), transparent 40%),

    #render { position: absolute; inset: 26px; display: block; width: calc(100% - 52px);

    .label { position: absolute; top: 22px; right: 26px; z-index: 5;

    .stamp-corner { position: absolute; bottom: 26px; right: 26px; z-index: 5;

    footer { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 14px;

  <script>
    const stage = document.getElementById('render');
    const ctx = stage.getContext('2d', { willReadFrequently: true });
    let t0 = performance.now();

    function paint() {
      const t = (performance.now() - t0) / 1000;
      const W = stage.width, H = stage.height;
      // Cardboard base
      ctx.fillStyle = '#c4a578';
      ctx.fillRect(0, 0, W, H);

      // Faux cardboard texture — fibrous noise
      const img = ctx.getImageData(0, 0, W, H);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 30;
        d[i]     = Math.max(0, Math.min(255, d[i]     + n));
        d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n * 0.7));
        d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n * 0.4));
      }
      ctx.putImageData(img, 0, 0);

      // Hand-stamped shapes
      const cx = W/2, cy = H/2;
      const rot = t * 0.2;
      for (let i = 0; i < 5; i++) {
        const r = 80 + i * 60 + Math.sin(t * 1.3 + i) * 20;
        ctx.save();
        ctx.translate(cx + Math.cos(t * 0.4 + i) * 30, cy + Math.sin(t * 0.5 + i) * 20);
        ctx.rotate(rot + i);
        ctx.strokeStyle = `rgba(58, 40, 24, ${0.4 - i * 0.06})`;
        ctx.lineWidth = 3 - i * 0.3;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        // Irregular polygon
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2;
          const rr = r + (Math.random() - 0.5) * 8;
          const x = Math.cos(a) * rr;
          const y = Math.sin(a) * rr;
          if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
      ctx.setLineDash([]);

      // Hand-stamped typography
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.05);
      ctx.font = 'bold 88px "Archivo Black", sans-serif';
      ctx.fillStyle = 'rgba(58, 40, 24, 0.85)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PLAY', 0, 0);
      ctx.restore();

      // Audio
      const bass = 0.5 + Math.sin(t * 1.5) * 0.4;
      const mid = 0.4 + Math.sin(t * 0.8) * 0.3;
      const tr = 0.3 + Math.abs(Math.sin(t * 4)) * 0.4;
      window.SWR = window.SWR || {};
      window.SWR.Audio = window.SWR.Audio || {};
      window.SWR.Audio.feat = { bass, mid, treble: tr, beat: Math.max(0, Math.sin(t * 3) - 0.7) * 2 };

      requestAnimationFrame(paint);
    }
    paint();

    const fxScript = document.createElement('script');
    fxScript.src = '../fx-postprocess.js';
    fxScript.onload = () => {
      const apply = () => {
        if (window.FX && window.FX.setPersona) {
          window.FX.setPersona({
            temp: 0.25,       // slightly warm
            mut: 0.0,
            mutAlgo: 0,
            posterize: 0.15,  // mild — to keep hand-stamped feel
            vignette: 0.45,
            chroma: 0.0,
            grain: 0.55,      // heavy grain — paper fiber
            sepia: 0.65,      // heavy sepia — kraft color
            glow: 0.0,
            grayscale: 0.0,
            blur: 0.05,       // slight softness
            liquid: 0.0,
            pearl: 0.0,
            glitch: 0.0,
          });
        } else setTimeout(apply, 50);
      };
      apply();
    };
    document.body.appendChild(fxScript);
  </script>

  <div id="swr-start" role="button" aria-label="Start Sainted Word Records">
    <div class="box">

  <script>
  (function(){
    var DEFAULT_SONG = '../library/audio/loop-grain.wav';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var fired = false;
    // Minimal shim for engines that only expose feat (no load/play).
    // Kraft's engine is synth-only and does not implement real audio loading,
    // so install a tiny <audio>-element shim on first use. Idempotent.
    function ensureShim() {
      if (!window.SWR || !window.SWR.Audio) return;
      if (typeof window.SWR.Audio.load === 'function') return;
      var el = document.createElement('audio');
      el.crossOrigin = 'anonymous';
      el.preload = 'auto';
      // Expose the audio element so the Recorder can hook into it.
      window.SWR.Audio.el = el;
      window.SWR.Audio.load = function(f) {
        try { el.pause(); } catch (e) {}
        // Free the previous Blob URL before allocating a new one.
        if (el.__swr_blob_url) {
          try { URL.revokeObjectURL(el.__swr_blob_url); } catch (_) {}
        }
        el.__swr_blob_url = URL.createObjectURL(f);
        el.src = el.__swr_blob_url;
        // Recorder button becomes usable once a real audio element is loaded.
        var btn = document.getElementById('rec');
        if (btn) btn.disabled = false;
      };
      window.SWR.Audio.play = function() {
        var p = el.play();
        if (p && p.catch) p.catch(function(){});
        this.playing = true;
      };
      el.addEventListener('ended', function() { window.SWR.Audio.playing = false; });
    }

    // === RECORDER (MP4/WebM canvas + audio export) ===
    // Same shape as neon / film / etc.: MediaRecorder over the canvas
    // captureStream + a MediaStreamDestination fed from the audio element.
    // Kraft's ensureShim creates a private <audio> that we just exposed
    // as window.SWR.Audio.el, so we can MediaElementSource it.
    const Recorder = {
      rec: null, chunks: [], recording: false, mime: 'video/webm',
      mediaCtx: null, mediaSrc: null, mediaDest: null,
    // SWR_REC_MP4_INTEGRATION
      start() {
        if (!A.el) { setStatus('load a song first', ''); return; }
        const fpsSel = $('rec-fps') ? $('rec-fps').value : '30';
        const fps = parseInt(fpsSel, 10) || 30;
        const qualSel = $('rec-quality') ? $('rec-quality').value : 'high';
        const BITRATE = { high: 12_000_000, med: 6_000_000, low: 3_000_000 }[qualSel] || 12_000_000;
        const formatSel = $('rec-format') ? $('rec-format').value : 'auto';
        const wantMp4 = formatSel === 'mp4' || (formatSel === 'auto' && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs());
        if (wantMp4 && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs()) {
          this._wcActive = true;
          this._wcPending = window.SWR_RECORDER.start({
            canvas: stage,
            audioSource: A.an,
            audioSampleRate: A.ctx ? A.ctx.sampleRate : 0,
            audioNumberOfChannels: 2,
            width: stage.width,
            height: stage.height,
            fps: fps,
            videoBitsPerSecond: BITRATE,
          }).then(() => {
            this.recording = true;
            this.startedAt = Date.now();
            const durSel = $('rec-dur') ? $('rec-dur').value : '0';
            let durMs = 0;
            if (durSel === 'song' && A.el && A.el.duration) {
              durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
            } else if (durSel !== '0' && durSel !== 'manual') {
              durMs = parseInt(durSel) * 1000;
            }
            this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
            $('rec').classList.add('live');
            $('rec').textContent = '■ STOP';
            const formatDur = (ms) => {
              const s = Math.max(0, Math.round(ms / 1000));
              return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
            };
            if (this.autoStopAt > 0) {
              const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
              setStatus('rec · MP4 · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
              this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
            } else {
              setStatus('rec · MP4', 'live');
            }
            this.tickTimer = setInterval(() => {
              if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
              const el = formatDur(Date.now() - this.startedAt);
              if (this.autoStopAt > 0) {
                const rem = formatDur(this.autoStopAt - Date.now());
                const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
                const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
                setStatus('rec · MP4 · ' + el + ' / ' + durLabel, 'live');
              } else {
                setStatus('rec · MP4 · ' + el, 'live');
              }
            }, 500);
          }).catch((err) => {
            this._wcActive = false;
            if (err && err.unsupported) {
              setStatus('WebCodecs unsupported · falling back to WebM', 'warn');
              const prev = $('rec-format') ? $('rec-format').value : formatSel;
              if ($('rec-format')) $('rec-format').value = 'webm';
              this.start();
              if ($('rec-format')) $('rec-format').value = prev;
            } else {
              setStatus('recorder start failed: ' + (err && err.message || err), 'err');
            }
          });
          return;
        }
        // === MEDIA-RECORDER (WEBM) PATH — same as before ===
        const vstream = stage.captureStream(fps);
        const dest = A.ctx.createMediaStreamDestination();
        this.mediaDest = dest;
        try { A.an.disconnect(dest); } catch {}
        A.an.connect(dest);
        const tracks = [...vstream.getVideoTracks(), ...dest.stream.getAudioTracks()];
        const stream = new MediaStream(tracks);
        const mime = [
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=avc1,mp4a.40.2',
          'video/mp4;codecs=avc1',
          'video/mp4',
          'video/webm',
        ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
        this.mime = mime;
        this.rec = new MediaRecorder(stream, {
          mimeType: mime,
          videoBitsPerSecond: BITRATE,
          audioBitsPerSecond: 192_000,
        });
        this.chunks = [];
        this.rec.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
        this.rec.onstop = () => this._save();
        this.rec.start(250);
        this.recording = true;
        this.startedAt = Date.now();
        const durSel = $('rec-dur') ? $('rec-dur').value : '0';
        let durMs = 0;
        if (durSel === 'song' && A.el && A.el.duration) {
          durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
        } else if (durSel !== '0' && durSel !== 'manual') {
          durMs = parseInt(durSel) * 1000;
        }
        this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
        $('rec').classList.add('live');
        $('rec').textContent = '■ STOP';
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        const formatDur = (ms) => {
          const s = Math.max(0, Math.round(ms / 1000));
          return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
        };
        if (this.autoStopAt > 0) {
          const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
          setStatus('rec · ' + ext.toUpperCase() + ' · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
          this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
        } else {
          setStatus('rec · ' + ext.toUpperCase(), 'live');
        }
        this.tickTimer = setInterval(() => {
          if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
          const el = formatDur(Date.now() - this.startedAt);
          if (this.autoStopAt > 0) {
            const rem = formatDur(this.autoStopAt - Date.now());
            const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
            const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el + ' / ' + durLabel, 'live');
          } else {
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el, 'live');
          }
        }, 500);
        // SWR_REC_IMPROVED_v2
      },
      stop() {
        if (this._wcActive) {
          if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
          if (this.tickTimer) { clearInterval(this.tickTimer); this.tickTimer = null; }
          this._wcActive = false;
          this.recording = false;
          $('rec').classList.remove('live');
          $('rec').textContent = '● REC';
          setStatus('finalizing MP4…', '');
          window.SWR_RECORDER.stop().then((res) => {
            this.chunks = [res.blob];
            this.mime = res.mime;
            this._save();
          }).catch((err) => {
            setStatus('recorder stop failed: ' + (err && err.message || err), 'err');
          });
          return;
        }
        if (!this.rec) return;
        if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
        if (this.tickTimer) { clearInterval(this.tickTimer); this.tickTimer = null; }
        this.rec.stop();
        this.recording = false;
        $('rec').classList.remove('live');
        $('rec').textContent = '● REC';
        setStatus('rendering…', '');
        if (this.mediaDest) {
          try { A.an.disconnect(this.mediaDest); } catch {}
          this.mediaDest = null;
        }
      },
      _save() {
        const blob = new Blob(this.chunks, { type: this.mime });
        const a = document.createElement('a');
        const recUrl = URL.createObjectURL(blob);
        a.href = recUrl;
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const ext = this.mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        a.download = 'kraft-' + ts + '.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Free the download URL once the click has been dispatched.
        setTimeout(() => { try { URL.revokeObjectURL(recUrl); } catch (_) {} }, 1000);
      },
    };

    // (rec button enable happens inside ensureShim's load() — see above)

    const recBtn = document.getElementById('rec');
    if (recBtn) recBtn.addEventListener('click', () => {
      if (Recorder.recording) Recorder.stop();
      else Recorder.start();
    });
    async function start() {
      if (fired) return;
      fired = true;
      try {
        // Prefer the user's last-loaded song (from engine.html IDB),
        // fall back to the per-page hardcoded DEFAULT_SONG.
        var picked = window.SWR_PICK_DEFAULT_SONG
          ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
          : null;
        if (!picked) throw new Error('no song source available');
        var blob = picked.blob;
        var name = picked.name;
        var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
        if (window.SWR && window.SWR.Audio) {
          ensureShim();
          window.SWR.Audio.load(file);
          window.SWR.Audio.play();
          if (sub) {
            var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
            sub.textContent = tag + name;
          }
        }
      } catch (e) {
        if (sub) sub.textContent = 'tap "load song" to start';
        console.warn('swr auto-start failed:', e);
      }
      overlay.classList.add('hide');
      setTimeout(function(){ overlay.remove(); }, 600);
    }
    overlay.addEventListener('click', start, { once: true });
    document.addEventListener('keydown', function(ev){
      if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();
  </script>
<script src="./temp-slider.js"></script>
</body>
