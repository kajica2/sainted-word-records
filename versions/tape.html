  <style>
    :root {
      --bg: #1a1310; --panel: #2a1f1a; --line: #3a2a22;
      --ink: #e8d8b8; --muted: #8a7860;
      --rec: #c42a2a; --warn: #d4a04a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0a0806; color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { display: grid; grid-template-rows: 44px 1fr 56px; height: 100vh; }
    header { display: flex; align-items: center; gap: 14px; padding: 0 18px;
      background: var(--bg); border-bottom: 2px solid var(--rec); position: relative; }
    header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px;
      height: 1px; background: var(--rec); opacity: 0.4; }
    .v { font-weight: 700; letter-spacing: 0.18em; color: var(--rec); text-shadow: 2px 0 0 #0066ff; }
    .v small { color: var(--warn); margin-left: 6px; font-weight: 400; letter-spacing: 0.1em; }
    .pill { font-size: 9px; padding: 3px 8px; border: 1px solid var(--line); color: var(--muted);
      letter-spacing: 0.14em; text-transform: uppercase; }
    .pill.rec { color: var(--rec); border-color: var(--rec); animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0.3; } }
    .spacer { flex: 1; }
    .tbtn { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
      font: 10px/1 ui-monospace; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 7px 12px; cursor: pointer; }
    .tbtn:hover { border-color: var(--rec); color: var(--rec); }
    .tbtn.primary { background: var(--rec); color: #fff; border-color: var(--rec); font-weight: 700; }
    .tbtn.primary:hover { background: #ff3838; }
    section.stage { position: relative; background: #000; overflow: hidden; }
    #render { display: block; width: 100%; height: 100%; }
    /* Static noise overlay — VHS static feel */
    .static { position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background: repeating-linear-gradient(0deg,
        rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
        transparent 1px, transparent 3px);
      mix-blend-mode: overlay; }
    .static::after { content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%),
        linear-gradient(0deg, transparent 50%, rgba(255,255,255,0.02) 50%); }
    .label { position: absolute; top: 14px; left: 16px; z-index: 4;
      font: 11px/1 ui-monospace; color: var(--rec); letter-spacing: 0.18em;
      text-shadow: 1px 0 0 #00d4ff, -1px 0 0 #ff3838; }
    .timecode { position: absolute; bottom: 14px; right: 16px; z-index: 4;
      font: 14px/1 ui-monospace; color: var(--warn); letter-spacing: 0.14em;
      text-shadow: 1px 0 0 #000; }
    footer { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 14px;
      align-items: center; padding: 0 18px; background: var(--bg); border-top: 1px solid var(--line);
      font: 9px/1 ui-monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .param b { color: var(--warn); font-weight: 400; margin-left: 4px; }
    .led { width: 8px; height: 8px; border-radius: 50%; background: #000; border: 1px solid var(--rec); }
    .led.on { background: var(--rec); box-shadow: 0 0 8px var(--rec); }
    a.nav { color: var(--warn); text-decoration: none; font-size: 9px;
      letter-spacing: 0.14em; text-transform: uppercase; }
    a.nav:hover { color: var(--rec); }

    /* AUTO-START overlay (browser autoplay policy requires one user gesture) */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);
      cursor: pointer;
      transition: opacity 0.4s ease;
    }
    #swr-start .box {
      text-align: center; color: var(--ink);
      font-family: ui-monospace, monospace;
      padding: 28px 36px;
      border: 1px solid #ff0066;
      background: rgba(20,0,10,0.65);
      box-shadow: 0 0 32px rgba(255,0,102,0.25);
    }
    #swr-start .arrow { font-size: 56px; color: #ff0066; line-height: 1; margin-bottom: 14px; }
    #swr-start .label { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink); }
    #swr-start .sub   { font-size: 9px;  letter-spacing: 0.18em; text-transform: uppercase; color: #00ff66; margin-top: 8px; }
    #swr-start.hide { opacity: 0; pointer-events: none; }

<body data-page="tape">
      
  <div id="app">
    <header>
      <span class="gctrl" data-looks-mount></span>
      <div class="v">TAPE <small>v1 · VHS</small></div>
      <span class="pill rec" id="rec">● REC</span>
      <span class="pill" id="status">SP/LP</span>
      <span class="spacer"></span>
      <a class="nav" href="../engine.html">← engine</a>
    </header>
    <section class="stage">
      <canvas id="render" width="1280" height="720"></canvas>
      <div class="static"></div>
      <div class="label">CH-3 · 1986</div>
      <div class="timecode" id="timecode">00:00:00:00</div>
    </section>
    <footer>
      <div class="param">chroma <b>0.85</b></div>
      <div class="param">sepia <b>0.55</b></div>
      <div class="param">grain <b>0.40</b></div>
      <div class="param">glitch <b>0.35</b></div>
      <div class="param">vignette <b>0.60</b></div>
      <span data-fx-intensity-mount></span>
      <span data-fx-tone-mount></span>
      <button class="tbtn" id="automix-debug" title="Automix debug (D)" style="padding:3px 8px;font-size:9px;margin-left:6px;background:none;border:1px solid #444;border-radius:6px;color:#ccc;cursor:pointer;">Debug</button>
      <label class="tbtn" id="automix-toggle" style="cursor:pointer;">Automix <span id="automix-state" style="color:var(--m);">OFF</span></label>
      <select id="automix-style" title="How the visuals evolve (anchor pool · cadence · drift · cutting)" style="font-size:9px;padding:2px 4px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:9px ui-monospace;max-width:104px;margin-left:6px;"></select>
      <span class="led on"></span>
    </footer>
  </div>

  <script>
    // === 2D stage animation — concentric VHS-degraded rings + chroma ribbons ===
    const stage = document.getElementById('render');
    const ctx = stage.getContext('2d', { willReadFrequently: true });
    let t0 = performance.now();
    function paint() {
      const t = (performance.now() - t0) / 1000;
      const W = stage.width, H = stage.height;
      // Background — burnt umber gradient
      const bg = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, Math.max(W, H) * 0.7);
      bg.addColorStop(0, '#3a2a1a');
      bg.addColorStop(0.5, '#1a0e08');
      bg.addColorStop(1, '#000');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Sweeping ring — the "tape head" trace
      const cx = W/2 + Math.cos(t * 0.3) * 60;
      const cy = H/2 + Math.sin(t * 0.4) * 40;
      for (let i = 0; i < 6; i++) {
        const r = 80 + i * 60 + Math.sin(t * 1.2 + i) * 20;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(212, 160, 74, ${0.4 - i * 0.05})`;
        ctx.lineWidth = 2 - i * 0.2;
        ctx.stroke();
      }

      // Horizontal chroma ribbons (the "tracking" lines)
      for (let i = 0; i < 12; i++) {
        const y = ((t * 80 + i * 60) % (H + 80)) - 40;
        const wobble = Math.sin(y * 0.04 + t * 2) * 30;
        ctx.fillStyle = `hsla(${(t * 40 + i * 30) % 360}, 60%, 50%, 0.08)`;
        ctx.fillRect(wobble, y, W, 3);
      }

      // Big "head" — central pulsing circle
      const headR = 60 + Math.sin(t * 3) * 10;
      const head = ctx.createRadialGradient(cx, cy, 0, cx, cy, headR);
      head.addColorStop(0, 'rgba(255, 80, 80, 0.6)');
      head.addColorStop(0.5, 'rgba(196, 42, 42, 0.3)');
      head.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = head;
      ctx.beginPath();
      ctx.arc(cx, cy, headR, 0, Math.PI * 2);
      ctx.fill();

      // Timecode text
      ctx.font = 'bold 96px ui-monospace';
      ctx.fillStyle = 'rgba(232, 216, 184, 0.85)';
      ctx.textAlign = 'center';
      ctx.fillText('PLAY', cx, cy + 24);

      // Drive audio features for the shader. When a real song is loaded the
      // canonical extractor (lib/media-feat.client.js) samples the live
      // analyser; the old synthesised features remain the no-audio fallback
      // so the idle VHS demo still reacts.
      if (featHandle) {
        featHandle.sample();
      } else {
        window.SWR = window.SWR || {};
        window.SWR.Audio = window.SWR.Audio || {};
        window.SWR.Audio.feat = {
          bass: 0.4 + Math.sin(t * 1.5) * 0.3,
          mid: 0.5 + Math.sin(t * 0.8) * 0.2,
          treble: 0.3 + Math.abs(Math.sin(t * 4)) * 0.5,
          beat: Math.max(0, Math.sin(t * 3) - 0.7) * 3,
        };
      }

      requestAnimationFrame(paint);
    }
    paint();

    // === Canvas VHS tracking post-pass ===
    // The standalone page (this file) paints a burnt-umber radial field, a
    // sweeping stack of "tape head" rings, twelve horizontal chroma ribbons
    // marching down the frame, a pulsing red head circle and a PLAY
    // wordmark, and then layers a CSS .static scanline sheet plus a
    // "CH-3 · 1986" label and a running timecode over the canvas. Its audio
    // mapping is the classic VHS degradation: the head pulse breathes with
    // the bass, the ribbons shimmer with the treble, and the beat is the
    // tracking kick that makes the picture jump.
    //
    // Inside the engine this pass cannot repaint the frame — the user's
    // clips are already on the canvas when postFx() runs, so the tape look
    // has to be a grade/overlay instead of a replacement. The sepia wash,
    // the vignette and the scanline jitter are translucent source-over
    // passes; the tracking band, its chromatic split, the tracking tear and
    // the REC glow are additive ('lighter') so they brighten the media
    // underneath rather than hiding it.
    //
    // Audio features read: A.feat.bass (band height + REC glow), A.feat.treble
    // (chromatic bleed strength), A.feat.beat and A.feat.beatPulse (tracking
    // kick + REC blink), A.feat.rms (noise density), A.feat.centroid (smear
    // bias). Every read is defensive, so the pass still runs with no audio
    // object at all, and SWR_AUDIO_DAMP is optional (guarded) smoothing for
    // the band height.
    function drawFx() {
      const A_ = (typeof A !== 'undefined' && A) ? A : null;
      const feat = (A_ && A_.feat) ? A_.feat : null;
      const num = (v) => (typeof v === 'number' && isFinite(v)) ? v : 0;
      const bass = num(feat && feat.bass);
      const treble = num(feat && feat.treble);
      const beat = num(feat && feat.beat);
      const onset = num(feat && feat.onset);
      const rms = num(feat && feat.rms);
      const centroid = num(feat && feat.centroid);
      const beatPulse = !!(feat && feat.beatPulse);

      const t = performance.now() / 1000;
      const cw = (typeof W !== 'undefined' && W) ? W
        : ((typeof stage !== 'undefined' && stage && stage.width) ? stage.width : 1280);
      const ch = (typeof H !== 'undefined' && H) ? H
        : ((typeof stage !== 'undefined' && stage && stage.height) ? stage.height : 720);
      if (!cw || !ch) return;

      // Optional smoothing for the band height — the page's own band grows
      // and shrinks with the raw bass, so damping only the height keeps the
      // jitter intact while the edges stop strobing. SWR_AUDIO_DAMP is bound
      // by the switcher but may be undefined, so both the bound name and the
      // global are probed and every read is guarded.
      const _DAMP = (typeof SWR_AUDIO_DAMP !== 'undefined' && SWR_AUDIO_DAMP &&
        typeof SWR_AUDIO_DAMP.damp === 'function')
        ? SWR_AUDIO_DAMP.damp
        : ((typeof window !== 'undefined' && window.SWR_AUDIO_DAMP &&
            typeof window.SWR_AUDIO_DAMP.damp === 'function')
          ? window.SWR_AUDIO_DAMP.damp : null);
      let bassS = bass;
      if (_DAMP) {
        // `proc` is the switcher's stable scratch canvas, so it doubles as
        // the damping instance key — the band height then smooths across
        // frames instead of strobing on noisy analyser values.
        bassS = (typeof proc !== 'undefined' && proc) ? _DAMP(bass, 0.35, proc) : _DAMP(bass, 0.35);
      }

      ctx.save();

      // 1) Sepia wash — the page's own burnt-umber background gradient
      //    (#3a2a1a → #1a0e08) applied translucently over the media.
      const wash = ctx.createRadialGradient(cw / 2, ch / 2, 40, cw / 2, ch / 2, Math.max(cw, ch) * 0.7);
      wash.addColorStop(0, 'rgba(58,42,26,0.16)');
      wash.addColorStop(0.5, 'rgba(26,14,8,0.12)');
      wash.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, cw, ch);

      // 2) Vignette — same radial darkening as the page's .static::after.
      const vig = ctx.createRadialGradient(cw / 2, ch / 2, Math.min(cw, ch) * 0.34,
        cw / 2, ch / 2, Math.max(cw, ch) * 0.72);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, cw, ch);

      // 3) Scanline jitter — the page's 1px-in-3px static sheet, but each
      //    line is displaced horizontally so the pattern wobbles like a
      //    mis-tracked head. The wobble grows with the bass.
      const wob = 1.5 + bassS * 5 + rms * 3;
      ctx.fillStyle = 'rgba(232,216,184,0.035)';
      for (let y = 0; y < ch; y += 3) {
        const off = Math.sin(y * 0.07 + t * 3.1) * wob + Math.sin(y * 0.011 + t * 0.7) * wob * 1.6;
        ctx.fillRect(-4 + off, y, cw + 8, 1);
      }

      // 4) Tracking band — the horizontal strip of noise the tape head has
      //    lost, drifting down the frame at the same 80px/s as the page's
      //    chroma ribbons. Height follows the bass; the beat kicks it.
      const bandH = Math.max(18, Math.min(ch * 0.22, 34 + bassS * 90 + rms * 40));
      let bandY = ((t * 80) % (ch + bandH * 2)) - bandH;
      const kick = beat * 0.6 + onset;
      if (kick > 0.02) bandY += Math.sin(t * 37) * kick * 14;

      ctx.globalCompositeOperation = 'lighter';
      const bandGrad = ctx.createLinearGradient(0, bandY, 0, bandY + bandH);
      bandGrad.addColorStop(0, 'rgba(212,160,74,0)');
      bandGrad.addColorStop(0.5, 'rgba(212,160,74,0.10)');
      bandGrad.addColorStop(1, 'rgba(212,160,74,0)');
      ctx.fillStyle = bandGrad;
      ctx.fillRect(0, bandY, cw, bandH);

      // 5) Chroma bleed inside the band — the streaks are tinted with the
      //    page's chromatic-aberration colours (#ff3838 / #00d4ff, the
      //    same pair the .label and .v text-shadows use) and each streak is
      //    offset from its neighbours, which is what a split signal looks
      //    like. Treble drives how far the channels separate.
      const split = 1 + treble * 4 + centroid * 3;
      const streaks = 140;
      for (let i = 0; i < streaks; i++) {
        const n = Math.random();
        const x = Math.random() * cw;
        const y = bandY + Math.random() * bandH;
        const len = 6 + Math.random() * 46;
        const a = 0.05 + n * 0.22 * (0.4 + rms);
        if (n > 0.66) {
          ctx.fillStyle = 'rgba(255,56,56,' + a + ')';
          ctx.fillRect(x + split, y, len, 1.5);
        } else if (n > 0.4) {
          ctx.fillStyle = 'rgba(0,212,255,' + a * 0.85 + ')';
          ctx.fillRect(x - split, y, len, 1.5);
        } else {
          ctx.fillStyle = 'rgba(232,216,184,' + a + ')';
          ctx.fillRect(x, y, len, 1.5);
        }
      }

      // 6) Tracking tear — a bright scanline ripping across the band,
      //    split into the same red/cyan fringes.
      const tearY = bandY + ((t * 220) % bandH);
      ctx.fillStyle = 'rgba(232,216,184,0.22)';
      ctx.fillRect(0, tearY, cw, 1.5);
      ctx.fillStyle = 'rgba(255,56,56,0.18)';
      ctx.fillRect(split * 0.8, tearY, cw, 1.5);
      ctx.fillStyle = 'rgba(0,212,255,0.18)';
      ctx.fillRect(-split * 0.8, tearY, cw, 1.5);

      // 7) REC accent — the blinking record dot of the page header, in the
      //    page's --rec red, with an additive glow that swells on the beat.
      const blink = Math.sin(t * Math.PI * 2 / 1.2) > 0 ? 1 : 0.3;
      const recA = Math.max(0, Math.min(1, blink * (0.55 + bassS * 0.35) + (beatPulse ? 0.3 : 0)));
      const recGlow = ctx.createRadialGradient(18, 22, 0, 18, 22, 26 + bassS * 16);
      recGlow.addColorStop(0, 'rgba(196,42,42,' + (0.5 * recA) + ')');
      recGlow.addColorStop(1, 'rgba(196,42,42,0)');
      ctx.fillStyle = recGlow;
      ctx.fillRect(0, 0, 60, 60);
      ctx.beginPath();
      ctx.arc(18, 22, 4 + bassS * 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(196,42,42,' + recA + ')';
      ctx.fill();

      // 8) REC label + timecode — the page's own chrome, in --ink and
      //    --warn, with the label's chromatic text-shadow.
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = 'bold 11px ui-monospace';
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(255,56,56,0.5)';
      ctx.fillText('REC', 29, 26);
      ctx.fillStyle = 'rgba(0,212,255,0.5)';
      ctx.fillText('REC', 27, 26);
      ctx.fillStyle = 'rgba(232,216,184,0.9)';
      ctx.fillText('REC', 28, 26);

      const frames = Math.floor(performance.now() / 33);
      const total = frames % 10000;
      const tc = String(Math.floor(total / 3600)).padStart(2, '0') + ':' +
        String(Math.floor(total / 60) % 60).padStart(2, '0') + ':' +
        String(total % 60).padStart(2, '0') + ':' +
        String(frames % 30).padStart(2, '0');
      ctx.font = '14px ui-monospace';
      const tcW = ctx.measureText(tc).width;
      ctx.fillStyle = 'rgba(212,160,74,0.9)';
      ctx.fillText(tc, cw - tcW - 16, ch - 16);

      ctx.restore();
    }

    // Timecode
    setInterval(() => {
      const s = Math.floor(performance.now() / 33) % 10000;
      const m = Math.floor(s / 60) % 60;
      const sec = s % 60;
      const f = Math.floor((performance.now() / 33) % 30);
      const el = document.getElementById('timecode');
      if (el) el.textContent =
        `${String(Math.floor(s / 3600)).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}:${String(f).padStart(2, '0')}`;
    }, 33);

    // Audio stubs (so the SWR auto-start overlay can call .load() / .play())
    window.SWR.Audio.playing = false;
    window.SWR.Audio._el = null;
    // Canonical feat extractor (lib/media-feat.client.js). Replaces the old
    // fake Math.sin features when a real song is loaded; the fake writer in
    // paint() stays as the no-audio fallback so the idle shader still moves.
    var featHandle = null;
    window.SWR.Audio.load = function(file) {
      if (window.SWR.Audio._el) {
        try { window.SWR.Audio._el.pause(); } catch(e){}
        // Free the previous Blob URL before allocating a new one.
        if (window.SWR.Audio._el.__swr_blob_url) {
          try { URL.revokeObjectURL(window.SWR.Audio._el.__swr_blob_url); } catch (_) {}
        }
      }
      if (featHandle) { featHandle.detach(); featHandle = null; }
      var url = URL.createObjectURL(file);
      window.SWR.Audio._el = new Audio();
      window.SWR.Audio._el.__swr_blob_url = url;
      window.SWR.Audio._el.src = url;
      window.SWR.Audio._el.preload = 'auto';
      if (window.SWR_MEDIA_FEAT) featHandle = window.SWR_MEDIA_FEAT.attach(window.SWR.Audio._el);
    };
    window.SWR.Audio.play = function() {
      if (window.SWR.Audio._el) {
        window.SWR.Audio._el.play();
        window.SWR.Audio.playing = true;
      }
    };

    // === Load FX post-process and apply the TAPE persona ===
    const fxScript = document.createElement('script');
    fxScript.src = '../fx-postprocess.js';
    fxScript.onload = () => {
      // Apply TAPE persona — heavy chroma, sepia, grain, glitch, vignette
      const applyTape = () => {
        if (window.FX && window.FX.setPersona) {
          window.FX.setPersona({
            temp: 0.5,        // warm
            mut: 0.2,
            mutAlgo: 1,       // glitch displacement
            posterize: 0.05,  // light posterize
            vignette: 0.6,
            chroma: 0.85,     // heavy chromatic aberration
            grain: 0.4,
            sepia: 0.55,
            glow: 0.1,
            grayscale: 0.0,
            blur: 0.0,
            liquid: 0.0,
            pearl: 0.0,
            glitch: 0.35,     // horizontal slice displacement
          });
        } else {
          setTimeout(applyTape, 50);
        }
      };
      applyTape();
    };
    document.body.appendChild(fxScript);
  </script>

  <script>
  (function(){
    var DEFAULT_SONG = '../library/audio/loop-grain.wav';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var fired = false;
    async function start() {
      if (fired) return;
      fired = true;
      try {
        // Prefer the user's last-loaded song (from engine.html IDB),
        // fall back to the per-page hardcoded DEFAULT_SONG.
        var picked = window.SWR_PICK_DEFAULT_SONG
          ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
          : null;
        if (!picked) throw new Error('no song source available');
        var blob = picked.blob;
        var name = picked.name;
        var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
        if (window.SWR && window.SWR.Audio) {
          window.SWR.Audio.load(file);
          window.SWR.Audio.play();
          if (sub) {
            var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
            sub.textContent = tag + name;
          }
        }
      } catch (e) {
        if (sub) sub.textContent = 'tap "load song" to start';
        console.warn('swr auto-start failed:', e);
      }
      overlay.classList.add('hide');
      setTimeout(function(){ overlay.remove(); }, 600);
    }
    overlay.addEventListener('click', start, { once: true });
    document.addEventListener('keydown', function(ev){
      if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();
  </script>

<script>
  // Mount the automix style dropdown. Deferred so it runs after the
  // automix modules that expose SWR_AUTOMIX / SWR_ANCHOR_MAP.
  (function () {
    function __swr_mount_automix_style() {
      var sel = document.getElementById('automix-style');
      var S = window.SWR_AUTOMIX_STYLE;
      if (!sel || !S) return false;
      S.mount(sel);
      // Apply the stored style so a returning session keeps its look.
      S.apply(S.get());
      return true;
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', __swr_mount_automix_style, { once: true });
    } else if (!__swr_mount_automix_style()) {
      setTimeout(__swr_mount_automix_style, 300);
    }
  })();
