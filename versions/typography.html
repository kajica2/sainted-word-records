  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;800&family=Space+Mono:wght@400;700&display=swap');
    :root {
      --bg: #0e0e0e; --panel: #181818; --line: #2a2a2a;
      --ink: #fafafa; --muted: #888;
      --accent: #ff3030;
      /* iPhone safe-area insets, read through custom properties so
         each fixed overlay can use max(n, var(--safe-bottom)) instead of
         repeating env(). The 0px fallback keeps every non-notched
         browser pixel-identical to before. */
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left:   env(safe-area-inset-left,   0px);
      --safe-right:  env(safe-area-inset-right,  0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none;
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif; }
    #app { display: grid; grid-template-rows: 60px 1fr 52px; height: 100vh; }
    /* iPhone safe-area (P2.3): the transport header clears the
       Dynamic Island and the footer bar clears the home indicator;
       left/right cover landscape, where the notch side insets 59px
       and the rounded corners eat the other.
       The padding lands on #app, not body, for the reason
       engine.html gives: #app is this page's own 100vh grid, so
       under the global box-sizing: border-box the padding insets its
       grid tracks in place. Padding body would stack on top of
       #app's 100vh box and push the footer off-screen with no way
       back (html/body are overflow:hidden).
       position:fixed resolves against the viewport, so no padding on
       an in-flow element reaches the overlays below - each folds its
       own inset in with max(n, var(--safe-*)). Full-bleed inset:0
       overlays (#swr-start, .drop-zone, .swr-load) are meant to cover
       the notch and correctly stay untouched. */
    #app { padding-top:    var(--safe-top);
           padding-bottom: var(--safe-bottom);
           padding-left:   var(--safe-left);
           padding-right:  var(--safe-right); }
    header { display: flex; align-items: center; gap: 14px; padding: 0 24px;
      background: var(--bg); border-bottom: 1px solid var(--line); }
    .v { font: 800 22px/1 'Archivo Black', sans-serif; letter-spacing: -0.01em; }
    .v small { font: 500 10px/1 'Space Mono', monospace; color: var(--muted);
      margin-left: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
    .pill { font: 9px/1 'Space Mono', monospace; padding: 4px 10px;
      border: 1px solid var(--line); color: var(--muted);
      letter-spacing: 0.18em; text-transform: uppercase; }
    .pill.live { color: var(--accent); border-color: var(--accent);
      animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .spacer { flex: 1; }
    a.nav { color: var(--ink); text-decoration: none; font-size: 10px;
      font-family: 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; opacity: 0.6; }
    a.nav:hover { opacity: 1; }
    section.stage { position: relative; background: var(--bg); overflow: hidden; }
    #render { display: block; width: 100%; height: 100%; }
    .copy-editor { position: absolute; top: 18px; left: 24px; z-index: 5;
      display: flex; flex-direction: column; gap: 6px; max-width: 60%; }
    .copy-editor input, .copy-editor textarea {
      background: rgba(20,20,20,0.7); border: 1px solid var(--line);
      color: var(--ink); padding: 8px 12px; font: 500 13px/1.3 'Inter', sans-serif;
      outline: none; backdrop-filter: blur(8px); }
    .copy-editor input:focus, .copy-editor textarea:focus { border-color: var(--accent); }
    .copy-editor input { font: 800 22px/1.1 'Archivo Black', sans-serif; }
    .copy-editor textarea { resize: vertical; min-height: 36px; max-height: 80px; }
    .copy-editor .row { display: flex; gap: 6px; }
    .copy-editor .row > * { flex: 1; }
    .copy-editor .lbl { font: 9px/1 'Space Mono', monospace; color: var(--muted);
      letter-spacing: 0.18em; text-transform: uppercase; }
    .badge { position: absolute; top: 18px; right: 24px;
      font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); padding: 5px 10px; }
    footer { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 18px;
      align-items: center; padding: 0 24px; background: var(--bg);
      border-top: 1px solid var(--line);
      font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .param b { color: var(--ink); font-weight: 700; }
    .led { width: 8px; height: 8px; border-radius: 50%; background: #000; border: 1px solid var(--line); }
    .led.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    button.tbtn { font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 6px 12px; background: transparent;
      color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
    button.tbtn:hover { border-color: var(--accent); color: var(--accent); }
    /* AUTO-START */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(14,14,14,0.88);
      cursor: pointer;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }
    #swr-start .box {
      text-align: center; color: #fff;
      padding: 36px 52px;
      border: 1px solid var(--accent);
      background: rgba(30,15,15,0.7);
      box-shadow: 0 0 60px rgba(255,48,48,0.2);
      max-width: 480px;
    }
    #swr-start .arrow { font-size: 56px; color: var(--accent); line-height: 1; margin-bottom: 14px; }
    #swr-start .label { font: 800 18px/1 'Archivo Black', sans-serif;
      letter-spacing: 0.04em; text-transform: uppercase; color: #fff; position: static; }
    #swr-start .sub { font: 11px/1.4 'Space Mono', monospace; letter-spacing: 0.16em;
      text-transform: uppercase; color: #888; margin-top: 14px; }
    #swr-start.hide { opacity: 0; pointer-events: none; }
  </style>

<body data-page="typography">
      
  <div id="app">
    <header>
      <span class="gctrl" data-looks-mount></span>
      <div class="v">TYPOGRAPHY<small>· MOTION TYPE FOR DESIGNERS</small></div>
      <span class="pill live" id="live">● ON</span>
      <span class="spacer"></span>
      <a class="nav" href="../engine.html">← engine</a>
    </header>
    <section class="stage">
      <canvas id="render" width="1280" height="720"></canvas>
      <div class="copy-editor">
        <div class="lbl">Headline</div>
        <input id="headline" type="text" value="MAKE IT LOUD" maxlength="40" />
        <div class="row">
          <div>
            <div class="lbl">Subhead</div>
            <textarea id="subhead" rows="1">brand-safe motion typography · audio-reactive</textarea>
          </div>
        </div>
      </div>
      <div class="badge">audio-reactive type</div>
    </section>
    <footer>
      <div class="param">scale <b id="scale-v">1.00</b></div>
      <div class="param">weight <b id="weight-v">800</b></div>
      <div class="param">tracking <b id="track-v">0</b></div>
      <div class="param">kicker <b id="kicker-v">100%</b></div>
      <div class="param">temp <b id="temp-v">+0.0</b></div>
      <span data-fx-intensity-mount></span>
      <button class="tbtn" id="automix-debug" title="Automix debug (D)" style="padding:3px 8px;font-size:9px;margin-left:6px;background:none;border:1px solid #444;border-radius:6px;color:#ccc;cursor:pointer;">Debug</button>
      <label class="tbtn" id="automix-toggle" style="cursor:pointer;">Automix <span id="automix-state" style="color:var(--m);">OFF</span></label>
      <select id="automix-style" title="How the visuals evolve (anchor pool · cadence · drift · cutting)" style="font-size:9px;padding:2px 4px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:9px ui-monospace;max-width:104px;margin-left:6px;"></select>
      <button class="tbtn" id="rec" disabled>● REC</button>
    </footer>
  </div>

  <script>
    const stage = document.getElementById('render');
    const ctx = stage.getContext('2d', { willReadFrequently: true });
    let t0 = performance.now();

    const headlineEl = document.getElementById('headline');
    const subheadEl = document.getElementById('subhead');
    headlineEl.addEventListener('input', () => { /* re-render on next frame */ });
    subheadEl.addEventListener('input', () => {});

    // Audio reactivity
    function getAudioFeat() {
      if (window.Audio && window.Audio.feat) return window.Audio.feat;
      // Synthetic fallback
      const t = (performance.now() - t0) / 1000;
      return {
        bass: 0.5 + Math.sin(t * 1.5) * 0.4,
        mid: 0.5 + Math.sin(t * 0.8) * 0.3,
        treble: 0.4 + Math.abs(Math.sin(t * 4)) * 0.4,
        beat: Math.max(0, Math.sin(t * 2.5) - 0.6) * 2,
      };
    }

    function paint() {
      const t = (performance.now() - t0) / 1000;
      const W = stage.width, H = stage.height;
      const feat = getAudioFeat();

      // Background: subtle off-white that pulses with bass
      const bgLerp = 0.92 + feat.bass * 0.08;
      ctx.fillStyle = `rgb(${Math.floor(14 * (1 - bgLerp) + 245 * bgLerp)}, ${Math.floor(14 * (1 - bgLerp) + 245 * bgLerp)}, ${Math.floor(14 * (1 - bgLerp) + 245 * bgLerp)})`;
      ctx.fillRect(0, 0, W, H);

      // Headline: scale + weight pulse with beat
      const beatScale = 1.0 + feat.beat * 0.15;     // 1.0 .. 1.15
      const weight = Math.floor(800 + feat.bass * 200);  // 800..1000
      const tracking = Math.floor(feat.mid * 40) - 20;   // -20..20 em thousandths
      const kicker = Math.floor(80 + feat.treble * 100);  // bottom kicker size

      document.getElementById('scale-v').textContent = beatScale.toFixed(2);
      document.getElementById('weight-v').textContent = weight;
      document.getElementById('track-v').textContent = tracking;
      document.getElementById('kicker-v').textContent = kicker + '%';

      // Center the headline
      ctx.save();
      ctx.translate(W/2, H * 0.45);
      SWR_MOTION_KILL.gateScale(ctx, beatScale, beatScale);

      const headline = headlineEl.value || 'MAKE IT LOUD';
      ctx.font = `${weight} ${220}px "Archivo Black", "Inter", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Letter spacing (em thousandths → px for 220px font)
      // (Canvas 2D doesn't support letter-spacing directly, draw char by char)
      const charW = (220 * 0.5);  // rough char width
      const totalW = headline.length * charW * 1.0;
      const startX = -totalW / 2;
      for (let i = 0; i < headline.length; i++) {
        const ch = headline[i];
        const charOffset = i * charW * 1.0;
        // Subtle drop shadow
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillText(ch, startX + charOffset + 6, 6);
        // Main fill
        ctx.fillStyle = '#0a0a0a';
        ctx.fillText(ch, startX + charOffset, 0);
      }
      ctx.restore();

      // Subhead below
      ctx.save();
      ctx.translate(W/2, H * 0.7);
      const subhead = subheadEl.value || '';
      const subSize = 28;
      const subCharW = subSize * 0.55;
      const subWidth = subhead.length * subCharW;
      ctx.font = `500 ${subSize}px "Inter", sans-serif`;
      ctx.fillStyle = `rgba(20,20,20,${0.6 + feat.mid * 0.4})`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      // Word-wrap if too long
      if (subWidth > W * 0.8) {
        // Split into two lines
        const mid = Math.floor(subhead.length / 2);
        const split = subhead.lastIndexOf(' ', mid);
        const l1 = subhead.slice(0, split > 0 ? split : mid);
        const l2 = subhead.slice(split > 0 ? split + 1 : mid);
        ctx.fillText(l1, 0, -subSize);
        ctx.fillText(l2, 0, subSize);
      } else {
        ctx.fillText(subhead, 0, 0);
      }
      ctx.restore();

      // Kicker bar at the bottom: thin line that pulses
      const kickerY = H * 0.88;
      const kickerH = 4 + feat.treble * 12;
      const kickerW = W * 0.4 * (0.7 + kicker / 200);
      const kickerX = (W - kickerW) / 2;
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(kickerX, kickerY, kickerW, kickerH);

      // Bass-driven accent strip across the whole bottom
      ctx.fillStyle = `rgba(255,48,48,${0.05 + feat.bass * 0.4})`;
      ctx.fillRect(0, H - 4, W * (0.3 + feat.bass * 0.7), 4);

      // Temperature slider: subtle warm/cool tint via mix-blend would be ideal,
      // but in 2D canvas we can do a very subtle BG overlay.
      const temp = (window.FX && window.FX.state && window.FX.state.temp) || 0;
      if (Math.abs(temp) > 0.01) {
        const tint = temp > 0 ? `rgba(255,180,80,${Math.abs(temp) * 0.08})` : `rgba(80,180,255,${Math.abs(temp) * 0.08})`;
        ctx.fillStyle = tint;
        ctx.fillRect(0, 0, W, H);
      }

      // Audio feature exposure
      window.SWR = window.SWR || {};
      window.SWR.Audio = window.SWR.Audio || {};
      window.SWR.Audio.feat = feat;

      requestAnimationFrame(paint);
    }
    paint();

    // === Canvas kinetic-type post-pass ===
    // The standalone page paints an off-white "paper" sheet — a near-white
    // background whose brightness breathes with the bass — and on top of it
    // a huge Archivo Black headline ("MAKE IT LOUD") that scales on every
    // beat, thickens with the bass, tracks out with the mids, a small
    // subhead line under it, a kicker bar whose height rides the treble,
    // and a red (#ff3030) accent strip pinned to the bottom edge whose
    // width and opacity follow the bass. Hairline rules in --line frame
    // the sheet the way the page's chrome frames the canvas.
    //
    // Inside the shared engine the user's clips sit UNDER this pass, so the
    // paper cannot be an opaque fill: the sheet becomes a translucent white
    // veil the media still reads through, the grid rules and the type forms
    // are drawn in the page's own ink colours on top of it, and the red
    // accent plus the beat echo are composited with 'lighter' so they read
    // as light rather than as paint. Same typographic system — grid,
    // headline, subhead, kicker, red accent — laid over moving images
    // instead of replacing them.
    //
    // Audio mapping, identical to paint() above: bass -> paper brightness,
    // headline weight and accent-strip width/opacity; beat -> headline scale
    // (1.00 .. 1.15); mid -> tracking and subhead opacity; treble -> kicker
    // bar height and width.
    //
    // The headline is drawn as block letterforms assembled from rectangles
    // (the same heavy grotesque geometry as the page's Archivo Black) rather
    // than fillText, because real glyph metrics are not available here and
    // the engine has no headline input to read.
    //
    // Safe to compile into the engine: uses only ctx, W, H and A — all
    // bound by client/variant-switcher.client.js.
    function drawFx() {
      const feat = (typeof A !== 'undefined' && A && A.feat) || {};
      const bass = feat.bass || 0;
      const mid = feat.mid || 0;
      const treble = feat.treble || 0;
      const beat = feat.beat || 0;

      // Page palette, inlined from typography.html's :root and from the
      // literal fills paint() uses on the canvas:
      //   --line #2a2a2a (grid rules)  --accent #ff3030 (accent strip)
      //   headline / kicker fill #0a0a0a
      const INK = '#0a0a0a';
      const LINE = '#2a2a2a';
      const ACCENT = '#ff3030';

      // Heavy grotesque block letters on a 5x7 unit grid: [x, y, w, h].
      // Only the letters the page's own copy needs are defined.
      const GLYPHS = {
        A: [[1, 0, 3, 1], [0, 1, 1, 6], [4, 1, 1, 6], [1, 3, 3, 1]],
        D: [[0, 0, 1, 7], [1, 0, 3, 1], [4, 0, 1, 7], [1, 6, 3, 1]],
        E: [[0, 0, 1, 7], [1, 0, 4, 1], [1, 3, 3, 1], [1, 6, 4, 1]],
        I: [[0, 0, 5, 1], [2, 1, 1, 5], [0, 6, 5, 1]],
        K: [[0, 0, 1, 7], [4, 0, 1, 1], [3, 1, 1, 1], [1, 2, 2, 1], [3, 4, 1, 1], [4, 5, 1, 2]],
        L: [[0, 0, 1, 7], [0, 6, 5, 1]],
        M: [[0, 0, 1, 7], [4, 0, 1, 7], [1, 1, 1, 2], [3, 1, 1, 2], [2, 3, 1, 1]],
        N: [[0, 0, 1, 7], [4, 0, 1, 7], [1, 1, 2, 2], [3, 4, 1, 2]],
        O: [[0, 0, 1, 7], [4, 0, 1, 7], [1, 0, 3, 1], [1, 6, 3, 1]],
        T: [[0, 0, 5, 1], [2, 1, 1, 6]],
        U: [[0, 0, 1, 6], [4, 0, 1, 6], [1, 6, 3, 1]],
      };

      // Metrics: a glyph is 5 units wide, one unit of sidebearing follows
      // every character, a space is 2 units, and the live tracking is added
      // to each advance — the same relationship the page has between its
      // headline size and its tracking readout.
      function advance(ch, unit, track) {
        return (ch === ' ' ? 2 : 5) * unit + unit + track;
      }

      function wordWidth(word, unit, track) {
        let w = 0;
        for (const ch of word) w += advance(ch, unit, track);
        // No trailing sidebearing on the last character.
        return w - (unit + track);
      }

      // Draw a word centred on cx, its cap height sitting on baseline.
      // fw / fh thicken the stems and the bars (the "weight" parameter).
      function drawWord(word, unit, cx, baseline, track, fw, fh, color, alpha) {
        ctx.fillStyle = color;
        ctx.globalAlpha = alpha;
        let x = cx - wordWidth(word, unit, track) / 2;
        for (const ch of word) {
          if (ch !== ' ') {
            const g = GLYPHS[ch];
            if (g) {
              for (const r of g) {
                const gx = r[0], gy = r[1], gw = r[2], gh = r[3];
                const w = gw * unit * (gw >= gh ? fw : 1);
                const h = gh * unit * (gh > gw ? fh : 1);
                ctx.fillRect(x + gx * unit, baseline - 7 * unit + gy * unit, w, h);
              }
            }
          }
          x += advance(ch, unit, track);
        }
        ctx.globalAlpha = 1;
      }

      ctx.save();

      // 1) The paper sheet. paint() fills an opaque near-white background
      //    whose luminance follows the bass; here it is a translucent veil
      //    so the engine's media stays visible underneath.
      const paper = 0.16 + bass * 0.06;
      ctx.fillStyle = 'rgba(250, 250, 250, ' + paper.toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);

      // 2) Typographic grid — margin rules, twelve column rules and the
      //    baseline rules the headline and subhead sit on (--line).
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;
      for (let i = 1; i < 12; i++) {
        const x = Math.round((W / 12) * i) + 0.5;
        ctx.globalAlpha = 0.16;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.45;
      const marginX = [W * 0.04, W * 0.96];
      for (const mx of marginX) {
        ctx.beginPath();
        ctx.moveTo(Math.round(mx) + 0.5, 0);
        ctx.lineTo(Math.round(mx) + 0.5, H);
        ctx.stroke();
      }

      // 3) The headline: "MAKE IT LOUD" set as one line, scaled on the beat
      //    exactly like paint() (1.00 .. 1.15), thickened by the bass
      //    (weight 800 .. 1000) and tracked out by the mids.
      const HEADLINE = 'MAKE IT LOUD';
      const SUBHEAD = 'MOTION';
      const cols = 65; // 10 glyphs * 5 units + 2 spaces * 2 units + sidebearings
      // Sized so the line still fits the frame after the beat scale
      // (up to 1.15x) and the live tracking have been applied.
      const unit = Math.min((W * 0.78) / cols, (H * 0.28) / 7);
      const trackUnit = (Math.floor(mid * 40) - 20) / 1000; // em thousandths
      const track = trackUnit * 7 * unit;
      const fw = 1 + bass * 0.14;
      const fh = 1 + bass * 0.2;
      const beatScale = 1 + beat * 0.15;
      const headBase = H * 0.45 + 3.5 * unit;

      // Baselines the grid rules follow (headline cap height + subhead).
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.moveTo(marginX[0], Math.round(headBase) + 0.5);
      ctx.lineTo(marginX[1], Math.round(headBase) + 0.5);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.save();
      ctx.translate(W / 2, headBase);
      SWR_MOTION_KILL.gateScale(ctx, beatScale, beatScale);
      ctx.translate(-W / 2, -headBase);
      drawWord(HEADLINE, unit, W / 2, headBase, track, fw, fh, INK, 0.95);
      ctx.restore();

      // 4) Subhead line under the headline, opacity driven by the mids.
      const subUnit = unit * 0.26;
      const subBase = H * 0.7 + 3.5 * subUnit;
      drawWord(SUBHEAD, subUnit, W / 2, subBase, track * 0.4, 1, 1,
        'rgba(20, 20, 20, ' + (0.6 + mid * 0.4).toFixed(3) + ')', 1);

      // 5) Kicker bar: height rides the treble, width the treble-scaled
      //    kicker percentage, exactly as paint() computes it.
      const kicker = Math.floor(80 + treble * 100);
      const kickerH = 4 + treble * 12;
      const kickerW = W * 0.4 * (0.7 + kicker / 200);
      const kickerY = H * 0.88;
      ctx.fillStyle = INK;
      ctx.globalAlpha = 0.9;
      ctx.fillRect((W - kickerW) / 2, kickerY, kickerW, kickerH);

      // 6) Red accent strip along the bottom edge: width and opacity follow
      //    the bass, exactly as paint() does — plus an additive bloom so it
      //    glows over the media instead of sitting flat on it.
      const accentA = 0.05 + bass * 0.4;
      const accentW = W * (0.3 + bass * 0.7);
      ctx.globalAlpha = accentA;
      ctx.fillStyle = ACCENT;
      ctx.fillRect(0, H - 4, accentW, 4);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = accentA * 0.8;
      ctx.fillRect(0, H - 10, accentW, 6);

      // 7) Beat echo: the headline re-strikes in red, offset, on every
      //    hit — the kinetic-type flourish, additive so it reads as light.
      if (beat > 0.02) {
        ctx.globalAlpha = Math.min(Math.max(beat * 0.28, 0), 1);
        ctx.fillStyle = ACCENT;
        let x = W / 2 - wordWidth(HEADLINE, unit, track) / 2 + 8;
        const baseline = headBase - 8;
        for (const ch of HEADLINE) {
          if (ch !== ' ') {
            const g = GLYPHS[ch];
            if (g) {
              for (const r of g) {
                ctx.fillRect(x + r[0] * unit, baseline - 7 * unit + r[1] * unit,
                  r[2] * unit, r[3] * unit);
              }
            }
          }
          x += advance(ch, unit, track);
        }
      }

      ctx.restore();
    }

    // === RECORDER ===
    const Recorder = {
      rec: null, chunks: [], recording: false, mime: 'video/webm',
      mediaCtx: null, mediaSrc: null, mediaDest: null,
    // SWR_REC_MP4_INTEGRATION
      start() {
        if (!A.el) { setStatus('load a song first', ''); return; }
        const fpsSel = $('rec-fps') ? $('rec-fps').value : '30';
        const fps = parseInt(fpsSel, 10) || 30;
        const qualSel = $('rec-quality') ? $('rec-quality').value : 'high';
        const BITRATE = { high: 12_000_000, med: 6_000_000, low: 3_000_000 }[qualSel] || 12_000_000;
        const formatSel = $('rec-format') ? $('rec-format').value : 'auto';
        const wantMp4 = formatSel === 'mp4' || (formatSel === 'auto' && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs());
        if (wantMp4 && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs()) {
          this._wcActive = true;
          this._wcPending = window.SWR_RECORDER.start({
            canvas: stage,
            audioSource: A.an,
            audioSampleRate: A.ctx ? A.ctx.sampleRate : 0,
            audioNumberOfChannels: 2,
            width: stage.width,
            height: stage.height,
            fps: fps,
            videoBitsPerSecond: BITRATE,
          }).then(() => {
            this.recording = true;
            this.startedAt = Date.now();
            const durSel = $('rec-dur') ? $('rec-dur').value : '0';
            let durMs = 0;
            if (durSel === 'song' && A.el && A.el.duration) {
              durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
            } else if (durSel !== '0' && durSel !== 'manual') {
              durMs = parseInt(durSel) * 1000;
            }
            this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
            $('rec').classList.add('live');
            $('rec').textContent = '■ STOP';
            const formatDur = (ms) => {
              const s = Math.max(0, Math.round(ms / 1000));
              return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
            };
            if (this.autoStopAt > 0) {
              const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
              setStatus('rec · MP4 · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
              this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
            } else {
              setStatus('rec · MP4', 'live');
            }
            this.tickTimer = setInterval(() => {
              if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
              const el = formatDur(Date.now() - this.startedAt);
              if (this.autoStopAt > 0) {
                const rem = formatDur(this.autoStopAt - Date.now());
                const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
                const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
                setStatus('rec · MP4 · ' + el + ' / ' + durLabel, 'live');
              } else {
                setStatus('rec · MP4 · ' + el, 'live');
              }
            }, 500);
          }).catch((err) => {
            this._wcActive = false;
            if (err && err.unsupported) {

              const prev = $('rec-format') ? $('rec-format').value : formatSel;

              this.start();
              if ($('rec-format')) $('rec-format').value = prev;
            } else {
              setStatus('recorder start failed: ' + (err && err.message || err), 'err');
            }
          });

        }

        const vstream = stage.captureStream(fps);
        const dest = A.ctx.createMediaStreamDestination();
        this.mediaDest = dest;
        try { A.an.disconnect(dest); } catch {}
        A.an.connect(dest);
        const tracks = [...vstream.getVideoTracks(), ...dest.stream.getAudioTracks()];
        const stream = new MediaStream(tracks);
        const mime = [
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=avc1,mp4a.40.2',
          'video/mp4;codecs=avc1',
          'video/mp4',
          'video/webm',
        ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
        this.mime = mime;
        this.rec = new MediaRecorder(stream, {
          mimeType: mime,
          videoBitsPerSecond: BITRATE,
          audioBitsPerSecond: 192_000,
        });
        this.chunks = [];
        this.rec.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
        this.rec.onstop = () => this._save();
        this.rec.start(250);
        this.recording = true;
        this.startedAt = Date.now();
        const durSel = $('rec-dur') ? $('rec-dur').value : '0';
        let durMs = 0;
        if (durSel === 'song' && A.el && A.el.duration) {
          durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
        } else if (durSel !== '0' && durSel !== 'manual') {
          durMs = parseInt(durSel) * 1000;
        }
        this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
        $('rec').classList.add('live');
        $('rec').textContent = '■ STOP';
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        const formatDur = (ms) => {
          const s = Math.max(0, Math.round(ms / 1000));
          return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
        };
        if (this.autoStopAt > 0) {
          const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
          setStatus('rec · ' + ext.toUpperCase() + ' · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
          this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
        } else {
          setStatus('rec · ' + ext.toUpperCase(), 'live');
        }
        this.tickTimer = setInterval(() => {
          if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
          const el = formatDur(Date.now() - this.startedAt);
          if (this.autoStopAt > 0) {
            const rem = formatDur(this.autoStopAt - Date.now());
            const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
            const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el + ' / ' + durLabel, 'live');
          } else {
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el, 'live');
          }
        }, 500);
        // SWR_REC_IMPROVED_v2
      },
      stop() {
        if (this._wcActive) {
          if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
          if (this.tickTimer) { clearInterval(this.tickTimer); this.tickTimer = null; }
          this._wcActive = false;
          this.recording = false;
          $('rec').classList.remove('live');
          $('rec').textContent = '● REC';
          setStatus('finalizing MP4…', '');
          window.SWR_RECORDER.stop().then((res) => {
            this.chunks = [res.blob];
            this.mime = res.mime;
            this._save();
          }).catch((err) => {
            setStatus('recorder stop failed: ' + (err && err.message || err), 'err');
          });
          return;
        }
        if (!this.rec) return;
        if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
        if (this.tickTimer) { clearInterval(this.tickTimer); this.tickTimer = null; }
        this.rec.stop();
        this.recording = false;
        $('rec').classList.remove('live');
        $('rec').textContent = '● REC';
        setStatus('rendering…', '');
        if (this.mediaDest) {
          try { A.an.disconnect(this.mediaDest); } catch {}
          this.mediaDest = null;
        }
      },
      _save() {
        const blob = new Blob(this.chunks, { type: this.mime });
        const a = document.createElement('a');
        const recUrl = URL.createObjectURL(blob);
        a.href = recUrl;
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const ext = this.mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        a.download = 'typography-' + ts + '.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Free the download URL once the click has been dispatched.
        setTimeout(() => { try { URL.revokeObjectURL(recUrl); } catch (_) {} }, 1000);
      },
    };

    const recBtn = document.getElementById('rec');
    if (recBtn) recBtn.addEventListener('click', () => {
      if (Recorder.recording) Recorder.stop();

    if (!window.SWR.Audio.load) {
      window.SWR.Audio.load = function (f) {

        if (this.el && this.el.__swr_blob_url) {
          try { URL.revokeObjectURL(this.el.__swr_blob_url); } catch (_) {}

        this.el = document.createElement('audio');
        this.el.crossOrigin = 'anonymous';
        this.el.__swr_blob_url = URL.createObjectURL(f);
        this.el.src = this.el.__swr_blob_url;
        this.el.preload = 'auto';
        var btn = document.getElementById('rec');
        if (btn) btn.disabled = false;
      };
      window.SWR.Audio.play = function () {
        if (this.el) { this.el.play(); this.playing = true; }
      };
    }
  </script>

  <script>
  (function(){
    var DEFAULT_SONG = '../library/audio/loop-shimmer.wav';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var fired = false;

    // Can we autoplay without a user gesture? Modern browsers
    // (Chrome 94+, Safari 16.4+, Firefox 121+) relax autoplay for
    // sites the user has interacted with before. The MediaSession
    // API surfaces a "activation hint" — non-empty activation
    // means the user has clicked/tapped/typed since the page loaded,
    // and we can autoplay. On pages where this is true, run start()
    // immediately and skip the overlay.
    var canAutoplay = false;
    try {
      if (navigator.userActivation && navigator.userActivation.isActive) {
        canAutoplay = true;
      }
    } catch (_) {}

    async function start() {
      if (fired) return;
      fired = true;
      var succeeded = false;
      try {
        // Prefer the user's last-loaded song (from engine.html IDB),
        // fall back to the per-page bundled audio.
        var picked = window.SWR_PICK_DEFAULT_SONG
          ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
          : null;
        if (!picked) throw new Error('no song source available');
        var blob = picked.blob;
        var name = picked.name;
        var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
        if (window.SWR && window.SWR.Audio) {
          window.SWR.Audio.load(file);
          await window.SWR.Audio.play();
          if (sub) {
            var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
            sub.textContent = tag + name;
          }
        }
        succeeded = true;
      } catch (e) {
        // Failure path: leave the overlay visible so the user can
        // click again. Reset the fired flag so the click handler
        // can fire a fresh attempt. Without this, a single failed
        // autoplay leaves the user stranded — the overlay disappears
        // and the "tap to start" hint vanishes with it. This is the
        // exact "media is not loading" symptom we were trying to
        // avoid.
        fired = false;
        if (sub) sub.textContent = 'tap "load song" to start';
        console.warn('swr auto-start failed:', e);
      }
      // Only hide + remove the overlay on success. The overlay is
      // the manual fallback for browsers that still block autoplay;
      // removing it on failure strands the user with no retry path.
      if (succeeded) {
        overlay.classList.add('hide');
        setTimeout(function(){ overlay.remove(); }, 600);
      }
    }

    // Track a one-shot user gesture anywhere on the page to arm the
    // audio for next time. Once armed, the overlay can autoplay.
    document.addEventListener('pointerdown', function arm() {
      try { localStorage.setItem('swr.audio.armed', '1'); } catch (_) {}
    }, { once: true, capture: true });

    if (canAutoplay || (function () {
      try { return localStorage.getItem('swr.audio.armed') === '1'; }
      catch (_) { return false; }
    })()) {
      // Try to autoplay immediately — if the browser blocks, the
      // overlay stays visible (start()'s catch path) and the user
      // can click it manually. Either way, the engine renders
      // visual content on enter via the normal RAF loop.
      //
      // Wait for window.SWR_PICK_DEFAULT_SONG to be defined —
      // last-song.js (which defines it) loads AFTER this inline
      // script. Poll until it's there, then fire. This avoids the
      // race where the auto-start fires before last-song.js has
      // registered the helper.
      function waitForPick() {
        if (window.SWR_PICK_DEFAULT_SONG) {
          start();
          return;
        }
        var tries = 0;
        var iv = setInterval(function() {
          tries++;
          if (window.SWR_PICK_DEFAULT_SONG) {
            clearInterval(iv);
            start();
          } else if (tries > 50) {  // ~5s timeout
            clearInterval(iv);
            // Don't fire — overlay stays as fallback.
          }
        }, 100);
      }
      waitForPick();
    }

    // If the autoplay attempt didn't fire the overlay (because
    // play() resolved), keep the overlay visible until the user
    // explicitly hides it. The overlay remains the manual fallback
    // for browsers that still block autoplay.
    overlay.addEventListener('click', function manualStart() {
      if (!fired) start();
    });
    document.addEventListener('keydown', function(ev){
      if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();
  </script>
