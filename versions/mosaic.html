  <style>
    :root {
      --bg: #0a0a0a; --panel: #1a1a1a; --line: #2a2a2a;
      --c1: #ff2d8a; --c2: #00d4ff; --c3: #ffd700; --c4: #00ff7a; --c5: #b400ff;
      --ink: #fafafa; --muted: #888;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }

      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-transform: uppercase; }
    .v small { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted);

    .sw.c1 { background: var(--c1); }
    .sw.c2 { background: var(--c2); }
    .sw.c3 { background: var(--c3); }
    .sw.c4 { background: var(--c4); }
    .sw.c5 { background: var(--c5); }
    .pill { font: 10px/1 'Geist Mono', monospace; padding: 4px 10px;
      border: 1px solid var(--line); color: var(--muted);
      letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }
    .pill.live { color: var(--c4); border-color: var(--c4);
      box-shadow: 0 0 6px rgba(0, 255, 122, 0.3); animation: live 1.4s infinite; }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .spacer { flex: 1; }
    .tbtn { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
      font: 10px/1 'Geist Mono', monospace; letter-spacing: 0.15em;
      text-transform: uppercase; padding: 7px 14px; cursor: pointer; font-weight: 500; }
    .tbtn:hover { border-color: var(--c2); color: var(--c2); }
    .tbtn.primary { background: var(--c1); color: #000; border-color: var(--c1); font-weight: 700; }
    .tbtn.primary:hover { background: var(--c2); border-color: var(--c2); }
    section.stage { position: relative; background: #000; overflow: hidden; }
    #render { display: block; width: 100%; height: 100%; }
    .pixel-grid { position: absolute; inset: 0; pointer-events: none; z-index: 3;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 16px 16px; }
    .label { position: absolute; top: 14px; left: 18px; z-index: 4;
      font: bold 11px/1 'Geist Mono', monospace; color: var(--c3);
      letter-spacing: 0.2em; text-transform: uppercase;
      background: rgba(0,0,0,0.6); padding: 4px 10px; border: 1px solid var(--c3); }
    .fps { position: absolute; bottom: 14px; right: 18px; z-index: 4;

      letter-spacing: 0.15em; text-transform: uppercase;

    footer { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 14px;
      align-items: center; padding: 0 18px; background: var(--bg);

    a.nav { color: var(--c2); text-decoration: none; font: 10px/1 'Geist Mono', monospace;
      letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }
    a.nav:hover { color: var(--c1); }

    /* SWR AUTO-START-OVERLAY */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);

    #swr-start.hide { opacity: 0; pointer-events: none; }

  <script>
    const stage = document.getElementById('render');
    const ctx = stage.getContext('2d', { willReadFrequently: true });
    let t0 = performance.now();
    let frameCount = 0;
    let lastFps = performance.now();

    function paint() {
      const t = (performance.now() - t0) / 1000;
      const W = stage.width, H = stage.height;
      const cx = W/2, cy = H/2;

      // Background — rotating gradient mesh
      const bg = ctx.createLinearGradient(
        cx + Math.cos(t * 0.3) * 400, cy + Math.sin(t * 0.3) * 400,
        cx - Math.cos(t * 0.3) * 400, cy - Math.sin(t * 0.3) * 400
      );
      bg.addColorStop(0, '#0a002a');
      bg.addColorStop(0.3, '#2a0040');
      bg.addColorStop(0.6, '#40002a');
      bg.addColorStop(1, '#001a40');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Big colored blobs
      const blobs = [
        { c: '#ff2d8a', r: 180, sx: 0.4, sy: 0.3, phase: 0 },
        { c: '#00d4ff', r: 220, sx: -0.3, sy: 0.4, phase: 1 },
        { c: '#ffd700', r: 160, sx: 0.3, sy: -0.4, phase: 2 },
        { c: '#00ff7a', r: 140, sx: -0.4, sy: -0.3, phase: 3 },
        { c: '#b400ff', r: 200, sx: 0.0, sy: 0.0, phase: 4 },
      ];
      for (const b of blobs) {
        const x = cx + Math.cos(t * b.sx + b.phase) * 350;
        const y = cy + Math.sin(t * b.sy + b.phase) * 280;
        const r = b.r + Math.sin(t * 2 + b.phase) * 30;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, b.c);
        g.addColorStop(0.5, b.c + 'aa');
        g.addColorStop(1, b.c + '00');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Geometric — concentric squares
      for (let i = 0; i < 6; i++) {
        const r = 60 + i * 50 + Math.sin(t * 1.2 + i) * 20;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(t * 0.15 + i * 0.3);
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 - i * 0.04})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(-r, -r, r * 2, r * 2);
        ctx.restore();
      }

      // Big bold title
      ctx.font = 'bold 96px "Space Grotesk", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fafafa';
      ctx.fillText('NEON', cx, cy);

      // Audio
      const bass = 0.5 + Math.sin(t * 1.5) * 0.4;
      const mid = 0.4 + Math.sin(t * 0.8) * 0.3;
      const tr = 0.3 + Math.abs(Math.sin(t * 4)) * 0.4;
      window.SWR = window.SWR || {};
      window.SWR.Audio = window.SWR.Audio || {};
      window.SWR.Audio.feat = { bass, mid, treble: tr, beat: Math.max(0, Math.sin(t * 3) - 0.7) * 2 };

      // FPS counter
      frameCount++;
      const now = performance.now();
      if (now - lastFps > 1000) {
        const fps = Math.round(frameCount * 1000 / (now - lastFps));
        const el = document.getElementById('fps');
        if (el) el.textContent = fps + ' FPS';
        frameCount = 0;
        lastFps = now;
      }

      requestAnimationFrame(paint);
    }
    paint();

    const fxScript = document.createElement('script');
    fxScript.src = '../fx-postprocess.js';
    fxScript.onload = () => {
      const apply = () => {
        if (window.FX && window.FX.setPersona) {
          window.FX.setPersona({
            temp: 0.0,         // neutral
            mut: 0.0,
            mutAlgo: 0,
            posterize: 0.85,   // heavy posterize — quantized color blocks
            vignette: 0.2,
            chroma: 0.3,       // light chroma split
            grain: 0.0,
            sepia: 0.0,
            glow: 0.4,         // moderate glow — neon look
            grayscale: 0.0,
            blur: 0.0,
            liquid: 0.15,      // light liquid warp
            pearl: 0.0,
            glitch: 0.0,
          });
        } else setTimeout(apply, 50);
      };
      apply();
    };
    document.body.appendChild(fxScript);
  </script>

  <script>
  (function(){
    if (window.__SWR_AUTO_START_INJECTED__) return;
    window.__SWR_AUTO_START_INJECTED__ = true;
    var DEFAULT_SONG = '../library/audio/loop-grain.wav';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var audio = null;
    function showSub(label) { if (sub) sub.textContent = label; }
    async function start() {
      if (audio) return;
      // Prefer the user's last-loaded song (from engine.html IDB),
      // fall back to the per-page hardcoded DEFAULT_SONG.
      var url = DEFAULT_SONG;
      try {
        if (window.SWR_PICK_DEFAULT_SONG) {
          var picked = await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG);
          if (picked && picked.blob) {
            url = URL.createObjectURL(picked.blob);
            // remember for the sub label
            start._lastName = picked.name;
            start._lastSource = picked.source;
          }
        }
      } catch (_) { /* fall through to DEFAULT_SONG */ }
      audio = new Audio(url);
      audio.loop = true;
      audio.volume = 0.6;
      // Expose for the Recorder block (lives outside this IIFE).
      window.__mosaicAudio = audio;
      var recBtn = document.getElementById('rec');
      if (recBtn) recBtn.disabled = false;
      audio.play().then(function() {
        var tag = start._lastSource === 'saved' ? 'last song · ' : 'playing · ';
        showSub(tag + (start._lastName || DEFAULT_SONG.split('/').pop()));
      }).catch(function(e) {
        showSub('tap a video to start');
        console.warn('swr auto-start failed:', e);
      });
      overlay.classList.add('hide');
      setTimeout(function(){ overlay.remove(); }, 600);
    }

    // === RECORDER (MP4/WebM canvas + audio export) ===
    // Same shape as neon / film / etc. Mosaic keeps its <audio> in a
    // closure-scoped var, which we just exposed as window.__mosaicAudio.
    const Recorder = {
      rec: null, chunks: [], recording: false, mime: 'video/webm',
      mediaCtx: null, mediaSrc: null, mediaDest: null,
    // SWR_REC_MP4_INTEGRATION
      start() {
        if (!A.el) { setStatus('load a song first', ''); return; }
        const fpsSel = $('rec-fps') ? $('rec-fps').value : '30';
        const fps = parseInt(fpsSel, 10) || 30;
        const qualSel = $('rec-quality') ? $('rec-quality').value : 'high';
        const BITRATE = { high: 12_000_000, med: 6_000_000, low: 3_000_000 }[qualSel] || 12_000_000;
        const formatSel = $('rec-format') ? $('rec-format').value : 'auto';
        const wantMp4 = formatSel === 'mp4' || (formatSel === 'auto' && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs());
        if (wantMp4 && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs()) {
          this._wcActive = true;
          this._wcPending = window.SWR_RECORDER.start({
            canvas: stage,
            audioSource: A.an,
            audioSampleRate: A.ctx ? A.ctx.sampleRate : 0,
            audioNumberOfChannels: 2,
            width: stage.width,
            height: stage.height,
            fps: fps,
            videoBitsPerSecond: BITRATE,
          }).then(() => {
            this.recording = true;
            this.startedAt = Date.now();
            const durSel = $('rec-dur') ? $('rec-dur').value : '0';
            let durMs = 0;
            if (durSel === 'song' && A.el && A.el.duration) {
              durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
            } else if (durSel !== '0' && durSel !== 'manual') {
              durMs = parseInt(durSel) * 1000;
            }
            this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
            $('rec').classList.add('live');
            $('rec').textContent = '■ STOP';
            const formatDur = (ms) => {
              const s = Math.max(0, Math.round(ms / 1000));
              return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
            };
            if (this.autoStopAt > 0) {
              const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
              setStatus('rec · MP4 · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
              this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
            } else {
              setStatus('rec · MP4', 'live');
            }
            this.tickTimer = setInterval(() => {
              if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
              const el = formatDur(Date.now() - this.startedAt);
              if (this.autoStopAt > 0) {
                const rem = formatDur(this.autoStopAt - Date.now());
                const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
                const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
                setStatus('rec · MP4 · ' + el + ' / ' + durLabel, 'live');
              } else {
                setStatus('rec · MP4 · ' + el, 'live');
              }
            }, 500);
          }).catch((err) => {
            this._wcActive = false;
            if (err && err.unsupported) {
              setStatus('WebCodecs unsupported · falling back to WebM', 'warn');
              const prev = $('rec-format') ? $('rec-format').value : formatSel;
              if ($('rec-format')) $('rec-format').value = 'webm';
              this.start();
              if ($('rec-format')) $('rec-format').value = prev;
            } else {
              setStatus('recorder start failed: ' + (err && err.message || err), 'err');
            }
          });
          return;
        }
        // === MEDIA-RECORDER (WEBM) PATH — same as before ===
        const vstream = stage.captureStream(fps);
        const dest = A.ctx.createMediaStreamDestination();
        this.mediaDest = dest;
        try { A.an.disconnect(dest); } catch {}
        A.an.connect(dest);
        const tracks = [...vstream.getVideoTracks(), ...dest.stream.getAudioTracks()];
        const stream = new MediaStream(tracks);
        const mime = [
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=avc1,mp4a.40.2',
          'video/mp4;codecs=avc1',
          'video/mp4',
          'video/webm',
        ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
        this.mime = mime;
        this.rec = new MediaRecorder(stream, {
          mimeType: mime,
          videoBitsPerSecond: BITRATE,
          audioBitsPerSecond: 192_000,
        });
        this.chunks = [];
        this.rec.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
        this.rec.onstop = () => this._save();
        this.rec.start(250);
        this.recording = true;
        this.startedAt = Date.now();
        const durSel = $('rec-dur') ? $('rec-dur').value : '0';
        let durMs = 0;
        if (durSel === 'song' && A.el && A.el.duration) {
          durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
        } else if (durSel !== '0' && durSel !== 'manual') {
          durMs = parseInt(durSel) * 1000;
        }
        this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
        $('rec').classList.add('live');
        $('rec').textContent = '■ STOP';
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        const formatDur = (ms) => {
          const s = Math.max(0, Math.round(ms / 1000));
          return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
        };
        if (this.autoStopAt > 0) {
          const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
          setStatus('rec · ' + ext.toUpperCase() + ' · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
          this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
        } else {
          setStatus('rec · ' + ext.toUpperCase(), 'live');
        }
        this.tickTimer = setInterval(() => {
          if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
          const el = formatDur(Date.now() - this.startedAt);
          if (this.autoStopAt > 0) {
            const rem = formatDur(this.autoStopAt - Date.now());
            const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
            const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el + ' / ' + durLabel, 'live');
          } else {
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el, 'live');
          }
        }, 500);
        // SWR_REC_IMPROVED_v2
      },
      stop() {
        if (this._wcActive) {
          if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
          if (this.tickTimer) { clearInterval(this.tickTimer); this.tickTimer = null; }
          this._wcActive = false;
          this.recording = false;
          $('rec').classList.remove('live');
          $('rec').textContent = '● REC';
          setStatus('finalizing MP4…', '');
          window.SWR_RECORDER.stop().then((res) => {
            this.chunks = [res.blob];
            this.mime = res.mime;
            this._save();
          }).catch((err) => {
            setStatus('recorder stop failed: ' + (err && err.message || err), 'err');
          });
          return;
        }
        if (!this.rec) return;
        if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
        if (this.tickTimer) { clearInterval(this.tickTimer); this.tickTimer = null; }
        this.rec.stop();
        this.recording = false;
        $('rec').classList.remove('live');
        $('rec').textContent = '● REC';
        setStatus('rendering…', '');
        if (this.mediaDest) {
          try { A.an.disconnect(this.mediaDest); } catch {}
          this.mediaDest = null;
        }
      },
      _save() {
        const blob = new Blob(this.chunks, { type: this.mime });
        const a = document.createElement('a');
        const recUrl = URL.createObjectURL(blob);
        a.href = recUrl;
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const ext = this.mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        a.download = 'mosaic-' + ts + '.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Free the download URL once the click has been dispatched.
        setTimeout(() => { try { URL.revokeObjectURL(recUrl); } catch (_) {} }, 1000);
      },
    };

    const recBtn = document.getElementById('rec');
    if (recBtn) recBtn.addEventListener('click', () => {
      if (Recorder.recording) Recorder.stop();
      else Recorder.start();
    });

    overlay.addEventListener('click', start, { once: true });
    document.addEventListener('keydown', function(ev){
      if (!audio && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();
  </script>
<script src="./temp-slider.js"></script>
</body>
