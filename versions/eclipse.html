<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ECLIPSE · SWR engine v1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #000000; --bg-2: #060308; --panel: #0a0410; --panel-2: #120820;
      --ink: #f5e9ff; --muted: #8a7aa0; --line: #2a1d3e;
      --rim: #ffb347; --corona: #fff3c2; --shadow: #1a0033; --void: #000000;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { display: grid; grid-template-columns: 220px 1fr 240px; grid-template-rows: 44px 1fr 36px; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px;
      background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .v { font-weight: 700; letter-spacing: 0.16em; color: var(--rim); text-shadow: 0 0 8px var(--rim); }
    .v small { color: var(--corona); margin-left: 6px; text-shadow: 0 0 6px var(--corona); font-weight: 400; }
    .pill { font-size: 9px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
    .pill.ok { color: var(--corona); border-color: var(--corona); }
    .pill.live { color: var(--rim); border-color: var(--rim); animation: blink 0.4s infinite alternate; }
    @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    .tbtn { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font: 10px/1 ui-monospace;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 12px; border-radius: 4px; cursor: pointer; }
    .tbtn:hover { border-color: var(--rim); color: var(--rim); }
    .tbtn.primary { background: var(--rim); color: #000; border-color: var(--rim); font-weight: 700; }
    .tbtn.primary:hover { background: var(--corona); border-color: var(--corona); }
    .spacer { flex: 1; }
    .meter { width: 160px; height: 16px; background: #000; border: 1px solid var(--line); border-radius: 3px; display: block; }
    aside.lib, aside.layers { background: var(--panel); overflow-y: auto; }
    aside.lib { border-right: 1px solid var(--line); }
    aside.layers { border-left: 1px solid var(--line); }
    .head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .head h2 { margin: 0; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); flex: 1; }
    .body { padding: 6px; }
    #lib { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .li { aspect-ratio: 1; background: var(--bg-2); border: 1px solid var(--line); border-radius: 3px;
      overflow: hidden; position: relative; cursor: pointer; transition: border-color 0.1s; }
    .li:hover { border-color: var(--rim); }
    .li img, .li video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .li .tag { position: absolute; top: 2px; left: 2px; font-size: 7px; padding: 1px 3px; background: var(--rim);
      color: #000; border-radius: 1px; letter-spacing: 0.08em; }
    .li .nm { position: absolute; bottom: 0; left: 0; right: 0; padding: 1px 3px; font-size: 7px; color: #fff;
      background: linear-gradient(transparent, rgba(0,0,0,0.8)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #layers { display: flex; flex-direction: column; gap: 4px; }
    .l { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
    .l.sel { border-color: var(--rim); box-shadow: 0 0 0 1px var(--rim); }
    .l .lh { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .l .lh .n { font-size: 9px; color: var(--muted); width: 14px; }
    .l .lh .nm { flex: 1; font-size: 10px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .l .lh .x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; }
    .l .lh .x:hover { color: var(--rim); }
    .l .r { display: grid; grid-template-columns: 36px 1fr; gap: 4px; align-items: center; margin-top: 2px; }
    .l .r label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .l .r select, .l .r input { background: var(--bg); border: 1px solid var(--line); color: var(--ink);
      font: 9px ui-monospace; padding: 2px 3px; border-radius: 2px; width: 100%; }
    .l .react { font-size: 8px; color: var(--corona); letter-spacing: 0.04em; margin-top: 3px; }
    section.stage { position: relative; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    /* ECLIPSE corona overlay — radial darkening with a glowing rim, breathes w/ bass */
    #corona {
      position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at center,
          rgba(0,0,0,0.92) 0%,
          rgba(0,0,0,0.88) 28%,
          rgba(0,0,0,0.72) 36%,
          rgba(255,179,71,0.35) 44%,
          rgba(255,243,194,0.18) 50%,
          rgba(0,0,0,0) 58%,
          rgba(0,0,0,0) 100%);
      mix-blend-mode: normal;
      opacity: 0.85;
    }
    /* Faint ring shimmer that blooms on each beat */
    #ring {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) 38%,
        rgba(255,243,194,0.0) 44%,
        rgba(255,179,71,0.0) 48%,
        rgba(0,0,0,0) 52%,
        rgba(0,0,0,0) 100%);
      mix-blend-mode: screen;
      opacity: 0;
      transition: opacity 0.15s linear;
    }
    footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px;
      background: var(--bg-2); border-top: 1px solid var(--line); font-size: 9px; color: var(--muted); letter-spacing: 0.08em; }
    .gc { display: flex; align-items: center; gap: 6px; }
    .gc input { width: 80px; }
    .gc b { color: var(--rim); min-width: 26px; text-align: right; }
    .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
    .led.on { background: var(--rim); box-shadow: 0 0 8px var(--rim); }
    a.nav { color: var(--corona); text-decoration: none; border: none; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
    a.nav:hover { color: var(--rim); }
    input[type=file] { display: none; }

    .swr-watermark {
      position: absolute; bottom: 16px; right: 16px; width: 100px; opacity: 0.45;
      pointer-events: none; z-index: 9999; mix-blend-mode: screen;
    }
    .swr-watermark img { width: 100%; height: auto; display: block; filter: drop-shadow(0 0 2px rgba(0,0,0,0.6)); }
  </style>
</head>
<body data-page="eclipse">
  <div id="app">
    <header>
      <div class="v">ECLIPSE <small>v1</small></div>
      <span class="pill" id="status">idle</span>
      <button class="tbtn" id="load-song">Load song</button>
      <input type="file" id="song-input" accept="audio/*" />
      <button class="tbtn primary" id="play" disabled>▶</button>
      <span id="time" style="font-size:10px;color:var(--muted);">0:00 / 0:00</span>
      <canvas class="meter" id="meter" width="320" height="32"></canvas>
      <span class="spacer"></span>
      <span class="gc">beat <span class="led" id="beat-led"></span></span>
      <span class="gc">onset <span class="led" id="onset-led"></span></span>
      <select id="rec-dur" style="font-size:9px; padding:3px 4px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:3px; font:9px ui-monospace;" title="Auto-stop recording after N seconds">
        <option value="0">manual</option>
        <option value="10">10s</option>
        <option value="15">15s</option>
        <option value="30" selected>30s</option>
        <option value="60">60s</option>
        <option value="song">song</option>
      </select>
      <button class="tbtn" id="rec" disabled>● REC</button>
      <a class="nav" href="hallucination.html">← hallucination</a>
      <a class="nav" href="../versions/">versions</a>
    </header>
    <aside class="lib">
      <div class="head"><h2>Library</h2><button class="tbtn" id="add" style="padding:3px 8px;font-size:9px;">+</button>
        <input type="file" id="asset-input" multiple accept="video/*,image/*,image/gif" /></div>
      <div class="body"><div id="lib"></div></div>
    </aside>
    <section class="stage">
      <canvas id="render"></canvas>
      <div id="corona"></div>
      <div id="ring"></div>
      <div class="swr-watermark">
        <img src="../watermark-monogram.svg" alt="SWR" />
      </div>
    </section>
    <aside class="layers">
      <div class="head"><h2>Layers</h2><button class="tbtn" id="remap" style="padding:3px 8px;font-size:9px;">RE-MAP</button></div>
      <div class="body"><div id="layers"></div></div>
    </aside>
    <footer>
      <span class="gc">sens <input type="range" id="sens" min="0.2" max="3" step="0.05" value="1.2" /> <b id="sens-v">1.20</b></span>
      <span class="gc">gate <input type="range" id="gate" min="1.05" max="2.5" step="0.05" value="1.4" /> <b id="gate-v">1.40</b></span>
      <span class="gc">decay <input type="range" id="decay" min="0.5" max="0.99" step="0.01" value="0.85" /> <b id="decay-v">0.85</b></span>
      <span class="spacer" style="flex:1"></span>
      <span id="fps" style="color:var(--rim);">— fps</span>
    </footer>
  </div>
  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const stage = $('render');
    const ctx = stage.getContext('2d', { alpha: false });
    const meter = $('meter').getContext('2d');
    const coronaEl = $('corona');
    const ringEl = $('ring');
    let W, H;

    // === AUDIO === (same engine as the other versions)
    const A = { ctx: null, an: null, src: null, el: null, gain: null,
      fft: null, time: null,
      feat: { bass:0,mid:0,treble:0,air:0,sub:0,rms:0,centroid:0,beat:0,onset:0,beatPulse:false,onsetPulse:false,bpm:0 },
      hist: { prev:null, bassAvg:0, fluxAvg:0 }, beats: [], playing: false,
      unlock() { if (this.ctx) return; this.ctx = new (window.AudioContext||window.webkitAudioContext)();
        this.an = this.ctx.createAnalyser(); this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0.6;
        this.fft = new Uint8Array(this.an.frequencyBinCount);
        this.time = new Uint8Array(this.an.fftSize);
        this.gain = this.ctx.createGain(); this.gain.gain.value = 1;
        this.an.connect(this.gain); this.gain.connect(this.ctx.destination);
        setStatus('ready', 'ok'); },
      load(file) { this.unlock(); if (this.src) try{this.src.disconnect();}catch{}
        if (this.el) { this.el.pause(); this.el.src=''; }
        this.el = document.createElement('audio'); this.el.crossOrigin='anonymous';
        this.el.src = URL.createObjectURL(file); this.el.preload='auto';
        this.el.addEventListener('ended', ()=>{A.playing=false;$('play').textContent='▶';});
        this.el.addEventListener('timeupdate', ()=>{
          const t=this.el.currentTime,d=this.el.duration||0;
          $('time').textContent = fmt(t)+' / '+fmt(d); });
        this.src = this.ctx.createMediaElementSource(this.el);
        this.src.connect(this.an);
        this.hist = { prev:null, bassAvg:0, fluxAvg:0 }; this.beats=[]; this.feat.bpm=0;
        $('play').disabled=false; $('rec').disabled=false; },
      play() { this.unlock(); if (this.ctx.state==='suspended') this.ctx.resume();
        this.el.play(); this.playing=true; $('play').textContent='❚❚'; },
      pause() { if (this.el) this.el.pause(); this.playing=false; $('play').textContent='▶'; },
      sample() { if (!this.an) return;
        this.an.getByteFrequencyData(this.fft);
        this.an.getByteTimeDomainData(this.time);
        const N=this.fft.length, sr=this.ctx.sampleRate, hz=sr/this.an.fftSize;
        const r = { sub:[1,Math.floor(60/hz)], bass:[Math.floor(60/hz),Math.floor(250/hz)],
          mid:[Math.floor(250/hz),Math.floor(2000/hz)], treble:[Math.floor(2000/hz),Math.floor(6000/hz)],
          air:[Math.floor(6000/hz),N-1] };
        const mean = (lo,hi) => { let s=0,c=0; for (let i=lo;i<=hi&&i<N;i++){s+=this.fft[i];c++;} return s/c/255; };
        this.feat.sub=mean(r.sub[0],r.sub[1]); this.feat.bass=mean(r.bass[0],r.bass[1]);
        this.feat.mid=mean(r.mid[0],r.mid[1]); this.feat.treble=mean(r.treble[0],r.treble[1]);
        this.feat.air=mean(r.air[0],r.air[1]);
        let rms=0; for (let i=0;i<this.time.length;i++){const v=(this.time[i]-128)/128;rms+=v*v;}
        this.feat.rms = Math.sqrt(rms/this.time.length);
        let num=0,den=0; for (let i=1;i<N;i++){num+=i*this.fft[i];den+=this.fft[i];}
        this.feat.centroid = den>0?num/den/N:0;
        let flux=0; if (this.hist.prev) for (let i=1;i<N;i++){const d=this.fft[i]-this.hist.prev[i]; if (d>0) flux+=d;}
        flux /= 255*N;
        this.hist.fluxAvg = lerp(this.hist.fluxAvg, flux, 0.08);
        const onsetHit = flux > this.hist.fluxAvg * parseFloat($('gate').value) && flux > 0.02;
        this.hist.bassAvg = lerp(this.hist.bassAvg, this.feat.bass, 0.06);
        const beatHit = this.feat.bass > this.hist.bassAvg * parseFloat($('gate').value) && this.feat.bass > 0.18;
        const now = this.ctx.currentTime;
        if (beatHit) { this.beats.push(now); while (this.beats.length&&this.beats[0]<now-8) this.beats.shift();
          if (this.beats.length>=4) { let t=0; for (let i=1;i<this.beats.length;i++) t+=this.beats[i]-this.beats[i-1];
            const a=t/(this.beats.length-1); if (a>0) this.feat.bpm=Math.round(60/a); } }
        const dec = parseFloat($('decay').value);
        this.feat.beat = beatHit ? 1 : this.feat.beat*dec;
        this.feat.onset = onsetHit ? 1 : this.feat.onset*dec;
        this.feat.beatPulse = beatHit; this.feat.onsetPulse = onsetHit;
        this.hist.prev = Uint8Array.from(this.fft);
        $('beat-led').classList.toggle('on', beatHit);
        $('onset-led').classList.toggle('on', onsetHit);
      }
    };
    const lerp = (a,b,t) => a+(b-a)*t;
    const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
    const fmt = s => { if (!isFinite(s)||s<0) s=0; const m=Math.floor(s/60); return m+':'+Math.floor(s%60).toString().padStart(2,'0'); };
    function setStatus(t, cls) { const p=$('status'); p.textContent=t; p.className='pill'+(cls?' '+cls:''); }

    // === LIBRARY ===
    const Lib = { items: [], nextId: 1,
      async addFiles(files) { const seen = new Set(this.items.map(i=>i.name+':'+i.blob?.size));
        for (const f of files) { if (!f.type) continue; const k=f.name+':'+f.size; if (seen.has(k)) continue; seen.add(k);
          const it = { id: this.nextId++, name: f.name, type: f.type.startsWith('video/')?'video':'image',
            blob: f, url: URL.createObjectURL(f), motion: 0, luma: 0.5, hue: 0, w:0, h:0, added: Date.now(), thumb: null };
          this.items.push(it); this._classify(it); }
        this.render(); },
      _classify(it) {
        const c = document.createElement('canvas'); c.width=32; c.height=32; const cx=c.getContext('2d');
        const src = it.type==='video' ? Object.assign(document.createElement('video'),{src:it.url,muted:true,playsInline:true,preload:'metadata'}) : Object.assign(new Image(),{src:it.url});
        src.addEventListener(src.tagName==='VIDEO'?'loadeddata':'load', () => {
          if (it.type==='video') it.duration = src.duration;
          cx.drawImage(src, 0,0,32,32);
          const d = cx.getImageData(0,0,32,32).data;
          let luma=0,hue=0; for (let i=0;i<d.length;i+=4) luma += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
          it.luma = (luma/(d.length/4))/255;
          let sx=0,sy=0; for (let i=0;i<d.length;i+=4){
            const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
            if (mx===mn) continue; const df=mx-mn; let h=0;
            if (mx===d[i]) h=((d[i+1]-d[i+2])/df)%6;
            else if (mx===d[i+1]) h=(d[i+2]-d[i])/df+2;
            else h=(d[i]-d[i+1])/df+4;
            h/=6; sx+=Math.cos(h*Math.PI*2); sy+=Math.sin(h*Math.PI*2);
          }
          it.hue = (Math.atan2(sy/(d.length/4), sx/(d.length/4))/(Math.PI*2)+1)%1;
          it.w = src.videoWidth||src.naturalWidth; it.h = src.videoHeight||src.naturalHeight;
          const tw=120,th=120; const tcv=document.createElement('canvas'); tcv.width=tw;tcv.height=th;
          const tcx=tcv.getContext('2d'); tcx.drawImage(src,0,0,tw,th);
          it.thumb = tcv.toDataURL('image/jpeg',0.7);
          this.render();
        }, { once: true });
      },
      render() { const el = $('lib');
        if (!this.items.length) { el.innerHTML='<div style="grid-column:1/-1;color:var(--muted);font-size:10px;padding:16px;text-align:center;">drop files</div>'; return; }
        el.innerHTML = '';
        for (const it of this.items) {
          const d = document.createElement('div'); d.className='li';
          d.innerHTML = `<span class="tag">${it.type==='video'?'V':'I'}</span><span class="nm">${it.name}</span>`;
          if (it.thumb) { const i=new Image(); i.src=it.thumb; d.appendChild(i); }
          else if (it.type==='video') { const v=document.createElement('video'); v.src=it.url;v.muted=true;v.playsInline=true;d.appendChild(v); }
          else { const i=new Image(); i.src=it.url; d.appendChild(i); }
          d.addEventListener('click', () => Layers.add(it));
          el.appendChild(d);
        }
      }
    };

    // === LAYERS ===
    // ECLIPSE preset key: 'eclipse' — distinct blend order, motion-style reactions
    const ECLIPSE_PRESETS = [
      // L0 — corona anchor: slow scale on bass, opacity dips on beat (the "shadow approaching")
      [ { feature:'bass', target:'scale', scale: 0.5, ease:'smooth' }, { feature:'beat', target:'opacity', scale: 0.7, ease:'sharp' }, { feature:'rms', target:'x', scale: 60, ease:'smooth' } ],
      // L1 — chromatic ring: hue ride on mids, scale on treble
      [ { feature:'mid',   target:'hue', scale: 240, ease:'smooth' }, { feature:'treble', target:'scale', scale: 0.4, ease:'smooth' }, { feature:'air', target:'y', scale: 50, ease:'smooth' } ],
      // L2 — silhouette: bass-driven scale, beat snap opacity
      [ { feature:'bass',  target:'scale', scale: 0.6, ease:'sharp' }, { feature:'beat', target:'opacity', scale: 0.9, ease:'sharp' }, { feature:'onset', target:'rot', scale: 30, ease:'sharp' } ],
      // L3 — deep field: slow drift, low-amplitude RMS reaction
      [ { feature:'rms',   target:'scale', scale: 0.25, ease:'smooth' }, { feature:'mid', target:'hue', scale: 120, ease:'smooth' }, { feature:'onset', target:'y', scale: 40, ease:'smooth' } ],
      // L4 — bright halo: treble-reactive, brightness on beat
      [ { feature:'treble',target:'scale', scale: 0.5, ease:'sharp' }, { feature:'beat', target:'brightness', scale: 0.6, ease:'sharp' }, { feature:'air', target:'hue', scale: 180, ease:'sharp' } ],
      // L6 — full darkening: opacity on beat, big scale on bass (the totality of the shadow)
      [ { feature:'bass',  target:'scale', scale: 0.8, ease:'smooth' }, { feature:'beat', target:'opacity', scale: 1.0, ease:'sharp' }, { feature:'centroid', target:'hue', scale: 60, ease:'smooth' } ],
    ];
    const ECLIPSE_BLENDS = ['multiply','screen','lighten','multiply','screen','lighten'];
    const ECLIPSE_BASESCALE = [1.4, 0.9, 1.6, 0.7, 2.2, 0.5];
    const __shuffle_eclipse = (() => {
      let cache = null, key = null;
      return (k, arr) => {
        if (!cache || key !== k) {
          const a = arr.slice();
          for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
          cache = a; key = k;
        }
        cache.push(cache.shift()); return cache;
      };
    })();

    const Layers = { list: [], sel: null,
      add(it) { const i=this.list.length;
        const l = { id:'L'+(i+1), asset: it, blend: (__shuffle_eclipse('eclipse', ECLIPSE_BLENDS))[i%ECLIPSE_BLENDS.length],
          opacity: 1, baseScale: ECLIPSE_BASESCALE[i%ECLIPSE_BASESCALE.length], hue: 0, brightness: 1, contrast: 1,
          reactors: ECLIPSE_PRESETS[i%ECLIPSE_PRESETS.length] };
        this.list.push(l); this.render(); this.sel = l; },
      rm(id) { this.list = this.list.filter(l => l.id !== id); this.render(); },
      render() {
        const el = $('layers'); el.innerHTML = '';
        for (let i=0;i<this.list.length;i++) {
          const l = this.list[i]; const d = document.createElement('div'); d.className='l'+(this.sel===l?' sel':'');
          const react = l.reactors.map(r=>`${r.feature}→${r.target}×${r.scale.toFixed(2)}`).join(' · ');
          d.innerHTML = `<div class="lh"><span class="n">${i+1}</span><span class="nm">${l.asset?l.asset.name.slice(0,16):'(empty)'}</span><button class="x">×</button></div><div class="react">${react}</div><div class="r"><label>blend</label><select><option>source-over</option><option>screen</option><option>lighter</option><option>multiply</option><option>overlay</option><option>lighten</option><option>darken</option></select></div><div class="r"><label>op</label><input type="range" min="0" max="1" step="0.01" /></div><div class="r"><label>sc</label><input type="range" min="0.1" max="3" step="0.01" /></div><div class="r"><label>hue</label><input type="range" min="-180" max="180" step="1" /></div>`;
          d.querySelector('select').value = l.blend;
          const ins = d.querySelectorAll('input[type=range]');
          ins[0].value = l.opacity; ins[1].value = l.baseScale; ins[2].value = l.hue;
          d.querySelector('select').addEventListener('change', e => l.blend = e.target.value);
          ins[0].addEventListener('input', e => l.opacity = +e.target.value);
          ins[1].addEventListener('input', e => l.baseScale = +e.target.value);
          ins[2].addEventListener('input', e => l.hue = +e.target.value);
          d.querySelector('.x').addEventListener('click', e => { e.stopPropagation(); this.rm(l.id); });
          el.appendChild(d);
        }
      },
      remap() {
        if (!Lib.items.length) return;
        const f = A.feat; const sens = parseFloat($('sens').value);
        // Eclipse scoring: prefer darker assets (low luma), low motion (the stillness of a totality)
        const roles = [
          { want:'shadow', weight: 0.7 + f.bass * sens },
          { want:'ring',   weight: 0.4 + f.mid * sens },
          { want:'silhouette', weight: 0.6 + f.bass * sens * 1.5 },
          { want:'depth',  weight: 0.3 + f.rms * sens },
          { want:'halo',   weight: 0.5 + f.treble * sens * 1.5 },
          { want:'shadow', weight: 0.7 + f.onset * sens * 2 },
        ];
        const scored = Lib.items.map(it => {
          const sc = {};
          sc.shadow = (1 - it.luma) * 0.7 + it.motion * 0.3;
          sc.ring = it.luma * 0.5 + (1 - it.motion) * 0.5;
          sc.silhouette = (1 - it.luma) * 0.6 + it.motion * 0.4;
          sc.depth = (1 - it.motion) * 0.5 + (1 - it.luma) * 0.5;
          sc.halo = it.luma * 0.6 + (1 - it.motion) * 0.4;
          return { it, sc };
        });
        const topN = 2 + Math.floor(Math.random()*2);
        const used = new Set();
        const assignments = roles.map(r => {
          const cands = [];
          for (const s of scored) { if (used.has(s.it.id)) continue; cands.push({ it: s.it, v: s.sc[r.want] * r.weight }); }
          if (!cands.length) return null;
          cands.sort((a,b) => b.v - a.v);
          const pool = cands.slice(0, Math.min(topN, cands.length));
          const total = pool.reduce((s,c) => s + Math.max(c.v, 0.01), 0);
          let r2 = Math.random() * total; let pick = pool[0];
          for (const c of pool) { r2 -= Math.max(c.v, 0.01); if (r2 <= 0) { pick = c; break; } }
          used.add(pick.it.id); return pick.it;
        });
        this.list = [];
        for (let i=0;i<assignments.length;i++) {
          if (!assignments[i]) continue;
          this.list.push({
            id:'L'+(i+1), asset: assignments[i],
            blend: (__shuffle_eclipse('eclipse', ECLIPSE_BLENDS))[i%ECLIPSE_BLENDS.length],
            opacity: 1, baseScale: ECLIPSE_BASESCALE[i%ECLIPSE_BASESCALE.length],
            hue: 0, brightness: 1, contrast: 1,
            reactors: ECLIPSE_PRESETS[i%ECLIPSE_PRESETS.length]
          });
        }
        this.render();
      }
    };

    // === RENDERER (ECLIPSE style) ===
    let fps=0, lastT=performance.now(), frames=0;
    function fit() {
      const vw = stage.clientWidth, vh = stage.clientHeight;
      const target = 16/9; const ar = vw/vh;
      let w, h;
      if (Math.abs(ar - target) < 0.02) { w=vw; h=vh; }
      else if (ar > target) { h = vh; w = h * target; }
      else { w = vw; h = w / target; }
      stage.width = Math.max(640, Math.round(w));
      stage.height = Math.max(360, Math.round(h));
      W = stage.width; H = stage.height;
    }
    fit(); addEventListener('resize', fit);
    function ease(name, t) {
      if (name === 'sharp') return Math.pow(t, 0.4);
      if (name === 'soft') return t*t*(3-2*t);
      return t; // smooth
    }
    function applyR(l) {
      const sens = parseFloat($('sens').value);
      const out = { scale: l.baseScale, x:0, y:0, rot:0, opacity:l.opacity, hue:l.hue, brightness:l.brightness, contrast:l.contrast };
      for (const r of l.reactors) {
        let v = A.feat[r.feature] ?? 0;
        v = ease(r.ease, clamp(v,0,1)) * r.scale * sens;
        if (r.target==='scale') out.scale += v;
        else if (r.target==='x') out.x += v * 180;
        else if (r.target==='y') out.y += v * 180;
        else if (r.target==='rot') out.rot += v * 25;
        else if (r.target==='opacity') out.opacity = clamp(out.opacity + v*0.6, 0, 1);
        else if (r.target==='hue') out.hue += v * 60;
        else if (r.target==='brightness') out.brightness = clamp(out.brightness + v*0.5, 0.1, 2.5);
        else if (r.target==='contrast') out.contrast = clamp(out.contrast + v*0.5, 0.1, 2.5);
      }
      return out;
    }
    function drawLayer(l, idx) {
      const a = l.asset; if (!a) return;
      let src;
      if (a.type==='video') {
        if (!a._el) { a._el = document.createElement('video'); a._el.src = a.url; a._el.muted = true; a._el.loop = true; a._el.playsInline = true; a._el.preload = 'auto'; }
        src = a._el;
        if (A.playing && src.paused) src.play().catch(()=>{});
        if (!A.playing && !src.paused) src.pause();
      } else {
        if (!a._el) { a._el = new Image(); a._el.src = a.url; }
        src = a._el;
      }
      if (a.type==='video' && src.readyState < 2) return;
      const r = applyR(l);
      const ar = (a.w||src.naturalWidth||src.videoWidth||1) / (a.h||src.naturalHeight||src.videoHeight||1);
      const car = W/H;
      let dw, dh;
      if (ar > car) { dh = H*r.scale; dw = dh*ar; } else { dw = W*r.scale; dh = dw/ar; }
      const dx = (W-dw)/2 + r.x; const dy = (H-dh)/2 + r.y;
      // Eclipse filter: muted hue, low contrast (everything beneath the shadow)
      ctx.save();
      ctx.globalCompositeOperation = l.blend || 'source-over';
      ctx.globalAlpha = clamp(r.opacity, 0, 1);
      ctx.filter = `hue-rotate(${r.hue}deg) saturate(${0.55 + r.contrast*0.2}) brightness(${r.brightness}) contrast(${r.contrast})`;
      ctx.translate(W/2, H/2);
      ctx.rotate(r.rot * Math.PI / 180);
      ctx.drawImage(src, -dw/2 + r.x, -dh/2 + r.y, dw, dh);
      ctx.restore();
    }

    // === DRAW LOOP ===
    function draw() {
      A.sample();
      // pure-black base — anything beneath the shadow is invisible
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);
      for (let i=0;i<Layers.list.length;i++) drawLayer(Layers.list[i], i);

      // === ECLIPSE corona overlay (driven by audio, replaces NEON's flash) ===
      // corona radius breathes with bass; corona hue rotates with mids
      const bass = A.feat.bass, mid = A.feat.mid, beat = A.feat.beat, onset = A.feat.onset;
      const baseR = 30 + bass * 18;          // % of min(W,H)
      const ringR = baseR + beat * 6;        // ring grows on beat
      const coronaOpacity = 0.78 + bass * 0.15;
      const midHue = Math.round(mid * 60);   // 0–60° shift toward red/orange
      coronaEl.style.opacity = clamp(coronaOpacity, 0.6, 0.98).toFixed(3);
      coronaEl.style.background = `radial-gradient(circle at center,
        rgba(0,0,0,0.94) 0%,
        rgba(0,0,0,0.90) ${baseR}%,
        rgba(0,0,0,0.74) ${baseR+6}%,
        rgba(255,179,71,${0.30 + bass*0.4}) ${baseR+12}%,
        hsla(${32 + midHue},90%,${70 + onset*15}%,${0.18 + onset*0.3}) ${baseR+16}%,
        rgba(0,0,0,0) ${baseR+22}%,
        rgba(0,0,0,0) 100%)`;
      // Ring flash — bright halo bloom on each onset
      const ringIntensity = clamp(onset * 1.4, 0, 1);
      ringEl.style.opacity = ringIntensity.toFixed(3);
      ringEl.style.background = `radial-gradient(circle at center,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) ${baseR-2}%,
        rgba(255,243,194,${0.4 * ringIntensity}) ${baseR+10}%,
        rgba(255,179,71,${0.6 * ringIntensity}) ${baseR+14}%,
        rgba(255,80,40,${0.3 * ringIntensity}) ${baseR+18}%,
        rgba(0,0,0,0) ${baseR+22}%,
        rgba(0,0,0,0) 100%)`;

      // === METER ===
      meter.fillStyle = '#000'; meter.fillRect(0,0,320,32);
      const bassW = A.feat.bass * 200;
      const midW = A.feat.mid * 200;
      const trebleW = A.feat.treble * 200;
      meter.fillStyle = '#ffb347'; meter.fillRect(0, 4, bassW, 8);
      meter.fillStyle = '#ff7a3a'; meter.fillRect(0, 14, midW, 8);
      meter.fillStyle = '#fff3c2'; meter.fillRect(0, 24, trebleW, 8);

      // FPS
      frames++;
      const now = performance.now();
      if (now - lastT > 500) { fps = Math.round(frames * 1000 / (now - lastT)); frames = 0; lastT = now; $('fps').textContent = fps + ' fps'; }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // === UI wiring (same as other versions) ===
    $('load-song').onclick = () => $('song-input').click();
    $('song-input').onchange = e => { const f = e.target.files[0]; if (f) A.load(f); };
    $('play').onclick = () => A.playing ? A.pause() : A.play();
    $('add').onclick = () => $('asset-input').click();
    $('asset-input').onchange = e => Lib.addFiles([...e.target.files]);
    $('remap').onclick = () => Layers.remap();
    $('sens').oninput = e => { $('sens-v').textContent = (+e.target.value).toFixed(2); };
    $('gate').oninput = e => { $('gate-v').textContent = (+e.target.value).toFixed(2); };
    $('decay').oninput = e => { $('decay-v').textContent = (+e.target.value).toFixed(2); };
    setStatus('idle');

    // === Drag & drop ===
    addEventListener('dragover', e => { e.preventDefault(); });
    addEventListener('drop', e => {
      e.preventDefault();
      const files = [...e.dataTransfer.files];
      const audio = files.find(f => f.type.startsWith('audio/'));
      const assets = files.filter(f => f.type.startsWith('video/') || f.type.startsWith('image/'));
      if (audio) A.load(audio);
      if (assets.length) Lib.addFiles(assets);
    });

    // === RECORDER (same pipeline, native recorder) ===
    let recorder = null, recChunks = [], recMixDest = null, recAutoStopAt = 0;
    function startRec() {
      try {
        const vStream = stage.captureStream(30);
        recMixDest = A.ctx.createMediaStreamDestination();
        A.gain.connect(recMixDest);
        const aTrack = recMixDest.stream.getAudioTracks()[0];
        const stream = new MediaStream([vStream.getVideoTracks()[0], aTrack]);
        const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
        recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
        recChunks = [];
        recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(recChunks, { type: recorder.mimeType });
          const ext = recorder.mimeType.includes('mp4') ? 'mp4' : 'webm';
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `eclipse-${Date.now()}.${ext}`;
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
          setStatus('exported', 'ok');
          if (recMixDest) { try{A.gain.disconnect(recMixDest);}catch{} recMixDest=null; }
        };
        recorder.start();
        const dur = $('rec-dur').value;
        if (dur !== '0' && dur !== 'manual') {
          if (dur === 'song' && A.el && A.el.duration) recAutoStopAt = Date.now() + (A.el.duration - A.el.currentTime) * 1000;
          else recAutoStopAt = Date.now() + parseFloat(dur) * 1000;
          setInterval(() => { if (Date.now() >= recAutoStopAt && recorder && recorder.state==='recording') recorder.stop(); }, 100);
        }
        setStatus('recording · ' + (mime.includes('mp4')?'MP4':'WebM'), 'live');
        $('rec').textContent = '■ STOP'; $('rec').style.color = '#ff7a3a';
      } catch (err) { console.error('recorder start failed', err); setStatus('rec error'); }
    }
    function stopRec() {
      if (recorder && recorder.state==='recording') recorder.stop();
      $('rec').textContent = '● REC'; $('rec').style.color = '';
    }
    $('rec').onclick = () => recorder && recorder.state==='recording' ? stopRec() : startRec();

    // === Auto-load 27-item library from /library/manifest.json (matches sibling versions) ===
    (async () => {
      try {
        const r = await fetch('../library/manifest.json', { cache: 'no-cache' });
        if (r.ok) { const m = await r.json();
          const blobs = await Promise.all((m.files||[]).map(async f => { const fr=await fetch('../library/'+f); return await fr.blob(); }));
          await Lib.addFiles(blobs.map((b,i) => new File([b], m.files[i], { type: b.type })));
          setTimeout(() => Layers.remap(), 600);
        }
      } catch (e) {}
      setStatus('READY', 'ok');
    })();

    // === Expose SWR for sibling scripts (match shape used by neon/film/grid/smoke/hallucination) ===
    window.SWR = { Audio: A, Library: Lib, Layers, Recorder: { start: startRec, stop: stopRec }, get stage() { return stage; }, get ctx() { return ctx; } };
    console.log('[ECLIPSE] SWR engine ready · version=ECLIPSE · library=' + Lib.items.length);
  })();
  </script>
