  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700&display=swap');
    :root {
      --bg: #f4f0e8; --paper: #fffaf0; --line: #c8b89a;
      --ink: #1a0f08; --muted: #6b5d4a;
      --accent: #d8232a;
      /* iPhone safe-area insets, read through custom properties so
         each fixed overlay can use max(n, var(--safe-bottom)) instead of
         repeating env(). The 0px fallback keeps every non-notched
         browser pixel-identical to before. */
      --safe-top:    env(safe-area-inset-top,    0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left:   env(safe-area-inset-left,   0px);
      --safe-right:  env(safe-area-inset-right,  0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none;
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', sans-serif; }
    #app { display: grid; grid-template-rows: 60px 1fr 52px; height: 100vh; }
    /* iPhone safe-area (P2.3): the transport header clears the
       Dynamic Island and the footer bar clears the home indicator;
       left/right cover landscape, where the notch side insets 59px
       and the rounded corners eat the other.
       The padding lands on #app, not body, for the reason
       engine.html gives: #app is this page's own 100vh grid, so
       under the global box-sizing: border-box the padding insets its
       grid tracks in place. Padding body would stack on top of
       #app's 100vh box and push the footer off-screen with no way
       back (html/body are overflow:hidden).
       position:fixed resolves against the viewport, so no padding on
       an in-flow element reaches the overlays below - each folds its
       own inset in with max(n, var(--safe-*)). Full-bleed inset:0
       overlays (#swr-start, .drop-zone, .swr-load) are meant to cover
       the notch and correctly stay untouched. */
    #app { padding-top:    var(--safe-top);
           padding-bottom: var(--safe-bottom);
           padding-left:   var(--safe-left);
           padding-right:  var(--safe-right); }
    header { display: flex; align-items: center; gap: 14px; padding: 0 24px;
      background: var(--paper); border-bottom: 2px solid var(--ink); }
    .v { font: 800 22px/1 'Archivo Black', sans-serif; letter-spacing: -0.01em; text-transform: uppercase; }
    .v em { font-style: normal; color: var(--accent); }
    .v small { font: 500 10px/1 'Inter', sans-serif; color: var(--muted);
      margin-left: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
    .pill { font: 9px/1 'Space Mono', monospace; padding: 4px 10px;
      border: 1px solid var(--ink); color: var(--ink);
      letter-spacing: 0.18em; text-transform: uppercase; }
    .pill.live { background: var(--accent); color: #fff; border-color: var(--accent);
      animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .spacer { flex: 1; }
    a.nav { color: var(--ink); text-decoration: none; font-size: 10px;
      font-family: 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; opacity: 0.6; }
    a.nav:hover { opacity: 1; }
    section.stage { position: relative; background: var(--bg); overflow: hidden;
      border-bottom: 2px solid var(--ink); }
    #render { display: block; width: 100%; height: 100%; }
    .badge { position: absolute; top: 18px; right: 24px;
      font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink);
      border: 1px solid var(--ink); padding: 5px 10px; background: var(--paper); }
    .credit { position: absolute; top: 18px; left: 24px; z-index: 4;
      font: 800 14px/1.1 'Archivo Black', sans-serif; letter-spacing: -0.01em;
      text-transform: uppercase; color: var(--ink); max-width: 60%; }
    .credit small { display: block; font: 9px/1 'Space Mono', monospace;
      letter-spacing: 0.18em; margin-top: 4px; font-weight: 400; color: var(--muted);
      text-transform: uppercase; }
    footer { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 18px;
      align-items: center; padding: 0 24px; background: var(--paper);
      border-top: 2px solid var(--ink);
      font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .param b { color: var(--ink); font-weight: 700; }
    .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ink); }
    .led.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    button.tbtn { font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 6px 12px; background: transparent;
      color: var(--ink); border: 1px solid var(--ink); cursor: pointer; }
    button.tbtn:hover { background: var(--ink); color: var(--paper); }
    /* AUTO-START */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(244,240,232,0.92);
      cursor: pointer;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }
    #swr-start .box {
      text-align: center; color: var(--ink);
      padding: 36px 52px;
      border: 2px solid var(--ink);
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
      max-width: 480px;
    }
    #swr-start .arrow { font-size: 56px; color: var(--accent); line-height: 1; margin-bottom: 14px; }
    #swr-start .label { font: 800 18px/1 'Archivo Black', sans-serif;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); position: static; }
    #swr-start .sub { font: 11px/1.4 'Space Mono', monospace; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted); margin-top: 14px; }
    #swr-start.hide { opacity: 0; pointer-events: none; }
  </style>

<body data-page="collage">
      
  <div id="app">

    <section class="stage">

      <div class="credit">
        mixed-media // 6 panels
        <small>drop clips + audio · beat-synced cuts</small>
      </div>

    </section>
    <footer>
      <div class="param">cuts / beat <b id="cuts-v">1</b></div>

      <div class="param">ink <b id="ink-v">0.8</b></div>
      <div class="param">temp <b id="temp-v">+0.0</b></div>
      <span data-fx-intensity-mount></span>
      <button class="tbtn" id="automix-debug" title="Automix debug (D)" style="padding:3px 8px;font-size:9px;margin-left:6px;background:none;border:1px solid #444;border-radius:6px;color:#ccc;cursor:pointer;">Debug</button>
      <label class="tbtn" id="automix-toggle" style="cursor:pointer;">Automix <span id="automix-state" style="color:var(--m);">OFF</span></label>
      <select id="automix-style" title="How the visuals evolve (anchor pool · cadence · drift · cutting)" style="font-size:9px;padding:2px 4px;background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:9px ui-monospace;max-width:104px;margin-left:6px;"></select>
      <button class="tbtn" id="rec" disabled>● REC</button>
    </footer>
  </div>

  <script>
    const stage = document.getElementById('render');
    const ctx = stage.getContext('2d', { willReadFrequently: true });
    let t0 = performance.now();

    // Magazine grid: 3 columns x 2 rows = 6 panels
    // Each panel gets a synthetic pattern by default; once the
    // library is loaded, panels are assigned library assets and
    // paintPanel draws the asset instead of the synthetic pattern.
    const GRID = { cols: 3, rows: 2 };
    const GUTTER = 6;
    const panels = [];
    for (let r = 0; r < GRID.rows; r++) {
      for (let c = 0; c < GRID.cols; c++) {
        panels.push({
          row: r, col: c,
          // Each panel has a slightly different pattern
          hue: 20 + (r * GRID.cols + c) * 47 % 360,
          sat: 30 + (r * GRID.cols + c) * 11 % 50,
          pattern: (r * GRID.cols + c) % 6,  // 0-5 patterns
          asset: null,                         // assigned from Lib after load
        });
      }
    }

    // === LIBRARY ===
    // Mirrors the inline Lib object used by the 13 main engines
    // (aurora, chrome, eclipse, film, fractal, glitch, grid,
    // hallucination, neon, pulse, smoke, void, watercolor) so the
    // shared client/library-loader.client.js can populate it via
    // SWR_LIBLOAD.boot({...}). Collage has no Layers object — the
    // 6 panels themselves take library items.
    const Lib = {
      items: [],
      nextId: 1,
      async addFiles(files) {
        const seen = new Set(this.items.map((i) => i.name + ':' + (i.blob ? i.blob.size : 0)));
        for (const f of files) {
          if (!f.type) continue;
          const k = f.name + ':' + f.size;
          if (seen.has(k)) continue;
          seen.add(k);
          const it = {
            id: this.nextId++,
            name: f.name,
            type: f.type.startsWith('video/') ? 'video' : 'image',
            blob: f,
            url: URL.createObjectURL(f),
            motion: 0, luma: 0.5, hue: 0, w: 0, h: 0,
            added: Date.now(),
            thumb: null,
          };
          this.items.push(it);
          this._classify(it);
        }
        assignPanelsFromLib();
      },
      _classify(it) {
        // Tiny 32x32 sample to compute luma/hue for asset selection.
        const c = document.createElement('canvas'); c.width = 32; c.height = 32;
        const cx = c.getContext('2d');
        const src = it.type === 'video'
          ? Object.assign(document.createElement('video'), { src: it.url, muted: true, playsInline: true, preload: 'metadata' })
          : Object.assign(new Image(), { src: it.url });
        const capture = () => {
          if (it.type === 'video') it.duration = src.duration;
          try { cx.drawImage(src, 0, 0, 32, 32); } catch (_) {}
          const d = cx.getImageData(0, 0, 32, 32).data;
          let luma = 0;
          for (let i = 0; i < d.length; i += 4) luma += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          it.luma = (luma / (d.length / 4)) / 255;
          it.w = src.videoWidth || src.naturalWidth || 0;
          it.h = src.videoHeight || src.naturalHeight || 0;
        };
        // Poster frame, not frame 0: t=0 is black on anything that fades
        // in, so the thumbnail (and the luma/hue read from it) came out
        // black. Same rule as lib/library.client.js. The helper seeks to
        // 1s — or the middle of a shorter clip — and falls back to the
        // current frame if the clip cannot be seeked.
        if (src.tagName === 'VIDEO' && window.SWR_VIDEO_THUMB) {
          window.SWR_VIDEO_THUMB.atPoster(src, capture);
        } else {
          src.addEventListener(src.tagName==='VIDEO'?'loadeddata':'load', capture, { once: true });
        }
      },
    };

    // Round-robin assign the first N library items to the 6 panels.
    // Images + videos both qualify; later beats cycle the assignment
    // for the "cut" effect.
    let __collageLibCursor = 0;
    function assignPanelsFromLib() {
      if (!Lib.items.length) return;
      for (let i = 0; i < panels.length; i++) {
        const p = panels[i];
        const it = Lib.items[(__collageLibCursor + i) % Lib.items.length];
        p.asset = it;
        // Force creation of the underlying media element so it's
        // ready by the time paintPanel runs. Videos get a muted
        // autoplay-friendly element; images are pre-decoded.
        if (it.type === 'video' && !it._el) {
          const v = document.createElement('video');
          v.src = it.url; v.muted = true; v.loop = true;
          v.playsInline = true; v.preload = 'auto';
          it._el = v;
        } else if (it.type === 'image' && !it._el) {
          const im = new Image();
          im.src = it.url;
          it._el = im;
        }
      }
    }
    // Advance the cursor on strong beats so the panels "cut" to a
    // new set of clips (matches the page's "beat-synced cuts" copy).
    let __collageLastCutT = -1;
    function maybeCutPanels(t, feat) {
      if (feat.beat < 0.4) return;
      if (t - __collageLastCutT < 0.45) return;  // ~130 BPM max
      __collageLastCutT = t;
      if (Lib.items.length <= panels.length) return;
      __collageLibCursor = (__collageLibCursor + panels.length) % Lib.items.length;
      assignPanelsFromLib();
    }

    // Defer to DOMContentLoaded so the deferred
    // `<script src="../client/library-loader.client.js">` in <head>
    // has executed first. Without this, window.SWR_LIBLOAD is
    // undefined when this IIFE runs and boot() silently never
    // fires — same guard used by the 13 main engines.
    function __swr_libboot() {
      if (!window.SWR_LIBLOAD) return;
      if (typeof Lib === 'undefined') {
        console.warn('[swr-libload] inline Lib not found at boot time');
        return;
      }
      window.SWR_LIBLOAD.boot({
        manifestUrl: null,
        filePrefix:  '../library/',
        phase1Count: 8,
        Lib: Lib,
        doneFlag: 'swr-manifest-loaded',
      }).then(() => { try { assignPanelsFromLib(); } catch (_) {} });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', __swr_libboot, { once: true });
    } else {
      __swr_libboot();
    }

    function getAudioFeat() {
      if (window.Audio && window.Audio.feat) return window.Audio.feat;
      const t = (performance.now() - t0) / 1000;
      return {
        bass: 0.5 + Math.sin(t * 1.5) * 0.4,
        mid: 0.5 + Math.sin(t * 0.8) * 0.3,
        treble: 0.4 + Math.abs(Math.sin(t * 4)) * 0.4,
        beat: Math.max(0, Math.sin(t * 2.5) - 0.6) * 2,
      };
    }

    function paintPanel(panel, x, y, w, h, t, feat) {
      ctx.save();
      // White paper background
      ctx.fillStyle = '#fffaf0';
      ctx.fillRect(x, y, w, h);
      // Inner border
      ctx.strokeStyle = 'rgba(26,15,8,0.08)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

      // Library asset (when assigned). Falls back to the synthetic
      // pattern below if the asset isn't ready yet.
      let drewAsset = false;
      if (panel.asset) {
        const a = panel.asset;
        if (a._el) {
          const ready = a.type === 'video'
            ? (a._el.readyState >= 2)
            : (a._el.complete && a._el.naturalWidth > 0);
          if (ready) {
            // Cover-fit the asset into the panel.
            const srcW = a.type === 'video' ? (a._el.videoWidth || a.w) : (a._el.naturalWidth || a.w);
            const srcH = a.type === 'video' ? (a._el.videoHeight || a.h) : (a._el.naturalHeight || a.h);
            if (srcW > 0 && srcH > 0) {
              const ar = srcW / srcH, par = w / h;
              let dw, dh;
              if (ar > par) { dh = h; dw = dh * ar; } else { dw = w; dh = dw / ar; }
              const dx = x + (w - dw) / 2;
              const dy = y + (h - dh) / 2;
              // Videos get a subtle punch on heavy beats.
              if (a.type === 'video') {
                if (window.SWR && window.SWR.Audio && window.SWR.Audio.playing && a._el.paused) {
                  a._el.play().catch(() => {});
                } else if (window.SWR && window.SWR.Audio && !window.SWR.Audio.playing && !a._el.paused) {
                  a._el.pause();
                }
              }
              ctx.drawImage(a._el, dx, dy, dw, dh);
              drewAsset = true;
            }
          }
        }
      }

      // Panel-specific content (synthetic patterns — used as a
      // fallback when no library asset is assigned or ready).
      if (!drewAsset) switch (panel.pattern) {
        case 0: { // Big circle
          const cr = Math.min(w, h) * 0.35 * (1 + feat.bass * 0.1);
          ctx.fillStyle = `hsl(${panel.hue}, ${panel.sat}%, 60%)`;
          ctx.beginPath();
          ctx.arc(x + w/2, y + h/2, cr, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 1: { // Diagonal stripes
          ctx.strokeStyle = `hsl(${panel.hue}, ${panel.sat}%, 40%)`;
          ctx.lineWidth = 4;
          for (let i = -h; i < w + h; i += 12) {
            ctx.beginPath();
            ctx.moveTo(x + i, y);
            ctx.lineTo(x + i + h, y + h);
            ctx.stroke();
          }
          break;
        }
        case 2: { // Bold text block
          ctx.fillStyle = `hsl(${panel.hue}, ${panel.sat - 10}%, 25%)`;
          ctx.fillRect(x + w * 0.1, y + h * 0.3, w * 0.8, h * 0.4);
          // Label
          ctx.fillStyle = '#fffaf0';
          ctx.font = `900 ${Math.floor(h * 0.18)}px "Archivo Black", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('NOTE', x + w/2, y + h/2);
          break;
        }
        case 3: { // Concentric circles
          for (let r = 5; r < Math.min(w, h) / 2; r += 6) {
            ctx.strokeStyle = `hsla(${panel.hue + r}, ${panel.sat}%, 40%, ${0.6 - r / 200})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x + w/2, y + h/2, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          break;
        }
        case 4: { // Halftone-ish dots
          for (let dy = 0; dy < h; dy += 8) {
            for (let dx = 0; dx < w; dx += 8) {
              const dist = Math.hypot(dx - w/2, dy - h/2);
              const t = 1 - dist / Math.max(w, h);
              const r = Math.max(0.5, t * 4 * (0.5 + feat.mid * 0.5));
              ctx.fillStyle = `hsl(${panel.hue + dy}, ${panel.sat}%, 30%)`;
              ctx.beginPath();
              ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }
        case 5: { // Cross-hatch grid
          ctx.strokeStyle = `hsl(${panel.hue}, ${panel.sat}%, 25%)`;
          ctx.lineWidth = 1;
          for (let i = 0; i < w; i += 8) {
            ctx.beginPath();
            ctx.moveTo(x + i, y);
            ctx.lineTo(x + i, y + h);
            ctx.stroke();
          }
          for (let i = 0; i < h; i += 8) {
            ctx.beginPath();
            ctx.moveTo(x, y + i);
            ctx.lineTo(x + w, y + i);
            ctx.stroke();
          }
          break;
        }
      }
      // Beat-driven overlay tint
      if (feat.beat > 0.1) {
        ctx.fillStyle = `rgba(216, 35, 42, ${feat.beat * 0.2})`;
        ctx.fillRect(x, y, w, h);
      }
      // Small index marker (top-left, like a magazine)
      ctx.fillStyle = 'rgba(26,15,8,0.7)';
      ctx.font = '600 9px "Space Mono", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`[${String(panel.row * GRID.cols + panel.col + 1).padStart(2, '0')}]`, x + 6, y + 6);
      ctx.restore();
    }

    function paint() {
      const t = (performance.now() - t0) / 1000;
      const W = stage.width, H = stage.height;
      const feat = getAudioFeat();
      maybeCutPanels(t, feat);

      // Paper background
      ctx.fillStyle = '#f4f0e8';
      ctx.fillRect(0, 0, W, H);

      // Layout: 3 columns × 2 rows with 6px gutter
      const pad = 24;
      const gridW = W - pad * 2;
      const gridH = H - pad * 2;
      const colW = (gridW - GUTTER * (GRID.cols - 1)) / GRID.cols;
      const rowH = (gridH - GUTTER * (GRID.rows - 1)) / GRID.rows;

      // Beat-driven cut: on each beat, panels get a brief scaling + rotation
      const cut = Math.floor(t * 2) % 2;  // 0 or 1 every 0.5s
      const beatCut = feat.beat > 0.4 ? 0.08 : 0;

      for (let i = 0; i < panels.length; i++) {
        const p = panels[i];
        const x = pad + p.col * (colW + GUTTER);
        const y = pad + p.row * (rowH + GUTTER);

        // Cut animation: alternate panels shift slightly on each beat
        const shiftX = (i % 2 === cut) ? beatCut * colW * 0.05 : 0;
        const shiftY = (i % 3 === cut) ? beatCut * rowH * 0.05 : 0;

        paintPanel(p, x + shiftX, y + shiftY, colW, rowH, t, feat);
      }

      // Heavy black rule at top (magazine masthead bar)
      ctx.fillStyle = '#1a0f08';
      ctx.fillRect(0, 0, W, 6);

      // Speed lines on heavy beat
      if (feat.beat > 0.5) {
        for (let i = 0; i < 12; i++) {
          const y = Math.random() * H;
          ctx.fillStyle = 'rgba(26,15,8,0.4)';
          ctx.fillRect(0, y, Math.random() * 80, 1);
        }
      }

      // Audio features
      window.SWR = window.SWR || {};
      window.SWR.Audio = window.SWR.Audio || {};
      window.SWR.Audio.feat = feat;
      // Expose Library + panels so verify scripts and other consumers
      // can read the same shape the 13 main engines expose.
      window.SWR.Library = Lib;
      window.SWR.collage_panels = panels;

      requestAnimationFrame(paint);
    }
    paint();

    // === Collage paper pass (engine variant) ===
    // The standalone COLLAGE page is a cut-paper magazine spread: six
    // paper panels (3 × 2, 24px margin, 6px gutter) on a warm paper
    // ground, each panel carrying its own hue/sat and one of six printed
    // motifs — a big circle, diagonal stripes, a bold text block, concentric
    // circles, a halftone dot field, a cross-hatch — with a red accent
    // flashing on the beat, a small [01]…[06] index marker in the corner,
    // a heavy black masthead bar across the top and speed lines torn across
    // the sheet on a heavy beat.
    //
    // Inside the shared engine the user's media is ALREADY painted on the
    // stage canvas, so the paper cannot be re-painted: an opaque sheet would
    // erase the clips, which is the one thing the engine exists to show. So
    // the paper becomes a translucent warm lift ('lighter'), each printed
    // motif becomes an additive tint in the panel's own hue, the panel
    // edges become the page's --line rule, and the masthead bar stays the
    // one near-opaque mark — it is 6px tall and it is the page's identity.
    // The media stays visible UNDER the collage, which is the point.
    //
    // Audio mapping — the page's own loop drives a synthetic bass/mid/
    // treble out of sine waves; under the engine the real feature values
    // arrive on A.feat instead: bass swells the big circle and the paper
    // lift, mid drives the halftone dot radius, treble lifts the diagonal
    // stripes, and the beat flashes the red accent, shifts the panels on
    // the page's half-second cut and tears the speed lines across the sheet.
    //
    // Safe to compile into the engine: uses only ctx, W, H, A, clamp and
    // performance — all bound by client/variant-switcher.client.js.
    function drawFx() {
      const feat = (typeof A !== 'undefined' && A && A.feat) || null;
      const bass = feat ? (feat.bass || 0) : 0;
      const mid = feat ? (feat.mid || 0) : 0;
      const treble = feat ? (feat.treble || 0) : 0;
      const beat = feat ? (feat.beat || 0) : 0;
      const onset = feat ? (feat.onset || 0) : 0;
      const t = performance.now() / 1000;

      // Page palette, inlined from the :root block above.
      const PAPER = '255,250,240';   // --paper  #fffaf0
      const INK = '26,15,8';         // --ink    #1a0f08
      const LINE = '200,184,154';    // --line   #c8b89a
      const ACCENT = '216,35,42';    // --accent #d8232a

      // The page's own layout constants (pad 24, gutter 6, 3 × 2).
      const pad = 24, gutter = 6, cols = 3, rows = 2;
      const gridW = W - pad * 2, gridH = H - pad * 2;
      const colW = (gridW - gutter * (cols - 1)) / cols;
      const rowH = (gridH - gutter * (rows - 1)) / rows;

      // The page's half-second panel cut, and the beat-driven shift.
      const cut = Math.floor(t * 2) % 2;
      const beatCut = beat > 0.4 ? 0.08 : 0;

      ctx.save();

      // --- 1) The paper lift ------------------------------------------------
      // The page paints an opaque sheet; over media it is a warm lift that
      // desaturates toward paper without hiding anything.
      ctx.globalCompositeOperation = 'lighter';
      const wash = ctx.createLinearGradient(0, 0, W, H);
      wash.addColorStop(0, 'rgba(' + PAPER + ',' + (0.09 + bass * 0.07).toFixed(3) + ')');
      wash.addColorStop(0.55, 'rgba(' + PAPER + ',' + (0.05 + mid * 0.05).toFixed(3) + ')');
      wash.addColorStop(1, 'rgba(' + PAPER + ',' + (0.03 + treble * 0.05).toFixed(3) + ')');
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, W, H);

      // --- 2) The six printed panels ---------------------------------------
      for (let i = 0; i < cols * rows; i++) {
        const row = Math.floor(i / cols), col = i % cols;
        // The page's per-panel hue/sat/pattern, inlined from the panel loop.
        const hue = 20 + ((i * 47) % 360);
        const sat = 30 + ((i * 11) % 50);
        const pattern = i % 6;

        const shiftX = (i % 2 === cut) ? beatCut * colW * 0.05 : 0;
        const shiftY = (i % 3 === cut) ? beatCut * rowH * 0.05 : 0;
        const x = pad + col * (colW + gutter) + shiftX;
        const y = pad + row * (rowH + gutter) + shiftY;

        // Panel tint: the page's motif colour, printed lightly over the
        // clip so the panel reads as a coloured sheet of paper.
        const tint = 0.05 + bass * 0.05 + mid * 0.03;
        ctx.fillStyle = 'hsla(' + hue + ',' + sat + '%,60%,' + tint.toFixed(3) + ')';
        ctx.fillRect(x, y, colW, rowH);

        // The printed motif, one per panel, exactly the page's six.
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, colW, rowH);
        ctx.clip();
        if (pattern === 0) {
          // Big circle — the bass swells it.
          const cr = Math.min(colW, rowH) * 0.35 * (1 + bass * 0.1);
          ctx.fillStyle = 'hsla(' + hue + ',' + sat + '%,60%,' + (0.10 + bass * 0.14).toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(x + colW / 2, y + rowH / 2, cr, 0, Math.PI * 2);
          ctx.fill();
        } else if (pattern === 1) {
          // Diagonal stripes — the treble lifts them.
          ctx.strokeStyle = 'hsla(' + hue + ',' + sat + '%,40%,' + (0.12 + treble * 0.16).toFixed(3) + ')';
          ctx.lineWidth = 4;
          for (let s = -rowH; s < colW + rowH; s += 12) {
            ctx.beginPath();
            ctx.moveTo(x + s, y);
            ctx.lineTo(x + s + rowH, y + rowH);
            ctx.stroke();
          }
        } else if (pattern === 2) {
          // Bold text block.
          ctx.fillStyle = 'hsla(' + hue + ',' + (sat - 10) + '%,25%,' + (0.16 + mid * 0.10).toFixed(3) + ')';
          ctx.fillRect(x + colW * 0.1, y + rowH * 0.3, colW * 0.8, rowH * 0.4);
        } else if (pattern === 3) {
          // Concentric circles.
          for (let r = 5; r < Math.min(colW, rowH) / 2; r += 6) {
            ctx.strokeStyle = 'hsla(' + ((hue + r) % 360) + ',' + sat + '%,40%,' + (0.14 + bass * 0.10).toFixed(3) + ')';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x + colW / 2, y + rowH / 2, r, 0, Math.PI * 2);
            ctx.stroke();
          }
        } else if (pattern === 4) {
          // Halftone dots — the mid band drives the radius.
          for (let dy = 0; dy < rowH; dy += 8) {
            for (let dx = 0; dx < colW; dx += 8) {
              const dist = Math.hypot(dx - colW / 2, dy - rowH / 2);
              const fall = 1 - dist / Math.max(colW, rowH);
              const r = Math.max(0.5, fall * 4 * (0.5 + mid * 0.5));
              ctx.fillStyle = 'hsla(' + ((hue + dy) % 360) + ',' + sat + '%,30%,' + (0.12 + mid * 0.12).toFixed(3) + ')';
              ctx.beginPath();
              ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        } else {
          // Cross-hatch.
          ctx.strokeStyle = 'hsla(' + hue + ',' + sat + '%,25%,' + (0.10 + onset * 0.14).toFixed(3) + ')';
          ctx.lineWidth = 1;
          for (let s = 0; s < colW; s += 8) {
            ctx.beginPath();
            ctx.moveTo(x + s, y);
            ctx.lineTo(x + s, y + rowH);
            ctx.stroke();
          }
          for (let s = 0; s < rowH; s += 8) {
            ctx.beginPath();
            ctx.moveTo(x, y + s);
            ctx.lineTo(x + colW, y + s);
            ctx.stroke();
          }
        }
        ctx.restore();

        // The page's panel edge (--line) and the red beat flash.
        ctx.strokeStyle = 'rgba(' + LINE + ',0.30)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, colW - 1, rowH - 1);
        if (beat > 0.1) {
          ctx.fillStyle = 'rgba(' + ACCENT + ',' + (beat * 0.12).toFixed(3) + ')';
          ctx.fillRect(x, y, colW, rowH);
        }

        // The small index marker, like a magazine.
        ctx.fillStyle = 'rgba(' + INK + ',0.45)';
        ctx.font = '600 9px "Space Mono", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText('[' + String(i + 1).padStart(2, '0') + ']', x + 6, y + 6);
      }

      // --- 3) The masthead bar ---------------------------------------------
      // The one near-opaque mark: 6px of black ink across the top, the
      // page's magazine rule. It is the paper's edge, not a replacement
      // for the frame.
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(' + INK + ',0.92)';
      ctx.fillRect(0, 0, W, 6);

      // --- 4) Speed lines on a heavy beat ----------------------------------
      // The page tears ink lines across the sheet when the beat is heavy.
      if (beat > 0.5) {
        ctx.strokeStyle = 'rgba(' + INK + ',0.28)';
        ctx.lineWidth = 1;
        for (let s = 0; s < 12; s++) {
          const ly = Math.random() * H;
          const ll = Math.random() * 80;
          ctx.beginPath();
          ctx.moveTo(0, ly);
          ctx.lineTo(ll, ly);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // === RECORDER (same shape as other engines) ===
    const Recorder = {
      rec: null, chunks: [], recording: false, mime: 'video/webm',
      mediaCtx: null, mediaSrc: null, mediaDest: null,
    // SWR_REC_MP4_INTEGRATION
      start() {
        if (!A.el) { setStatus('load a song first', ''); return; }
        const fpsSel = $('rec-fps') ? $('rec-fps').value : '30';
        const fps = parseInt(fpsSel, 10) || 30;
        const qualSel = $('rec-quality') ? $('rec-quality').value : 'high';
        const BITRATE = { high: 12_000_000, med: 6_000_000, low: 3_000_000 }[qualSel] || 12_000_000;
        const formatSel = $('rec-format') ? $('rec-format').value : 'auto';
        const wantMp4 = formatSel === 'mp4' || (formatSel === 'auto' && window.SWR_RECORDER && window.SWR_RECORDER.canUseWebCodecs && window.SWR_RECORDER.canUseWebCodecs());

          this._wcPending = window.SWR_RECORDER.start({
            canvas: stage,
            audioSource: A.an,
            audioSampleRate: A.ctx ? A.ctx.sampleRate : 0,
            audioNumberOfChannels: 2,
            width: stage.width,
            height: stage.height,
            fps: fps,
            videoBitsPerSecond: BITRATE,
          }).then(() => {
            this.recording = true;
            this.startedAt = Date.now();
            const durSel = $('rec-dur') ? $('rec-dur').value : '0';
            let durMs = 0;
            if (durSel === 'song' && A.el && A.el.duration) {

            } else if (durSel !== '0' && durSel !== 'manual') {
              durMs = parseInt(durSel) * 1000;
            }
            this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
            $('rec').classList.add('live');
            $('rec').textContent = '■ STOP';
            const formatDur = (ms) => {
              const s = Math.max(0, Math.round(ms / 1000));
              return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
            };
            if (this.autoStopAt > 0) {
              const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
              setStatus('rec · MP4 · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
              this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());

              setStatus('rec · MP4', 'live');

            this.tickTimer = setInterval(() => {
              if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
              const el = formatDur(Date.now() - this.startedAt);
              if (this.autoStopAt > 0) {
                const rem = formatDur(this.autoStopAt - Date.now());
                const durSel2 = $('rec-dur') ? $('rec-dur').value : '0';
                const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');

        const stream = new MediaStream(tracks);
        const mime = [
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=avc1,mp4a.40.2',
          'video/mp4;codecs=avc1',
          'video/mp4',
          'video/webm',
        ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
        this.mime = mime;

        this.rec.onstop = () => this._save();

        this.recording = true;
        this.startedAt = Date.now();
        const durSel = $('rec-dur') ? $('rec-dur').value : '0';
        let durMs = 0;
        if (durSel === 'song' && A.el && A.el.duration) {
          durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
        } else if (durSel !== '0' && durSel !== 'manual') {
          durMs = parseInt(durSel) * 1000;
        }
        this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
        $('rec').classList.add('live');
        $('rec').textContent = '■ STOP';
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        const formatDur = (ms) => {
          const s = Math.max(0, Math.round(ms / 1000));
          return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0');
        };
        if (this.autoStopAt > 0) {
          const durLabel = durSel === 'song' ? 'song' : (durSel + 's');
          setStatus('rec · ' + ext.toUpperCase() + ' · ' + formatDur(this.autoStopAt - Date.now()) + ' / ' + durLabel, 'live');
          this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
        } else {
          setStatus('rec · ' + ext.toUpperCase(), 'live');

        this.tickTimer = setInterval(() => {
          if (!this.recording) { clearInterval(this.tickTimer); this.tickTimer = null; return; }
          const el = formatDur(Date.now() - this.startedAt);
          if (this.autoStopAt > 0) {
            const rem = formatDur(this.autoStopAt - Date.now());

            const durLabel = durSel2 === 'song' ? 'song' : (durSel2 + 's');
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el + ' / ' + durLabel, 'live');
          } else {
            setStatus('rec · ' + ext.toUpperCase() + ' · ' + el, 'live');
          }
        }, 500);
        // SWR_REC_IMPROVED_v2
      },
      stop() {

          this.recording = false;
          $('rec').classList.remove('live');
          $('rec').textContent = '● REC';
          setStatus('finalizing MP4…', '');
          window.SWR_RECORDER.stop().then((res) => {
            this.chunks = [res.blob];

        if (!this.rec) return;
        if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }

    const recBtn = document.getElementById('rec');

  <div id="swr-start" role="button" aria-label="Start Sainted Word Records">
    <div class="box">
      <div class="arrow">▶</div>
      <div class="label">Drop a song</div>

    </div>

  <script>
  (function(){
    var DEFAULT_SONG = '../library/audio/loop-grain.wav';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var fired = false;

    // Can we autoplay without a user gesture? Modern browsers
    // (Chrome 94+, Safari 16.4+, Firefox 121+) relax autoplay for
    // sites the user has interacted with before. The MediaSession
    // API surfaces a "activation hint" — non-empty activation
    // means the user has clicked/tapped/typed since the page loaded,
    // and we can autoplay. On pages where this is true, run start()
    // immediately and skip the overlay.
    var canAutoplay = false;
    try {
      if (navigator.userActivation && navigator.userActivation.isActive) {
        canAutoplay = true;
      }
    } catch (_) {}

    async function start() {
      if (fired) return;
      fired = true;
      var succeeded = false;
      try {
        // Prefer the user's last-loaded song (from engine.html IDB),
        // fall back to the per-page bundled audio.
        var picked = window.SWR_PICK_DEFAULT_SONG
          ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
          : null;
        if (!picked) throw new Error('no song source available');
        var blob = picked.blob;
        var name = picked.name;
        var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
        if (window.SWR && window.SWR.Audio) {
          window.SWR.Audio.load(file);
          await window.SWR.Audio.play();
          if (sub) {
            var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
            sub.textContent = tag + name;
          }
        }
        succeeded = true;
      } catch (e) {
        // Failure path: leave the overlay visible so the user can
        // click again. Reset the fired flag so the click handler
        // can fire a fresh attempt. Without this, a single failed
        // autoplay leaves the user stranded — the overlay disappears
        // and the "tap to start" hint vanishes with it. This is the
        // exact "media is not loading" symptom we were trying to
        // avoid.
        fired = false;
        if (sub) sub.textContent = 'tap "load song" to start';
        console.warn('swr auto-start failed:', e);
      }
      // Only hide + remove the overlay on success. The overlay is
      // the manual fallback for browsers that still block autoplay;
      // removing it on failure strands the user with no retry path.
      if (succeeded) {
        overlay.classList.add('hide');
        setTimeout(function(){ overlay.remove(); }, 600);
      }
    }

    // Track a one-shot user gesture anywhere on the page to arm the
    // audio for next time. Once armed, the overlay can autoplay.
    document.addEventListener('pointerdown', function arm() {
      try { localStorage.setItem('swr.audio.armed', '1'); } catch (_) {}
    }, { once: true, capture: true });

    if (canAutoplay || (function () {
      try { return localStorage.getItem('swr.audio.armed') === '1'; }
      catch (_) { return false; }
    })()) {
      // Try to autoplay immediately — if the browser blocks, the
      // overlay stays visible (start()'s catch path) and the user
      // can click it manually. Either way, the engine renders
      // visual content on enter via the normal RAF loop.
      //
      // Wait for window.SWR_PICK_DEFAULT_SONG to be defined —
      // last-song.js (which defines it) loads AFTER this inline
      // script. Poll until it's there, then fire. This avoids the
      // race where the auto-start fires before last-song.js has
      // registered the helper.
      function waitForPick() {
        if (window.SWR_PICK_DEFAULT_SONG) {
          start();
          return;
        }
        var tries = 0;
        var iv = setInterval(function() {
          tries++;
          if (window.SWR_PICK_DEFAULT_SONG) {
            clearInterval(iv);
            start();

            clearInterval(iv);
            // Don't fire — overlay stays as fallback.
          }
        }, 100);
      }
      waitForPick();
    }

    // play() resolved), keep the overlay visible until the user
    // explicitly hides it. The overlay remains the manual fallback
    // for browsers that still block autoplay.
    overlay.addEventListener('click', function manualStart() {
      if (!fired) start();
    });
    document.addEventListener('keydown', function(ev){
      if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();

<script>
  // Mount the automix style dropdown. Deferred so it runs after the
  // automix modules that expose SWR_AUTOMIX / SWR_ANCHOR_MAP.
  (function () {
    function __swr_mount_automix_style() {
      var sel = document.getElementById('automix-style');
      var S = window.SWR_AUTOMIX_STYLE;
      if (!sel || !S) return false;
      S.mount(sel);
      // Apply the stored style so a returning session keeps its look.
      S.apply(S.get());
      return true;
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', __swr_mount_automix_style, { once: true });
    } else if (!__swr_mount_automix_style()) {
      setTimeout(__swr_mount_automix_style, 300);
    }
  })();
</script>
