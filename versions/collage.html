<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>COLLAGE · SWR version · Mixed-media magazine layout</title>
  <meta name="description" content="SWR engine — COLLAGE: multi-clip split-screen composition for mixed-media. Magazine-grid layout that cuts to the beat." />
  <meta name="theme-color" content="#f4f0e8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site-name" content="Sainted Word Records" />
  <meta property="og:title" content="COLLAGE · SWR engine" />
  <meta property="og:description" content="Mixed-media magazine grid composition. Drop in your clips + audio, get a beat-synced split-screen cut." />
  <meta property="og:url" content="https://sainted-word-records.vercel.app/versions/collage.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="COLLAGE · SWR engine" />
  <meta name="twitter:description" content="Mixed-media magazine grid composition for mixed-media creators" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;700&display=swap');
    :root {
      --bg: #f4f0e8; --paper: #fffaf0; --line: #c8b89a;
      --ink: #1a0f08; --muted: #6b5d4a;
      --accent: #d8232a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden;
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', sans-serif; }
    #app { display: grid; grid-template-rows: 60px 1fr 52px; height: 100vh; }
    header { display: flex; align-items: center; gap: 14px; padding: 0 24px;
      background: var(--paper); border-bottom: 2px solid var(--ink); }
    .v { font: 800 22px/1 'Archivo Black', sans-serif; letter-spacing: -0.01em; text-transform: uppercase; }
    .v em { font-style: normal; color: var(--accent); }
    .v small { font: 500 10px/1 'Inter', sans-serif; color: var(--muted);
      margin-left: 12px; letter-spacing: 0.18em; text-transform: uppercase; }
    .pill { font: 9px/1 'Space Mono', monospace; padding: 4px 10px;
      border: 1px solid var(--ink); color: var(--ink);
      letter-spacing: 0.18em; text-transform: uppercase; }
    .pill.live { background: var(--accent); color: #fff; border-color: var(--accent);
      animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .spacer { flex: 1; }
    a.nav { color: var(--ink); text-decoration: none; font-size: 10px;
      font-family: 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; opacity: 0.6; }
    a.nav:hover { opacity: 1; }
    section.stage { position: relative; background: var(--bg); overflow: hidden;
      border-bottom: 2px solid var(--ink); }
    #render { display: block; width: 100%; height: 100%; }
    .badge { position: absolute; top: 18px; right: 24px;
      font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink);
      border: 1px solid var(--ink); padding: 5px 10px; background: var(--paper); }
    .credit { position: absolute; top: 18px; left: 24px; z-index: 4;
      font: 800 14px/1.1 'Archivo Black', sans-serif; letter-spacing: -0.01em;
      text-transform: uppercase; color: var(--ink); max-width: 60%; }
    .credit small { display: block; font: 9px/1 'Space Mono', monospace;
      letter-spacing: 0.18em; margin-top: 4px; font-weight: 400; color: var(--muted);
      text-transform: uppercase; }
    footer { display: grid; grid-template-columns: repeat(5, 1fr) auto; gap: 18px;
      align-items: center; padding: 0 24px; background: var(--paper);
      border-top: 2px solid var(--ink);
      font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
    .param b { color: var(--ink); font-weight: 700; }
    .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); border: 1px solid var(--ink); }
    .led.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    button.tbtn { font: 9px/1 'Space Mono', monospace; letter-spacing: 0.18em;
      text-transform: uppercase; padding: 6px 12px; background: transparent;
      color: var(--ink); border: 1px solid var(--ink); cursor: pointer; }
    button.tbtn:hover { background: var(--ink); color: var(--paper); }
    /* AUTO-START */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(244,240,232,0.92);
      cursor: pointer;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(8px);
    }
    #swr-start .box {
      text-align: center; color: var(--ink);
      padding: 36px 52px;
      border: 2px solid var(--ink);
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
      max-width: 480px;
    }
    #swr-start .arrow { font-size: 56px; color: var(--accent); line-height: 1; margin-bottom: 14px; }
    #swr-start .label { font: 800 18px/1 'Archivo Black', sans-serif;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); position: static; }
    #swr-start .sub { font: 11px/1.4 'Space Mono', monospace; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--muted); margin-top: 14px; }
    #swr-start.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body data-page="collage">
  <div id="app">
    <header>
      <div class="v">COLL<em>A</em>GE<small>· MAGAZINE GRID · MIXED-MEDIA</small></div>
      <span class="pill live" id="live">● CUT</span>
      <span class="spacer"></span>
      <a class="nav" href="../engine.html">← engine</a>
    </header>
    <section class="stage">
      <canvas id="render" width="1280" height="720"></canvas>
      <div class="credit">
        mixed-media // 6 panels
        <small>drop clips + audio · beat-synced cuts</small>
      </div>
      <div class="badge">3 × 2 grid · 6 panels</div>
    </section>
    <footer>
      <div class="param">cuts / beat <b id="cuts-v">1</b></div>
      <div class="param">gutter <b id="gutter-v">6</b></div>
      <div class="param">paper <b id="paper-v">1.0</b></div>
      <div class="param">ink <b id="ink-v">0.8</b></div>
      <div class="param">temp <b id="temp-v">+0.0</b></div>
      <button class="tbtn" id="rec" disabled>● REC</button>
    </footer>
  </div>

  <script>
    const stage = document.getElementById('render');
    const ctx = stage.getContext('2d', { willReadFrequently: true });
    let t0 = performance.now();

    // Magazine grid: 3 columns x 2 rows = 6 panels
    // Each panel gets a synthetic pattern (no library assets loaded by default)
    // When library assets ARE loaded, fill the next panel with the asset
    const GRID = { cols: 3, rows: 2 };
    const GUTTER = 6;
    const panels = [];
    for (let r = 0; r < GRID.rows; r++) {
      for (let c = 0; c < GRID.cols; c++) {
        panels.push({
          row: r, col: c,
          // Each panel has a slightly different pattern
          hue: 20 + (r * GRID.cols + c) * 47 % 360,
          sat: 30 + (r * GRID.cols + c) * 11 % 50,
          pattern: (r * GRID.cols + c) % 6,  // 0-5 patterns
        });
      }
    }

    function getAudioFeat() {
      if (window.Audio && window.Audio.feat) return window.Audio.feat;
      const t = (performance.now() - t0) / 1000;
      return {
        bass: 0.5 + Math.sin(t * 1.5) * 0.4,
        mid: 0.5 + Math.sin(t * 0.8) * 0.3,
        treble: 0.4 + Math.abs(Math.sin(t * 4)) * 0.4,
        beat: Math.max(0, Math.sin(t * 2.5) - 0.6) * 2,
      };
    }

    function paintPanel(panel, x, y, w, h, t, feat) {
      ctx.save();
      // White paper background
      ctx.fillStyle = '#fffaf0';
      ctx.fillRect(x, y, w, h);
      // Inner border
      ctx.strokeStyle = 'rgba(26,15,8,0.08)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

      // Panel-specific content (synthetic patterns — would be library assets in production)
      switch (panel.pattern) {
        case 0: { // Big circle
          const cr = Math.min(w, h) * 0.35 * (1 + feat.bass * 0.1);
          ctx.fillStyle = `hsl(${panel.hue}, ${panel.sat}%, 60%)`;
          ctx.beginPath();
          ctx.arc(x + w/2, y + h/2, cr, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
        case 1: { // Diagonal stripes
          ctx.strokeStyle = `hsl(${panel.hue}, ${panel.sat}%, 40%)`;
          ctx.lineWidth = 4;
          for (let i = -h; i < w + h; i += 12) {
            ctx.beginPath();
            ctx.moveTo(x + i, y);
            ctx.lineTo(x + i + h, y + h);
            ctx.stroke();
          }
          break;
        }
        case 2: { // Bold text block
          ctx.fillStyle = `hsl(${panel.hue}, ${panel.sat - 10}%, 25%)`;
          ctx.fillRect(x + w * 0.1, y + h * 0.3, w * 0.8, h * 0.4);
          // Label
          ctx.fillStyle = '#fffaf0';
          ctx.font = `900 ${Math.floor(h * 0.18)}px "Archivo Black", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('NOTE', x + w/2, y + h/2);
          break;
        }
        case 3: { // Concentric circles
          for (let r = 5; r < Math.min(w, h) / 2; r += 6) {
            ctx.strokeStyle = `hsla(${panel.hue + r}, ${panel.sat}%, 40%, ${0.6 - r / 200})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x + w/2, y + h/2, r, 0, Math.PI * 2);
            ctx.stroke();
          }
          break;
        }
        case 4: { // Halftone-ish dots
          for (let dy = 0; dy < h; dy += 8) {
            for (let dx = 0; dx < w; dx += 8) {
              const dist = Math.hypot(dx - w/2, dy - h/2);
              const t = 1 - dist / Math.max(w, h);
              const r = Math.max(0.5, t * 4 * (0.5 + feat.mid * 0.5));
              ctx.fillStyle = `hsl(${panel.hue + dy}, ${panel.sat}%, 30%)`;
              ctx.beginPath();
              ctx.arc(x + dx, y + dy, r, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          break;
        }
        case 5: { // Cross-hatch grid
          ctx.strokeStyle = `hsl(${panel.hue}, ${panel.sat}%, 25%)`;
          ctx.lineWidth = 1;
          for (let i = 0; i < w; i += 8) {
            ctx.beginPath();
            ctx.moveTo(x + i, y);
            ctx.lineTo(x + i, y + h);
            ctx.stroke();
          }
          for (let i = 0; i < h; i += 8) {
            ctx.beginPath();
            ctx.moveTo(x, y + i);
            ctx.lineTo(x + w, y + i);
            ctx.stroke();
          }
          break;
        }
      }
      // Beat-driven overlay tint
      if (feat.beat > 0.1) {
        ctx.fillStyle = `rgba(216, 35, 42, ${feat.beat * 0.2})`;
        ctx.fillRect(x, y, w, h);
      }
      // Small index marker (top-left, like a magazine)
      ctx.fillStyle = 'rgba(26,15,8,0.7)';
      ctx.font = '600 9px "Space Mono", monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(`[${String(panel.row * GRID.cols + panel.col + 1).padStart(2, '0')}]`, x + 6, y + 6);
      ctx.restore();
    }

    function paint() {
      const t = (performance.now() - t0) / 1000;
      const W = stage.width, H = stage.height;
      const feat = getAudioFeat();

      // Paper background
      ctx.fillStyle = '#f4f0e8';
      ctx.fillRect(0, 0, W, H);

      // Layout: 3 columns × 2 rows with 6px gutter
      const pad = 24;
      const gridW = W - pad * 2;
      const gridH = H - pad * 2;
      const colW = (gridW - GUTTER * (GRID.cols - 1)) / GRID.cols;
      const rowH = (gridH - GUTTER * (GRID.rows - 1)) / GRID.rows;

      // Beat-driven cut: on each beat, panels get a brief scaling + rotation
      const cut = Math.floor(t * 2) % 2;  // 0 or 1 every 0.5s
      const beatCut = feat.beat > 0.4 ? 0.08 : 0;

      for (let i = 0; i < panels.length; i++) {
        const p = panels[i];
        const x = pad + p.col * (colW + GUTTER);
        const y = pad + p.row * (rowH + GUTTER);

        // Cut animation: alternate panels shift slightly on each beat
        const shiftX = (i % 2 === cut) ? beatCut * colW * 0.05 : 0;
        const shiftY = (i % 3 === cut) ? beatCut * rowH * 0.05 : 0;

        paintPanel(p, x + shiftX, y + shiftY, colW, rowH, t, feat);
      }

      // Heavy black rule at top (magazine masthead bar)
      ctx.fillStyle = '#1a0f08';
      ctx.fillRect(0, 0, W, 6);

      // Speed lines on heavy beat
      if (feat.beat > 0.5) {
        for (let i = 0; i < 12; i++) {
          const y = Math.random() * H;
          ctx.fillStyle = 'rgba(26,15,8,0.4)';
          ctx.fillRect(0, y, Math.random() * 80, 1);
        }
      }

      // Audio features
      window.SWR = window.SWR || {};
      window.SWR.Audio = window.SWR.Audio || {};
      window.SWR.Audio.feat = feat;

      requestAnimationFrame(paint);
    }
    paint();

    // === RECORDER (same shape as other engines) ===
    const Recorder = {
      rec: null, chunks: [], recording: false, mime: 'video/webm',
      mediaCtx: null, mediaSrc: null, mediaDest: null,
      start() {
        const audioEl = window.SWR.Audio && window.SWR.Audio.el;
        if (!audioEl) { alert('load a song first'); return; }
        try {
          const fps = 24;
          const vstream = stage.captureStream(fps);
          const AC = window.AudioContext || window.webkitAudioContext;
          this.mediaCtx = new AC();
          this.mediaSrc = this.mediaCtx.createMediaElementSource(audioEl);
          this.mediaDest = this.mediaCtx.createMediaStreamDestination();
          this.mediaSrc.connect(this.mediaDest);
          this.mediaSrc.connect(this.mediaCtx.destination);
          const stream = new MediaStream([
            ...vstream.getVideoTracks(),
            ...this.mediaDest.stream.getAudioTracks(),
          ]);
          const mime = [
            'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
            'video/mp4;codecs=avc1',
            'video/mp4',
            'video/webm;codecs=vp9,opus',
            'video/webm;codecs=vp8,opus',
            'video/webm',
          ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
          this.mime = mime;
          this.rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
          this.chunks = [];
          this.rec.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
          this.rec.onstop = () => this._save();
          this.rec.start(500);
          this.recording = true;
          $('rec').classList.add('live');
          $('rec').textContent = '■ STOP';
          console.log('collage: recording', mime);
        } catch (e) {
          console.error('collage: recorder start failed', e);
        }
      },
      stop() {
        if (!this.rec) return;
        this.rec.stop();
        this.recording = false;
        $('rec').classList.remove('live');
        $('rec').textContent = '● REC';
        try { this.mediaSrc && this.mediaSrc.disconnect(); } catch {}
        try { this.mediaDest && this.mediaDest.disconnect(); } catch {}
        try { this.mediaCtx && this.mediaCtx.close(); } catch {}
        this.mediaCtx = this.mediaSrc = this.mediaDest = null;
      },
      _save() {
        const blob = new Blob(this.chunks, { type: this.mime });
        const a = document.createElement('a');
        const recUrl = URL.createObjectURL(blob);
        a.href = recUrl;
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const ext = this.mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        a.download = 'collage-' + ts + '.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Free the download URL once the click has been dispatched.
        setTimeout(() => { try { URL.revokeObjectURL(recUrl); } catch (_) {} }, 1000);
      },
    };

    const recBtn = document.getElementById('rec');
    if (recBtn) recBtn.addEventListener('click', () => {
      if (Recorder.recording) Recorder.stop();
      else Recorder.start();
    });

    if (!window.SWR.Audio.load) {
      window.SWR.Audio.load = function (f) {
        if (this.el) { try { this.el.pause(); this.el.src = ''; } catch (e) {} }
        // Free the previous Blob URL before allocating a new one.
        if (this.el && this.el.__swr_blob_url) {
          try { URL.revokeObjectURL(this.el.__swr_blob_url); } catch (_) {}
        }
        this.el = document.createElement('audio');
        this.el.crossOrigin = 'anonymous';
        this.el.__swr_blob_url = URL.createObjectURL(f);
        this.el.src = this.el.__swr_blob_url;
        this.el.preload = 'auto';
        var btn = document.getElementById('rec');
        if (btn) btn.disabled = false;
      };
      window.SWR.Audio.play = function () {
        if (this.el) { this.el.play(); this.playing = true; }
      };
    }
  </script>

  <div id="swr-start" role="button" aria-label="Start Sainted Word Records">
    <div class="box">
      <div class="arrow">▶</div>
      <div class="label">Drop a song</div>
      <div class="sub" id="swr-start-sub">Or load saved last song</div>
    </div>
  </div>
  <script>
  (function(){
    var DEFAULT_SONG = '../audios/collage.mp3';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var fired = false;
    async function start() {
      if (fired) return;
      fired = true;
      try {
        var picked = window.SWR_PICK_DEFAULT_SONG
          ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
          : null;
        if (!picked) throw new Error('no song source available');
        var blob = picked.blob;
        var name = picked.name;
        if (!window.SWR) window.SWR = {};
        if (!window.SWR.Audio) window.SWR.Audio = {};
        if (typeof window.SWR.Audio.load === 'function') {
          var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
          window.SWR.Audio.load(file);
          window.SWR.Audio.play();
          if (sub) {
            var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
            sub.textContent = tag + name;
          }
        }
      } catch (e) {
        if (sub) sub.textContent = 'tap a song to start';
        console.warn('swr auto-start failed:', e);
      }
      overlay.classList.add('hide');
      setTimeout(function(){ overlay.remove(); }, 600);
    }
    overlay.addEventListener('click', start, { once: true });
    document.addEventListener('keydown', function(ev){
      if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();
  </script>
<script src="./last-song.js"></script>
  <script src="../lib/persist.client.js"></script>
  <script src="../lib/persist-fx.client.js"></script>
<script src="./temp-slider.js"></script>
</body>
