  <style>
    :root {
      --bg: #f4f4f4; --bg-2: #e8e8e8; --panel: #ffffff; --panel-2: #f0f0f0;
      --ink: #0a0a0a; --muted: #888; --line: #d0d0d0;
      --accent: #ff3d00;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    #app { display: grid; grid-template-columns: 200px minmax(0, 1fr) 220px; grid-template-rows: 48px 1fr 40px; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px;
      background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .head-title { display: flex; flex-direction: column; gap: 2px; line-height: 1; }
    .subtitle { font: 700 8px/1 ui-monospace; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); padding-left: 4px; }
    .v { font-weight: 900; font-size: 17px; color: var(--ink); letter-spacing: 0.18em; text-transform: uppercase;
      padding: 2px 4px; border: 1px solid var(--ink); background: var(--bg); line-height: 1; }
    .v small { margin-left: 6px; font-weight: 900; font-size: 9px;
      letter-spacing: 0.08em; padding: 1px 3px; border: 1px solid var(--accent); background: var(--accent); color: #fff; vertical-align: 1px; }
    .pill { font: 900 9px/1 ui-monospace; padding: 4px 8px; border: 1px solid var(--ink); color: var(--ink);
      letter-spacing: 0.12em; text-transform: uppercase; background: var(--bg); }
    .pill.ok { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .pill.live { background: var(--accent); color: #fff; border-color: var(--accent); animation: pillLive 0.9s steps(2) infinite; }
    @keyframes pillLive { 50% { background: #fff; color: var(--accent); } }
    .tbtn { background: var(--bg-2); color: var(--ink); border: 1px solid var(--ink); font: 10px/1 ui-monospace;
      letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 12px; cursor: pointer; }
    .tbtn:hover { background: var(--ink); color: var(--bg); }
    .tbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .spacer { flex: 1; }
    .meter { width: 160px; height: 20px; background: #fff; border: 1px solid var(--ink); }
    aside.lib, aside.layers { background: var(--panel); overflow-y: auto; border-top: 1px solid var(--line); }
    aside.lib { border-right: 1px solid var(--line); }
    aside.layers { border-left: 1px solid var(--line); }
    .head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .head h2 { margin: 0; font: 700 10px/1 ui-monospace; letter-spacing: 0.12em; text-transform: uppercase; flex: 1; }
    .body { padding: 6px; }
    #lib { display: grid; grid-template-columns: 1fr; gap: 4px; }
    .li { aspect-ratio: 1; background: #ddd; border: 1px solid var(--ink); position: relative; cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink); }
    .li img, .li video { width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(1) contrast(1.55); }
    .li .idx { position: absolute; top: 0; left: 0; font: 700 9px/1 ui-monospace; padding: 2px 4px;
      background: var(--bg); color: var(--ink); border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
      letter-spacing: 0.04em; z-index: 2; }
    .li .tag { position: absolute; top: 0; right: 0; font: 9px/1 ui-monospace; padding: 2px 4px; background: var(--ink); color: var(--bg); z-index: 2; }
    .li .nm { position: absolute; bottom: 0; left: 0; right: 0; padding: 2px 4px; font: 9px/1 ui-monospace; color: #fff; background: var(--ink); }
    .li .li-x { position: absolute; bottom: 0; right: 0; width: 16px; height: 16px; padding: 0;
      background: var(--accent); color: #fff; border: 0; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink);
      font: 700 12px/14px ui-monospace; cursor: pointer; z-index: 3; display: flex; align-items: center; justify-content: center; }
    .li .li-x:hover { background: var(--ink); color: var(--accent); }
    .li.li-user { outline: 2px solid var(--accent); outline-offset: -2px; }
    #layers { display: flex; flex-direction: column; gap: 0; }
    .l { background: var(--panel-2); border-bottom: 1px solid var(--ink); padding: 8px 10px 8px 14px; position: relative; }
    .l:first-child { border-top: 2px solid var(--ink); }
    .l::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent; }
    .l.sel { background: var(--ink); color: var(--bg); }
    .l.sel::before { background: var(--accent); }
    .l.sel .nm, .l.sel .react { color: var(--bg); }
    .l .lh { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .l .lh .n { font: 700 10px/1 ui-monospace; width: 18px; }
    .l .lh .nm { flex: 1; font: 9px/1 ui-monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .l .lh .x { background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; }
    .l .r { display: grid; grid-template-columns: 40px 1fr; gap: 4px; align-items: center; margin-top: 2px; }
    .l .r label { font: 8px/1 ui-monospace; text-transform: uppercase; letter-spacing: 0.08em; }
    .l .r select, .l .r input { background: transparent; border: 0; border-bottom: 1px solid currentColor; color: inherit;
      font: 9px/1 ui-monospace; padding: 2px 0; width: 100%; outline: none; }
    /* Focus rings — brutalist accent outline for keyboard nav */
    .tbtn:focus-visible, .pill:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; }
    .l.sel select:focus-visible, .l.sel input:focus-visible { outline-color: var(--bg); }
    .l .react { font: 8px/1 ui-monospace; color: var(--accent); margin-top: 3px; letter-spacing: 0.04em; }
    section.stage { position: relative; background: #fff; }
    /* Hard grid overlay — declared cells, doubled major axes, junction markers */
    #grid { position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.14) 1px, transparent 1px),
        linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
      background-size: 12.5% 12.5%, 12.5% 12.5%, 6.25% 6.25%, 6.25% 6.25%; }
    #grid::before { content: ""; position: absolute; inset: 0;
      background-image:
        radial-gradient(circle at 1px 1px, var(--ink) 1px, transparent 1.5px);
      background-size: 12.5% 12.5%;
      opacity: 0.55; }
    #frame { position: absolute; inset: 8px; pointer-events: none; border: 1px solid var(--ink); }
    #flash { position: absolute; inset: 0; pointer-events: none; background: var(--accent); opacity: 0; mix-blend-mode: multiply;
      will-change: opacity; }
    canvas { display: block; width: 100%; height: 100%; }
    footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px;
      background: var(--ink); color: var(--bg); border-top: 1px solid var(--ink); font: 9px/1 ui-monospace; letter-spacing: 0.08em; }
    .preset-chip { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 0;
      border: 1px solid var(--bg); }
    .preset-chip .preset-label { font-weight: 900; padding: 3px 5px; background: var(--accent); color: #fff; }
    .preset-chip .preset-name { font-weight: 900; letter-spacing: 0.16em; }
    .preset-chip .preset-vals { color: #b0b0b0; letter-spacing: 0.06em; }
    footer > .gc:not(:last-of-type) { padding-right: 16px; border-right: 1px solid #2a2a2a; }
    footer > .preset-chip { padding-right: 16px; }
    .bpm-readout { display: flex; align-items: center; gap: 6px; }
    .bpm-label { color: var(--accent); font-weight: 900; }
    .bpm-readout b { color: #fff; font-weight: 900; font-size: 10px; }
    /* Same specificity as .gc b below — bump to win regardless of source order */
    .gc.bpm-readout b { color: #fff; }
    .bpm-bar { position: relative; width: 60px; height: 6px; background: #2a2a2a; border: 1px solid #000; }
    .bpm-bar-ref { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--accent); }
    .bpm-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #fff; width: 0; transition: width 80ms linear; }
    .gc input { width: 80px; accent-color: var(--accent); }
    .gc b { color: var(--accent); }
    .led { width: 8px; height: 8px; background: #333; border: 1px solid #000; }
    .led.on { background: var(--accent); }
    a.nav { color: var(--bg); text-decoration: none; border: 1px solid var(--bg); padding: 4px 8px;
      font: 9px/1 ui-monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    a.nav:hover { background: var(--bg); color: var(--ink); }
    input[type=file] { display: none; }

    /* SWR watermark overlay */
    /* ---------- Responsive layout (mobile-first additions) ----------
       SWR-RESPONSIVE-MARKER
       Original desktop layout (grid-template-columns: 220px 1fr 240px,
       header in one row) is preserved. Below 720px viewport we collapse
       the 3-column grid to a single column, stack the canvas on top of
       the library + layers panels (each scrollable with a bounded
       height), and let the header wrap + scroll vertically. */
    #app { min-width: 0; }
    header { flex-wrap: wrap; max-height: 30vh; overflow-y: auto; min-width: 0; }
    header > * { min-width: 0; }
    header input, header select, header button { max-width: 100%; }
    aside.lib, aside.layers { min-width: 0; }
    footer { flex-wrap: wrap; max-height: 24vh; overflow-y: auto; min-width: 0; row-gap: 4px; }
    footer > * { min-width: 0; }
    @media (max-width: 720px) {
      #app {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto 1fr auto auto;
      }
      header { padding: 6px 10px; gap: 6px; max-height: 22vh; }
      .meter { width: 100px; }
      aside.lib, aside.layers { max-height: 30vh; }
      aside.lib { grid-row: 3; border-right: none; border-top: 1px solid var(--line); }
      aside.layers { grid-row: 4; border-left: none; border-top: 1px solid var(--line); }
      section.stage { grid-row: 2; min-height: 320px; }
      /* Tighten the new footer additions on narrow viewports — preset detail string + BPM bar shrink */
      .preset-chip .preset-vals { display: none; }
      .bpm-bar { width: 36px; }
    }

    /* ---------- Mobile icons-only header ----------
       SWR-MOBILE-HEADER-MARKER
       At <= 480px the header text labels collapse to glyphs to keep all
       14 controls reachable in one row (~41px tall, was 75-109px when
       wrapped to multiple rows). At > 480px the labels show normally —
       the desktop/tablet layout is unchanged.
       The data-icon attributes are inserted by the codemod's HTML
       pass; see the HEADER_ICON_INJECTIONS list for the per-control
       glyph mapping. */
    /* Stop the header from wrapping to multiple rows at phone widths —
       let it stay one tall row and use the icons. */
    @media (max-width: 480px) {
      header {
        flex-wrap: nowrap;
        max-height: 64px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 4px 8px;
        gap: 2px;
      }
      header > * { flex-shrink: 0; }
      header .spacer { display: none; }
      /* Hide the textual label of every data-icon control. The ::before
         pseudo carries the glyph. text-indent:-9999px is the standard
         "icon-only button" pattern and keeps the text in the DOM for
         screen readers + the .tbtn:hover color-state rules. */
      [data-icon] {
        text-indent: -9999px;
        position: relative;
        padding-left: 6px;
        padding-right: 6px;
        min-width: 0;
        font-size: 14px;
      }
      [data-icon]::before {
        content: attr(data-icon);
        text-indent: 0;
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1;
        pointer-events: none;
      }
      /* Auto-cycle's checkbox input is hidden by the original CSS; the
         label carries the text. We need to keep the checkbox + label
         behavior but the text label needs to swap to the icon. The
         label wraps a checkbox AND has data-icon set; the rule above
         handles the ::before, and we keep the checkbox visual via the
         existing :checked styles. */
      #meter { width: 60px !important; height: 18px; }
      /* rec-dur select: keep visible 3-char "30s" text */
      #rec-dur { text-indent: 0; padding: 4px 6px; min-width: 50px; }
      #rec-dur::before { display: none; }
      /* #time: keep as compact timestamp — the engine writes
         "0:00 / 0:00" into #time. At icons mode we hide the second
         half (after the slash) so only the elapsed time shows.
         "0:00 / 0:00" contains a literal " / " (space-slash-space)
         that we mask with a zero-width spacer and clip the rest. */
      #time {
        text-indent: 0;
        font-size: 11px;
        max-width: 50px;
        overflow: hidden;
        white-space: nowrap;
      }
      #time::before { display: none; }
      /* .v title: keep the engine name visible */
      .v { text-indent: 0; font-size: 14px; }
      .v::before { display: none; }
      /* subtitle: too long for narrow header — hide on mobile, wordmark chip carries identity */
      .subtitle { display: none; }
      /* .pill status: keep small text */
      .pill { text-indent: 0; padding: 2px 6px; }
      .pill::before { display: none; }
      /* The auto-cycle label carries text "auto-cycle" but it's a
         <label> wrapping a checkbox. We need its data-icon glyph to
         show while the checkbox stays usable. */
      label[data-icon] {
        padding: 4px 6px;
        text-indent: -9999px;
        position: relative;
      }
      label[data-icon]::before {
        content: attr(data-icon);
        text-indent: 0;
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1;
        pointer-events: none;
      }
      /* Beat/onset indicators are <span class="gc">beat <span class="led">.
         At icons mode the .gc text "beat"/"onset" is hidden (the LED
         dot already has its own data-icon glyph). The two header .gc
         elements have an inline style="font-size:10px" (from the
         engine's source markup) which would otherwise override our
         class rule, so we use !important here. */
      .gc { font-size: 0 !important; gap: 0; }
      .gc::before { display: none; }
      .gc .led { font-size: 0; }
      /* The select inside .gc (rec-dur) keeps its visible text — see
         the #rec-dur rules above. */
      /* Tighten the meter canvas — it eats 60px and we need the room
         for the actual primary controls. */
      /* At very narrow widths (≤ 380px) hide the meter entirely. It's
         a nice-to-have spectrum display; the play button + status
         are the primary signal. */
      @media (max-width: 380px) {
        #meter { display: none; }
      }
    }

    .swr-watermark {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 100px;
      opacity: 0.45;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: screen;
    }
    .swr-watermark img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
    }
  
    /* AUTO-START overlay (browser autoplay policy requires one user gesture) */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);
      cursor: pointer;
      transition: opacity 0.4s ease;
    }
    #swr-start .box {
      text-align: center; color: var(--ink);
      font-family: ui-monospace, monospace;
      padding: 28px 36px;
      border: 1px solid var(--r);
      background: rgba(0,0,0,0.65);
      box-shadow: 0 0 32px var(--r);
    }
    #swr-start .arrow { font-size: 56px; color: var(--r); line-height: 1; margin-bottom: 14px; }
    #swr-start .label { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink); }
    #swr-start .sub   { font-size: 9px;  letter-spacing: 0.18em; text-transform: uppercase; color: var(--g); margin-top: 8px; }
    #swr-start.hide { opacity: 0; pointer-events: none; }
    .li .rm { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px;
      background: rgba(0,0,0,0.6); color: var(--muted); border: none; border-radius: 2px;
      font: 11px/1 ui-monospace, monospace; cursor: pointer; padding: 0;
      opacity: 0; transition: opacity 0.1s, color 0.1s, background 0.1s; }
    .li:hover .rm { opacity: 1; }
    .li .rm:hover { color: var(--m); background: rgba(0,0,0,0.85); }
    .li .rm.rm-armed { color: #fff; background: var(--m); opacity: 1; }

  </style>

<body data-page="grid">
  <div id="app">
    <!-- SWR-HEADER-DATA-ICONS --><header>
      <div class="head-title"><div class="v">GRID <small>v3</small></div><span class="subtitle">monochrome hard cells · heavy posterize · snap to the beat</span></div>
      <span class="pill" id="status">idle</span>
      <button class="tbtn" id="load-song" data-icon="↑">Load song</button>
      <input type="file" id="song-input" accept="audio/*" />
      <button class="tbtn primary" id="play" disabled data-icon="▶">▶</button>
      <span id="time" style="font-size:10px;font-family:ui-monospace;">0:00 / 0:00</span>
      <canvas class="meter" id="meter" width="320" height="40"></canvas>
      <span class="spacer"></span><button class="tbtn" id="swr-keys-help-btn" title="Keyboard shortcuts (?)" style="font-family:ui-monospace,monospace;font-weight:700;min-width:24px;padding:5px 8px;line-height:1;position:relative;z-index:10001;">?</button>
      <span style="font:9px ui-monospace;display:flex;align-items:center;gap:4px;">BEAT <span class="led" id="beat-led" data-icon="●"></span></span>
      <span style="font:9px ui-monospace;display:flex;align-items:center;gap:4px;">ONSET <span class="led" id="onset-led" data-icon="●"></span></span>
            <select id="rec-format" class="swr-rec-extra-ctl-v2" style="font-size:9px; padding:3px 4px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:3px; font:9px ui-monospace;" title="Recording format">
        <option value="auto" selected>MP4 auto</option>
        <option value="mp4">MP4 (H.264)</option>
        <option value="webm">WebM (VP9)</option>
      </select>
      <select id="rec-fps" class="swr-rec-extra-ctl-v2" style="font-size:9px; padding:3px 4px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:3px; font:9px ui-monospace;" title="Recording frame rate">
        <option value="24">24fps</option>
        <option value="30" selected>30fps</option>
        <option value="60">60fps</option>
      </select>
      <select id="rec-quality" class="swr-rec-extra-ctl-v2" style="font-size:9px; padding:3px 4px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:3px; font:9px ui-monospace;" title="Recording quality (video bitrate)">
        <option value="low">3 Mbps</option>
        <option value="med">6 Mbps</option>
        <option value="high" selected>12 Mbps</option>
      </select>
      <select id="rec-dur" style="font-size:9px; padding:3px 4px; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-radius:3px; font:9px ui-monospace;" title="Auto-stop recording after N seconds">
        <option value="0">manual</option>
        <option value="10">10s</option>
        <option value="15">15s</option>
        <option value="30" selected>30s</option>
        <option value="60">60s</option>
        <option value="song">song</option>
      </select>
      <label style="display:flex;align-items:center;gap:4px;font:9px ui-monospace;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;" title="When on, the grid re-arranges every 2 beats" data-icon="↻">
        <input type="checkbox" id="auto-cycle" checked />AUTO-CYCLE
      </label>
      <button class="tbtn danger" id="rec" disabled data-icon="⏺">● REC</button>
      <a class="nav" href="smoke.html">→ smoke</a>
    </header>
    <aside class="lib">
      <div class="head"><h2>Library</h2><button class="tbtn" id="add" style="padding:4px 8px;">+</button><button class="tbtn" id="reset-state" style="padding:4px 8px;" title="Reset local state (built-ins re-seed on next visit)">↺</button>
        <input type="file" id="asset-input" multiple accept="video/*,image/*,image/gif" /></div>
      <div class="body"><div id="lib"></div></div>
    </aside>
    <section class="stage">
      <canvas id="render"></canvas>

  <script>
  (function(){
    var DEFAULT_SONG = '../audios/grid.mp3';
    var overlay = document.getElementById('swr-start');
    var sub = document.getElementById('swr-start-sub');
    var fired = false;

    // Can we autoplay without a user gesture? Modern browsers
    // (Chrome 94+, Safari 16.4+, Firefox 121+) relax autoplay for
    // sites the user has interacted with before. The MediaSession
    // API surfaces a "activation hint" — non-empty activation
    // means the user has clicked/tapped/typed since the page loaded,
    // and we can autoplay. On pages where this is true, run start()
    // immediately and skip the overlay.
    var canAutoplay = false;
    try {
      if (navigator.userActivation && navigator.userActivation.isActive) {
        canAutoplay = true;
      }
    } catch (_) {}

    async function start() {
      if (fired) return;
      fired = true;
      var succeeded = false;
      try {
        // Prefer the user's last-loaded song (from engine.html IDB),
        // fall back to the per-page bundled audio.
        var picked = window.SWR_PICK_DEFAULT_SONG
          ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
          : null;
        if (!picked) throw new Error('no song source available');
        var blob = picked.blob;
        var name = picked.name;
        var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
        if (window.SWR && window.SWR.Audio) {
          window.SWR.Audio.load(file);
          await window.SWR.Audio.play();
          if (sub) {
            var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
            sub.textContent = tag + name;
          }
        }
        succeeded = true;
      } catch (e) {
        // Failure path: leave the overlay visible so the user can
        // click again. Reset the fired flag so the click handler
        // can fire a fresh attempt. Without this, a single failed
        // autoplay leaves the user stranded — the overlay disappears
        // and the "tap to start" hint vanishes with it. This is the
        // exact "media is not loading" symptom we were trying to
        // avoid.
        fired = false;
        if (sub) sub.textContent = 'tap "load song" to start';
        console.warn('swr auto-start failed:', e);
      }
      // Only hide + remove the overlay on success. The overlay is
      // the manual fallback for browsers that still block autoplay;
      // removing it on failure strands the user with no retry path.
      if (succeeded) {
        overlay.classList.add('hide');
        setTimeout(function(){ overlay.remove(); }, 600);
      }
    }

    // Track a one-shot user gesture anywhere on the page to arm the
    // audio for next time. Once armed, the overlay can autoplay.
    document.addEventListener('pointerdown', function arm() {
      try { localStorage.setItem('swr.audio.armed', '1'); } catch (_) {}
    }, { once: true, capture: true });

    if (canAutoplay || (function () {
      try { return localStorage.getItem('swr.audio.armed') === '1'; }
      catch (_) { return false; }
    })()) {
      // Try to autoplay immediately — if the browser blocks, the
      // overlay stays visible (start()'s catch path) and the user
      // can click it manually. Either way, the engine renders
      // visual content on enter via the normal RAF loop.
      //
      // Wait for window.SWR_PICK_DEFAULT_SONG to be defined —
      // last-song.js (which defines it) loads AFTER this inline
      // script. Poll until it's there, then fire. This avoids the
      // race where the auto-start fires before last-song.js has
      // registered the helper.
      function waitForPick() {
        if (window.SWR_PICK_DEFAULT_SONG) {
          start();
          return;
        }
        var tries = 0;
        var iv = setInterval(function() {
          tries++;
          if (window.SWR_PICK_DEFAULT_SONG) {
            clearInterval(iv);
            start();
          } else if (tries > 50) {  // ~5s timeout
            clearInterval(iv);
            // Don't fire — overlay stays as fallback.
          }
        }, 100);
      }
      waitForPick();
    }

    // play() resolved), keep the overlay visible until the user
    // explicitly hides it. The overlay remains the manual fallback
    // for browsers that still block autoplay.
    overlay.addEventListener('click', function manualStart() {
      if (!fired) start();
    });
    document.addEventListener('keydown', function(ev){
      if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
    }, { once: true });
  })();
