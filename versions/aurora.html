  <style>
    :root {
      --bg: #05030a; --bg-2: #0a0612; --panel: #0e0818; --panel-2: #150b22;
      --ink: #f5e9ff; --muted: #8a7aa0; --line: #2a1d3e;
      --m: #FFB3BA; --c: #B3FFD9; --y: #D4B3FF; --g: #BAE1FF;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { display: grid; grid-template-columns: 220px minmax(0, 1fr) 240px; grid-template-rows: 44px 1fr 36px; height: 100vh; }
    header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px;
      background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .v { font-weight: 700; letter-spacing: 0.16em; color: var(--m); text-shadow: 0 0 8px var(--m); }
    .v small { color: var(--c); margin-left: 6px; text-shadow: 0 0 6px var(--c); font-weight: 400; }
    .pill { font-size: 9px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
    .pill.ok { color: var(--g); border-color: var(--g); }
    .pill.live { color: var(--y); border-color: var(--y); animation: blink 0.4s infinite alternate; }
    @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    .tbtn { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font: 10px/1 ui-monospace;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 12px; border-radius: 4px; cursor: pointer; }
    .tbtn:hover { border-color: var(--m); color: var(--m); }
    .tbtn.primary { background: var(--m); color: #000; border-color: var(--m); font-weight: 700; }
    .tbtn.primary:hover { background: var(--c); border-color: var(--c); }
    .spacer { flex: 1; }
    .meter { width: 160px; height: 16px; background: #0a0612; border: 1px solid var(--line); border-radius: 3px; display: block; }
    aside.lib, aside.layers { background: var(--panel); overflow-y: auto; }
    aside.lib { border-right: 1px solid var(--line); }
    aside.layers { border-left: 1px solid var(--line); }
    .head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .head h2 { margin: 0; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); flex: 1; }
    .body { padding: 6px; }
    #lib { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .li { aspect-ratio: 1; background: var(--bg-2); border: 1px solid var(--line); border-radius: 3px;
      overflow: hidden; position: relative; cursor: pointer; transition: border-color 0.1s; }
    .li:hover { border-color: var(--c); }
    .li img, .li video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .li .tag { position: absolute; top: 2px; left: 2px; font-size: 7px; padding: 1px 3px; background: var(--m);
      color: #000; border-radius: 1px; letter-spacing: 0.08em; }
    .li .nm { position: absolute; bottom: 0; left: 0; right: 0; padding: 1px 3px; font-size: 7px; color: #fff;
      background: linear-gradient(transparent, rgba(0,0,0,0.8)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #layers { display: flex; flex-direction: column; gap: 4px; }
    .l { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
    .l.sel { border-color: var(--m); box-shadow: 0 0 0 1px var(--m); }
    .l .lh { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .l .lh .n { font-size: 9px; color: var(--muted); width: 14px; }
    .l .lh .nm { flex: 1; font-size: 10px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .l .lh .x { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; }
    .l .lh .x:hover { color: var(--m); }
    .l .r { display: grid; grid-template-columns: 36px 1fr; gap: 4px; align-items: center; margin-top: 2px; }
    .l .r label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    .l .r select, .l .r input { background: var(--bg); border: 1px solid var(--line); color: var(--ink);
      font: 9px ui-monospace; padding: 2px 3px; border-radius: 2px; width: 100%; }
    .l .react { font-size: 8px; color: var(--c); letter-spacing: 0.04em; margin-top: 3px; }
    section.stage { position: relative; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #flash { position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at center, rgba(255,45,138,0.5), transparent 60%);
      opacity: 0; mix-blend-mode: screen; }
    footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 14px;
      background: var(--bg-2); border-top: 1px solid var(--line); font-size: 9px; color: var(--muted); letter-spacing: 0.08em; }
    .gc { display: flex; align-items: center; gap: 6px; }
    .gc input { width: 80px; }
    .gc b { color: var(--c); min-width: 26px; text-align: right; }
    .led { width: 8px; height: 8px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
    .led.on { background: var(--m); box-shadow: 0 0 8px var(--m); }
    a.nav { color: var(--c); text-decoration: none; border: none; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; }
    a.nav:hover { color: var(--m); }
    input[type=file] { display: none; }

    /* SWR watermark overlay */
    /* ---------- Responsive layout (mobile-first additions) ----------
       SWR-RESPONSIVE-MARKER
       Original desktop layout (grid-template-columns: 220px 1fr 240px,
       header in one row) is preserved. Below 720px viewport we collapse
       the 3-column grid to a single column, stack the canvas on top of
       the library + layers panels (each scrollable with a bounded
       height), and let the header wrap + scroll vertically. */
    #app { min-width: 0; }
    header { flex-wrap: wrap; max-height: 30vh; overflow-y: auto; min-width: 0; }
    header > * { min-width: 0; }
    header input, header select, header button { max-width: 100%; }
    aside.lib, aside.layers { min-width: 0; }
    footer { flex-wrap: wrap; max-height: 24vh; overflow-y: auto; min-width: 0; row-gap: 4px; }
    footer > * { min-width: 0; }
    @media (max-width: 720px) {
      #app {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto 1fr auto auto;
      }
      header { padding: 6px 10px; gap: 6px; max-height: 22vh; }
      .meter { width: 100px; }
      aside.lib, aside.layers { max-height: 30vh; }
      aside.lib { grid-row: 3; border-right: none; border-top: 1px solid var(--line); }
      aside.layers { grid-row: 4; border-left: none; border-top: 1px solid var(--line); }
      section.stage { grid-row: 2; min-height: 320px; }
    }

    /* ---------- Mobile icons-only header ----------
       SWR-MOBILE-HEADER-MARKER
       At <= 480px the header text labels collapse to glyphs to keep all
       14 controls reachable in one row (~41px tall, was 75-109px when
       wrapped to multiple rows). At > 480px the labels show normally —
       the desktop/tablet layout is unchanged.
       The data-icon attributes are inserted by the codemod's HTML
       pass; see the HEADER_ICON_INJECTIONS list for the per-control
       glyph mapping. */
    /* Stop the header from wrapping to multiple rows at phone widths —
       let it stay one tall row and use the icons. */
    @media (max-width: 480px) {
      header {
        flex-wrap: nowrap;
        max-height: 64px;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 4px 8px;
        gap: 2px;
      }
      header > * { flex-shrink: 0; }
      header .spacer { display: none; }
      /* Hide the textual label of every data-icon control. The ::before
         pseudo carries the glyph. text-indent:-9999px is the standard
         "icon-only button" pattern and keeps the text in the DOM for
         screen readers + the .tbtn:hover color-state rules. */
      [data-icon] {
        text-indent: -9999px;
        position: relative;
        padding-left: 6px;
        padding-right: 6px;
        min-width: 0;
        font-size: 14px;
      }
      [data-icon]::before {
        content: attr(data-icon);
        text-indent: 0;
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1;
        pointer-events: none;
      }
      /* Auto-cycle's checkbox input is hidden by the original CSS; the
         label carries the text. We need to keep the checkbox + label
         behavior but the text label needs to swap to the icon. The
         label wraps a checkbox AND has data-icon set; the rule above
         handles the ::before, and we keep the checkbox visual via the
         existing :checked styles. */
      #meter { width: 60px !important; height: 18px; }
      /* rec-dur select: keep visible 3-char "30s" text */
      #rec-dur { text-indent: 0; padding: 4px 6px; min-width: 50px; }
      #rec-dur::before { display: none; }
      /* #time: keep as compact timestamp — the engine writes
         "0:00 / 0:00" into #time. At icons mode we hide the second
         half (after the slash) so only the elapsed time shows.
         "0:00 / 0:00" contains a literal " / " (space-slash-space)
         that we mask with a zero-width spacer and clip the rest. */
      #time {
        text-indent: 0;
        font-size: 11px;
        max-width: 50px;
        overflow: hidden;
        white-space: nowrap;
      }
      #time::before { display: none; }
      /* .v title: keep the engine name visible */
      .v { text-indent: 0; font-size: 14px; }
      .v::before { display: none; }
      /* .pill status: keep small text */
      .pill { text-indent: 0; padding: 2px 6px; }
      .pill::before { display: none; }
      /* The auto-cycle label carries text "auto-cycle" but it's a
         <label> wrapping a checkbox. We need its data-icon glyph to
         show while the checkbox stays usable. */
      label[data-icon] {
        padding: 4px 6px;
        text-indent: -9999px;
        position: relative;
      }
      label[data-icon]::before {
        content: attr(data-icon);
        text-indent: 0;
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1;
        pointer-events: none;
      }
      /* Beat/onset indicators are <span class="gc">beat <span class="led">.
         At icons mode the .gc text "beat"/"onset" is hidden (the LED
         dot already has its own data-icon glyph). The two header .gc
         elements have an inline style="font-size:10px" (from the
         engine's source markup) which would otherwise override our
         class rule, so we use !important here. */
      .gc { font-size: 0 !important; gap: 0; }
      .gc::before { display: none; }
      .gc .led { font-size: 0; }
      /* The select inside .gc (rec-dur) keeps its visible text — see
         the #rec-dur rules above. */
      /* Tighten the meter canvas — it eats 60px and we need the room
         for the actual primary controls. */
      /* At very narrow widths (≤ 380px) hide the meter entirely. It's
         a nice-to-have spectrum display; the play button + status
         are the primary signal. */
      @media (max-width: 380px) {
        #meter { display: none; }
      }
    }

    .swr-watermark {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 100px;
      opacity: 0.45;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: screen;
    }
    .swr-watermark img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
    }

    /* AUTO-START overlay (browser autoplay policy requires one user gesture) */
    #swr-start {
      position: fixed; inset: 0; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.78);
      cursor: pointer;
      transition: opacity 0.4s ease;
    }
    #swr-start .box {
      text-align: center; color: var(--ink);
      font-family: ui-monospace, monospace;
      padding: 28px 36px;
      border: 1px solid #ff0066;
      background: rgba(20,0,10,0.65);
      box-shadow: 0 0 32px rgba(255,0,102,0.25);
    }
    #swr-start .arrow { font-size: 56px; color: #ff0066; line-height: 1; margin-bottom: 14px; }
    #swr-start .label { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink); }
    #swr-start .sub   { font-size: 9px;  letter-spacing: 0.18em; text-transform: uppercase; color: #00ff66; margin-top: 8px; }
    #swr-start.hide { opacity: 0; pointer-events: none; }
  </style>

        <option value="0">manual</option>

      <span class="gc">sens <input type="range" id="sens" min="0.2" max="3" step="0.05" value="1.2" /> <b id="sens-v">1.20</b></span>

  <script>
    // Seeded randomness: routed through SWR_GENOPS so deterministic mode
    // reproduces asset selection as well as parameters. Falls back when absent.
    const _rnd = () => (window.SWR_GENOPS ? window.SWR_GENOPS.rand() : Math.random());
    function __shuffle_once(key, arr) {
      if (!__shuffle_once._cache || __shuffle_once._key !== key) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(_rnd() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        __shuffle_once._cache = a;
        __shuffle_once._key = key;
      }
      __shuffle_once._cache.push(__shuffle_once._cache.shift());
      return __shuffle_once._cache;
    }

  (() => {
    const $ = (id) => document.getElementById(id);
    const stage = $('render');
    const ctx = stage.getContext('2d', { alpha: false });
    const meter = $('meter').getContext('2d');
    let W, H;

    // === AUDIO ===
    const A = { ctx: null, an: null, src: null, el: null, gain: null,
      fft: null, time: null,
      feat: { bass:0,mid:0,treble:0,air:0,sub:0,rms:0,centroid:0,beat:0,onset:0,beatPulse:false,onsetPulse:false,bpm:0 },
      // Cached slider values — read once per slider input, not once
      // per audio frame. Avoids forcing layout every audio sample.
      params: { sens: 1.5, gate: 1.2, decay: 0.7 },
      hist: { prev:null, bassAvg:0, fluxAvg:0 }, beats: [], playing: false,
      unlock() { if (this.ctx) return; this.ctx = new (window.AudioContext||window.webkitAudioContext)();
        this.an = this.ctx.createAnalyser(); this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0.6;
        this.fft = new Uint8Array(this.an.frequencyBinCount);
        this.time = new Uint8Array(this.an.fftSize);
        this.gain = this.ctx.createGain(); this.gain.gain.value = 1;
        this.an.connect(this.gain); this.gain.connect(this.ctx.destination);
        
      setStatus('ready', 'ok'); },
      load(file) { this.unlock(); if (this.src) try{this.src.disconnect();}catch{}
        if (this.el) { this.el.pause(); this.el.src=''; }
        // Free the previous Blob URL before allocating a new one.
        if (this.el && this.el.__swr_blob_url) {
          try { URL.revokeObjectURL(this.el.__swr_blob_url); } catch (_) {}
        }
        this.el = document.createElement('audio'); this.el.crossOrigin='anonymous';
        this.el.__swr_blob_url = URL.createObjectURL(file);
        this.el.src = this.el.__swr_blob_url; this.el.preload='auto';
        this.el.addEventListener('ended', ()=>{A.playing=false;$('play').textContent='▶';});
        this.el.addEventListener('timeupdate', ()=>{
          const t=this.el.currentTime,d=this.el.duration||0;
          $('time').textContent = fmt(t)+' / '+fmt(d); });
        this.src = this.ctx.createMediaElementSource(this.el);
        this.src.connect(this.an);
        this.hist = { prev:null, bassAvg:0, fluxAvg:0 }; this.beats=[]; this.feat.bpm=0;
        $('play').disabled=false; $('rec').disabled=false; },
      play() { this.unlock(); if (this.ctx.state==='suspended') this.ctx.resume();
        this.el.play(); this.playing=true; $('play').textContent='❚❚'; },
      pause() { if (this.el) this.el.pause(); this.playing=false; $('play').textContent='▶'; },
      sample() { if (!this.an) return;
        this.an.getByteFrequencyData(this.fft);
        this.an.getByteTimeDomainData(this.time);
        const N=this.fft.length, sr=this.ctx.sampleRate, hz=sr/this.an.fftSize;
        const r = { sub:[1,Math.floor(60/hz)], bass:[Math.floor(60/hz),Math.floor(250/hz)],
          mid:[Math.floor(250/hz),Math.floor(2000/hz)], treble:[Math.floor(2000/hz),Math.floor(6000/hz)],
          air:[Math.floor(6000/hz),N-1] };
        const mean = (lo,hi) => { let s=0,c=0; for (let i=lo;i<=hi&&i<N;i++){s+=this.fft[i];c++;} return s/c/255; };
        this.feat.sub=mean(r.sub[0],r.sub[1]); this.feat.bass=mean(r.bass[0],r.bass[1]);
        this.feat.mid=mean(r.mid[0],r.mid[1]); this.feat.treble=mean(r.treble[0],r.treble[1]);
        this.feat.air=mean(r.air[0],r.air[1]);
        let rms=0; for (let i=0;i<this.time.length;i++){const v=(this.time[i]-128)/128;rms+=v*v;}
        this.feat.rms = Math.sqrt(rms/this.time.length);
        let num=0,den=0; for (let i=1;i<N;i++){num+=i*this.fft[i];den+=this.fft[i];}
        this.feat.centroid = den>0?num/den/N:0;

      recording: false,
      mime: 'video/webm',
      mediaDest: null,
      autoStopAt: 0,
      autoStopTimer: null,
      autoStopAt: 0,
      autoStopTimer: null,
      start() {
        if (!A.el) { setStatus('load a song first', ''); return; }
        const fps = 30;
        const vstream = stage.captureStream(fps);
        const dest = A.ctx.createMediaStreamDestination();
        this.mediaDest = dest;
        A.an.connect(dest);
        const tracks = [...vstream.getVideoTracks(), ...dest.stream.getAudioTracks()];
        const stream = new MediaStream(tracks);
        const mime = [
          'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
          'video/mp4;codecs=avc1,mp4a.40.2',
          'video/mp4;codecs=avc1',
          'video/mp4',
          'video/webm;codecs=vp9,opus',
          'video/webm;codecs=vp8,opus',
          'video/webm',
        ].find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
        this.mime = mime;
        this.rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
        this.chunks = [];
        this.rec.ondataavailable = (e) => { if (e.data.size) this.chunks.push(e.data); };
        this.rec.onstop = () => this._save();
        this.rec.start(500);
        this.recording = true;
        const durSel = $('rec-dur') ? $('rec-dur').value : '0';
        let durMs = 0;
        if (durSel === 'song' && A.el && A.el.duration) {
          durMs = Math.max(0, (A.el.duration - A.el.currentTime) * 1000);
        } else if (durSel !== '0' && durSel !== 'manual') {
          durMs = parseInt(durSel) * 1000;
        }
        this.autoStopAt = durMs > 0 ? Date.now() + durMs : 0;
        $('rec').classList.add('live');
        $('rec').textContent = '■ STOP';
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        if (this.autoStopAt > 0) {
          const sec = Math.round((this.autoStopAt - Date.now()) / 1000);
          setStatus('recording · ' + ext.toUpperCase() + ' · ' + sec + 's', 'live');
          this.autoStopTimer = setTimeout(() => { if (this.recording) Recorder.stop(); }, this.autoStopAt - Date.now());
        } else {
          setStatus('recording · ' + ext.toUpperCase(), 'live');
        }
      },
      stop() {
        if (!this.rec) return;
        if (this.autoStopTimer) { clearTimeout(this.autoStopTimer); this.autoStopTimer = null; }
        this.rec.stop();
        this.recording = false;
        $('rec').classList.remove('live');
        $('rec').textContent = '● REC';
        setStatus('rendering…', '');
        if (this.mediaDest) {
          try { A.an.disconnect(this.mediaDest); } catch {}
          this.mediaDest = null;
        }
      },
      _save() {
        const blob = new Blob(this.chunks, { type: this.mime });
        const a = document.createElement('a');
        const recUrl = URL.createObjectURL(blob);
        a.href = recUrl;
        const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        const ext = this.mime.startsWith('video/mp4') ? 'mp4' : 'webm';
        a.download = 'sainted-word-' + ts + '.' + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Free the download URL once the click has been dispatched.
        setTimeout(() => { try { URL.revokeObjectURL(recUrl); } catch (_) {} }, 1000);
        setStatus('exported · ' + ext.toUpperCase(), 'ok');
      },
    };
        // Invalidate the per-layer cache whenever the page rebuilds.
    if (Layers && typeof Layers.render === 'function') {
      const __r = Layers.render.bind(Layers);
      Layers.render = function () { try { SWR_RENDER.invalidate(); } catch (_) {} return __r(); };
    }
    window.SWR = { Audio: A, Library: Lib, Layers, Recorder, get stage() { return stage; }, get ctx() { return ctx; } };
  })();

  <div id="swr-start" role="button" aria-label="Start Sainted Word Records">
    <div class="box">
      <div class="arrow">▶</div>
      <div class="label">Drop a song</div>
      <div class="sub" id="swr-start-sub">Radio + Video</div>
    </div>
  </div>
<script>
(function(){
  var DEFAULT_SONG = '../library/audio/loop-pulse.wav';
  var overlay = document.getElementById('swr-start');
  var sub = document.getElementById('swr-start-sub');
  var fired = false;
  async function start() {
    if (fired) return;
    fired = true;
    try {
      // Prefer the user's last-loaded song (from engine.html IDB),
      // fall back to the per-page hardcoded DEFAULT_SONG.
      var picked = window.SWR_PICK_DEFAULT_SONG
        ? await window.SWR_PICK_DEFAULT_SONG(DEFAULT_SONG)
        : null;
      if (!picked) throw new Error('no song source available');
      var blob = picked.blob;
      var name = picked.name;
      var file = new File([blob], name, { type: blob.type || picked.type || 'audio/mpeg' });
      if (window.SWR && window.SWR.Audio) {
        window.SWR.Audio.load(file);
        window.SWR.Audio.play();
        if (sub) {
          var tag = picked.source === 'saved' ? 'last song · ' : 'playing · ';
          sub.textContent = tag + name;
        }
      }
    } catch (e) {
      if (sub) sub.textContent = 'tap "load song" to start';
      console.warn('swr auto-start failed:', e);
    }
    overlay.classList.add('hide');
    setTimeout(function(){ overlay.remove(); }, 600);
  }
  overlay.addEventListener('click', start, { once: true });
  document.addEventListener('keydown', function(ev){
    if (!fired && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); start(); }
  }, { once: true });
})();
</script>
