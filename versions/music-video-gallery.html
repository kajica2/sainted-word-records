  <style>
    /* --- Stage --- */
    .music-video-stage {
      position: relative;
      perspective: 1600px;
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Each video --- */
    .music-video {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transform: rotateY(90deg);
      transform-origin: center;
      transition:
        transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1),
        opacity 0.6s ease,
        visibility 0s linear 0.6s;
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .music-video.is-active {
      opacity: 1;
      visibility: visible;
      transform: rotateY(0deg);
      transition-delay: 0s;
      position: relative; /* so it holds the height */
    }

    /* Direction-aware flips */
    .music-video.leaving-left {
      transform: rotateY(-90deg);
      opacity: 0;
    }

    .music-video.leaving-right {
      transform: rotateY(90deg);
      opacity: 0;
    }

    .music-video video {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* --- Nav bar --- */
    .music-video-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 2rem;
      padding: 0 1rem;
    }

    .music-video-nav button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: #111;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font: inherit;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .music-video-nav button:hover:not(:disabled) {
      background: #333;
    }

    .music-video-nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .music-video-nav .counter {
      font-variant-numeric: tabular-nums;
      opacity: 0.7;
    }

    @media (prefers-reduced-motion: reduce) {
      .music-video {
        transition: opacity 0.2s ease, visibility 0s linear 0.2s;
        transform: none !important;
      }
      .music-video.is-active {
        transform: none !important;
      }
    }
    .record-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(10, 10, 16, 0.62);
      color: #fff;
      font: 600 12px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 999px;
      backdrop-filter: blur(6px);
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 120ms ease;
    }
    .record-btn:hover { background: rgba(20, 20, 28, 0.78); border-color: rgba(255, 107, 26, 0.45); }
    .record-btn:active { transform: scale(0.97); }
    .record-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #ff453a;
      box-shadow: 0 0 8px rgba(255, 69, 58, 0.65);
    }
    .record-btn[data-state="recording"] {
      background: rgba(255, 69, 58, 0.18);
      border-color: rgba(255, 69, 58, 0.75);
    }
    .record-btn[data-state="recording"] .dot {
      animation: record-pulse 900ms ease-in-out infinite;
    }
    .record-btn[data-state="saving"] { opacity: 0.7; cursor: progress; }
    .record-btn[data-state="saving"] .dot { background: #ffb86b; box-shadow: none; animation: none; }
    .record-btn[data-state="unsupported"] { display: none; }
    @keyframes record-pulse {
      0%, 100% { transform: scale(1);   box-shadow: 0 0 8px rgba(255,69,58,0.65); }
      50%      { transform: scale(1.4); box-shadow: 0 0 14px rgba(255,69,58,0.95); }
    }
  </style>

<body>
  <swr-nav></swr-nav>
  <header class="container">
    <h1>Music videos</h1>
    <p class="muted">Click <strong>Next</strong> / <strong>Previous</strong> or use the arrow keys to flip through the videos.</p>
  </header>

  <main class="container music-video-stage">

    <section class="music-video is-active" data-title="Neon">
      <h2>Neon</h2>
      <video controls playsinline>
        <source src="/videos/neon.mp4" type="video/mp4" />
      </video>
      <button type="button" class="record-btn" aria-label="Record this video">

        <span class="record-btn__label">Record</span>
      </button>
    </section>

    <section class="music-video" data-title="Grid">
      <h2>Grid</h2>
      <video controls playsinline>
        <source src="/videos/grid.mp4" type="video/mp4" />
      </video>
      <button type="button" class="record-btn" aria-label="Record this video">
        <span class="dot" aria-hidden="true"></span>
        <span class="record-btn__label">Record</span>
      </button>
    </section>

    <section class="music-video" data-title="Film">
      <h2>Film</h2>
      <video controls playsinline>
        <source src="/videos/film.mp4" type="video/mp4" />
      </video>
      <button type="button" class="record-btn" aria-label="Record this video">
        <span class="dot" aria-hidden="true"></span>
        <span class="record-btn__label">Record</span>
      </button>
    </section>

    <section class="music-video" data-title="Reedbed — Watercolor">
      <h2>Reedbed — Watercolor</h2>
      <video autoplay loop muted playsinline poster="/videos/reedbed-watercolor.jpg">
        <source src="/videos/reedbed-watercolor.mp4" type="video/mp4" />
      </video>
      <button type="button" class="record-btn" aria-label="Record this video">
        <span class="dot" aria-hidden="true"></span>
        <span class="record-btn__label">Record</span>
      </button>
    </section>

    <section class="music-video" data-title="Reedbed — Bokeh">
      <h2>Reedbed — Bokeh</h2>
      <video autoplay loop muted playsinline poster="/videos/reedbed-bokeh.jpg">
        <source src="/videos/reedbed-bokeh.mp4" type="video/mp4" />
      </video>
      <button type="button" class="record-btn" aria-label="Record this video">
        <span class="dot" aria-hidden="true"></span>
        <span class="record-btn__label">Record</span>
      </button>
    </section>

    <section class="music-video" data-title="Stage take">
      <h2>Stage take</h2>
      <video controls playsinline>
        <source src="/videos/stage-take-2026-09-29.mp4" type="video/mp4" />
      </video>
      <button type="button" class="record-btn" aria-label="Record this video">
        <span class="dot" aria-hidden="true"></span>
        <span class="record-btn__label">Record</span>
      </button>
    </section>

  </main>

  <nav class="container music-video-nav" aria-label="Music video navigation">
    <button class="nav-prev" type="button">
      <span class="arrow">←</span>
      <span class="label">Previous</span>
    </button>
    <span class="counter"><span id="current-index">1</span> / <span id="total-count">6</span></span>
    <button class="nav-next" type="button">
      <span class="label">Next</span>
      <span class="arrow">→</span>
    </button>
  </nav>

  <script>
  (function () {
    const videos = Array.from(document.querySelectorAll('.music-video'));
    const prevBtn = document.querySelector('.nav-prev');
    const nextBtn = document.querySelector('.nav-next');
    const indexEl = document.getElementById('current-index');
    const totalEl = document.getElementById('total-count');

    if (!videos.length || !prevBtn || !nextBtn) return;

    let current = videos.findIndex(v => v.classList.contains('is-active'));
    if (current === -1) current = 0;
    videos.forEach((v, i) => v.classList.toggle('is-active', i === current));
    if (totalEl) totalEl.textContent = videos.length;

    function pauseAllExcept(active) {
      videos.forEach(v => {
        if (v === active) return;
        v.querySelectorAll('video').forEach(vid => {
          vid.pause();
          vid.currentTime = 0;
        });
      });
    }

    function show(nextIndex, direction) {
      if (nextIndex < 0 || nextIndex >= videos.length || nextIndex === current) return;

      const oldEl = videos[current];
      const newEl = videos[nextIndex];

      // Prepare new one off-screen in the correct direction
      newEl.classList.remove('leaving-left', 'leaving-right');
      newEl.style.transform =
        direction === 'next' ? 'rotateY(90deg)' : 'rotateY(-90deg)';

      // Force reflow so the transition runs
      void newEl.offsetWidth;

      // Old one flips out
      oldEl.classList.remove('is-active');
      oldEl.classList.add(direction === 'next' ? 'leaving-left' : 'leaving-right');

      // New one flips in
      newEl.classList.add('is-active');
      newEl.style.transform = '';

      // Cleanup after transition
      setTimeout(() => {
        oldEl.classList.remove('leaving-left', 'leaving-right');
      }, 650);

      current = nextIndex;
      if (indexEl) indexEl.textContent = current + 1;
      pauseAllExcept(newEl);

      // Update URL hash so back/forward works
      history.replaceState(null, '', '#video-' + (current + 1));
    }

    prevBtn.addEventListener('click', () => show(current - 1, 'prev'));
    nextBtn.addEventListener('click', () => show(current + 1, 'next'));

    // Keyboard
    document.addEventListener('keydown', e => {
      if (e.target.matches('input, textarea, select')) return;
      if (e.key === 'ArrowLeft') show(current - 1, 'prev');
      if (e.key === 'ArrowRight') show(current + 1, 'next');
    });

    // Touch swipe
    let touchStartX = null;
    const stage = document.querySelector('.music-video-stage');
    if (stage) {
      stage.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
      }, { passive: true });
      stage.addEventListener('touchend', e => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
          if (dx < 0) show(current + 1, 'next');
          else show(current - 1, 'prev');
        }
        touchStartX = null;
      }, { passive: true });
    }

    // Deep link: /versions/music_video.html#video-2
    const hashMatch = location.hash.match(/^#video-(\d+)$/);
    if (hashMatch) {
      const target = Math.min(Math.max(parseInt(hashMatch[1], 10) - 1, 0), videos.length - 1);
      if (target !== current) show(target, target > current ? 'next' : 'prev');
    }
  })();
  </script>

  <script>
  // Per-tile recorder. Each <button class="record-btn"> captures the
  // <video> in its <section> via captureStream() + MediaRecorder and
  // downloads a WebM on stop. Only one recording is active at a time;
  // starting another stops the previous one cleanly.
  (function () {
    if (typeof MediaRecorder === 'undefined') {
      document.querySelectorAll('.record-btn').forEach(b => b.setAttribute('data-state', 'unsupported'));
      return;
    }

    const supports = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : (MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : 'video/webm');

    let active = null; // { btn, rec, chunks, name, stopped, downloadUrl }

    function pickMimeForVideo(video) {
      // captureStream() is widely supported on <video>; cross-origin media
      // returns a CORS-tainted stream. These videos are same-origin (/videos/*),
      // so captureStream() gives a clean stream.
      if (typeof video.captureStream === 'function') return video.captureStream();
      if (typeof video.mozCaptureStream === 'function') return video.mozCaptureStream();
      return null;
    }

    function safeTitle(section) {
      const t = (section.dataset.title || 'video').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return t || 'video';
    }

    function stopActive(reason) {
      if (!active) return;
      const { rec, btn, name, downloadUrl } = active;
      btn.setAttribute('data-state', 'saving');
      btn.querySelector('.record-btn__label').textContent = 'Saving…';
      try { rec.stop(); } catch (_) {}
      // Finalise download on stop (handler below)
      rec.addEventListener('stop', () => {
        if (downloadUrl) URL.revokeObjectURL(downloadUrl);
        const blob = new Blob(active.chunks, { type: supports });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${name}.webm`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Revoke after a tick so Safari has the URL long enough
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        btn.setAttribute('data-state', '');
        btn.querySelector('.record-btn__label').textContent = 'Record';
        if (active === sessionStorage.getItem('__swrLastRecord')) active = null;
        sessionStorage.removeItem('__swrLastRecord');
      }, { once: true });
      // safety timeout: clear if 'stop' never fires within 60s
      setTimeout(() => { if (active && active.btn === btn) { active = null; btn.setAttribute('data-state', ''); btn.querySelector('.record-btn__label').textContent = 'Record'; } }, 60000);
    }

    function start(btn, section) {
      const video = section.querySelector('video');
      if (!video) return;
      // Ensure playback is active so captureStream produces frames.
      const wasPaused = video.paused;
      if (wasPaused) video.play().catch(() => {});

      const stream = pickMimeForVideo(video);
      if (!stream) {
        btn.setAttribute('data-state', 'unsupported');
        return;
      }
      const rec = new MediaRecorder(stream, { mimeType: supports });
      const chunks = [];
      rec.addEventListener('dataavailable', e => { if (e.data && e.data.size) chunks.push(e.data); });

      // Stop any prior recording first.
      stopActive();

      const name = safeTitle(section) + '-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      active = { rec, btn, chunks, name, downloadUrl: null };
      sessionStorage.setItem('__swrLastRecord', JSON.stringify({ name }));

      btn.setAttribute('data-state', 'recording');
      btn.querySelector('.record-btn__label').textContent = 'Stop & Save';
      rec.start(1000); // emit a chunk every 1s for bounded memory
    }

    document.querySelectorAll('.record-btn').forEach(btn => {
      const section = btn.closest('.music-video');
      if (!section) return;
      btn.addEventListener('click', () => {
        if (btn.getAttribute('data-state') === 'recording') {
          stopActive();
        } else if (btn.getAttribute('data-state') !== 'saving') {
          start(btn, section);
        }
      });
    });
  })();
  </script>
