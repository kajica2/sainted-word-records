<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Persona Demo · SWR engine</title>
  <meta name="description" content="An archetype-driven demo of the SWR audio-reactive engine. Drop a track, see how a chosen persona reads it." />
  <meta name="theme-color" content="#0a0d12" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <style>
    :root {
      --bg: #05030a; --bg-2: #0a0612; --panel: #0e0818; --panel-2: #150b22;
      --ink: #f5e9ff; --muted: #8a7aa0; --line: #2a1d3e;
      --m: #ff2d8a; --c: #00f0ff; --y: #fff04a; --g: #00ffa3;
      --persona: #ff3d92;  /* overridden per persona via JS */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
      color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #app { display: grid; grid-template-rows: 44px minmax(0, 1fr) 180px; height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 0 14px;
      background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .badge { font-weight: 700; letter-spacing: 0.16em; color: var(--persona);
      text-shadow: 0 0 8px var(--persona); text-transform: uppercase; font-size: 11px; }
    .badge small { color: var(--c); margin-left: 6px; font-weight: 400; font-size: 9px;
      letter-spacing: 0.12em; }
    .cluster { font-size: 9px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
    .cluster.auditor { color: var(--c); border-color: var(--c); }
    .cluster.practitioner { color: var(--g); border-color: var(--g); }
    .cluster.broker { color: var(--y); border-color: var(--y); }
    .cluster.cross { color: var(--m); border-color: var(--m); }
    .spacer { flex: 1; }
    .pill { font-size: 9px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
    .pill.live { color: var(--y); border-color: var(--y); animation: blink 0.4s infinite alternate; }
    @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    .tbtn { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font: 10px/1 ui-monospace;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 12px; border-radius: 4px; cursor: pointer; }
    .tbtn:hover { border-color: var(--persona); color: var(--persona); }
    .tbtn.primary { background: var(--persona); color: #000; border-color: var(--persona); font-weight: 700; }
    .tbtn.primary:hover { background: var(--c); border-color: var(--c); }
    #stage { position: relative; background: #000; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #hud { display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      padding: 12px 14px; background: var(--bg-2); border-top: 1px solid var(--line); }
    #hud .panel { display: flex; flex-direction: column; gap: 4px; }
    .h-title { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    #tagline { font-size: 12px; color: var(--ink); font-style: italic; }
    #highlights { margin: 0; padding-left: 16px; font-size: 11px; color: var(--ink); }
    #highlights li { margin-bottom: 2px; }
    #config-line { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; }
    #config-line b { color: var(--c); font-weight: 400; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span class="badge" id="badge">PERSONA · <small id="cluster-label">…</small></span>
      <a class="tbtn" href="/personas" title="See all personas">← ALL</a>
      <span class="spacer"></span>
      <span class="pill live" id="status">LOADING</span>
    </header>

    <section id="stage">
      <canvas id="render"></canvas>
    </section>

    <footer id="hud">
      <div class="panel">
        <span class="h-title">Tagline</span>
        <div id="tagline">…</div>
        <span class="h-title" style="margin-top: 8px;">What this demo shows</span>
        <ul id="highlights"></ul>
      </div>
      <div class="panel">
        <span class="h-title">Configuration</span>
        <div id="config-line">preset: <b id="cfg-preset">…</b> · primitive: <b id="cfg-primitive">…</b></div>
        <div id="config-line">reactor band: <b id="cfg-band">…</b> · envelope: <b id="cfg-env">…</b></div>
        <div id="config-line">cluster: <b id="cfg-cluster">…</b> · loop: <b id="cfg-loop">90s</b></div>
        <span class="h-title" style="margin-top: 8px;">Cluster explainer</span>
        <div id="cluster-explainer" style="font-size: 11px; color: var(--ink);"></div>
      </div>
    </footer>
  </div>

  <!-- Persona runtime: a self-contained 3D scene + audio analyser.
       Engine-free by design (no SWR engine-core dependency). -->
  <script src="/persona-runtime.client.js" defer></script>

</body>
</html>
