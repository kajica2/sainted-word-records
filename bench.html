<style>
  /* The lab's own palette, scoped to body.swr-bench so it does not fight the

<script>
/* ============================================================
   SWR · BENCH & SYNC LAB — a thin host over the shared suite
   (lib/bench-suite.client.js). The lab owns what it DRAWS; the suite
   owns the buffer, the measurement, the reports and the advisor.
   ============================================================ */
/* ---------- utils ---------- */
const $  = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
/* The host knows its own numbers: the suite's "reduce density" chip says
   "-40 %", which is only true for the particles — the grid is cut by a
   different factor. The toast is the host's, so the host says the truth. */
function cutLabel(factor) {
  return '-' + Math.round((1 - factor) * 100) + ' %';
}
function toast(msg) {
  let text = String(msg);
  if (/reduce-count/.test(text)) {
    // the host's own density state — the suite's chip says "-40 %", which
    // is only true for the particles, and only on the first application.
    text += ' · particles ' + cutLabel(labOverrides.density.particles) +
            ', grid ' + cutLabel(labOverrides.density.grid);
  }
  const t = $('#toast');
  t.textContent = text; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1700);
}


/* ---------- demo synth (the editor's signal) ---------- */
function demoSynth(t) {
  const bpm = 120;
  const beat = (t * bpm / 60) % 1;
  const phrase = (t * bpm / 60) % 4;
  const pulse = Math.exp(-beat * 5.5);
  // The off-beat half of the pulse. (This constant was a stray emoji in the
  // supplied source — a syntax error that stopped the whole script parsing.)
  const off = Math.exp(-(((beat + 0.5) % 1)) * 5.5);
  const kick = Math.max(pulse, off);
  // The phrase downbeat holds the low end, so a "held for 300ms" condition
  // is reachable on the demo signal.
  const hold = phrase < 1.5 ? 0.55 : 0;
  return {
    sub: 0.35 + kick * 0.75 + hold * 0.4,
    bass: 0.28 + kick * 1.15 + hold,
    mid: 0.35 + 0.22 * Math.sin(t * 1.9) + 0.10 * Math.sin(t * 5.3),
    treble: 0.28 + 0.25 * Math.abs(Math.sin(t * 3.1)),
    air: 0.20 + 0.20 * hash(Math.floor(t * 8)),
    rms: 0.35 + kick * 0.45 + hold * 0.3,
    centroid: 0.45 + 0.20 * Math.sin(t * 0.7),
    pulse
  };
}


/* ---------- painters (parity with the editor) ---------- */
const PARAM_SPEC = {
  count: { min: 4, max: 256, step: 1 }, width: { min: 0.05, max: 1, step: 0.01 },
  gain: { min: 0, max: 3, step: 0.01 }, tilt: { min: -1, max: 1, step: 0.01 },
  radius: { min: 0.05, max: 1, step: 0.01 }, thickness: { min: 0.01, max: 0.5, step: 0.01 },
  spin: { min: -2, max: 2, step: 0.01 }, spread: { min: 0, max: 2, step: 0.01 },
  amp: { min: 0, max: 1, step: 0.01 }, glow: { min: 0, max: 1, step: 0.01 },
  noise: { min: 0, max: 1, step: 0.01 }, size: { min: 0.002, max: 0.06, step: 0.001 },
  speed: { min: 0, max: 3, step: 0.01 }, jitter: { min: 0, max: 1, step: 0.01 },
  cols: { min: 3, max: 64, step: 1 }, rows: { min: 3, max: 64, step: 1 },
  warp: { min: 0, max: 1, step: 0.01 },
};

const PAINTERS = {
  bars(ctx, f, t, P, W, H, c1, c2) {
    const n = Math.max(4, Math.round(P.count || 56));
    const gap = 1 - (P.width || 0.72);
    const bw = W / n;
    const half = Math.ceil(n / 2);
    for (let i = 0; i < n; i++) {
      // mirrored spectrum + three band lobes (the editor's profile)
      const u = P.mirror === false
        ? i / (n - 1 || 1)
        : (i < half ? (half - 1 - i) / (half - 1 || 1) : (i - half) / (half - 1 || 1));
      const lobe = (c, s) => Math.exp(-Math.pow((u - c) / s, 2));
      let v = f.bass * lobe(0.16, 0.22) + f.mid * lobe(0.5, 0.24) + f.treble * lobe(0.84, 0.26);
      v = v * (P.gain || 1) * (1 + (P.tilt || 0) * (u - 0.5));
      const h = clamp(v * 0.7, 0, 1) * H * 0.42;
      ctx.fillStyle = u < 0.5 ? c1 : c2;
      ctx.fillRect(i * bw + bw * gap * 0.5, H / 2 - h, bw * (1 - gap), h * 2);
    }
  },
  rings(ctx, f, t, P, W, H, c1, c2) {
    const cx = W / 2, cy = H / 2;
    const R = Math.min(W, H) * (P.radius || 0.35);
    const n = Math.max(1, Math.round(P.count || 8));
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1 || 1);
      const r = R * (0.3 + u * (P.spread || 0.6)) * (0.85 + f.bass * 0.5);
      const a = t * (P.spin || 0.4) * (i % 2 ? 1 : -1);
      // the stroke is a hairline on the ring's own scale
      ctx.lineWidth = Math.max(1, r * (P.thickness || 0.1) * (0.35 + u * 0.5));
      ctx.strokeStyle = i % 2 ? c2 : c1;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(1, r), a, a + Math.PI * (1.2 + f.mid * 0.8));
      ctx.stroke();
    }
  },
  waveform(ctx, f, t, P, W, H, c1, c2) {
    const cy = H / 2, amp = H * (P.amp || 0.3);
    ctx.lineWidth = Math.max(1, H * (P.thickness || 0.06));
    for (let k = 0; k < 2; k++) {
      ctx.strokeStyle = k ? c2 : c1;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 2) {
        const u = x / W;
        const v = Math.sin(u * 8 + t * 2 + k * 1.7) * (0.6 + f.mid * 0.6)
                + Math.sin(u * 23 - t * 3) * 0.25 * (P.noise || 0.2)
                + Math.sin(u * 3 + t) * f.bass * 0.5;
        const y = cy + v * amp * (1 - k * 0.5);
        x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  },
  particles(ctx, f, t, P, W, H, c1, c2) {
    const n = Math.max(1, Math.round(P.count || 200));
    const base = Math.min(W, H) * 0.45;
    for (let i = 0; i < n; i++) {
      const r1 = hash(i * 1.7), r2 = hash(i * 3.1 + 9), r3 = hash(i * 5.3 + 4);
      const ang = r1 * Math.PI * 2 + t * (P.speed || 0.5) * (0.4 + r2);
      const rad = (0.1 + r2 * 0.9) * base * (1 + f.bass * 0.4) * (0.6 + (P.spread || 0.9) * 0.4);
      const x = W / 2 + Math.cos(ang) * rad + (r3 - 0.5) * (P.jitter || 0.4) * 40;
      const y = H / 2 + Math.sin(ang) * rad * 0.9 + (r1 - 0.5) * (P.jitter || 0.4) * 40;
      const s = Math.max(0.5, Math.min(W, H) * (P.size || 0.012) * (0.5 + r3));
      ctx.fillStyle = r3 > 0.5 ? c1 : c2;
      ctx.beginPath(); ctx.arc(x, y, s, 0, 6.2832); ctx.fill();
    }
  },
  grid(ctx, f, t, P, W, H, c1, c2) {
    const cols = Math.max(3, Math.round(P.cols || 18));
    const rows = Math.max(3, Math.round(P.rows || 12));
    ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.003 * (1 + (P.glow || 0.5)));
    for (let j = 0; j <= rows; j++) {
      ctx.strokeStyle = j % 2 ? c2 : c1;
      ctx.beginPath();
      for (let i = 0; i <= cols; i++) {
        const u = i / cols, v = j / rows;
        const w = Math.sin(u * 6 + t * 1.5 + v * 4) * (P.warp || 0.35) * 0.08 * H * (0.5 + f.bass);
        const x = u * W, y = v * H + w;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }
};


/* ---------- reactivity (the editor's curves) ---------- */
const CURVES = {
  linear: f => f,
  sqrt: f => Math.sqrt(Math.max(0, f)),
  exp: f => (Math.exp(clamp(f, 0, 3) * 2.2) - 1) / (Math.exp(6.6) - 1),
  pulse: f => f * f,
  thresh: f => f > 0.4 ? 1 : 0,
  inv: f => 1 - Math.min(1, f),
  log: f => Math.log(1 + Math.max(0, f) * 9) / Math.log(10)
};

function applyReact(L, f, mul) {
  const out = { ...L, params: { ...L.params } };
  if (!L.react || !L.react.length || mul <= 0) return out;
  for (const r of L.react) {
    const fv = clamp(f[r.feature] ?? 0, 0, 3);
    const amt = (CURVES[r.curve] || CURVES.linear)(fv) * (r.amount ?? 1) * mul;
    const key = r.param;
    if (key === 'opacity') { out.opacity = clamp((out.opacity ?? 1) + amt, 0, 2); continue; }
    if (!(key in out.params)) continue;
    const base = out.params[key] ?? 0;
    let v = r.mode === 'mul' ? base * (1 + amt) : base + amt;
    const spec = PARAM_SPEC[key];
    // the editor clamps every reactive parameter to its own range; a
    // benchmark that renders unclamped values is not benchmarking the editor
    if (spec) {
      v = clamp(v, spec.min, spec.max);
      if (key === 'count' || key === 'cols' || key === 'rows') v = Math.max(3, Math.round(v));
    }
    out.params[key] = v;
  }
  return out;
}


/* ============================================================
   CONFIG + LAYER SETS
   ============================================================ */
function defaultLayers(preset) {
  if (preset === 'baseline') {
    return [{ type: 'bars', enabled: true, opacity: 0.85, blend: 'lighter',
      params: { count: 56, width: 0.72, gain: 0.85, tilt: 0.3, mirror: true },
      react: [] }];
  }
  if (preset === 'reactive') {
    return [
      { type: 'bars', enabled: true, opacity: 0.85, blend: 'lighter',
        params: { count: 56, width: 0.72, gain: 0.85, tilt: 0.3, mirror: true },
        react: [{ feature: 'bass', param: 'gain', amount: 1.2, curve: 'exp' }] },
      { type: 'rings', enabled: true, opacity: 0.6, blend: 'lighter',
        params: { count: 8, radius: 0.35, thickness: 0.12, spin: 0.4, spread: 0.6 },
        react: [{ feature: 'rms', param: 'radius', amount: 0.3, curve: 'sqrt' }] },
      { type: 'particles', enabled: true, opacity: 0.55, blend: 'lighter',
        params: { count: 220, size: 0.012, speed: 0.5, spread: 0.9, jitter: 0.4 },
        react: [{ feature: 'treble', param: 'speed', amount: 0.6, curve: 'linear' }] }
    ];
  }
  if (preset === 'stress') {
    return [
      { type: 'bars', enabled: true, opacity: 0.85, blend: 'lighter',
        params: { count: 64, width: 0.6, gain: 0.85, tilt: 0.4, mirror: true },
        react: [{ feature: 'bass', param: 'gain', amount: 1.4, curve: 'exp' }] },
      { type: 'rings', enabled: true, opacity: 0.6, blend: 'lighter',
        params: { count: 10, radius: 0.35, thickness: 0.12, spin: 0.4, spread: 0.6 },
        react: [{ feature: 'rms', param: 'radius', amount: 0.3, curve: 'sqrt' }] },
      { type: 'waveform', enabled: true, opacity: 0.5, blend: 'screen',
        params: { amp: 0.35, thickness: 0.06, glow: 0.7, noise: 0.25 },
        react: [{ feature: 'mid', param: 'amp', amount: 0.3, curve: 'linear' }] },
      { type: 'particles', enabled: true, opacity: 0.5, blend: 'lighter',
        params: { count: 320, size: 0.01, speed: 1.2, spread: 1.2, jitter: 0.6 },
        react: [{ feature: 'treble', param: 'speed', amount: 0.8, curve: 'linear' }] },
      { type: 'grid', enabled: true, opacity: 0.45, blend: 'screen',
        params: { cols: 26, rows: 16, warp: 0.4, glow: 0.6 },
        react: [{ feature: 'bass', param: 'warp', amount: 0.8, curve: 'pulse' }] }
    ];
  }
  return [];
}

/* The config is built FROM the layer preset. (The supplied source set
 * `layers: defaultLayers('reactive')` and then merged the test's override
 * on top, so the "baseline" test ran the three reactive layers and the
 * baseline it claimed to measure never happened.)
 *
 * The knobs fall into two families, and they are kept apart on purpose:
 *   - the RUN owns: the layer preset, the reactivity, the interpolation
 *     and the injected audio lag (a test asks for these);
 *   - the HOST owns: the dpr cap, the trails and the smoothing (the
 *     lab's own live state — a test must never reset them).
 * A test's config therefore carries ONLY the run's knobs; the host's own
 * state survives every run. */


/* ============================================================
   CANVAS + RENDER
   ============================================================ */
const stage = $('#stage');
const ctx = stage.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

function resize() {
  const r = stage.parentElement.getBoundingClientRect();
  const want = labCfg.dpr || window.devicePixelRatio || 1;
  DPR = Math.min(want, 2.5);
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  stage.width = Math.round(W * DPR);
  stage.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05070c';
  ctx.fillRect(0, 0, W, H);
  $('#liveDpr').textContent = 'dpr ' + DPR.toFixed(2);
}
new ResizeObserver(resize).observe($('#stageWrap'));

/* The editor's trail fade. It is a function of the trails value only, so
   it lives here — the report quotes the very number the renderer used. */
function trailRetention(trails) {
  return clamp(0.52 - (trails || 0) * 0.38, 0.30, 0.62);
}

function render(f, tSec, cfg) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  // the editor's trail fade and its per-frame trail normalisation
  const retention = trailRetention(cfg.trails);
  ctx.fillStyle = `rgba(5,7,12,${retention})`;
  ctx.fillRect(0, 0, W, H);
  const trailNorm = 1 - retention;

  const hue = 0.52, sat = 0.9, contrast = 1;
  const light1 = clamp((30 + f.bass * 12) * contrast, 10, 48);
  const c1 = `hsl(${hue * 360} ${sat * 100}% ${light1}%)`;
  const c2 = `hsl(${((hue + 0.12) % 1) * 360} ${sat * 100}% ${clamp((34 + f.mid * 10) * contrast, 10, 48)}%)`;

  // the editor's additive stack cap
  let additive = 0;
  for (const L of cfg.layers) {
    if (!L.enabled) continue;
    const blend = L.blend || 'lighter';
    if (blend !== 'lighter' && blend !== 'screen') continue;
    additive += clamp(L.opacity ?? 1, 0, 1);
  }
  const stackScale = additive > 1.1 ? 1.1 / additive : 1;

  for (const L of cfg.layers) {
    if (!L.enabled) continue;
    const painter = PAINTERS[L.type];
    if (!painter) continue;
    const M = applyReact(L, f, cfg.reactivity);
    const opacity = clamp(M.opacity ?? L.opacity ?? 1, 0, 1);
    if (opacity <= 0.002) continue;
    ctx.save();
    ctx.globalCompositeOperation = L.blend || 'lighter';
    ctx.globalAlpha = clamp(opacity * trailNorm * stackScale, 0, 1);
    ctx.shadowBlur = Math.min(18, 8 * (0.4 + 0.5)) * stackScale;
    ctx.shadowColor = c1;
    ctx.strokeStyle = c1; ctx.fillStyle = c1;
    painter(ctx, f, tSec, M.params, W, H, c1, c2);
    ctx.restore();
  }
}


/* ============================================================
   THE HOST ADAPTER
   ============================================================ */
var suite = null;
var labCfg = { layerPreset: 'reactive', layers: [], reactivity: 1.5, interpolate: true, injectAudioDrift: 0, dpr: 0, smoothing: 0.7, trails: 0.4 };

/* The density factors the lab really applies: the PARTICLES are cut by
   40 %, the GRID by 25 %. The suite's own chip says "-40 %" — the host is
   the only party that knows both numbers, so the host states them. */
var DENSITY_FACTORS = { particles: 0.6, grid: 0.75 };

/* The applied-override map.
   The advisor's changes must survive into the run that follows them, and
   `onTestStart` rebuilds the layer set from the preset name — that rebuild
   is the source of truth for the LAYER SET. So every applied change is
   recorded here and re-applied on top of the rebuild: the density entries
   are multipliers on the rebuilt layers (they compose, so applying twice
   really does cut twice), the rest are the host's own live values. */
var labOverrides = {
  density: { particles: 1, grid: 1 },
  dpr: null,
  trails: null,
  smoothing: null
};
var labRunCount = 0;

/* The suite's own config defaults (its state.cfg starts with exactly
   these). A merged run config always carries them, so a value that EQUALS
   one of them is not an explicit request — it is the suite's stale
   default. Only a value that differs is honoured, so a run can never
   reset the host's own live settings. */
var SUITE_DEFAULTS = { dpr: 0, trails: 0.4, smoothing: 0.7 };

/* Scale the heavy layers of a layer set. Returns true when something
   actually moved — an apply that changes nothing must not claim success. */
function scaleLayerDensity(layers, factors) {
  var changed = false;
  (layers || []).forEach(function (L) {
    var P = L.params || (L.params = {});
    if (L.type === 'particles' && P.count) {
      var np = Math.max(4, Math.round(P.count * factors.particles));
      if (np !== P.count) { P.count = np; changed = true; }
    }
    if (L.type === 'grid') {
      if (P.cols) {
        var nc = Math.max(3, Math.round(P.cols * factors.grid));
        if (nc !== P.cols) { P.cols = nc; changed = true; }
      }
      if (P.rows) {
        var nr = Math.max(3, Math.round(P.rows * factors.grid));
        if (nr !== P.rows) { P.rows = nr; changed = true; }
      }
    }
  });
  return changed;
}

/* ---------- the audio clock ----------
   The reading is EXACT and DETERMINISTIC: the audio clock is the wall
   clock minus the run's injected lag. A 12 ms lag therefore reads as
   12 ms on every frame — independent of the buffer's phase and of the
   interpolation. The per-sample uncertainty lives in the CONTENT (see
   demoFeatures), never in the reading. */
function audioClock(tSec) {
  return tSec - (labCfg.injectAudioDrift || 0);
}

/* ---------- the feature pipeline: jitter + smoothing ----------
   The lab's own signal path, in this order:
     1. JITTER — the audio clock's per-sample uncertainty (±2 ms) is the
        CONTENT's, not the clock reading's: the demo signal is read at a
        slightly uncertain time. That is what keeps the measured A/V
        offset independent of where the buffer happens to be.
     2. SMOOTHING — a one-pole filter over the feature vector. The
        coefficient is the lab's `smoothing` knob: the higher it is, the
        more slowly the features move. It is a filter, so it is stateful
        across frames, and it is reset at the start of every run so two
        runs are comparable. */
var JITTER_SEC = 0.004;          // ±2 ms
var smoothState = null;

function resetSmoothing() { smoothState = null; }

/* the one-pole coefficient: smoothing 0 = no filter, smoothing 1 = frozen */
function smoothingAlpha() {
  return clamp(1 - clamp(labCfg.smoothing || 0, 0, 0.98), 0.02, 1);
}

function smoothFeatures(raw) {
  var alpha = smoothingAlpha();
  if (!smoothState) {
    smoothState = Object.assign({}, raw);
    return Object.assign({}, raw);
  }
  var out = {};
  for (var k in raw) {
    var x = raw[k];
    if (typeof x !== 'number') { out[k] = x; continue; }
    var prev = typeof smoothState[k] === 'number' ? smoothState[k] : x;
    out[k] = prev + alpha * (x - prev);
  }
  smoothState = out;
  return out;
}

/* A test's configuration carries ONLY the knobs the run owns (the layer
   preset, the reactivity, the interpolation, the injected lag). The dpr
   cap, the trails and the smoothing belong to the host and are NOT part
   of a test — a frozen test config must not reset the lab's own state. */
function cfgFor(preset, over) {
  var cfg = {
    layerPreset: preset,
    layers: defaultLayers(preset),
    reactivity: 1.5,
    interpolate: true,
    injectAudioDrift: 0
  };
  return Object.assign(cfg, over || {});
}

var TESTS = [
  { name: 'baseline',      desc: '1 bar layer, no reactivity, interpolation on',  cfg: cfgFor('baseline', { reactivity: 0, interpolate: true }) },
  { name: 'reactive',      desc: '3 layers, full reactivity, interpolation on',   cfg: cfgFor('reactive', { reactivity: 1.5, interpolate: true }) },
  { name: 'reactive-noint',desc: 'same but interpolation OFF — shows buffer cost',  cfg: cfgFor('reactive', { reactivity: 1.5, interpolate: false }) },
  { name: 'stress',        desc: 'all 5 layer types, full reactivity',             cfg: cfgFor('stress', { reactivity: 1.5, interpolate: true }) },
  { name: 'sync-stress',   desc: 'reactive + 12ms audio lag — tests buffer recov', cfg: cfgFor('reactive', { reactivity: 1.5, interpolate: true, injectAudioDrift: 0.012 }) }
];

/* The audio side: the features, and the time they represent. The label is
   EXACTLY the audio clock's reading — the suite compares the two. */
function demoFeatures(tSec) {
  var jitter = (Math.random() - 0.5) * JITTER_SEC;
  var raw = demoSynth(audioClock(tSec) + jitter);
  return { features: smoothFeatures(raw), audioTime: audioClock(tSec) };
}

/* The version label for a new report: the header field, or a run counter
   when the field is empty. */
function hostVersionTag() {
  var el = $('#versionInput');
  var v = el && el.value ? el.value.trim() : '';
  return v || ('run-' + labRunCount);
}

/* The header's version field and the panel's tag field are the same field:
   whichever the suite reads, it reads the same label. */
function syncVersionTag() {
  var vEl = $('#versionInput');
  var tEl = document.getElementById('benchTagInput');
  var v = vEl && vEl.value ? vEl.value.trim() : '';
  if (!tEl) return;
  if (v) tEl.value = v;
  else if (!tEl.value.trim() || /^run-\d+$/.test(tEl.value.trim())) tEl.value = 'run-' + labRunCount;
}

function densityLabel() {
  var d = labOverrides.density;
  if (d.particles === 1 && d.grid === 1) return '';
  return ' · p×' + d.particles.toFixed(2) + ' g×' + d.grid.toFixed(2);
}

var HOST = {
  tests: function () { return TESTS; },
  sample: demoFeatures,
  audioClock: audioClock,
  reportConfig: function () {
    var st = suite && suite.state ? suite.state.cfg : {};
    var layers = labCfg.layers || [];
    var particles = 0, cols = 0, rows = 0;
    layers.forEach(function (L) {
      var P = L.params || {};
      if (L.type === 'particles') particles = P.count || 0;
      if (L.type === 'grid') { cols = P.cols || 0; rows = P.rows || 0; }
    });
    return {
      layerPreset: labCfg.layerPreset,
      layerCount: layers.length,
      layerTypes: layers.map(function (L) { return L.type; }),
      reactivity: labCfg.reactivity,
      interpolate: typeof st.interpolate === 'boolean' ? st.interpolate : labCfg.interpolate,
      injectAudioDrift: typeof st.injectAudioDrift === 'number' ? st.injectAudioDrift : labCfg.injectAudioDrift,
      smoothing: labCfg.smoothing,
      smoothingAlpha: smoothingAlpha(),
      trails: labCfg.trails,
      trailRetention: trailRetention(labCfg.trails),
      dpr: DPR,
      dprCap: labCfg.dpr,
      particleCount: particles,
      gridCols: cols,
      gridRows: rows,
      density: { particles: labOverrides.density.particles, grid: labOverrides.density.grid },
      bufferCapacity: suite ? suite.buffer.capacity : 128
    };
  },
  supports: function (id) {
    /* The lab's own four, PLUS the suite's own two (the interpolation and
       the buffer capacity): the suite applies those itself, and the lab
       must not filter them out of the advisor — the lab's "reactive-noint"
       test is exactly what the suite's interpolation fix corrects. */
    if (['reduce-count', 'cap-dpr', 'increase-trails', 'increase-smoothing',
         'enable-interp', 'increase-buffer'].indexOf(id) < 0) return false;
    /* Capping the DPR only helps when there IS a DPR to cap: on a
       1× display the cap equals the current ratio, so the "optimization"
       changes nothing and the advisor would be reporting a fix for a
       problem this machine does not have. */
    if (id === 'cap-dpr' && (window.devicePixelRatio || 1) <= 1.25) return false;
    return true;
  },
  /* The current value of the thing a suggestion changes. The suite reads
     it before and after an apply and reports a failed apply when the two
     are the same — so this must be the value the apply really moves. */
  verify: function (id) {
    if (id === 'reduce-count') {
      var n = 0;
      (labCfg.layers || []).forEach(function (L) {
        var P = L.params || {};
        if (L.type === 'particles') n += P.count || 0;
        if (L.type === 'grid') n += (P.cols || 0) * (P.rows || 0);
      });
      return n;
    }
    if (id === 'cap-dpr') return DPR;
    if (id === 'increase-trails') return labCfg.trails;
    if (id === 'increase-smoothing') return labCfg.smoothing;
    return null;   // the suite's own knobs have no host-side value
  },
  apply: function (id) {
    if (id === 'reduce-count') {
      if (!scaleLayerDensity(labCfg.layers, DENSITY_FACTORS)) return false;
      labOverrides.density.particles = Math.max(0.05, labOverrides.density.particles * DENSITY_FACTORS.particles);
      labOverrides.density.grid = Math.max(0.05, labOverrides.density.grid * DENSITY_FACTORS.grid);
      return true;
    }
    if (id === 'cap-dpr') {
      var cap = Math.min(1.25, window.devicePixelRatio || 1);
      var before = DPR;
      labCfg.dpr = cap;
      labOverrides.dpr = cap;
      resize();
      return DPR !== before;   // it only "took" if the render really changed
    }
    if (id === 'increase-trails') {
      var trails = Math.min(0.9, (labCfg.trails || 0.4) + 0.15);
      if (trails === labCfg.trails) return false;
      labCfg.trails = trails;
      labOverrides.trails = trails;
      return true;
    }
    if (id === 'increase-smoothing') {
      var smoothing = Math.min(0.95, (labCfg.smoothing || 0.7) + 0.1);
      if (smoothing === labCfg.smoothing) return false;
      labCfg.smoothing = smoothing;
      labOverrides.smoothing = smoothing;
      resetSmoothing();          // the filter restarts at the new coefficient
      return true;
    }
    if (id === 'enable-interp') { labCfg.interpolate = true; return true; }
    /* 'increase-buffer' is the suite's own (the buffer capacity) — the lab
       supports the suggestion, the suite applies it. */
    return false;
  },
  onTestStart: function (cfg) {
    cfg = cfg || {};
    // the knobs the RUN owns
    if (typeof cfg.layerPreset === 'string') labCfg.layerPreset = cfg.layerPreset;
    if (typeof cfg.reactivity === 'number') labCfg.reactivity = cfg.reactivity;
    if (typeof cfg.interpolate === 'boolean') labCfg.interpolate = cfg.interpolate;
    if (typeof cfg.injectAudioDrift === 'number') labCfg.injectAudioDrift = cfg.injectAudioDrift;
    // the knobs the HOST owns: a run config may carry them (the suite's
    // optimized config does), but only a value that differs from the
    // suite's own default is an explicit request — and the APPLIED
    // overrides win over both, so an applied change survives the re-run.
    if (typeof cfg.dpr === 'number' && cfg.dpr !== SUITE_DEFAULTS.dpr) labCfg.dpr = cfg.dpr;
    if (typeof cfg.trails === 'number' && cfg.trails !== SUITE_DEFAULTS.trails) labCfg.trails = cfg.trails;
    if (typeof cfg.smoothing === 'number' && cfg.smoothing !== SUITE_DEFAULTS.smoothing) labCfg.smoothing = cfg.smoothing;
    if (labOverrides.dpr !== null) labCfg.dpr = labOverrides.dpr;
    if (labOverrides.trails !== null) labCfg.trails = labOverrides.trails;
    if (labOverrides.smoothing !== null) labCfg.smoothing = labOverrides.smoothing;

    // the layer set is rebuilt from the preset name — the source of truth
    // for the LAYERS — and the applied density is re-applied on top of it.
    labCfg.layers = defaultLayers(labCfg.layerPreset);
    scaleLayerDensity(labCfg.layers, labOverrides.density);

    // every run starts from the same filter state, so two runs compare
    resetSmoothing();

    labRunCount += 1;
    syncVersionTag();

    $('#liveCfg').textContent = 'cfg ' + labCfg.layerPreset + densityLabel();
    resize();
  },
  optimizedConfig: function () {
    var st = suite && suite.state ? suite.state.cfg : {};
    return Object.assign({}, labCfg, {
      // the suite owns the interpolation: its live value wins, so the
      // suite's own "enable interpolation" fix survives the re-run.
      interpolate: typeof st.interpolate === 'boolean' ? st.interpolate : labCfg.interpolate,
      injectAudioDrift: typeof st.injectAudioDrift === 'number' ? st.injectAudioDrift : labCfg.injectAudioDrift,
      layerPreset: labCfg.layerPreset,
      layers: labCfg.layers
    });
  },
  toast: function (m) { toast(m); }
};

/* ---------- the lab's own render loop ---------- */

/* The suite's run state, read from its public state — the lab does not
   keep a second copy of "is a run in flight". */
function suiteRunDurationMs() {
  var st = suite && suite.state;
  if (st && typeof st.durationMs === 'number') return st.durationMs;
  var mode = document.getElementById('benchRunMode');
  return mode && mode.value === 'quick' ? 1500 : 3000;
}

/* The stage header's run indicator — it is driven by the suite's own
   state, so it shows the run that is really happening (the suite's panel
   indicator lives in the panel and is the suite's business). */
function updateRunIndicator(now) {
  var ind = $('#runIndicator');
  if (!ind) return;
  var st = suite && suite.state;
  var running = !!(st && (st.recording || st.activeTest));
  ind.classList.toggle('on', running);
  if (!running) return;
  var label = $('#runLabel');
  if (label) label.textContent = st.activeTest ? ('running · ' + st.activeTest) : 'running…';
  var bar = $('#runBar');
  if (bar) {
    var dur = suiteRunDurationMs();
    var p = (dur > 0 && st.startAt) ? clamp((now - st.startAt) / dur, 0, 1) : 0;
    bar.style.width = (p * 100).toFixed(0) + '%';
  }
}

/* The drift readout is the SUITE's number — the lab does not compute its
   own A/V offset (the suite owns the clock and the buffer). */
function driftText() {
  if (!suite) return 'drift –';
  var parts = [];
  if (typeof suite.driftAvg === 'number') parts.push('drift ' + suite.driftAvg.toFixed(1) + ' ms');
  if (typeof suite.quantAvg === 'number') parts.push('quant ' + suite.quantAvg.toFixed(1) + ' ms');
  return parts.join(' · ') || 'drift –';
}

function frame(now) {
  var dt = now - (state_lastNow || now);
  state_lastNow = now;
  // the VIDEO clock is the suite's: it is reset at the start of every run,
  // and the buffer's samples are stamped on it. (Using a clock of the lab's
  // own made the two timelines drift apart by the length of the run — the
  // lab measured its own bookkeeping instead of its sync.)
  var tSec = suite ? (now - suite.state.startAt) / 1000 : 0;

  var f;
  if (suite) {
    var sample = suite.sampleAt(tSec);
    f = sample.f;
    suite.updateBufferView(sample);
  }
  if (!f) f = demoSynth(tSec);

  render(f, tSec, labCfg);
  updateRunIndicator(now);

  var instFps = dt > 0 ? 1000 / dt : 60;
  if (Math.random() < 0.05) {
    $('#liveFpsBadge').textContent = Math.round(instFps) + ' fps';
    $('#liveDriftBadge').textContent = driftText();
    for (var k of ['bass', 'mid', 'treble', 'rms']) {
      var el = document.querySelector('[data-meter="' + k + '"]');
      if (el) el.style.height = Math.round(clamp(f[k] / 1.6, 0, 1) * 100) + '%';
    }
  }
  requestAnimationFrame(frame);
}

var state_lastNow = 0;

/* ---------- boot ----------
   The suite is a deferred script, so the inline boot waits for the DOM to
   be ready — deferred scripts run before DOMContentLoaded, so the factory
   is guaranteed to be there by then. */
function boot() {
  suite = window.SWR_BENCH.createSuite(HOST);
  suite.mount(document.getElementById('panel'));
  labCfg.layers = defaultLayers('reactive');
  render(demoSynth(0), 0, labCfg);
  requestAnimationFrame(frame);

  /* The header's version field and the panel's tag field are ONE field:
     whichever the suite reads, it reads the same label. */
  var vEl = $('#versionInput');
  var tEl = document.getElementById('benchTagInput');
  if (vEl) vEl.addEventListener('input', function () {
    if (tEl) tEl.value = vEl.value.trim();
  });
  if (tEl) tEl.addEventListener('input', function () {
    if (vEl) vEl.value = tEl.value.trim();
  });

  /* the public API — a host (or a gate) drives the lab through this */
  window.SWRBench = {
    get reports() { return suite.reports; },
    get buffer() { return suite.buffer; },
    get config() { return labCfg; },
    get suite() { return suite; },
    get host() { return HOST; },
    tests: function () { return TESTS; },
    runTest: suite.runTest,
    runAll: suite.runAll,
    analyze: suite.analyze,
    applySuggestions: suite.applySuggestions,
    versionTag: hostVersionTag,
    audioClock: audioClock,
    clear: function () { suite.buffer.clear(); }
  };
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
