<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Persona Engine · Sainted Word Records</title>
  <meta name="description" content="Browse audio-reactive visual personas — click any preset to apply it to the live canvas." />
  <meta property="og:title" content="Persona Engine · Sainted Word Records">
  <meta property="og:description" content="Browse audio-reactive visual personas — click any preset to apply it to the live canvas.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231a1028' stroke='%23ff3d92' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff3d92'/%3E%3Ccircle cx='16' cy='16' r='0.8' fill='%23fff'/%3E%3C/svg%3E" />

  <!-- Tier guard — must load before any rAF loops -->
  <script src="/lib/tier-runtime.js"></script>
  <script src="/lib/adaptive-guard.js" defer></script>

  <!-- Gate + watermark -->
  <script src="/lib/watermark.client.js" defer></script>
  <script src="/lib/invite-unlock.client.js" defer></script>
  <script src="/lib/invite-modal.client.js" defer></script>

  <!-- Persona presets dropdown -->
  <script src="/lib/presets-dropdown.client.js" defer></script>

  <!-- Styles -->
  <link rel="stylesheet" href="/video-fx.css" />
  <link rel="stylesheet" href="/presets-panel.css" />
  <link rel="stylesheet" href="/lib/presets-dropdown.css" />
  <link rel="stylesheet" href="/brandkit.css" />

  <style>
    :root {
      --bg-0: #050308;
      --bg-1: #0d0918;
      --bg-2: #1a1226;
      --panel: #11091a;
      --panel-2: #1a1028;
      --line: #2a1d3a;
      --line-2: #3a2a4a;
      --fg: #f5e9ff;
      --muted: #9a8aaa;
      --dim: #5a4a6a;
      --accent: #ff3d92;
      --accent-2: #00e5ff;
      --accent-3: #ffd24a;
      --warn: #ff7a3d;
      --ok: #00ffa3;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body {
      background: var(--bg-0);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(255, 61, 146, 0.10), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(0, 229, 255, 0.08), transparent 50%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1));
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: 56px 1fr 48px;
      grid-template-columns: 280px 1fr 280px;
      grid-template-areas:
        "header header  header"
        "sidebar stage  panels"
        "footer footer  footer";
      height: 100vh;
      width: 100vw;
      gap: 1px;
      background: var(--line);
    }

    /* ── Header ── */
    #header {
      grid-area: header;
      background: linear-gradient(180deg, var(--bg-2), var(--panel));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
    }
    .brand {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .sep { color: var(--dim); }
    .transport-group { display: flex; align-items: center; gap: 6px; }
    .btn-icon {
      width: 36px; height: 36px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--fg);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn-icon:hover { border-color: var(--accent); }
    .btn-icon.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-rec {
      width: 36px; height: 36px;
      border: 1.5px solid var(--warn);
      border-radius: 50%;
      background: transparent;
      color: var(--warn);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.05em;
      transition: background 0.15s, color 0.15s;
    }
    .btn-rec:hover { background: rgba(255,122,61,0.2); }
    .btn-rec.recording { background: var(--warn); color: #000; animation: rec-pulse 1s ease-in-out infinite; }
    @keyframes rec-pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .time-display {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.05em;
      min-width: 90px;
    }
    .bpm-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--accent-2);
      letter-spacing: 0.08em;
    }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .open-full { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted); text-decoration: none;
      border: 1px solid var(--line-2); padding: 6px 12px; border-radius: 6px;
      transition: color 0.15s, border-color 0.15s; }
    .open-full:hover { color: var(--fg); border-color: var(--accent-2); }

    /* ── Sidebar ── */
    #sidebar {
      grid-area: sidebar;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--line);
    }
    .sidebar-header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 8px;
    }
    .search-bar {
      width: 100%;
      padding: 7px 10px;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-bar::placeholder { color: var(--dim); }
    .search-bar:focus { border-color: var(--accent-2); }

    .family-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      max-height: 110px;
      overflow-y: auto;
    }
    .family-chip {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line-2);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .family-chip:hover { color: var(--fg); border-color: var(--accent-2); }
    .family-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .persona-list { flex: 1; overflow-y: auto; padding: 8px; }
    .persona-list::-webkit-scrollbar { width: 4px; }
    .persona-list::-webkit-scrollbar-track { background: transparent; }
    .persona-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 2px; }

    .persona-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      margin-bottom: 4px;
      position: relative;
    }
    .persona-card:hover { background: var(--panel-2); border-color: var(--line-2); }
    .persona-card.active { background: rgba(255,61,146,0.10); border-color: var(--accent); }
    .persona-card.active::before {
      content: '';
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 60%;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }
    .persona-thumb {
      width: 48px; height: 48px;
      border-radius: 6px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-2);
      display: flex; align-items: center; justify-content: center;
    }
    .persona-thumb svg { width: 100%; height: 100%; display: block; }
    .persona-info { flex: 1; min-width: 0; }
    .persona-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .persona-family { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .persona-palette { display: flex; gap: 3px; margin-top: 5px; }
    .palette-dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); }

    /* ── Stage ── */
    #stage {
      grid-area: stage;
      background: #000;
      position: relative;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #stage canvas { display: block; }

    .persona-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(13,9,24,0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line-2);
      border-radius: 8px;
      padding: 8px 14px;
      display: none;
      min-width: 160px;
    }
    .persona-badge.visible { display: block; }
    .badge-family { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
    .badge-name { font-size: 14px; font-weight: 600; color: var(--fg); }

    .persona-desc {
      position: absolute;
      bottom: 12px; left: 12px; right: 12px;
      background: rgba(13,9,24,0.75);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      display: none;
    }
    .persona-desc.visible { display: block; }

    .stage-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,61,146,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,61,146,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .stage-hint {
      position: absolute;
      bottom: 12px; right: 12px;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    /* ── Right panel ── */
    #panels {
      grid-area: panels;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-section { padding: 14px; border-bottom: 1px solid var(--line); }
    .panel-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }

    .level-bars { display: flex; align-items: flex-end; gap: 3px; height: 52px; }
    .level-bar { flex: 1; border-radius: 2px 2px 0 0; min-height: 3px; transition: height 0.05s; }
    .level-bar.bass   { background: var(--accent); }
    .level-bar.mid    { background: var(--accent-3); }
    .level-bar.treble { background: var(--accent-2); }
    .level-bar.rms    { background: var(--fg); opacity: 0.4; }

    .fx-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .fx-tag {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
      padding: 4px 8px; border-radius: 4px;
      background: var(--bg-2); border: 1px solid var(--line);
      color: var(--muted); text-transform: uppercase; text-align: center;
    }

    .audio-note {
      font-size: 11px;
      color: var(--dim);
      text-align: center;
      padding: 16px 8px;
      line-height: 1.6;
    }
    .audio-note strong { color: var(--muted); }

    /* ── Footer ── */
    #footer {
      grid-area: footer;
      background: var(--panel);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 16px;
    }
    .footer-status { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .footer-status span { color: var(--ok); }

    /* ── Invite gate overlay ── */
    #invite-gate-overlay {
      position: fixed; inset: 0;
      background: rgba(5,3,8,0.92);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #invite-gate-overlay.visible { display: flex; }

    /* ── States ── */
    .loading-personas {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 48px 16px;
      gap: 12px; color: var(--muted);
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .loading-spinner {
      width: 24px; height: 24px;
      border: 2px solid var(--line-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-search { padding: 32px 16px; text-align: center; color: var(--dim); font-size: 12px; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      #app {
        grid-template-columns: 220px 1fr;
        grid-template-rows: 56px 1fr 48px;
        grid-template-areas:
          "header header"
          "sidebar stage"
          "footer footer";
      }
      #panels { display: none; }
    }
    @media (max-width: 600px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: 56px 1fr 48px;
        grid-template-areas: "header" "stage" "footer";
      }
      #sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- Invite gate overlay -->
<div id="invite-gate-overlay">
  <div id="invite-modal-root"></div>
</div>

<!-- App shell -->
<div id="app">

  <!-- Header / Transport -->
  <header id="header">
    <div class="brand">SWR</div>
    <div class="sep">/</div>
    <div class="transport-group">
      <button class="btn-icon" id="btn-prev" title="Previous">⏮</button>
      <button class="btn-icon" id="btn-play" title="Play / Pause">▶</button>
      <button class="btn-icon" id="btn-next" title="Next">⏭</button>
    </div>
    <div class="time-display" id="time-display">0:00 / 0:00</div>
    <div class="bpm-pill" id="bpm-pill">— BPM</div>
    <div class="header-right">
      <button class="btn-rec" id="btn-rec" title="Record">REC</button>
      <a href="/engine" class="open-full" id="open-full">Open full engine →</a>
    </div>
  </header>

  <!-- Sidebar — persona browser -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Personas</div>
      <input class="search-bar" id="persona-search" type="search"
             placeholder="Search personas…" autocomplete="off" />
    </div>
    <div class="family-chips" id="family-chips">
      <button class="family-chip active" data-family="">All</button>
    </div>
    <div class="persona-list" id="persona-list">

        <div class="loading-spinner"></div>
        Loading personas…
      </div>
    </div>
  </aside>

  <!-- Stage -->
  <section id="stage">
    <div class="stage-grid"></div>
    <canvas id="canvas"></canvas>
    <div class="persona-badge" id="persona-badge">
      <div class="badge-family" id="badge-family">—</div>
      <div class="badge-name" id="badge-name">No persona selected</div>
    </div>
    <div class="persona-desc" id="persona-desc"></div>
    <div class="stage-hint">Persona Engine</div>
  </section>

  <!-- Right panel -->
  <aside id="panels">
    <div class="panel-section">
      <div class="panel-label">Audio Levels</div>
      <div class="level-bars" id="level-bars">
        <div class="level-bar bass"  id="bar-bass"   style="height:20%"></div>
        <div class="level-bar mid"   id="bar-mid"    style="height:15%"></div>
        <div class="level-bar treble" id="bar-treble" style="height:10%"></div>
        <div class="level-bar rms"   id="bar-rms"    style="height:25%"></div>
      </div>
    </div>
    <div class="panel-section">
      <div class="panel-label">FX Tags</div>
      <div class="fx-summary" id="fx-summary">
        <div class="fx-tag">—</div>
        <div class="fx-tag">—</div>
        <div class="fx-tag">—</div>
        <div class="fx-tag">—</div>
      </div>
    </div>
    <div class="panel-section">
      <div class="panel-label">Active Persona</div>
      <div id="active-persona-info" style="color:var(--muted);font-size:12px;line-height:1.6">None selected</div>
    </div>
    <div class="panel-section">
      <div class="panel-label">Audio Input</div>
      <div class="audio-note">
        Load audio in the<br>
        <a href="/engine" style="color:var(--accent-2)"><strong>full engine →</strong></a><br>
        to drive audio reactivity.
      </div>
    </div>
  </aside>

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-status">Engine <span>READY</span></div>
    <div style="flex:1"></div>
    <div class="footer-status" id="preset-count">— personas</div>
  </footer>

</div>

<script>
/* ─────────────────────────────────────────────────────────────────────────────
   engine-personas.html
   ─ Persona-browser-first SWR variant.

   Features:
   - Live persona card browser (fetches from /api/presets)
   - Full-text search + family chip filters
   - Click a card → dispatches 'swr-preset-applied' for engine integration
   - Canvas preview renders the persona's SVG thumbnail animatedly
   - Invite gate blocks REC; full engine at /engine has all recording features
   ─────────────────────────────────────────────────────────────────────────────*/

const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const stage   = document.getElementById('stage');

// ── Canvas setup ──────────────────────────────────────────────────────────────
function resizeCanvas() {
  canvas.width  = stage.clientWidth;
  canvas.height  = stage.clientHeight;
  canvas.style.width  = stage.clientWidth  + 'px';
  canvas.style.height = stage.clientHeight + 'px';
  drawCanvasBackground();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ── Canvas background — persona palette gradient ─────────────────────────────
let currentPalette = null;
let canvasAnimFrame = null;
let canvasTime = 0;

function drawCanvasBackground() {
  if (!ctx) return;
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // Dark base
  const bg = currentPalette && currentPalette.bg ? currentPalette.bg : '#0a0a14';
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  if (!currentPalette) return;

  const { primary='#ff3d92', secondary='#00e5ff', accent='#ffd24a' } = currentPalette;

  // Ambient radial glows
  const cx = w * 0.4, cy = h * 0.4;
  const g1 = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) * 0.5);
  g1.addColorStop(0, hexAlpha(primary, 0.25));
  g1.addColorStop(1, 'transparent');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, w, h);

  const cx2 = w * 0.7, cy2 = h * 0.65;
  const g2 = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, Math.min(w, h) * 0.4);
  g2.addColorStop(0, hexAlpha(secondary, 0.20));
  g2.addColorStop(1, 'transparent');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, w, h);

  // Subtle grid
  ctx.strokeStyle = hexAlpha(primary, 0.04);
  ctx.lineWidth = 1;
  const grid = 48;
  for (let x = 0; x < w; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let y = 0; y < h; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Canvas animation loop ─────────────────────────────────────────────────────
function startCanvasAnim() {
  if (canvasAnimFrame) cancelAnimationFrame(canvasAnimFrame);
  canvasTime = 0;
  function loop() {
    canvasTime += 0.016;
    drawCanvasFrame();
    canvasAnimFrame = requestAnimationFrame(loop);
  }
  canvasAnimFrame = requestAnimationFrame(loop);
}

function drawCanvasFrame() {
  if (!ctx || !currentPalette) return;
  const w = canvas.width, h = canvas.height;
  drawCanvasBackground();

  // Draw persona's SVG thumbnail scaled to fit
  if (window._activeThumbSvg) {
    const img = new Image();
    const svgBlob = new Blob([window._activeThumbSvg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(svgBlob);
    // Only draw when loaded — use a cached approach
    if (!window._thumbLoaded) {
      window._thumbImg = new Image();
      window._thumbImg.onload = () => { window._thumbLoaded = true; URL.revokeObjectURL(url); };
      window._thumbImg.src = url;
    } else if (window._thumbImg && window._thumbImg.complete) {
      const scale = Math.min(w * 0.6 / window._thumbImg.width, h * 0.6 / window._thumbImg.height);
      const iw = window._thumbImg.width * scale;
      const ih = window._thumbImg.height * scale;
      ctx.globalAlpha = 0.55 + 0.1 * Math.sin(canvasTime * 1.2);
      ctx.drawImage(window._thumbImg, (w - iw) / 2, (h - ih) / 2, iw, ih);
      ctx.globalAlpha = 1;
    }
  }
}

// ── Invite gate ───────────────────────────────────────────────────────────────
(function initGate() {
  const overlay = document.getElementById('invite-gate-overlay');
  const root    = document.getElementById('invite-modal-root');

  window.__swrInviteGateHandler = function () {
    overlay.classList.remove('visible');
  };

  document.addEventListener('swr-invite-unlocked', window.__swrInviteGateHandler);
  document.addEventListener('swr-invite-skipped',   window.__swrInviteGateHandler);

  // Wire REC button
  document.getElementById('btn-rec').addEventListener('click', () => {
    const btn = document.getElementById('btn-rec');
    if (btn.classList.contains('recording')) {
      btn.classList.remove('recording');
      return;
    }
    overlay.classList.add('visible');
    if (window.__swrInviteShowModal) {
      window.__swrInviteShowModal(root);
    }
  });
})();

// ── Transport ─────────────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', () => {
  // Placeholder — full audio in /engine
  const btn = document.getElementById('btn-play');
  btn.classList.toggle('active');
  btn.textContent = btn.classList.contains('active') ? '⏸' : '▶';
});
document.getElementById('btn-prev').addEventListener('click', () => {
  const cards = getFilteredCards();
  const cur = findActiveCardIdx(cards);
  if (cur > 0) cards[cur - 1].click();
});
document.getElementById('btn-next').addEventListener('click', () => {
  const cards = getFilteredCards();
  const cur = findActiveCardIdx(cards);
  if (cur < cards.length - 1) cards[cur + 1].click();
});

// ── State ─────────────────────────────────────────────────────────────────────
let personas      = [];
let activeId       = null;
let searchQuery   = '';
let familyFilter  = '';

// ── API fetch ─────────────────────────────────────────────────────────────────
async function loadPersonas() {
  try {
    const res  = await fetch('/api/presets');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    personas   = data.presets || [];
    renderFamilyChips(data.families || []);
    renderPersonas();
    document.getElementById('preset-count').textContent = personas.length + ' personas';
  } catch (e) {
    document.getElementById('persona-list').innerHTML =
      '<div class="empty-search">Failed to load personas.<br><small>' + e.message + '</small><br><a href="/engine" style="color:var(--accent-2)">Open full engine →</a></div>';
  }
}

// ── Family chips ──────────────────────────────────────────────────────────────
function renderFamilyChips(families) {
  const container = document.getElementById('family-chips');
  container.innerHTML = '';
  for (const [label, val] of [['', 'All'], ...families.map(f => [f, f])]) {
    const btn = document.createElement('button');
    btn.className = 'family-chip' + (familyFilter === val ? ' active' : '');
    btn.dataset.family = val;
    btn.textContent = label || val;
    btn.addEventListener('click', () => setFamily(val));
    container.appendChild(btn);
  }
}

function setFamily(f) {
  familyFilter = f;
  document.querySelectorAll('.family-chip').forEach(c =>
    c.classList.toggle('active', c.dataset.family === f)
  );
  renderPersonas();
}

// ── Card rendering ────────────────────────────────────────────────────────────
function getFilteredCards() {
  let list = personas;
  if (familyFilter) list = list.filter(p => p.family === familyFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p =>
      [p.name, p.description, p.family, ...(p.tags || [])].join(' ').toLowerCase().includes(q)
    );
  }
  return list;
}

function findActiveCardIdx(cards) {
  return cards.findIndex(c => c.dataset.id === activeId);
}

function renderPersonas() {
  const list   = document.getElementById('persona-list');
  const filtered = getFilteredCards();

  if (!filtered.length) {
    list.innerHTML = '<div class="empty-search">No personas match' +
      (searchQuery ? ' "' + searchQuery + '"' : '') + '</div>';
    return;
  }

  list.innerHTML = '';
  for (const p of filtered) {
    const card = document.createElement('div');
    card.className = 'persona-card' + (p.id === activeId ? ' active' : '');
    card.dataset.id = p.id;

    const thumbSvg = (p.preview && p.preview.thumbnail_svg) || fallbackThumb(p);

    const paletteDots = Object.values(p.palette || {})
      .filter(Boolean)
      .slice(0, 4)
      .map(c => `<div class="palette-dot" style="background:${c}" title="${c}"></div>`)
      .join('');

    card.innerHTML = `
      <div class="persona-thumb">${thumbSvg}</div>
      <div class="persona-info">
        <div class="persona-name">${p.name}</div>
        <div class="persona-family">${p.family}</div>
        <div class="persona-palette">${paletteDots}</div>
      </div>`;

    card.addEventListener('click', () => applyPersona(p));
    list.appendChild(card);
  }
}

function fallbackThumb(p) {
  const bg   = p.palette && p.palette.bg     || '#1a1028';
  const prim = p.palette && p.palette.primary || '#ff3d92';
  return `<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <rect width="48" height="48" fill="${bg}"/>
    <rect x="6" y="6" width="36" height="36" rx="6" fill="${prim}" opacity="0.5"/>
    <circle cx="24" cy="24" r="8" fill="${prim}" opacity="0.3"/>
  </svg>`;
}

// ── Apply persona ─────────────────────────────────────────────────────────────
function applyPersona(p) {
  activeId = p.id;

  // Highlight card
  document.querySelectorAll('.persona-card').forEach(c =>
    c.classList.toggle('active', c.dataset.id === p.id)
  );

  // Badge
  const badge = document.getElementById('persona-badge');
  badge.classList.add('visible');
  document.getElementById('badge-family').textContent = p.family;
  document.getElementById('badge-name').textContent    = p.name;

  // Description overlay
  const desc = document.getElementById('persona-desc');
  desc.textContent = p.description || '';
  desc.classList.toggle('visible', !!p.description);

  // FX tags
  const tags = (p.preview && p.preview.tags) || p.tags || [];
  const summary = document.getElementById('fx-summary');
  summary.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const tag = document.createElement('div');
    tag.className = 'fx-tag';
    tag.textContent = tags[i] || '—';
    summary.appendChild(tag);
  }

  // Active persona info
  document.getElementById('active-persona-info').innerHTML =
    `<strong style="color:var(--fg)">${p.name}</strong><br><span style="color:var(--accent)">${p.family}</span>` +
    (p.description ? `<br><span style="color:var(--muted);font-size:11px">${p.description.slice(0,80)}${p.description.length > 80 ? '…' : ''}</span>` : '');

  // Canvas palette
  currentPalette = p.palette || {};
  window._activeThumbSvg = p.preview && p.preview.thumbnail_svg;
  window._thumbLoaded = false;
  drawCanvasBackground();
  startCanvasAnim();

  // Dispatch event (engine.html listens via its inline handlers)
  document.dispatchEvent(new CustomEvent('swr-preset-applied', {
    bubbles: true,
    detail: { id: p.id, preset: p }
  }));
  window.__swrActivePersona = p;
}

// ── Search ─────────────────────────────────────────────────────────────────────
let searchTimer = null;
document.getElementById('persona-search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderPersonas();
  }, 180);
});

// ── Keyboard nav in sidebar ────────────────────────────────────────────────────
document.getElementById('persona-search').addEventListener('keydown', e => {
  const cards = getFilteredCards();
  if (!cards.length) return;
  const cur = findActiveCardIdx(cards);
  if (e.key === 'ArrowDown') { e.preventDefault(); cards[Math.min(cur + 1, cards.length - 1)].click(); cards[Math.min(cur + 1, cards.length - 1)].scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); cards[Math.max(cur - 1, 0)].click(); cards[Math.max(cur - 1, 0)].scrollIntoView({ block: 'nearest' }); }
});

// ── Boot ───────────────────────────────────────────────────────────────────────
loadPersonas();
</script>
