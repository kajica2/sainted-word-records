<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>AR Animation Loop — Sainted Word Records</title>
  <meta name="description" content="Drop a GIF, see it loop in your space via markerless AR." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231a1028' stroke='%23ff3d92' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff3d92'/%3E%3Ccircle cx='16' cy='16' r='0.8' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/video-fx.css" />
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #050308; color: #f5e9ff; font: 14px/1.4 system-ui, sans-serif; }
    #root { display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; min-height: 100dvh; }
    header { padding: 12px 16px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #2a1d3a; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header .spacer { flex: 1; }
    header a { color: #ff3d92; text-decoration: none; }
    #stage { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #ar-fallback { display: none; width: 100%; height: 100%; background: radial-gradient(ellipse at center, #0d0918 0%, #050308 70%); }
    body.no-camera #ar-fallback { display: flex; align-items: center; justify-content: center; }
    body.no-camera #ar-fallback::before { content: 'No camera — preview only. Use a mobile device for AR.'; color: #5a4a6a; font-size: 13px; }
    body.no-camera a-scene { display: none; }
    a-scene, #ar-fallback { width: 100% !important; height: 100% !important; }
    footer { padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid #2a1d3a; }
    footer button { background: #ff3d92; color: #050308; border: 0; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font: inherit; }
    footer button[disabled] { background: #3a2a4a; color: #9a8aaa; cursor: not-allowed; }
    footer button.ghost { background: transparent; color: #f5e9ff; border: 1px solid #2a1d3a; }
    footer input[type=file] { display: none; }
    footer label.file { background: #00e5ff; color: #050308; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; user-select: none; }
    footer .spacer { flex: 1; }
    .status { font-size: 12px; color: #9a8aaa; min-width: 100px; text-align: right; }
    .status.err { color: #ff6e6e; }
    .pill { display: inline-block; padding: 2px 8px; border: 1px solid #2a1d3a; border-radius: 999px; font-size: 11px; color: #9a8aaa; font-family: ui-monospace, monospace; }
    .pill.ready { color: #00e5ff; border-color: #00e5ff44; }
    .pill.recording { color: #ff3d92; border-color: #ff3d9244; animation: blink 1s infinite; }
    .pill.error { color: #ff6e6e; border-color: #ff6e6e44; }
    @keyframes blink { 50% { opacity: 0.5; } }
  </style>

  <!-- A-Frame + AR.js (CDN, pinned). gif-shader is optional and loaded
       after the scene so a CDN failure doesn't break the page — static
       images still work via the standard material component. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-gif-shader@0.9.1/dist/aframe-gif-shader.min.js" crossorigin="anonymous" onerror="window.__gifShaderFailed=true"></script>
</head>
<body>
  <div id="root">
    <header>
      <h1>AR Animation Loop</h1>
      <span class="pill" id="pill-state">idle</span>
      <span class="spacer"></span>
      <a href="/engine">← Back to engine</a>
    </header>

    <main id="stage">
      <a-scene
        id="scene"
        embedded
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true;">
        <a-assets>
          <img id="userGif" alt="" crossorigin="anonymous" />
        </a-assets>
        <!-- material uses gif shader when registered, else plain textured
             material. Controller swaps in gif shader post-load if available. -->
        <a-plane id="plane"
          material="src: #userGif; transparent: true; side: double; alphaTest: 0.01"
          position="0 0 -2"
          width="1.5" height="1.5"
          animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear;">
        </a-plane>
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity camera="active: true"></a-entity>
      </a-scene>
      <div id="ar-fallback" aria-hidden="true"></div>
    </main>

    <footer>
      <input type="file" id="fileInput" accept="image/gif,image/png,image/jpeg,image/webp" aria-label="Choose GIF or image file" />
      <label class="file" for="fileInput">Choose GIF or image</label>
      <button id="recordBtn" disabled>Record 5s</button>
      <button id="resetBtn" class="ghost" disabled>Reset</button>
      <button id="shareBtn" class="ghost" disabled>Share link</button>
      <span class="spacer"></span>
      <span class="status" id="status" role="status" aria-live="polite">Drop a file to begin.</span>
    </footer>
  </div>

  <script defer src="/client/ar-loop-app.client.js"></script>
</body>
</html>
