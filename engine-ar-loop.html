<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>AR Animation Loop — Sainted Word Records</title>
  <meta name="description" content="Drop a GIF, see it loop in your space via markerless AR." />
  <meta name="theme-color" content="#050308" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231a1028' stroke='%23ff3d92' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff3d92'/%3E%3Ccircle cx='16' cy='16' r='0.8' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/video-fx.css" />
  <style>
    /* AR Animation Loop — brand tokens mirror engine.html :root
       so this page reads as a peer of the engine, not a separate
       mini-app.  Keep palette + font choices synced with the
       canonical engine.html values (see :root in that file). */
    :root {
      color-scheme: dark;
      --bg-0: #050308;
      --bg-1: #0d0918;
      --bg-2: #1a1226;
      --panel: #11091a;
      --panel-2: #1a1028;
      --line: #2a1d3a;
      --line-2: #3a2a4a;
      --fg: #f5e9ff;
      --muted: #9a8aaa;
      --dim: #5a4a6a;
      --accent: #ff3d92;
      --accent-2: #00e5ff;
      --accent-3: #ffd24a;
      --warn: #ff7a3d;
      --ok: #00ffa3;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      background: var(--bg-0);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      /* Same warm-pink / cool-cyan corner glow engine.html uses so
         the page reads as the same family at first glance. */
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(255, 61, 146, 0.12), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(0, 229, 255, 0.10), transparent 50%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1));
    }

    /* === LAYOUT ===
       header / stage / footer vertically.  Heights chosen to mirror
       engine.html's 56px / 1fr / 48px transport strip. */
    #root {
      display: grid;
      grid-template-rows: 56px 1fr 56px;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-0);
    }

    /* === HEADER / TRANSPORT ===
       Same look as engine.html's header#transport: gradient bar,
       brand mark in mono pink, title in fg, status pill, spacer,
       ghost nav-link.  Adds a small "v1.0" version chip so the page
       declares itself part of the engine family. */
    header {
      background: linear-gradient(180deg, var(--bg-2), var(--panel));
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      min-height: 56px;
    }
    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 13px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(255, 61, 146, 0.45);
      white-space: nowrap;
      text-decoration: none;
    }
    .brand:hover { color: #ff5fa3; }
    .brand small {
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-left: 6px;
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    header a.back {
      color: var(--muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    header a.back:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--bg-2);
      text-decoration: none;
    }
    header a.back:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .spacer { flex: 1; }
    .ver-chip {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 3px 8px;
      border-radius: 3px;
      color: var(--accent-2);
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.3);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* === STATUS PILL ===
       Mirrors engine.html .pill exactly (mono caps, 999px, 4px×10px).
       idle = muted; ok = accent-2 cyan; live = accent pink with
       pulse animation; warn = warn orange; error = warn red.
       The ar-loop controller applies these classes on the
       #pill-state span. */
    .pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--bg-1);
      border: 1px solid var(--line);
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      transition: color 0.12s, border-color 0.12s;
    }
    /* Engine vocabulary: ok = cyan (ready), live = pink pulse (active),
       warn = orange (soft problem), error = red (hard fail).  The
       controller also writes "ready"/"recording" class names (its
       own state machine); those are aliased to the same visuals so
       the page reads consistently regardless of which class set a
       caller used. */
    .pill.ok    { color: var(--accent-2); border-color: rgba(0, 229, 255, 0.35); }
    .pill.live,
    .pill.recording { color: var(--accent); border-color: rgba(255, 61, 146, 0.45); animation: ar-pulse 1.4s ease-in-out infinite; }
    .pill.warn  { color: var(--warn);     border-color: rgba(255, 122, 61, 0.45); }
    .pill.error { color: var(--warn);     border-color: rgba(255, 122, 61, 0.45); }
    /* Controller uses .ready for upload-complete; map it to the same
       cyan "ok" treatment so both vocabularies converge. */
    .pill.ready { color: var(--accent-2); border-color: rgba(0, 229, 255, 0.35); }
    @keyframes ar-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* === STAGE / AR SCENE ===
       Stage fills the middle row and centers the A-Frame scene. */
    #stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }
    a-scene, #ar-fallback {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      inset: 0;
    }

    /* === CAMERA-UNAVAILABLE FALLBACK ===
       Properly authored DOM (not a CSS ::before rule) so the
       message can be styled, animated, and screen-reader-friendly. */
    #ar-fallback {
      display: none;
      background: radial-gradient(ellipse at center, var(--bg-1) 0%, var(--bg-0) 70%);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      padding: 24px;
      text-align: center;
    }
    body.no-camera #ar-fallback { display: flex; }
    body.no-camera a-scene { display: none; }
    .fallback-msg {
      color: var(--dim);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      max-width: 280px;
      line-height: 1.5;
    }
    .fallback-msg .accent { color: var(--accent-2); }
    .fallback-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--line-2);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-2);
      margin-bottom: 4px;
    }
    .fallback-icon svg { width: 24px; height: 24px; }

    /* === FOOTER ===
       Bottom strip with file picker label, action buttons, status.
       Same surface treatment as the header (panel-2 gradient,
       hairline border on top), with the same button vocabulary
       engine.html uses. */
    footer {
      background: var(--panel);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      min-height: 56px;
      flex-wrap: wrap;
    }
    .record-help {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--dim);
      text-transform: uppercase;
      max-width: 140px;
      line-height: 1.4;
    }

    /* === BUTTONS — engine.html .tbtn vocabulary ===
       Labelled <label> for the file picker = cyan accent button so
       the page's primary CTA (drop a media file) pops in the same
       pink/cyan/amber system engine pages use. */
    footer .btn {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 8px 14px;
      border: 1px solid var(--line-2);
      border-radius: 6px;
      background: var(--panel-2);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.12s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    footer .btn:hover:not([disabled]) {
      background: var(--bg-2);
      border-color: var(--accent);
    }
    footer .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    footer .btn[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Cyan primary CTA for the file picker — same accent-2 treatment
       engine.html uses for its export-video button (the "do
       something with media you have" action). */
    footer .btn.primary {
      background: var(--accent-2);
      color: #000;
      border-color: var(--accent-2);
      font-weight: 700;
    }
    footer .btn.primary:hover:not([disabled]) {
      background: #4af2ff;
      border-color: #4af2ff;
    }
    footer .btn.primary:focus-visible {
      outline-color: var(--accent-2);
    }

    /* Pink "do this" CTA — same accent-on-dark treatment engine.html
       uses for its record button.  Lives on the recording button so
       the most consequential footer action is unmistakable. */
    footer .btn.danger {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 700;
    }
    footer .btn.danger:hover:not([disabled]) {
      background: #ff5fa3;
      border-color: #ff5fa3;
    }
    footer .btn.danger:focus-visible {
      outline-color: var(--accent);
    }
    footer .btn.ghost {
      background: transparent;
      border-color: var(--line);
    }
    footer .btn.ghost:hover:not([disabled]) {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Hide the raw file input — the styled label is the click target. */
    footer input[type=file] {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0);
      white-space: nowrap; border: 0;
    }

    .status {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--muted);
      min-width: 100px;
      text-align: right;
      margin-left: 4px;
    }
    .status.err { color: var(--warn); }

    /* Reduced motion: kill the live-pill pulse + recording blink so
       users who opt out don't get the perceptual flicker. */
    @media (prefers-reduced-motion: reduce) {
      .pill.live { animation: none; }
    }

    /* Narrow viewports: stack the status below the action row, drop
       the help text so the footer fits on one line. */
    @media (max-width: 640px) {
      .record-help { display: none; }
      footer { gap: 8px; }
      .status { width: 100%; text-align: left; margin-left: 0; }
    }
  </style>

  <!-- A-Frame + AR.js (CDN, pinned). gif-shader is optional and loaded
       after the scene so a CDN failure doesn't break the page — static
       images still work via the standard material component. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-gif-shader@0.9.1/dist/aframe-gif-shader.min.js" crossorigin="anonymous" onerror="window.__gifShaderFailed=true"></script>
</head>
<body>
  <div id="root">
    <header>
      <a class="brand" href="/">SAINTED-WORD <small>records</small></a>
      <span class="ver-chip">v1.0 · ar-loop</span>
      <h1>AR Animation Loop</h1>
      <span class="pill" id="pill-state">idle</span>
      <span class="spacer"></span>
      <a class="back" href="/engine">← Back to engine</a>
    </header>

    <main id="stage">
      <a-scene
        id="scene"
        embedded
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        vr-mode-ui="enabled: false"
        renderer="antialias: true; alpha: true;">
        <a-assets>
          <img id="userGif" alt="" crossorigin="anonymous" />
        </a-assets>
        <!-- material uses gif shader when registered, else plain textured
             material. Controller swaps in gif shader post-load if available. -->
        <a-plane id="plane"
          material="src: #userGif; transparent: true; side: double; alphaTest: 0.01"
          position="0 0 -2"
          width="1.5" height="1.5"
          animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear;">
        </a-plane>
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity camera="active: true"></a-entity>
      </a-scene>
      <div id="ar-fallback" role="status" aria-live="polite">
        <span class="fallback-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </span>
        <span class="fallback-msg">
          No camera access — preview only.<br />
          <span class="accent">Use a mobile device for live AR.</span>
        </span>
      </div>
    </main>

    <footer>
      <input type="file" id="fileInput" accept="image/gif,image/png,image/jpeg,image/webp" aria-label="Choose GIF or image file" />
      <label class="btn primary" for="fileInput">Choose GIF or image</label>
      <button class="btn danger" id="recordBtn" disabled title="Capture a 5-second WebM of the AR loop">Record 5s</button>
      <button class="btn ghost" id="resetBtn" disabled>Reset</button>
      <button class="btn ghost" id="shareBtn" disabled>Share link</button>
      <span class="record-help">5s WebM · mic off</span>
      <span class="spacer"></span>
      <span class="status" id="status" role="status" aria-live="polite">Drop a file to begin.</span>
    </footer>
  </div>

  <script defer src="/client/ar-loop-app.client.js"></script>
</body>
</html>
