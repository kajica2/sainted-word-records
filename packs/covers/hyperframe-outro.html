<!DOCTYPE html>
<!--
  packs/covers/hyperframe-outro.html — 3s HyperFrames outro for SWR videos.
  
  Contract: same as hyperframe-cover.html (paused timeline, deterministic, zero-dep).
  
  Parameters (query string):
    title=SWR          wordmark
    url=sainted-word.records  CTA URL
    accent=%23ff3d92   accent hue
    dur=3              duration (default 3s)
  
  Render: Full duration -> outro.mp4 (via CDP + ffmpeg)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWR Outro</title>
<style>
  :root {
    --bg-0: #05060a;
    --fg: #f5f7ff;
    --accent: #ff3d92;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-0); }
  .stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: var(--mono);
  }
  .wordmark {
    font-size: 3rem; font-weight: 700; letter-spacing: 0.2em;
    color: var(--fg); text-transform: uppercase;
    opacity: 0;
  }
  .cta {
    font-size: 1rem; letter-spacing: 0.3em;
    color: var(--accent); text-transform: uppercase;
    margin-top: 1rem;
    opacity: 0;
  }
  .cta-url {
    font-size: 0.8rem; letter-spacing: 0.15em;
    color: var(--fg); opacity: 0.6;
    margin-top: 0.3rem;
  }
  .bar {
    width: 80px; height: 2px;
    background: var(--accent);
    margin-top: 1.5rem;
    opacity: 0; transform: scaleX(0);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="wordmark" id="wordmark">SWR</div>
  <div class="cta" id="cta">Created with</div>
  <div class="cta-url" id="url">sainted-word.records</div>
  <div class="bar" id="bar"></div>
</div>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const title = params.get('title') || 'SWR';
  const url = params.get('url') || 'sainted-word.records';
  const accent = params.get('accent') || '#ff3d92';
  const dur = parseFloat(params.get('dur')) || 3;
  
  document.documentElement.style.setProperty('--accent', accent);
  document.getElementById('wordmark').textContent = title;
  document.getElementById('url').textContent = url;
  
  const wordmark = document.getElementById('wordmark');
  const cta = document.getElementById('cta');
  const bar = document.getElementById('bar');
  
  // Timeline: 0-0.3s wordmark fade in, 0.5-1.0s cta, 0.8-2.5s bar expand, hold, 2.5-3.0s fade out
  const tl1 = [
    { t: 0,   op: 0 },
    { t: 0.4, op: 1 },
    { t: 2.5, op: 1 },
    { t: 3.0, op: 0 },
  ];
  const tl2 = [
    { t: 0,   op: 0 },
    { t: 0.5, op: 1 },
    { t: 2.2, op: 1 },
    { t: 2.8, op: 0 },
  ];
  const tl3 = [
    { t: 0,    op: 0,   sx: 0 },
    { t: 0.8,  op: 1,   sx: 0.3 },
    { t: 1.5,  op: 1,   sx: 1 },
    { t: 2.5,  op: 1,   sx: 1 },
    { t: 3.0,  op: 0,    sx: 1.1 },
  ];
  
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  
  function sample(arr, t) {
    let i = 0;
    for (let j = 0; j < arr.length - 1; j++) {
      if (t >= arr[j].t && t <= arr[j + 1].t) { i = j; break; }
    }
    const a = arr[i], b = arr[i + 1];
    const p = (t - a.t) / (b.t - a.t);
    return {
      op: lerp(a.op, b.op, easeOut(p)),
      sx: a.sx !== undefined ? lerp(a.sx, b.sx, easeInOut(p)) : undefined,
    };
  }
  
  const start = performance.now();
  function tick(now) {
    const elapsed = (now - start) / 1000;
    if (elapsed > dur + 0.5) return;
    
    const s1 = sample(tl1, elapsed);
    const s2 = sample(tl2, elapsed);
    const s3 = sample(tl3, elapsed);
    
    wordmark.style.opacity = s1.op;
    cta.style.opacity = s2.op;
    bar.style.opacity = s3.op;
    bar.style.transform = `scaleX(${s3.sx})`;
    
    requestAnimationFrame(tick);
  }
  
  if (document.readyState === 'complete') {
    requestAnimationFrame(tick);
  } else {
    window.addEventListener('load', () => requestAnimationFrame(tick));
  }
  
  window.__timelines = [{
    duration: dur,
    kill: function() { start = 0; }
  }];
})();
</script>
</body>
</html>
