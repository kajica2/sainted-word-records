<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/lib/components.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breathe · Sainted Word Records</title>
<meta name="description" content="Music videos that breathe. Browser-native audio-reactive engine.">
<link rel="canonical" href="https://sainted-word-records.vercel.app/entrance-cinematic" />
  <meta property="og:image" content="https://sainted-word-records.vercel.app/press/og-card.png" />
<link rel="stylesheet" href="/lib/design-tokens.css">
<style>
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:#000; color:#fff; font-family:system-ui,sans-serif; }
.hero {
  min-height:75vh; display:grid; place-items:center; text-align:center; position:relative;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.7) 100%),
    radial-gradient(ellipse at 30% 20%, #ff3d92 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, #00e5ff 0%, transparent 50%);
  background-size: cover;
}
.hero::before {
  content:""; position:absolute; inset:0; opacity:0.3;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events:none;
}
.content { position:relative; z-index:1; max-width:700px; padding:2rem; }
.content h1 { font-size:clamp(2.8rem,8vw,5.5rem); font-weight:300; letter-spacing:-0.03em; margin:0 0 1rem; line-height:1.05; }
.content p { font-size:1.15rem; opacity:0.85; margin:0 0 2rem; line-height:1.5; }
.actions { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; }
.btn { padding:0.9rem 1.8rem; border-radius:6px; text-decoration:none; font-weight:600; font-size:0.95rem; }
.btn-primary { background:#ff3d92; color:#fff; }
.btn-ghost { border:1px solid rgba(255,255,255,0.4); color:#fff; }
.btn:hover { transform:translateY(-1px); }
</style>
</head>
<body>
  <swr-nav></swr-nav>
<main class="hero">
  <div class="content">
    <h1>Music videos that <em>breathe</em>.</h1>
    <p>Drop a song and your clips. The engine analyses the beat, routes every asset, and renders a layered composition in real time. Export MP4. No server, no subscription.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/engine">Start composing</a>
      <a class="btn btn-ghost" href="/versions">See visual languages</a>
    </div>
  </div>
</main>
  <script src="/lib/nav.client.js" defer></script>
  <swr-footer></swr-footer>
  <script src="/lib/footer.client.js" defer></script>
</body>
</html>
