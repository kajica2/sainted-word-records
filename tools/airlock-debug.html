<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airlock Debug Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    #airlock-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1a1a2e;
      border: 2px solid #ff6b1a;
      color: #ff6b1a;
      font-size: 18px;
      cursor: pointer;
      z-index: 99999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: transform 0.2s, background 0.2s;
    }
    #airlock-toggle:hover {
      transform: scale(1.1);
      background: #2a2a3e;
    }
    #airlock-toggle.has-errors {
      border-color: #ff4444;
      color: #ff4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,68,68,0); }
    }
    
    #airlock-panel {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 420px;
      max-height: 60vh;
      background: #0d0d14;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      display: none;
      flex-direction: column;
      z-index: 99998;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px;
      overflow: hidden;
    }
    #airlock-panel.visible { display: flex; }
    
    #airlock-header {
      padding: 10px 12px;
      background: #1a1a2e;
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #airlock-title {
      color: #ff6b1a;
      font-weight: 600;
      font-size: 12px;
    }
    #airlock-stats {
      color: #666;
      font-size: 10px;
    }
    #airlock-actions {
      display: flex;
      gap: 6px;
    }
    .airlock-btn {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #3a3a4e;
      background: transparent;
      color: #888;
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .airlock-btn:hover {
      background: #2a2a3e;
      color: #fff;
    }
    .airlock-btn.copy {
      border-color: #ff6b1a;
      color: #ff6b1a;
    }
    .airlock-btn.copy:hover {
      background: #ff6b1a;
      color: #000;
    }
    .airlock-btn.clear {
      border-color: #ff4444;
      color: #ff4444;
    }
    .airlock-btn.clear:hover {
      background: #ff4444;
      color: #fff;
    }
    
    #airlock-filter {
      padding: 8px 12px;
      background: #14141a;
      border-bottom: 1px solid #2a2a3e;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #airlock-filter input {
      flex: 1;
      background: #0d0d14;
      border: 1px solid #2a2a3e;
      border-radius: 4px;
      padding: 4px 8px;
      color: #ccc;
      font-size: 10px;
      font-family: inherit;
    }
    #airlock-filter input:focus {
      outline: none;
      border-color: #ff6b1a;
    }
    .filter-check {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #666;
      font-size: 10px;
      cursor: pointer;
    }
    .filter-check input { margin: 0; }
    .filter-check:hover { color: #888; }
    
    #airlock-logs {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-entry {
      padding: 6px 8px;
      border-radius: 4px;
      background: #14141a;
      border-left: 3px solid #444;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .log-entry.error { 
      border-left-color: #ff4444; 
      background: #1a0a0a;
    }
    .log-entry.warn { 
      border-left-color: #ffaa00; 
      background: #1a1a0a;
    }
    .log-entry.info { 
      border-left-color: #4488ff; 
    }
    .log-entry.page {
      border-left-color: #ff6b1a;
      background: #1a1410;
      font-weight: 600;
      color: #ff6b1a;
    }
    .log-entry.success {
      border-left-color: #44ff88;
      background: #0a1a0f;
    }
    .log-meta {
      color: #666;
      font-size: 9px;
      margin-bottom: 2px;
    }
    .log-page {
      color: #ff6b1a;
      font-weight: 600;
    }
    .log-type {
      padding: 1px 4px;
      border-radius: 2px;
      font-size: 8px;
      text-transform: uppercase;
      margin-right: 6px;
    }
    .log-type.error { background: #ff4444; color: #000; }
    .log-type.warn { background: #ffaa00; color: #000; }
    .log-type.info { background: #4488ff; color: #000; }
  </style>
</head>
<body>
  <button id="airlock-toggle" title="Toggle Debug Panel">⚡</button>
  
  <div id="airlock-panel">
    <div id="airlock-header">
      <div>
        <div id="airlock-title">Airlock Debug</div>
        <div id="airlock-stats">0 entries</div>
      </div>
      <div id="airlock-actions">
        <button class="airlock-btn copy" id="airlock-copy">Copy All</button>
        <button class="airlock-btn clear" id="airlock-clear">Clear</button>
      </div>
    </div>
    
    <div id="airlock-filter">
      <input type="text" id="airlock-search" placeholder="Filter logs...">
      <label class="filter-check">
        <input type="checkbox" id="filter-errors" checked> Errors
      </label>
      <label class="filter-check">
        <input type="checkbox" id="filter-warns" checked> Warnings
      </label>
      <label class="filter-check">
        <input type="checkbox" id="filter-info" checked> Info
      </label>
    </div>
    
    <div id="airlock-logs"></div>
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'airlock_logs';
      let logs = [];
      let filterErrors = true;
      let filterWarns = true;
      let filterInfo = true;
      let searchTerm = '';
      
      // Load persisted logs
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) logs = JSON.parse(saved);
      } catch(e) {}
      
      const toggle = document.getElementById('airlock-toggle');
      const panel = document.getElementById('airlock-panel');
      const logsEl = document.getElementById('airlock-logs');
      const statsEl = document.getElementById('airlock-stats');
      const copyBtn = document.getElementById('airlock-copy');
      const clearBtn = document.getElementById('airlock-clear');
      const searchInput = document.getElementById('airlock-search');
      const filterErrorsCb = document.getElementById('filter-errors');
      const filterWarnsCb = document.getElementById('filter-warns');
      const filterInfoCb = document.getElementById('filter-info');
      
      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(logs.slice(-500)));
        } catch(e) {}
      }
      
      function getPageName() {
        const path = window.location.pathname;
        const match = path.match(/\/versions\/([^\/]+?)(?:\.html)?$/);
        return match ? match[1] : path.split('/').pop() || 'unknown';
      }
      
      function formatTime(date) {
        return date.toTimeString().split(' ')[0] + '.' + String(date.getMilliseconds()).padStart(3, '0');
      }
      
      function addLog(type, message, meta) {
        const entry = {
          type,
          message,
          meta,
          page: getPageName(),
          time: new Date().toISOString(),
          id: Date.now() + Math.random()
        };
        logs.push(entry);
        if (logs.length > 1000) logs.shift();
        save();
        render();
        updateToggle();
      }
      
      function updateToggle() {
        const errorCount = logs.filter(l => l.type === 'error').length;
        toggle.textContent = errorCount > 0 ? String(errorCount) : '⚡';
        toggle.classList.toggle('has-errors', errorCount > 0);
      }
      
      function render() {
        const filtered = logs.filter(l => {
          if (l.type === 'error' && !filterErrors) return false;
          if (l.type === 'warn' && !filterWarns) return false;
          if (l.type === 'info' && !filterInfo) return false;
          if (searchTerm && !l.message.toLowerCase().includes(searchTerm.toLowerCase())) return false;
          return true;
        });
        
        statsEl.textContent = `${filtered.length} entries`;
        
        logsEl.innerHTML = filtered.map(l => {
          const time = new Date(l.time).toTimeString().split(' ')[0];
          const typeClass = l.type === 'page' ? 'page' : l.type;
          return `<div class="log-entry ${typeClass}">
            <div class="log-meta">
              <span class="log-page">[${l.page}]</span>
              <span>${time}</span>
              ${l.type !== 'page' ? `<span class="log-type ${l.type}">${l.type}</span>` : ''}
            </div>
            <div>${escapeHtml(l.message)}</div>
          </div>`;
        }).join('');
        
        logsEl.scrollTop = logsEl.scrollHeight;
      }
      
      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      
      function getExportText() {
        return logs.map(l => {
          const time = new Date(l.time).toISOString();
          return `[${time}] [${l.page.toUpperCase()}] ${l.type.toUpperCase()}: ${l.message}`;
        }).join('\n');
      }
      
      // Toggle panel
      toggle.addEventListener('click', () => {
        panel.classList.toggle('visible');
      });
      
      // Copy all
      copyBtn.addEventListener('click', () => {
        const text = getExportText();
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => copyBtn.textContent = 'Copy All', 1500);
        });
      });
      
      // Clear
      clearBtn.addEventListener('click', () => {
        if (confirm('Clear all logs?')) {
          logs = [];
          save();
          render();
          updateToggle();
        }
      });
      
      // Filters
      filterErrorsCb.addEventListener('change', () => {
        filterErrors = filterErrorsCb.checked;
        render();
      });
      filterWarnsCb.addEventListener('change', () => {
        filterWarns = filterWarnsCb.checked;
        render();
      });
      filterInfoCb.addEventListener('change', () => {
        filterInfo = filterInfoCb.checked;
        render();
      });
      
      // Search
      searchInput.addEventListener('input', () => {
        searchTerm = searchInput.value;
        render();
      });
      
      // Intercept console
      const origError = console.error;
      const origWarn = console.warn;
      const origInfo = console.info;
      const origLog = console.log;
      
      console.error = function(...args) {
        origError.apply(console, args);
        addLog('error', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };
      console.warn = function(...args) {
        origWarn.apply(console, args);
        addLog('warn', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };
      console.info = function(...args) {
        origInfo.apply(console, args);
        addLog('info', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };
      console.log = function(...args) {
        origLog.apply(console, args);
        addLog('info', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
      };
      
      // Intercept errors
      window.addEventListener('error', (e) => {
        addLog('error', `${e.message} at ${e.filename}:${e.lineno}`);
      });
      window.addEventListener('unhandledrejection', (e) => {
        addLog('error', `Unhandled Promise: ${e.reason}`);
      });
      
      // Log page load
      addLog('page', `Loaded: ${window.location.href}`);
      addLog('success', 'Airlock Debug Panel active');
      
      // Initial render
      render();
      updateToggle();
    })();
  </script>
</body>
</html>
