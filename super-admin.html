<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Admin | SWR Control Center</title>
  <meta name="description" content="The SWR control centre: live pipeline, instance and health state, and the parameter bench." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0a0a'/%3E%3Cpath d='M9 21V11l7 6 7-6v10' stroke='%233b82f6' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --bg-card-hover: #1a1a1a;
      --border: #2a2a2a;
      --text: #e0e0e0;
      --text-dim: #888;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 20px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }
    .status-badge.ok { color: var(--green); border-color: var(--green); }
    .status-badge.warn { color: var(--yellow); border-color: var(--yellow); }
    .status-badge.bad { color: var(--red); border-color: var(--red); }
    .clock { font-size: 12px; color: var(--text-dim); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .card.full-width { grid-column: 1 / -1; }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }
    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card-title .icon { font-size: 16px; }
    .agent-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
    .dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.warn { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
    .dot.bad { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .metric { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
    .metric-label { color: var(--text-dim); }
    .metric-value { font-weight: 600; }
    .note { font-size: 10px; color: var(--text-dim); margin-top: 8px; line-height: 1.5; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 8px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--blue); transition: width 0.3s ease; }
    .log {
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      max-height: 190px;
      overflow-y: auto;
      font-size: 11px;
      margin-top: 10px;
    }
    .log-entry { padding: 2px 0; color: var(--text-dim); }
    .log-entry.success { color: var(--green); }
    .log-entry.warning { color: var(--yellow); }
    .log-entry.error { color: var(--red); }
    .log-time { color: #555; margin-right: 8px; }
    .action-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .btn {
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 12px;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: #3a3a3a; }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: var(--red); color: #fff; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.sm { padding: 4px 9px; font-size: 10px; }
    .table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .table th {
      text-align: left; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-dim); font-weight: 600; padding: 0 8px 6px 0; border-bottom: 1px solid var(--border);
    }
    .table td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
    .table tr:last-child td { border-bottom: none; }
    .ok { color: var(--green); }
    .warn { color: var(--yellow); }
    .bad { color: var(--red); }
    .muted { color: var(--text-dim); }
    .mono { font-size: 11px; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    #params-host { margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <span>🎛️</span>
      Super Admin
      <span class="status-badge" id="systemStatus">checking…</span>
    </h1>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <div class="grid">
    <!-- Pipeline -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">🔁</span>Pipeline</div>
        <div class="agent-status"><span class="dot" id="pipeDot"></span><span id="pipeStatus">—</span></div>
      </div>
      <div class="metric"><span class="metric-label">Last run</span><span class="metric-value" id="pipeLast">—</span></div>
      <div class="metric"><span class="metric-label">Conclusion</span><span class="metric-value" id="pipeConclusion">—</span></div>
      <div class="metric"><span class="metric-label">Completed runs</span><span class="metric-value" id="pipeCount">—</span></div>
      <div class="progress-bar"><div class="progress-fill" id="pipeProgress" style="width:0%"></div></div>
      <div class="log" id="pipeLog"><div class="log-entry info"><span class="log-time">--:--:--</span>waiting for the pipeline…</div></div>
      <div class="action-bar">
        <button class="btn" onclick="refresh()">Refresh</button>
        <button class="btn primary" onclick="runTests()">Run tests</button>
      </div>
      <p class="note" id="pipeNote"></p>
    </div>

    <!-- System -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">💻</span>System</div>
        <div class="agent-status"><span class="dot" id="sysDot"></span><span id="sysStatus">—</span></div>
      </div>
      <div class="metric"><span class="metric-label">Load (1m)</span><span class="metric-value" id="sysLoad">—</span></div>
      <div class="metric"><span class="metric-label">CPU</span><span class="metric-value" id="sysCpu">—</span></div>
      <div class="metric"><span class="metric-label">Memory</span><span class="metric-value" id="sysMem">—</span></div>
      <div class="metric"><span class="metric-label">Disk</span><span class="metric-value" id="sysDisk">—</span></div>
      <div class="metric"><span class="metric-label">Uptime</span><span class="metric-value" id="sysUptime">—</span></div>
      <div class="metric"><span class="metric-label">Runtime</span><span class="metric-value" id="sysRuntime">—</span></div>
      <p class="note" id="sysNote"></p>
    </div>

    <!-- Health -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">🩺</span>Health</div>
        <div class="agent-status"><span class="dot" id="healthDot"></span><span id="healthStatus">—</span></div>
      </div>
      <div class="log" id="healthLog" style="max-height:150px"></div>
      <div class="action-bar">
        <button class="btn" onclick="checkHealth()">Re-check</button>
      </div>
    </div>

    <!-- Git & Deploy -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span class="icon">📦</span>Git</div>
        <div class="agent-status"><span class="dot" id="gitDot"></span><span id="gitStatus">—</span></div>
      </div>
      <div class="metric"><span class="metric-label">Branch</span><span class="metric-value" id="gitBranch">—</span></div>
      <div class="metric"><span class="metric-label">Last commit</span><span class="metric-value" id="gitCommit">—</span></div>
      <div class="metric"><span class="metric-label">Message</span><span class="metric-value" id="gitMessage" style="font-weight:400;text-align:right;max-width:60%">—</span></div>
      <div class="metric"><span class="metric-label">Pushed</span><span class="metric-value" id="gitPushed">—</span></div>
      <div class="action-bar">
        <button class="btn" onclick="refresh()">Check git</button>
        <button class="btn primary" onclick="runTests()">Dispatch CI</button>
      </div>
      <p class="note" id="gitNote"></p>
    </div>

    <!-- Quick actions -->
    <div class="card full-width">
      <div class="card-header">
        <div class="card-title"><span class="icon">⚡</span>Quick actions</div>
      </div>
      <div class="row-actions">
        <button class="btn" onclick="runTests()">Run tests</button>
        <button class="btn" onclick="checkHealth()">Health check</button>
        <button class="btn" onclick="exportState()">Export state</button>
        <button class="btn" onclick="loadLogs()">View all logs</button>
        <button class="btn danger" onclick="stopPipeline()">Stop pipeline</button>
      </div>
      <p class="note" id="qaNote"></p>
    </div>

    <!-- Action log -->
    <div class="card full-width">
      <div class="card-header">
        <div class="card-title"><span class="icon">🧾</span>Action log</div>
        <div class="agent-status"><span id="logCount">—</span></div>
      </div>
      <div class="log" id="logBox" style="max-height:190px"></div>
      <div class="action-bar">
        <button class="btn sm" onclick="loadLogs()">Reload</button>
        <button class="btn sm" onclick="clearLogs()">Clear</button>
      </div>
    </div>

    <!-- Parameters -->
    <div class="card full-width" id="parameters">
      <div class="card-header">
        <div class="card-title"><span class="icon">⚙️</span>Parameters</div>
        <div class="agent-status"><span class="dot" id="paramsDot"></span><span id="paramsStatus">—</span></div>
      </div>
      <div id="params-host"></div>
    </div>
  </div>

  <script src="/client/engine-params.client.js"></script>
  <script>
  (function () {
    'use strict';

    var API = '/api/control-centre';
    var state = { git: null, system: null };

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function bytes(n) {
      if (!n && n !== 0) return '—';
      var u = ['B', 'KB', 'MB', 'GB', 'TB'];
      var i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (i === 0 ? n : n.toFixed(1)) + ' ' + u[i];
    }
    function ago(iso) {
      if (!iso) return '—';
      var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return Math.round(s) + 's ago';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      if (s < 86400) return Math.round(s / 3600) + 'h ago';
      return Math.round(s / 86400) + 'd ago';
    }
    function dot(el, cls) { el.className = 'dot' + (cls ? ' ' + cls : ''); }

    function log(box, level, message, time) {
      var d = document.createElement('div');
      d.className = 'log-entry ' + (level || 'info');
      d.innerHTML = '<span class="log-time">' + esc(time || new Date().toLocaleTimeString()) + '</span>' + esc(message);
      box.insertBefore(d, box.firstChild);
      while (box.children.length > 60) box.lastChild.remove();
    }

    function get(action) {
      return fetch(API + '?action=' + encodeURIComponent(action), { cache: 'no-store' })
        .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
    }
    function post(action, payload) {
      return fetch(API + '?action=' + encodeURIComponent(action), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload || {}),
      }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
    }

    // ── cards ──────────────────────────────────────────────────────────────

    function renderSystem(sys) {
      if (!sys) return;
      state.system = sys;
      $('sysLoad').textContent = sys.load1 + '  (' + sys.cores + ' cores)';
      $('sysCpu').textContent = sys.cpuPct + '%';
      $('sysMem').textContent = bytes(sys.memUsed) + ' / ' + bytes(sys.memTotal) + '  (' + sys.memPct + '%)';
      $('sysDisk').textContent = sys.disk ? sys.disk.pct + '% of ' + bytes(sys.disk.total) : '—';
      $('sysUptime').textContent = Math.round(sys.uptimeSec / 60) + 'm';
      $('sysRuntime').textContent = sys.node + ' · ' + sys.platform;
      $('sysNote').textContent = 'These are the numbers for ' + sys.scope + ' — the container serving this request, not the machine that pushed the commit.';
      dot($('sysDot'), 'ok');
      $('sysStatus').textContent = 'live';
    }

    function renderGit(git) {
      if (!git) return;
      state.git = git;
      if (git.error) {
        $('gitBranch').textContent = '—';
        $('gitStatus').textContent = 'unavailable';
        dot($('gitDot'), 'bad');
        $('gitNote').textContent = git.error;
        return;
      }
      $('gitBranch').textContent = git.branch;
      $('gitCommit').textContent = git.commits[0] ? git.commits[0].sha : '—';
      $('gitMessage').textContent = git.commits[0] ? git.commits[0].message : '—';
      $('gitPushed').textContent = ago(git.pushedAt);
      dot($('gitDot'), 'ok');
      $('gitStatus').textContent = git.runs.length + ' recent runs';
      $('gitNote').textContent = 'Commits and workflow runs come from the public GitHub API. Dispatching CI needs GITHUB_TOKEN on the deployment.';
    }

    function renderPipeline(git) {
      if (!git || git.error) return;
      var runs = git.runs || [];
      var done = runs.filter(function (r) { return r.status === 'completed'; });
      var last = runs[0];
      $('pipeLast').textContent = last ? last.name + ' · ' + last.sha : '—';
      var concl = last ? last.conclusion : null;
      $('pipeConclusion').textContent = concl || (last ? last.status : '—');
      $('pipeConclusion').className = 'metric-value ' + (concl === 'success' ? 'ok' : concl === 'failure' ? 'bad' : 'warn');
      $('pipeCount').textContent = done.length;
      var pct = runs.length ? Math.round((done.length / runs.length) * 100) : 0;
      $('pipeProgress').style.width = pct + '%';
      var box = $('pipeLog');
      box.innerHTML = '';
      if (!runs.length) {
        log(box, 'info', 'no workflow runs recorded for ' + git.branch);
      } else {
        runs.slice(0, 8).forEach(function (r) {
          var cls = r.conclusion === 'success' ? 'success' : r.conclusion === 'failure' ? 'error' : 'info';
          log(box, cls, r.name + ' · ' + r.sha + ' · ' + (r.conclusion || r.status) + ' · ' + ago(r.updatedAt),
            r.startedAt ? new Date(r.startedAt).toLocaleTimeString() : '');
        });
      }
      var running = runs.filter(function (r) { return r.status !== 'completed'; }).length;
      dot($('pipeDot'), running ? 'warn' : (last && last.conclusion === 'success') ? 'ok' : 'warn');
      $('pipeStatus').textContent = running ? running + ' running' : 'idle';
      $('pipeNote').textContent = 'Real workflow runs from GitHub Actions on ' + git.branch + '.';
    }

    function renderHealth(h) {
      var box = $('healthLog');
      box.innerHTML = '';
      (h.probes || []).forEach(function (p) {
        log(box, p.ok ? 'success' : 'error', p.url.replace(/^https?:\/\//, '') + ' → ' + (p.ok ? p.status : (p.error || p.status)) + ' · ' + p.ms + 'ms');
      });
      var store = h.store || {};
      log(box, store.ok === false ? 'error' : 'success', 'store: ' + (store.store || '—') + ' · users ' + (store.users != null ? store.users : '—') + ' · projects ' + (store.projects != null ? store.projects : '—'));
      var ok = h.ok;
      dot($('healthDot'), ok ? 'ok' : 'bad');
      $('healthStatus').textContent = ok ? 'all green' : 'degraded';
      var badge = $('systemStatus');
      badge.textContent = ok ? 'All Systems Operational' : 'Degraded';
      badge.className = 'status-badge ' + (ok ? 'ok' : 'warn');
    }

    // ── actions ────────────────────────────────────────────────────────────

    function refresh() {
      get('status').then(function (r) {
        if (r.body && r.body.system) renderSystem(r.body.system);
        if (r.body && r.body.git) { renderGit(r.body.git); renderPipeline(r.body.git); }
      }).catch(function (e) {
        log($('pipeLog'), 'error', 'status failed: ' + e.message);
      });
    }

    function checkHealth() {
      get('health').then(function (r) {
        if (r.body && r.body.health) renderHealth(r.body.health);
        else log($('healthLog'), 'error', 'health failed');
      }).catch(function (e) { log($('healthLog'), 'error', String(e)); });
    }

    function runTests() {
      $('qaNote').textContent = 'Dispatching the CI suite…';
      post('run-tests').then(function (r) {
        var b = r.body || {};
        $('qaNote').textContent = b.message || (b.ok ? 'Dispatched.' : 'Could not dispatch.');
        log($('pipeLog'), b.ok ? 'success' : 'error', b.message || 'CI dispatch');
        if (b.ok) setTimeout(refresh, 2500);
      }).catch(function (e) { $('qaNote').textContent = String(e); });
    }

    function stopPipeline() {
      if (!confirm('Stop in-flight CI runs?')) return;
      $('qaNote').textContent = 'Stopping in-flight runs…';
      post('stop').then(function (r) {
        var b = r.body || {};
        $('qaNote').textContent = b.message || (b.ok ? 'Stopped.' : 'Could not stop.');
        log($('pipeLog'), b.ok ? 'warning' : 'error', b.message || 'stop');
      }).catch(function (e) { $('qaNote').textContent = String(e); });
    }

    function exportState() {
      get('state').then(function (r) {
        var blob = new Blob([JSON.stringify(r.body, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'swr-control-state-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        $('qaNote').textContent = 'State exported.';
      }).catch(function (e) { $('qaNote').textContent = String(e); });
    }

    function loadLogs() {
      get('logs').then(function (r) {
        var box = $('logBox');
        box.innerHTML = '';
        var logs = (r.body && r.body.logs) || [];
        $('logCount').textContent = logs.length + ' entries';
        if (!logs.length) { log(box, 'info', 'no actions recorded yet'); return; }
        logs.forEach(function (l) {
          log(box, l.level, l.message, l.at ? new Date(l.at).toLocaleTimeString() : '');
        });
      }).catch(function (e) { $('qaNote').textContent = String(e); });
    }

    function clearLogs() {
      if (!confirm('Clear the action log?')) return;
      post('clear-logs').then(function () { loadLogs(); });
    }

    // ── boot ───────────────────────────────────────────────────────────────

    function tick() {
      $('clock').textContent = new Date().toLocaleTimeString();
    }
    setInterval(tick, 1000);
    tick();

    if (window.SWR_PARAMS) {
      SWR_PARAMS.mount($('params-host'));
      dot($('paramsDot'), 'ok');
      $('paramsStatus').textContent = SWR_PARAMS.data.length + ' parameters';
    } else {
      $('paramsStatus').textContent = 'module missing';
      dot($('paramsDot'), 'bad');
    }

    refresh();
    checkHealth();
    loadLogs();
    setInterval(refresh, 30000);
  })();
  </script>
</body>
</html>
