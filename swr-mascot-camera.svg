<?xml version="1.0" encoding="UTF-8"?>
<!--
  swr-mascot-camera.svg
  Hand-drawn ink mascot for SWR. The "brush" feel comes from intentionally
  wobbly bezier control points, not from SVG filter primitives — so this
  renders identically across Chrome, Safari, Firefox, and headless modes.

  Five layered states toggled by class on the root svg:
    .idle      : default, slow breathing pulse
    .wave      : hand is raised, slight tilt toward detected face
    .look-up   : eyes raised, head tilted up
    .lean-in   : scaled up toward camera, spark turns hot-magenta
    .back-away : scaled down, spark dims, gaze softens

  Three CSS custom properties drive continuous animation:
    (motion)   0..1, pulse magnitude from camera motion detection
    (tilt)     -1..+1, horizontal face centroid (negative=left, positive=right)
    (depth)    0..1, sustained-motion proxy for "you are close"

  NOTE: avoid the literal sequence two hyphens inside XML comments. The
  XML spec forbids it (it would close the comment prematurely). Phrase
  CSS variable docs as "(motion)" instead of the double-dash form.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240"
     role="img" aria-label="SWR mascot — a hand-drawn ink creature that reacts to your camera">

  <defs>
    <!-- Brush ink fill: warm dark-to-blush gradient, mimics wet ink on paper -->
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a1612" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#2a1f1a" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Blush cheek wash -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff6b6b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>

    <!-- Magenta/cyan accent (matches project palette) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d8a"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Hotter accent for lean-in state — more magenta, more saturated -->
    <radialGradient id="accent-hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff8aa8"/>
      <stop offset="60%" stop-color="#ff2d8a"/>
      <stop offset="100%" stop-color="#7a0a3f"/>
    </radialGradient>

    <!-- A reusable brush splatter dot for sparkle/highlight -->
    <symbol id="splat" overflow="visible">
      <circle cx="0" cy="0" r="1.2" fill="#1a1612"/>
      <circle cx="2.5" cy="-1" r="0.6" fill="#1a1612" opacity="0.7"/>
      <circle cx="-1.8" cy="1.6" r="0.5" fill="#1a1612" opacity="0.6"/>
      <circle cx="1.2" cy="2" r="0.4" fill="#1a1612" opacity="0.5"/>
    </symbol>
  </defs>

  <!-- ============ Background paper-cream circle (faint, wobbly) ============ -->
  <!-- Drawn as a polygon of 12 anchor positions around the circumference,
       each offset slightly from the perfect radius. Reads as a hand-drawn
       circle with imperfect closure. -->
  <circle cx="120" cy="120" r="112" fill="#faf7f2" stroke="#1a1612" stroke-width="1.4" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- ============ Body (round-shouldered blob with wobbly outline) ============ -->
  <!-- Hand-drawn brushstroke body. The cubic bezier control points are
       perturbed from the ideal ellipse so the silhouette reads as drawn
       in one continuous wet-brush stroke, not as a clean curve. -->
  <g class="mascot-body">
    <path d="M60,180
             C58,150 64.4,117.6 86,98
             C108.3,77.8 137.6,75.4 160,90.2
             C184,103.8 192.6,134.2 188,166.4
             C186,184 177.6,196.4 162,202
             C140,210 96.2,210.4 76,200
             C66,196 62,190 60,180 Z"
          fill="url(#ink)" />
    <!-- Body highlight stroke: thinner, lighter ink, suggesting the wet edge -->
    <path d="M70,178
             C72.5,162 79.6,137.6 96,124"
          fill="none" stroke="#f5ead8" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- ============ Head (the brush-drawn "SWR" creature) ============ -->
  <g class="mascot-head">
    <!-- Head silhouette: irregular cubic curves with intentional wobble -->
    <path d="M82,98
             C82,72 99.6,53.6 122,54
             C146.4,53.6 162.6,75.6 160,102
             C158,120  143.8,132.4 122,132
             C99.8,132.4 82,118 82,98 Z"
          fill="#1a1612" />

    <!-- Inner cream "face plate" — the area where eyes/mouth sit -->
    <path d="M92,98
             C92,80 103.8,65.6 122,66
             C140.4,65.6 152.4,82 150,100
             C148,114 137.6,122 122,122
             C106,122 92,114 92,98 Z"
          fill="#f5ead8" />

    <!-- Cheek blush -->
    <ellipse cx="100" cy="108" rx="9" ry="6" fill="url(#blush)"/>
    <ellipse cx="144" cy="108" rx="9" ry="6" fill="url(#blush)"/>
  </g>

  <!-- ============ Eyes (slightly imperfect brushstroke dots) ============ -->
  <g class="mascot-eyes">
    <!-- Left eye — irregular ellipse, not a perfect circle -->
    <path d="M103.8,93.4 C103.4,89.6 107,86 110.8,86.4 C114.4,86.6 112.6,90 112.4,93.6 C112,97.4 108.6,99.2 105,98.4 C101.6,97.4 104,96.6 103.8,93.4 Z"
          fill="#1a1612"/>
    <!-- Right eye -->
    <path d="M131.8,93.4 C131.4,89.6 135,86 138.8,86.4 C142.4,86.6 140.6,90 140.4,93.6 C140,97.4 136.6,99.2 133,98.4 C129.6,97.4 132,96.6 131.8,93.4 Z"
          fill="#1a1612"/>

    <!-- Eye sparkles (tiny white highlights, brush-tip dabs) -->
    <circle cx="109.5" cy="92" r="1.1" fill="#f5ead8"/>
    <circle cx="137.5" cy="92" r="1.1" fill="#f5ead8"/>
  </g>

  <!-- ============ Mouth — changes per state ============ -->
  <g class="mascot-mouth">
    <!-- Default gentle curve (slightly wobbly for hand-drawn feel) -->
    <path class="mouth-idle" d="M109.5,114 Q111.8,116 114,114.5 Q116.5,113 119,114.6 Q121.6,116 124,114.5 Q126.6,113 134.5,114"
          fill="none" stroke="#1a1612" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Wave: open smile (hidden by default, shown when .wave on root) -->
    <path class="mouth-wave" d="M108,112 Q110,113 112,112.5 Q114,112 116,113 Q118.6,114 122,118 Q125.6,122 128,114 Q131,112 134,112.5 Q136,113 138,112"
          fill="#ff2d8a" stroke="#1a1612" stroke-width="2.2" stroke-linecap="round" opacity="0"/>
    <path class="mouth-wave-tongue" d="M116,118 Q122,124 128,118 Q122,121 116,118 Z"
          fill="#00f0ff" opacity="0"/>

    <!-- Look-up: small "oh" circle -->
    <ellipse class="mouth-up" cx="122" cy="116" rx="4" ry="5"
             fill="#1a1612" opacity="0"/>
  </g>

  <!-- ============ Antenna / spark — accent gradient ============ -->
  <g class="mascot-spark">
    <line x1="122" y1="54" x2="122" y2="38" stroke="#1a1612" stroke-width="2.2" stroke-linecap="round"/>
    <circle class="spark-bulb" cx="122" cy="34" r="5" fill="url(#accent)"/>
    <!-- Star burst lines around the spark (slightly irregular) -->
    <g stroke="url(#accent)" stroke-width="1.6" stroke-linecap="round">
      <line x1="122" y1="22" x2="122" y2="14"/>
      <line x1="108" y1="34" x2="100" y2="34"/>
      <line x1="136" y1="34" x2="144" y2="34"/>
      <line x1="112" y1="24" x2="106" y2="18"/>
      <line x1="132" y1="24" x2="138" y2="18"/>
    </g>
  </g>

  <!-- ============ Hand (wave state) ============ -->
  <g class="mascot-hand" opacity="0">
    <!-- Arm -->
    <path d="M178,150 Q200,128 206,108"
          fill="none" stroke="#1a1612" stroke-width="6" stroke-linecap="round"/>
    <!-- Palm: rough 4-finger brushstroke (intentionally irregular blobs) -->
    <g fill="#1a1612">
      <path d="M204,108 C212,98 218,98 218,104 C218,108 214,114 208,116 Z"/>
      <ellipse cx="212" cy="100" rx="3" ry="5"/>
      <ellipse cx="206" cy="96"  rx="3" ry="6"/>
      <ellipse cx="200" cy="98"  rx="3" ry="5"/>
    </g>
    <!-- Motion arcs above the hand -->
    <g fill="none" stroke="#ff2d8a" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
      <path d="M218,90 Q226,82 220,72"/>
      <path d="M222,96 Q232,90 226,78"/>
    </g>
  </g>

  <!-- ============ Brush splatters around the mascot ============ -->
  <g class="mascot-splats">
    <use href="#splat" x="46"  y="84"/>
    <use href="#splat" x="194" y="200" transform="rotate(15 194 200)"/>
    <use href="#splat" x="40"  y="170" transform="rotate(-20 40 170)"/>
    <use href="#splat" x="200" y="60"  transform="rotate(45 200 60)"/>
  </g>

  <!-- ============ Style & animation ============ -->
  <style>
    /* Default: idle. Amplitudes deliberately exaggerated so the camera
       input is visible at a glance. (motion) 0 means no camera/JS = perfectly
       still, so it's safe to drop in anywhere as a static brand mark. */
    .mascot-body {
      transform-origin: 120px 200px;
      animation: breathe 3.6s ease-in-out infinite;
    }
    .mascot-head {
      transform-origin: 122px 90px;
      animation: bob 3.6s ease-in-out infinite;
    }
    .mascot-spark {
      transform-origin: 122px 34px;
      animation: glow 2.8s ease-in-out infinite;
    }
    .spark-bulb {
      animation: pulse 1.4s ease-in-out infinite;
      transform-origin: 122px 34px;
    }

    /* Motion-magnitude pulse driven by JS-set (motion) (0..1).
       (depth) scales the body for proximity feedback. */
    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(calc(1 + 0.08 * var(--depth, 0))); }
      50%      { transform: translateY(calc(-6px * (1 + var(--motion, 0))))
                          scale(calc(1 + 0.08 * var(--depth, 0) + 0.03 * var(--motion, 0))); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(0); }
      50%      { transform: translateY(calc(-5px * (1 + var(--motion, 0))))
                          rotate(calc(8deg * var(--tilt, 0))); }
    }
    @keyframes glow {
      0%, 100% { opacity: 1; transform: scale(calc(1 + 0.15 * var(--depth, 0))); }
      50%      { opacity: calc(0.6 + 0.4 * var(--motion, 0));
                 transform: scale(calc(1 + 0.15 * var(--depth, 0) + 0.2 * var(--motion, 0))); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(calc(1 + 0.1 * var(--motion, 0))); }
      50%      { opacity: 0.55; transform: scale(calc(1.2 + 0.15 * var(--motion, 0))); }
    }

    /* ---- WAVE state: hand visible, mouth swaps to open smile ---- */
    svg.wave .mascot-hand { opacity: 1; animation: wave 0.7s ease-in-out infinite; }
    svg.wave .mouth-idle  { opacity: 0; }
    svg.wave .mouth-wave  { opacity: 1; }
    svg.wave .mouth-wave-tongue { opacity: 0.85; }
    @keyframes wave {
      0%, 100% { transform: translateY(0) rotate(-15deg); }
      50%      { transform: translateY(-8px) rotate(15deg); }
    }

    /* ---- LOOK-UP state: eyes shift up, mouth becomes small circle ---- */
    svg.look-up .mascot-eyes { transform: translateY(-5px); transition: transform 0.3s; }
    svg.look-up .mouth-idle  { opacity: 0; }
    svg.look-up .mouth-up    { opacity: 1; }

    /* ---- LEAN-IN state: mascot scales toward camera, spark turns hot ---- */
    svg.lean-in .mascot-body {
      animation: lean 1.2s ease-in-out infinite;
    }
    svg.lean-in .mascot-head {
      transform: translateY(-3px) scale(1.08);
      transform-origin: 122px 90px;
      transition: transform 0.4s;
    }
    svg.lean-in .mascot-eyes {
      transform: scale(1.3);
      transform-origin: 122px 94px;
      transition: transform 0.4s;
    }
    svg.lean-in .spark-bulb { fill: url(#accent-hot); transition: fill 0.4s; }
    @keyframes lean {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-4px) scale(1.04); }
    }

    /* ---- BACK-AWAY state: mascot shrinks back, spark dims, gaze softens ---- */
    svg.back-away {
      transform: rotate(0) scale(0.9);
      transform-origin: 120px 120px;
      transition: transform 0.8s ease-out;
      opacity: 0.85;
    }
    svg.back-away .mascot-spark { opacity: 0.4; transition: opacity 0.8s; }
    svg.back-away .mascot-eyes  { opacity: 0.7; transition: opacity 0.8s; }
    svg.back-away .mascot-hand  { opacity: 0; }

    /* Whole-svg tilt toward detected face (driven by (tilt) -1..+1) */
    svg {
      transform: rotate(calc(10deg * var(--tilt, 0))) scale(calc(1 + 0.1 * var(--depth, 0)));
      transform-origin: 120px 120px;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</svg>