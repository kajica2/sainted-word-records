<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60">
  <!-- Abstract cross/wave icon -->
  <g fill="none" stroke="white" stroke-width="1" stroke-linecap="round">
    <!-- Vertical -->
    <line x1="20" y1="8" x2="20" y2="52" />
    <!-- Horizontal -->
    <line x1="4" y1="30" x2="36" y2="30" />
    <!-- Wave through center -->
    <path d="M8,30 Q14,20 20,30 Q26,40 32,30" stroke-width="0.8" opacity="0.7" />
    <!-- Small circle -->
    <circle cx="20" cy="30" r="3" fill="white" opacity="0.9" />
  </g>
  <!-- Divider -->
  <line x1="44" y1="14" x2="44" y2="46" stroke="white" stroke-width="0.4" opacity="0.3" />
  <!-- SWR -->
  <text x="56" y="30" fill="white" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4">SWR</text>
  <!-- Subtext -->
  <text x="56" y="44" fill="white" font-family="Helvetica Neue, Arial, sans-serif" font-size="5" font-weight="300" letter-spacing="3" opacity="0.5">SAINTED WORD</text>
</svg>