[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-fullstack-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3.30",
    "langchain-core>=0.3.40",
    "langchain-anthropic>=0.3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "pyright>=1.1.389",
    "langgraph-cli[inmem]>=0.1.55",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
strict = true
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
