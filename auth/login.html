<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/lib/components.css">
  <link rel="stylesheet" href="/lib/design-tokens.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in · Sainted Word Records</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg-0: #0a0a0a;
      --fg: #e8e6e1;
      --muted: rgba(232, 230, 225, 0.62);
      --dim: rgba(232, 230, 225, 0.35);
      --accent: #f4f2ee;
      --link: rgba(232, 230, 225, 0.65);
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(255, 255, 255, 0.06), transparent 70%),
        #0a0a0a;
      color: var(--fg);
      font-family: var(--font-sans);
    }

    /* ── Auth card ──────────────────────────────────────────── */
    .auth-card {
      width: min(420px, 100%);
      padding: 2.25rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(18, 18, 18, 0.72);
      backdrop-filter: blur(18px);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04) inset,
        0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .auth-brand {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(232, 230, 225, 0.55);
      margin-bottom: 2rem;
    }

    .auth-title {
      font-size: 1.65rem;
      font-weight: 550;
      letter-spacing: -0.015em;
      margin: 0 0 0.5rem;
      color: #f4f2ee;
    }

    .auth-subtitle {
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 1.75rem;
    }

    /* ── Form elements ──────────────────────────────────────── */
    .auth-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(232, 230, 225, 0.48);
    }

    .auth-input {
      width: 100%;
      height: 48px;
      padding: 0 0.9rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: #f4f2ee;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: border-color 0.18s ease, background-color 0.18s ease;
      -webkit-appearance: none;
      appearance: none;
    }

    .auth-input::placeholder {
      color: rgba(232, 230, 225, 0.32);
    }

    .auth-input:focus {
      outline: none;
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(255, 255, 255, 0.05);
    }

    /* ── CTA button ─────────────────────────────────────────── */
    .auth-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      height: 48px;
      margin-top: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      background: #f4f2ee;
      color: #0a0a0a;
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .auth-button:hover {
      background: #ffffff;
    }

    .auth-button:active {
      transform: translateY(1px);
    }

    .auth-button:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    /* ── Google sign-in ─────────────────────────────────────── */
    .auth-google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      height: 48px;
      margin-top: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .auth-google-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .auth-google-btn svg {
      flex-shrink: 0;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: var(--dim);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* ── Status messages ───────────────────────────────────── */
    .auth-status {
      margin-top: 0.85rem;
      font-size: 0.82rem;
      min-height: 18px;
      text-align: center;
    }

    .auth-status.err { color: #ff7a3d; }
    .auth-status.ok  { color: #00ffa3; }

    /* ── Footer ─────────────────────────────────────────────── */
    .auth-footer {
      margin-top: 1.75rem;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      text-align: center;
    }

    .auth-link {
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid rgba(232, 230, 225, 0.2);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .auth-link:hover {
      color: #f4f2ee;
      border-color: rgba(232, 230, 225, 0.5);
    }

    /* ── Skip link ─────────────────────────────────────────── */
    .auth-skip {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 5px 10px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .auth-skip:hover {
      color: var(--fg);
      border-color: rgba(255, 255, 255, 0.2);
    }
  </style>
  <script src="/fx-background.client.js" defer></script>
</head>
<body>

  <a class="auth-skip" href="/engine/">Skip →</a>

  <section class="auth-card">
    <div class="auth-brand">Sainted Word Records</div>

    <h1 class="auth-title">Sign in</h1>
    <p class="auth-subtitle">
      Save projects to your account and follow them across devices.
      The engine works fully offline without an account.
    </p>

    <!-- Email magic link -->
    <form id="login-form" method="post" action="/api/auth/magic" autocomplete="on">
      <label class="auth-label" for="email">Email</label>
      <input
        id="email"
        class="auth-input"
        type="email"
        name="email"
        required
        placeholder="you@example.com"
        autocomplete="email"
      />

      <button type="submit" class="auth-button" id="email-btn">
        Send magic link
      </button>

      <div class="auth-status" id="err"></div>
      <div class="auth-status ok" id="ok"></div>
    </form>

    <!-- Divider -->
    <div class="auth-divider">or</div>

    <!-- Google sign-in -->
    <a class="auth-google-btn" href="/auth/google">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <p class="auth-footer">
      No account yet?
      <a class="auth-link" href="https://tally.so/r/swr-waitlist" target="_blank" rel="noopener">
        Join the waitlist
      </a>
    </p>
  </section>

  <script type="module" src="/auth/login.client.js"></script>
  <script src="/lib/nav.client.js" defer></script>
  <script src="/lib/early-access-modal.client.js" defer></script>
  <script>
    // Replace waitlist link with early access modal
    document.addEventListener('DOMContentLoaded', function() {
      var waitlistLink = document.querySelector('a[href*="tally.so"]');
      if (waitlistLink) {
        waitlistLink.href = 'javascript:SWR_EARLY_ACCESS.show()';
        waitlistLink.textContent = 'Request Early Access →';
      }
    });
  </script>
</body>
</html>
