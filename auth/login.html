<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in · Sainted Word Records</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg-0: #0a0410; --bg-1: #14061f; --panel: #1a0828;
      --line: #3a1f55; --line-2: #5a2f7a;
      --fg: #f5e9ff; --muted: #9a8aaa; --dim: #5a4a6a;
      --accent: #ff3d92; --ok: #00ffa3; --warn: #ff7a3d;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 64px 24px 80px;
      background: var(--bg-0); color: var(--fg);
      font-family: var(--font-sans); font-size: 14px;
      background-image:
        radial-gradient(ellipse at 15% 0%, rgba(255, 61, 146, 0.18), transparent 55%),
        radial-gradient(ellipse at 85% 100%, rgba(0, 229, 255, 0.14), transparent 55%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1));
    }
    .shell { max-width: 540px; margin: 0 auto; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .brand { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.10em; color: var(--accent); }
    h1 { font: 28px/1.2 var(--font-sans); margin: 0 0 8px; }
    p.lede { color: var(--muted); line-height: 1.55; margin: 0 0 28px; }
    .card {
      background: linear-gradient(180deg, var(--panel), var(--bg-1));
      border: 1px solid var(--line-2);
      border-radius: 12px;
      padding: 28px 32px;
      box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6);
    }
    .card h2 { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
    .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .row label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--muted); }
    .row input { background: var(--bg-0); border: 1px solid var(--line-2); border-radius: 6px; color: var(--fg); font-family: var(--font-sans); font-size: 14px; padding: 10px 12px; }
    .row input:focus { outline: none; border-color: var(--accent); background: var(--bg-1); }
    button.primary { background: var(--accent); color: #000; border: 1px solid var(--accent); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 22px; border-radius: 6px; cursor: pointer; font-weight: 700; }
    button.primary:disabled { opacity: 0.5; cursor: progress; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .err { color: var(--warn); font-size: 12px; margin-top: 12px; min-height: 16px; }
    .ok  { color: var(--ok);   font-size: 12px; margin-top: 12px; min-height: 16px; }
    .foot { text-align: center; color: var(--dim); font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 40px; }
    .dev-link {
      margin-top: 16px; padding: 12px 14px;
      background: var(--bg-0); border: 1px dashed var(--line-2);
      border-radius: 6px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--muted); line-height: 1.5; word-break: break-all;
      display: none;
    }
    .dev-link.show { display: block; }
    .dev-link b { color: var(--accent); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">SAINTED WORD RECORDS</div>
      <a class="ghost" href="/engine/" style="text-decoration:none;">Skip →</a>
    </div>
    <h1>Sign in</h1>
    <p class="lede">Save projects to your account. Follow them across devices. Optional — the engine works fully offline without an account.</p>

    <div class="card">
      <h2>Email magic link</h2>
      <div class="sub">We email you a one-time sign-in link. No password.</div>
      <form id="login-form" autocomplete="on">
        <div class="row">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@label.fm" />
        </div>
        <div class="err" id="err"></div>
        <div class="ok"  id="ok"></div>
        <button type="submit" class="primary" id="enter-btn">Send link →</button>
        <div class="dev-link" id="dev-link"></div>
      </form>
    </div>

    <div class="foot">SAINTED WORD RECORDS · ALGORITHMIC AUDIO-REACTIVE VIDEO ENGINE</div>
  </div>

  <script type="module" src="/auth/login.client.js"></script>
</body>
</html>
