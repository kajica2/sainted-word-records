<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signing you in… · Sainted Word Records</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { --bg-0:#0a0410; --fg:#f5e9ff; --muted:#9a8aaa; --accent:#ff3d92; --ok:#00ffa3; --warn:#ff7a3d; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg-0); color:var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(255,61,146,0.18), transparent 55%), linear-gradient(180deg, var(--bg-0), #14061f); }
    .card { max-width: 480px; padding: 36px 40px; background: rgba(26,8,40,0.6); border: 1px solid #3a1f55; border-radius: 12px; text-align: center; backdrop-filter: blur(4px); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--accent); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ok { color: var(--ok); }
    .err { color: var(--warn); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="h">Signing you in…</h1>
    <p id="msg"><span class="spinner"></span> Verifying your magic link.</p>
    <p id="hint" style="font-size:12px"></p>
  </div>
  <script type="module" src="/auth/verify.client.js"></script>
</body>
</html>
