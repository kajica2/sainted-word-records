<?xml version="1.0" encoding="UTF-8"?>
<!--
  SWR Watermark C · Icon + "SWR" Text Hybrid
  ──────────────────────────────────────────
  - Vertical layout: cross-with-waveform icon on top, "SWR" text below
  - Use: intro/outro card, or compact bottom-right at 12-15% of frame
  - Icon: a + (cross) whose horizontal arm is an audio waveform, gradient pink→cyan
  - Pure-rect construction, no font dependencies
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="SWR icon-plus-text watermark">
  <defs>
    <filter id="swr-c-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="swr-c-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ff3d92"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- ICON: a cross where horizontal arm is an audio waveform, vertical arm is a bar -->
  <g filter="url(#swr-c-shadow)" transform="translate(40, 0)">
    <!-- Vertical bar (the up-arm of the cross) -->
    <rect x="74" y="40"  width="12" height="240" fill="url(#swr-c-grad)" rx="3"/>
    <!-- Horizontal arm: 14 audio-waveform bars centered vertically (y center = 168) -->
    <g fill="url(#swr-c-grad)">
      <rect x="0"   y="158" width="6"  height="20"  rx="2"/>
      <rect x="10"  y="148" width="6"  height="40"  rx="2"/>
      <rect x="20"  y="138" width="6"  height="60"  rx="2"/>
      <rect x="30"  y="118" width="6"  height="100" rx="2"/>
      <rect x="40"  y="98"  width="6"  height="140" rx="2"/>
      <rect x="50"  y="118" width="6"  height="100" rx="2"/>
      <rect x="60"  y="148" width="6"  height="40"  rx="2"/>
      <rect x="70"  y="158" width="20" height="20"/>
      <rect x="94"  y="138" width="6"  height="60"  rx="2"/>
      <rect x="104" y="118" width="6"  height="100" rx="2"/>
      <rect x="114" y="88"  width="6"  height="160" rx="2"/>
      <rect x="124" y="68"  width="6"  height="200" rx="2"/>
      <rect x="134" y="48"  width="6"  height="240" rx="2"/>
      <rect x="144" y="78"  width="6"  height="180" rx="2"/>
      <rect x="154" y="108" width="6"  height="120" rx="2"/>
    </g>
  </g>

  <!-- TEXT: "SWR" beneath the icon -->
  <g filter="url(#swr-c-shadow)" fill="#ffffff" fill-opacity="0.95" transform="translate(0, 320)">
    <!-- S 80w x 96h -->
    <g>
      <rect x="0"  y="0"  width="80" height="14"/>
      <rect x="0"  y="14" width="14" height="32"/>
      <rect x="0"  y="41" width="80" height="14"/>
      <rect x="66" y="55" width="14" height="32"/>
      <rect x="0"  y="82" width="80" height="14"/>
    </g>
    <!-- W 96w x 96h, drawn as polyline with stroke -->
    <g transform="translate(108, 0)" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="14" stroke-linejoin="miter">
      <polyline points="0,0 24,96 48,32 72,96 96,0"/>
    </g>
    <!-- R 80w x 96h -->
    <g transform="translate(232, 0)">
      <rect x="0"  y="0"  width="14" height="96"/>
      <rect x="14" y="0"  width="52" height="14"/>
      <rect x="66" y="14" width="14" height="32"/>
      <rect x="14" y="41" width="52" height="14"/>
      <polygon points="42,55 66,55 66,68 50,68 66,96 50,96 36,72"/>
    </g>
  </g>

  <!-- Underline tick -->
  <g fill="#ff3d92" fill-opacity="0.85">
    <rect x="0"   y="430" width="40" height="2"/>
    <rect x="48"  y="430" width="2"  height="2"/>
    <rect x="56"  y="430" width="2"  height="2"/>
  </g>
</svg>
