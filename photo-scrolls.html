<!doctype html>
<html lang="en" data-theme="system">
<head>
  <script src="/lib/app-version.js"></script>
  <script src="/lib/app-version-bust.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Scrolls · Sainted Word Records</title>
  <meta name="description" content="Every still in the SWR media packs as a horizontal scroll — 508 photographs across 13 collections, grouped by pack." />
  <link rel="canonical" href="https://sainted-word-records.vercel.app/photo-scrolls" />
  <meta property="og:title" content="Photo Scrolls · SWR" />
  <meta property="og:description" content="Every still in the SWR media packs as a horizontal scroll." />
  <meta property="og:image" content="https://sainted-word-records.vercel.app/press/og-card.png" />
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" />

  <link rel="stylesheet" href="/lib/design-tokens.css">
  <link rel="stylesheet" href="/lib/design-base.css">
  <link rel="stylesheet" href="/lib/components.css">
  <style>
    /* === PHOTO SCROLLS === */
    .ps-hero { padding: 56px 0 20px; border-bottom: 1px solid var(--line); }
    .ps-hero h1 {
      font-family: var(--font-display); font-weight: 300;
      font-size: clamp(34px, 5vw, 50px); line-height: 1.05;
      letter-spacing: -0.02em; margin: 0 0 12px;
    }
    .ps-hero h1 em { font-style: italic; color: var(--accent); }
    .ps-hero .lede {
      font-size: 16px; color: var(--ink-2); max-width: 680px;
      line-height: 1.5; margin: 0 0 10px;
    }
    .ps-tally {
      font-family: var(--font-mono, monospace); font-size: 12px;
      color: var(--ink-3, #888); margin: 0 0 4px;
    }

    /* Each pack is one horizontal strip. content-visibility keeps 508
       <img> off the render path until the strip is scrolled near. */
    .ps-collection {
      padding: 34px 0 6px;
      content-visibility: auto;
      contain-intrinsic-size: auto 320px;
    }
    .ps-collection__head {
      display: flex; align-items: baseline; gap: 12px;
      padding: 0 20px 12px; max-width: 1400px; margin: 0 auto;
    }
    .ps-collection__title {
      font-family: var(--font-display); font-size: 21px; font-weight: 400;
      margin: 0; letter-spacing: -0.01em;
    }
    .ps-collection__count {
      font-family: var(--font-mono, monospace); font-size: 11px;
      color: var(--ink-3, #888);
    }

    .ps-strip {
      display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory; scroll-padding-left: 20px;
      padding: 2px 20px 18px; scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .ps-strip::-webkit-scrollbar { height: 6px; }
    .ps-strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    .ps-frame {
      flex: 0 0 auto; scroll-snap-align: start;
      width: clamp(190px, 26vw, 340px); aspect-ratio: 16 / 10;
      border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
      background: #06060a; padding: 0; cursor: zoom-in; display: block;
    }
    .ps-frame img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .28s ease, opacity .28s ease;
    }
    .ps-frame:hover img, .ps-frame:focus-visible img { transform: scale(1.04); }
    .ps-frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .ps-empty { padding: 40px 20px; color: var(--ink-2); }

    /* === LIGHTBOX === */
    .ps-lb {
      position: fixed; inset: 0; z-index: 90; display: none;
      background: rgba(6,6,10,.94); backdrop-filter: blur(6px);
    }
    .ps-lb[open] { display: flex; }
    .ps-lb__frame {
      margin: auto; max-width: 94vw; max-height: 84vh; display: block;
      border-radius: 6px; border: 1px solid rgba(255,255,255,.14);
    }
    .ps-lb__bar {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center; gap: 18px;
      padding: 14px; font-family: var(--font-mono, monospace); font-size: 12px;
      color: #cfcfcf;
    }
    .ps-lb__btn {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
      color: #fff; border-radius: 99px; padding: 7px 16px; cursor: pointer;
      font-family: inherit; font-size: 12px;
    }
    .ps-lb__btn:hover { background: rgba(255,255,255,.16); }
    .ps-lb__close {
      position: absolute; top: 14px; right: 16px; font-size: 26px; line-height: 1;
      background: none; border: 0; color: #fff; cursor: pointer; padding: 6px 10px;
    }
    @media (prefers-reduced-motion: reduce) {
      .ps-frame img { transition: none; }
    }
  </style>
</head>
<body>
  <header class="ps-hero">
    <div style="max-width:1400px;margin:0 auto;padding:0 20px">
      <p class="kicker" style="font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px">
        <a href="/packs" style="color:inherit;text-decoration:none">← Packs</a>
      </p>
      <h1>Photo <em>Scrolls</em></h1>
      <p class="lede">
        Every still in the media packs, unrolled into a horizontal scroll — one
        strip per pack, in manifest order. Click any frame to open it large, then
        arrow through the collection.
      </p>
      <p class="ps-tally" id="ps-tally">loading…</p>
    </div>
  </header>

  <main id="ps-root">
    <p class="ps-empty">Loading collections…</p>
  </main>

  <div class="ps-lb" id="ps-lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="ps-lb__close" id="ps-lb-close" aria-label="Close">×</button>
    <img class="ps-lb__frame" id="ps-lb-img" alt="">
    <div class="ps-lb__bar">
      <button class="ps-lb__btn" id="ps-lb-prev">← Prev</button>
      <span id="ps-lb-meta"></span>
      <button class="ps-lb__btn" id="ps-lb-next">Next →</button>
    </div>
  </div>

  <script type="module">
    // Reads the shipped packs manifest and renders one horizontal scroll per
    // still pack. Video/audio packs are skipped on purpose: a scroll of
    // <video> elements would pull 48 clips and their posters for nothing, and
    // packs.html already covers motion.
    const ROOT = document.getElementById('ps-root');
    const TALLY = document.getElementById('ps-tally');
    const STILL = /\.(webp|png|jpe?g|avif)$/i;

    const LB = document.getElementById('ps-lb');
    const LB_IMG = document.getElementById('ps-lb-img');
    const LB_META = document.getElementById('ps-lb-meta');
    let LB_LIST = [];
    let LB_I = 0;
    let LB_LAST_FOCUS = null;

    const titleCase = (slug) => slug.replace(/-/g, ' ')
      .replace(/\b\w/g, (c) => c.toUpperCase());

    function renderStrip(packKey, files, base) {
      const sec = document.createElement('section');
      sec.className = 'ps-collection';

      const head = document.createElement('div');
      head.className = 'ps-collection__head';
      const h = document.createElement('h2');
      h.className = 'ps-collection__title';
      h.textContent = titleCase(packKey);
      const c = document.createElement('span');
      c.className = 'ps-collection__count';
      c.textContent = `${files.length} ${files.length === 1 ? 'frame' : 'frames'}`;
      head.append(h, c);

      const strip = document.createElement('div');
      strip.className = 'ps-strip';
      strip.setAttribute('role', 'group');
      strip.setAttribute('aria-label', `${titleCase(packKey)} — ${files.length} frames`);

      for (const rel of files) {
        const btn = document.createElement('button');
        btn.className = 'ps-frame';
        btn.type = 'button';
        btn.setAttribute('aria-label', `Open ${titleCase(packKey)} image`);
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = base + rel;
        img.alt = `${titleCase(packKey)} — ${rel.split('/').pop()}`;
        btn.appendChild(img);
        btn.addEventListener('click', () => openLb(files, files.indexOf(rel), base));
        strip.appendChild(btn);
      }

      sec.append(head, strip);
      return sec;
    }

    function openLb(files, index, base) {
      LB_LIST = files.map((f) => base + f);
      LB_I = index;
      LB_LAST_FOCUS = document.activeElement;
      paintLb();
      LB.setAttribute('open', '');
      document.body.style.overflow = 'hidden';
      document.getElementById('ps-lb-close').focus();
    }

    function paintLb() {
      const src = LB_LIST[LB_I];
      if (!src) return;
      LB_IMG.src = src;
      LB_IMG.alt = src.split('/').pop();
      LB_META.textContent = `${LB_I + 1} / ${LB_LIST.length}`;
    }

    function step(d) {
      if (!LB_LIST.length) return;
      LB_I = (LB_I + d + LB_LIST.length) % LB_LIST.length;
      paintLb();
    }

    function closeLb() {
      LB.removeAttribute('open');
      document.body.style.overflow = '';
      if (LB_LAST_FOCUS && LB_LAST_FOCUS.focus) LB_LAST_FOCUS.focus();
    }

    document.getElementById('ps-lb-close').addEventListener('click', closeLb);
    document.getElementById('ps-lb-prev').addEventListener('click', () => step(-1));
    document.getElementById('ps-lb-next').addEventListener('click', () => step(1));
    LB.addEventListener('click', (e) => { if (e.target === LB) closeLb(); });
    document.addEventListener('keydown', (e) => {
      if (!LB.hasAttribute('open')) return;
      if (e.key === 'Escape') closeLb();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
    });

    (async () => {
      let m = null;
      for (const url of ['/packs/manifest.json', '/library/manifest.json']) {
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) continue;
          const j = await r.json();
          if (j && j.packs && Object.keys(j.packs).length) { m = j; break; }
        } catch { /* try the next candidate */ }
      }
      if (!m) {
        ROOT.innerHTML = '<p class="ps-empty">Could not load the packs manifest.</p>';
        TALLY.textContent = '';
        return;
      }

      const base = typeof m.base === 'string' && m.base ? m.base : '/packs/';
      ROOT.innerHTML = '';
      let packs = 0;
      let photos = 0;

      for (const [key, files] of Object.entries(m.packs)) {
        const stills = (files || []).filter((f) => STILL.test(f));
        if (!stills.length) continue;
        ROOT.appendChild(renderStrip(key, stills, base));
        packs++;
        photos += stills.length;
      }

      TALLY.textContent = `${photos} photographs · ${packs} collections · scroll sideways, click to enlarge`;
      document.title = `Photo Scrolls · ${photos} frames · SWR`;
    })();
  </script>
</body>
</html>
